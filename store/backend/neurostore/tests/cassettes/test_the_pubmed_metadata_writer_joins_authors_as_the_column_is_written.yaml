        <!DOCTYPE PubmedArticleSet PUBLIC "-//NLM//DTD PubMedArticle, 1st January 2025//EN" "https://dtd.nlm.nih.gov/ncbi/pubmed/out/pubmed_250101.dtd">

        <PubmedArticleSet>

        <PubmedArticle><MedlineCitation Status="PubMed-not-MEDLINE" Owner="NLM"><PMID Version="1">25775530</PMID><DateCompleted><Year>2015</Year><Month>05</Month><Day>21</Day></DateCompleted><DateRevised><Year>2018</Year><Month>11</Month><Day>13</Day></DateRevised><Article PubModel="Print-Electronic"><Journal><ISSN IssnType="Electronic">1091-6490</ISSN><JournalIssue CitedMedium="Internet"><Volume>112</Volume><Issue>12</Issue><PubDate><Year>2015</Year><Month>Mar</Month><Day>24</Day></PubDate></JournalIssue><Title>Proceedings of the National Academy of Sciences of the United States of America</Title><ISOAbbreviation>Proc Natl Acad Sci U S A</ISOAbbreviation></Journal><ArticleTitle>Methane transport from the active layer to lakes in the Arctic using Toolik Lake, Alaska, as a case study.</ArticleTitle><Pagination><StartPage>3636</StartPage><EndPage>3640</EndPage><MedlinePgn>3636-40</MedlinePgn></Pagination><ELocationID EIdType="doi" ValidYN="Y">10.1073/pnas.1417392112</ELocationID><Abstract><AbstractText>Methane emissions in the Arctic are important, and may be contributing to global warming. While methane emission rates from Arctic lakes are well documented, methods are needed to quantify the relative contribution of active layer groundwater to the overall lake methane budget. Here we report measurements of natural tracers of soil/groundwater, radon, and radium, along with methane concentration in Toolik Lake, Alaska, to evaluate the role active layer water plays as an exogenous source for lake methane. Average concentrations of methane, radium, and radon were all elevated in the active layer compared with lake water (1.6 &#xd7; 10(4) nM, 61.6 dpm&#x22c5;m(-3), and 4.5 &#xd7; 10(5) dpm&#x22c5;m(-3) compared with 1.3 &#xd7; 10(2) nM, 5.7 dpm&#x22c5;m(-3), and 4.4 &#xd7; 10(3) dpm&#x22c5;m(-3), respectively). Methane transport from the active layer to Toolik Lake based on the geochemical tracer radon (up to 2.9 g&#x22c5;m(-2)&#x22c5;y(-1)) can account for a large fraction of methane emissions from this lake. Strong but spatially and temporally variable correlations between radon activity and methane concentrations (r(2) &gt; 0.69) in lake water suggest that the parameters that control methane discharge from the active layer also vary. Warming in the Arctic may expand the active layer and increase the discharge, thereby increasing the methane flux to lakes and from lakes to the atmosphere, exacerbating global warming. More work is needed to quantify and elucidate the processes that control methane fluxes from the active layer to predict how this flux might change in the future and to evaluate the regional and global contribution of active layer water associated methane inputs.</AbstractText></Abstract><AuthorList CompleteYN="Y"><Author ValidYN="Y"><LastName>Paytan</LastName><ForeName>Adina</ForeName><Initials>A</Initials><AffiliationInfo><Affiliation>Earth and Planetary Science, University of California, Santa Cruz, CA 95064; apaytan@ucsc.edu.</Affiliation></AffiliationInfo></Author><Author ValidYN="Y"><LastName>Lecher</LastName><ForeName>Alanna L</ForeName><Initials>AL</Initials><AffiliationInfo><Affiliation>Earth and Planetary Science, University of California, Santa Cruz, CA 95064;</Affiliation></AffiliationInfo></Author><Author ValidYN="Y"><LastName>Dimova</LastName><ForeName>Natasha</ForeName><Initials>N</Initials><AffiliationInfo><Affiliation>Earth and Planetary Science, University of California, Santa Cruz, CA 95064; Department of Geological Sciences, University of Alabama, Tuscaloosa, AL 35487; and.</Affiliation></AffiliationInfo></Author><Author ValidYN="Y"><LastName>Sparrow</LastName><ForeName>Katy J</ForeName><Initials>KJ</Initials><AffiliationInfo><Affiliation>Department of Earth and Environmental Sciences, University of Rochester, Rochester, NY 14627.</Affiliation></AffiliationInfo></Author><Author ValidYN="Y"><LastName>Kodovska</LastName><ForeName>Fenix Garcia-Tigreros</ForeName><Initials>FG</Initials><AffiliationInfo>