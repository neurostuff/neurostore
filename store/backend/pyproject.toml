[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurostore"
version = "0.19.1"
description = "neurostore"
authors = [
    { name = "James Kent", email = "jamesdkent21@gmail.com" }
]
license = { text = "MIT" }
dependencies = [
    "auth0-python~=6.2",
    "alembic~=1.19",
    "connexion[swagger-ui,uvicorn]==3.3.0",
    "cachelib~=0.15",
    "gunicorn~=26.0",
    "httpx2~=2.10",
    "uvicorn-worker~=0.4",
    "ipython~=9.16",
    "itsdangerous~=2.2",
    "marshmallow~=4.3",
    "numpy<3.0.0",
    "pandas~=3.0",
    "psycopg2-binary~=2.9",
    "pyld~=3.2",
    "python-jose~=3.5",
    "redis",
    "shortuuid~=1.0",
    "starlette>=1.4.1,<2",
    "sqlalchemy~=2.0",
    "sqlalchemy-utils",
    "sqladmin~=0.31",
    "sqltap",
    "webargs~=8.7",
    "wrapt~=2.3",
    "openapi-spec-validator~=0.9",
    "scipy~=1.18",
    "orjson~=3.11",
    "pgvector~=0.5",
    "NiMARE[parquet]==0.20.0",
    "openai~=3.0",
    "tenacity~=9.1",
]

[tool.setuptools.packages.find]
exclude = ["tests", "test_*"]
include = ["neurostore*"]

[project.optional-dependencies]
dev = [
    "flake8~=7.3",
    "pip-chill~=1.0",
    "wheel~=0.48",
    "pytest~=9.1",
    "vcrpy~=8.3",
    "pytest-recording~=0.13.4",
]

[project.scripts]
manage = "neurostore.cli:main"

[tool.setuptools.package-data]
neurostore = ["openapi/**/*"]
