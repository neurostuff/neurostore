[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurostore"
version = "0.23.1"
description = "neurostore"
authors = [
    { name = "James Kent", email = "jamesdkent21@gmail.com" }
]
license = { text = "MIT" }
dependencies = [
    "auth0-python~=6.7",
    "alembic~=1.20",
    "connexion[swagger-ui,uvicorn]==3.3.0",
    "cachelib~=0.17",
    "gunicorn~=26.2",
    "httpx2~=2.13",
    "uvicorn-worker~=0.4",
    "ipython~=9.17",
    "itsdangerous~=2.2",
    "marshmallow~=4.3",
    "numpy<3.0.0",
    "pandas~=3.0",
    "psycopg2-binary~=2.9",
    "pyld~=3.3",
    "python-jose~=3.5",
    "redis",
    "shortuuid~=1.0",
    "starlette>=1.7.0,<2",
    "sqlalchemy[asyncio]~=2.1.2",
    "sqladmin~=0.32",
    "sqltap",
    "webargs~=8.7",
    "wrapt~=2.5",
    "openapi-spec-validator~=0.9",
    "scipy~=1.18",
    "orjson~=3.12",
    "pgvector~=0.5",
    "NiMARE[parquet]==0.21.0",
    "openai~=3.23",
    "tenacity~=9.1",
    "sentry-sdk~=2.71",
]

[tool.setuptools.packages.find]
exclude = ["tests", "test_*"]
include = ["neurostore*"]

[project.optional-dependencies]
dev = [
    "flake8~=7.4",
    "pip-chill~=1.0",
    "wheel~=0.48",
    "pytest~=9.1",
    "vcrpy~=8.3",
    "pytest-recording~=0.13.4",
]

[project.scripts]
manage = "neurostore.cli:main"

[tool.setuptools.package-data]
neurostore = ["openapi/**/*"]
