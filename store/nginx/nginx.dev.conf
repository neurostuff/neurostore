user www-data;
worker_processes 4;
pid /run/nginx.pid;


events {
        worker_connections 768;
        multi_accept off;
}

http {

        map $http_x_forwarded_proto $forwarded_proto {
                default $http_x_forwarded_proto;
                "" $scheme;
        }

        # Public queries (/api/query/), per client: nginx-proxy in front sets X-Real-IP.
        map $http_x_real_ip $public_query_client {
                "" $binary_remote_addr;
                default $http_x_real_ip;
        }
        limit_req_zone $public_query_client zone=public_query:10m rate=1r/s;
        limit_conn_zone $public_query_client zone=public_query_conn:10m;

        ##
        # Basic Settings
        ##

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ##
        # Logging Settings
        ##

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        ##
        # Gzip Settings
        ##

        gzip on;
        gzip_disable "msie6";

        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_buffers 16 8k;
        gzip_http_version 1.1;
        gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript;

	server {
                listen 80;
		server_name _;

		location = /admin {
			if ($forwarded_proto != https) {
				return 301 https://$http_host$request_uri;
			}
			return 301 /admin/;
		}

		location /admin {
			if ($forwarded_proto != https) {
				return 301 https://$http_host$request_uri;
			}
			proxy_pass http://neurostore:8000;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-Host $http_host;
			proxy_set_header X-Forwarded-Port $server_port;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $forwarded_proto;
			proxy_connect_timeout 75s;
			proxy_read_timeout 300s;
			client_max_body_size 100M;
		}

		# Public queries: 1 a second with bursts of 20 and 2 at once, per client;
		# test_nginx.py checks it proxies as /api does.
		location /api/query/ {
			proxy_pass http://neurostore:8000;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-Host $http_host;
			proxy_set_header X-Forwarded-Port $server_port;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $forwarded_proto;
			proxy_connect_timeout 75s;
			proxy_read_timeout 300s;
			client_max_body_size 100M;
			limit_req zone=public_query burst=20 nodelay;
			limit_conn public_query_conn 2;
			limit_req_status 429;
			limit_conn_status 429;
		}

		location /api {
			proxy_pass http://neurostore:8000;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-Host $http_host;
			proxy_set_header X-Forwarded-Port $server_port;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $forwarded_proto;
			proxy_connect_timeout 75s;
			proxy_read_timeout 300s;
			client_max_body_size 100M;
		}

		# Matches MAX_IMPORT_BYTES in store/backend/neurostore/resources/body_limit.py.
		# test_nginx.py fails if this block drifts from /api.
		location /api/review/imports/ {
			proxy_pass http://neurostore:8000;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-Host $http_host;
			proxy_set_header X-Forwarded-Port $server_port;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $forwarded_proto;
			proxy_connect_timeout 75s;
			proxy_read_timeout 300s;
			client_max_body_size 200M;
		}

		# /file-data is the in-container mount point for the host FILE_DIR
		# configured in store/.env and mounted by docker-compose.yml.
		location /_protected/neurostore-studyset-releases/ {
			internal;
			alias /file-data/neurostore-studyset-releases/;
		}

		location /pghero/ {
			proxy_pass http://store-pghero:8080/pghero/;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-Host $http_host;
			proxy_set_header X-Forwarded-Port $server_port;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $forwarded_proto;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
		}

		location /grafana/ {
			rewrite ^/grafana/(.*)$ /$1 break;
			proxy_pass http://store-grafana:3030/;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-Host $http_host;
			proxy_set_header X-Forwarded-Port $server_port;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $forwarded_proto;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
		}

		location / {
			return 301 https://neurostuff.github.io/;
		}
	}
}
