services:
  pg:
    image: apikeys-store-pgsql17
    shm_size: '512MB'
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_PASSWORD: unused
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements,pg_search", "-c", "shared_buffers=1GB", "-c", "work_mem=16MB", "-c", "maintenance_work_mem=512MB", "-c", "max_wal_size=4GB"]
    volumes: [pqdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
volumes:
  pqdata:
