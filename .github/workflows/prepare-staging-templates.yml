name: Prepare Staging Templates

# Production's nightly backups land in S3 by about 00:10 UTC. Restoring them into the
# templates ahead of time leaves every staging deploy only a copy to make.
on:
  schedule:
    - cron: "45 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Shares the deploys' group without cancelling: it waits for a running deploy, and a push
# cancels it (deploy_environment.sh then stops its restore on the host).
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add remote SSH server to known hosts
        run: |
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Update administrative repo checkout
        run: |
          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o TCPKeepAlive=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
            set -e
            cd "${{ secrets.REPO_ROOT }}"
            git fetch --all --prune
            git reset --hard origin/master
            git submodule sync --recursive
            git submodule update --init --recursive
          '

      - name: Prepare templates
        run: |
          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o TCPKeepAlive=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
            set -e
            /bin/bash "${{ secrets.REPO_ROOT }}/scripts/deploy/deploy_environment.sh" \
              --track staging \
              --repo-root "${{ secrets.REPO_ROOT }}" \
              --git-ref origin/master \
              --templates-only
          '
