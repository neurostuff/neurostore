      string: "{\"id\":\"E9U9DFRDYmWB\",\"created_at\":\"2026-11-10T05:39:37.470237+00:00\",\"updated_at\":\"2026-11-10T16:25:29.980680+00:00\",\"user\":null,\"username\":\"Abigail\",\"name\":\"Speech
        Perception\",\"description\":\"\",\"type\":\"CBMA\",\"provenance\":{\"type\":\"CBMA\",\"curationMetadata\":{\"columns\":[{\"id\":\"022a7845-c88f-4747-81e6-2666e27a414e\",\"name\":\"Identification\",\"stubStudies\":[{\"id\":\"4575bdb7-76f6-4314-8a0e-6bf15379fcba\",\"title\":\"Auditory
        comprehension of language in young children: neural networks identified with
        fMRI.\",\"authors\":\"Z. Ahmad; L. M. Balsamo; B. C. Sachs; B. Xu; W. D. Gaillard\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"12771248\",\"doi\":\"10.1212/01.wnl.0000059865.32155.86\",\"articleYear\":\"2003\",\"journal\":\"Neurology\",\"abstractText\":\"OBJECTIVE\\nThe
        organization of neuronal systems that process language in young children is
        poorly understood. The authors used fMRI to identify brain regions underlying
        auditory comprehension in healthy young children.\\nMETHODS\\nFifteen right-handed
        children (mean age 6.8 years) underwent fMRI at 1.5-T using blood oxygen level
        dependent echoplanar imaging. They listened to stories with a reverse speech
        control condition. Group data were analyzed with statistical parametric mapping.
        Individual subject data were analyzed with a region of interest approach based
        on t-maps. An asymmetry index (AI = [(L-R)/(L+R)]) was calculated for each
        region.\\nRESULTS\\nGroup analysis showed significant activation in the left
        middle temporal gyrus (Brodmann area [BA] 21) and left superior temporal gyrus
        (BA 22) along the superior temporal sulcus extending back to the angular gyrus
        (BA 39). Individual maps showed lateralized activation in temporal regions
        (AI > 0.49 +/- 0.39). There was minimal activation in the frontal lobe. There
        were no significant correlations between age and regional AI.\\nCONCLUSION\\nNetworks
        for auditory language processing are regionally localized and lateralized
        by age 5. These data may provide a means to interpret language fMRI studies
        performed in preparation for brain surgery, and may be employed to investigate
        the effect of chronic disease states, such as epilepsy, on language organization
        during critical periods for plasticity.\\n\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/12771248\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"xPrv3XRL2cd5\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"960ff346-c03a-471c-b5cf-632efc0be05d\",\"title\":\"Changes
        in the functional connectivity of auditory and language-related brain regions
        in children with congenital severe sensorineural hearing loss: An fMRI study\",\"authors\":\"Qiang
        Li; Huang Guo; Lihua Liu; Shuang Xia\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"\",\"doi\":\"10.1016/j.jneuroling.2019.01.005\",\"articleYear\":\"2019\",\"journal\":\"Journal
        of Neurolinguistics\",\"abstractText\":\"Abstract Early hearing deprivation
        can affect the development of hearing, language, and vision. Thirty-four infants
        with congenital severe sensorineural hearing loss (CSSHL) and 20 age- and
        sex-matched subjects with normal hearing were recruited. The amplitude of
        low-frequency fluctuation (ALFF) of auditory and language-related brain areas
        was compared between infants with deafness and control subjects. Relative
        to subjects with normal hearing, infants with CSSHL had decreased ALFF values
        in the right Brodmann's area (BA) 22 region and in parts of several language-related
        regions. As the duration of hearing loss increased, the ALFF values in the
        left auditory and linguistic brain regions increased. These findings indicate
        that hearing deprivation affects the functional connectivity between auditory
        and language-related brain regions and the corresponding sensory and visual
        functional brain regions and that this functional connectivity decreases as
        the duration of hearing loss increases. Cochlear implantation performed after
        24 months may limit the habilitation of hearing and speech functions due to
        functional reorganization of the auditory and linguistic brain areas over
        time.\",\"articleLink\":\"\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"pQZGeAxUP25P\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"7ae7d299-ddbc-45c6-8646-b26dc0fe3149\",\"title\":\"Pre-reading
        language abilities and the brain's functional reading network in young children.\",\"authors\":\"Alina
        Benischek; Xiangyu Long; Christiane S. Rohr; Signe Bray; Deborah Dewey; Catherine
        Lebel\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"32389725\",\"doi\":\"10.1016/j.neuroimage.2020.116903\",\"articleYear\":\"2020\",\"journal\":\"NeuroImage\",\"abstractText\":\"Early
        childhood is an important period for language development that lays the foundation
        for future reading abilities. However, little research has focused on the
        functional brain systems supporting pre-reading language abilities in typically
        developing children. Here, we investigated functional connectivity using passive
        viewing functional magnetic resonance imaging (fMRI) in 50 healthy children
        aged 2.85-5.07 years (3.84\_\u200B\xB1\_\u200B0.60 years, 22 female/28 male).
        Children completed the NEPSY-II Phonological Processing and Speeded Naming
        subtests and underwent fMRI while watching a movie of their choice. Functional
        connectivity was measured between key brain reading areas (bilateral angular
        gyrus, superior temporal gyrus, and inferior frontal gyrus) and the rest of
        the brain. Age-adjusted pre-reading scores positively correlated with functional
        connectivity between (1) the right angular gyrus and superior temporal gyrus,
        (2) the bilateral angular gyri and right pars triangularis and motor areas,
        (3) the left superior temporal gyrus and bilateral medial frontal gyrus and
        right cerebellum, (4) the left pars triangularis and middle occipital gyrus
        and insula, and (5) the right pars triangularis and the bilateral thalamus.
        Higher pre-reading scores were associated with stronger negative functional
        connectivity between (1) the left angular gyrus and auditory cortex, (2) the
        left superior temporal gyrus and occipital vision areas, (3) the right pars
        triangularis and medial frontal region, and (4) the right superior temporal
        gyrus and the posterior cingulate/precuneus. These results suggest better
        integration of the reading network, as well as its connections with other
        brain areas that support language or reading, and more dissociation between
        reading areas and the default mode network, in young children with better
        pre-reading skills. Our findings show that relationships between functional
        connectivity and pre-reading language skills are evident in young children
        even before formal reading instruction.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/32389725\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"3ZDqdmcjqZxj\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"1b7db3df-4021-4a3f-9a90-0692cc51cc83\",\"title\":\"Children
        with Reading Difficulties Show Differences in Brain Regions Associated with
        Orthographic Processing During Spoken Language Processing\",\"authors\":\"Amy
        S. Desroches; Nadia E. Cone; Donald J. Bolger; Tali Bitan; Douglas D. Burman;
        James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC2942963\",\"pmid\":\"20691675\",\"doi\":\"10.1016/j.brainres.2010.07.097\",\"articleYear\":\"2010\",\"journal\":\"Brain
        Research\",\"abstractText\":\"We explored the neural basis of spoken language
        deficits in children with reading difficulty, specifically focusing on the
        role of orthography during spoken language processing. We used functional
        magnetic resonance imaging (fMRI) to examine differences in brain activation
        between children with reading difficulties (aged 9-to-15 years) and age-matched
        children with typical achievement during an auditory rhyming task. Both groups
        showed activation in bilateral superior temporal gyri (BA 42 and 22), a region
        associated with phonological processing, with no significant between-group
        differences. Interestingly, typically achieving children, but not children
        with reading difficulties, showed activation of left fusiform cortex (BA 37),
        a region implicated in orthographic processing. Furthermore, this activation
        was significantly greater for typically achieving children compared to those
        with reading difficulties. These findings suggest that typical children automatically
        activate orthographic representations during spoken language processing, while
        those with reading difficulties do not. Follow-up analyses revealed that the
        intensity of the activation in the fusiform gyrus was associated with significantly
        stronger behavioral conflict effects in typically achieving children only
        (i.e., longer latencies to rhyming pairs with orthographically dissimilar
        endings than to those with identical orthographic endings; jazz-has vs. cat-hat).
        Finally, for reading disabled children, a positive correlation between left
        fusiform activation and nonword reading was observed, such that greater access
        to orthography was related to decoding ability. Taken together, the results
        suggest that the integration of orthographic and phonological processing is
        directly related to reading ability.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/20691675\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"8CGdXGZVN7JK\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"d78e3d8f-553a-4733-8aee-72fadf21338d\",\"title\":\"Both
        frontal and temporal cortex exhibit phonological and semantic specialization
        during spoken language processing in 7\u2010 to 8\u2010year\u2010old children\",\"authors\":\"Jin
        Wang; Brianna L. Yamasaki; Yael Weiss; James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC8249890\",\"pmid\":\"33951259\",\"doi\":\"10.1002/hbm.25450\",\"articleYear\":\"2021\",\"journal\":\"Human
        Brain Mapping\",\"abstractText\":\" \\nA previous functional magnetic resonance
        imaging (fMRI) study by Weiss et al. (Weiss et al., Human Brain Mapping, 2018,
        39, 4334\u20134348) examined brain specialization for phonological and semantic
        processing of spoken words in young children who were 5 to 6\u2009years old
        and found evidence for specialization in the temporal but not the frontal
        lobe. According to a prominent neurocognitive model of language development
        (Skeide & Friederici, Nature Reviews Neuroscience, 2016, 17, 323\u2013332),
        the frontal lobe matures later than the temporal lobe. Thus, the current study
        aimed to examine if brain specialization in the frontal lobe can be observed
        in a slightly older cohort of children aged 7 to 8\u2009years old using the
        same experimental and analytical approach as in Weiss et al. (Weiss et al.,
        Human Brain Mapping, 2018, 39, 4334\u20134348). One hundred and ten typically
        developing children were recruited and were asked to perform a sound judgment
        task, tapping into phonological processing, and a meaning judgment task, tapping
        into semantic processing, while in the MRI scanner. Direct task comparisons
        showed that these children exhibited language specialization in both the temporal
        and the frontal lobes, with the left posterior dorsal inferior frontal gyrus
        (IFG) showing greater activation for the sound than the meaning judgment task,
        and the left anterior ventral IFG and the left posterior middle temporal gyrus
        (MTG) showing greater activation for the meaning than the sound judgment task.
        These findings demonstrate that 7\u2010 to 8\u2010year\u2010old children have
        already begun to develop a language\u2010related specialization in the frontal
        lobe, suggesting that early elementary schoolers rely on both specialized
        linguistic manipulation and representation mechanisms to perform language
        tasks. \\n  \\nWe designed an auditory sound judgment task tapping into phonological
        processing and an auditory meaning judgment task tapping into semantic processing.
        We found that 7\u2010 to 8\u2010year\u2010old children exhibited language
        specialization in both the temporal and the frontal lobes, with the left posterior
        dorsal inferior frontal gyrus (IFG) showing greater activation for the sound
        than the meaning judgment task, and the left anterior ventral IFG and the
        left posterior middle temporal gyrus (MTG) showing greater activation for
        the meaning than the sound judgment task. Our findings suggest that early
        elementary schoolers rely on both specialized linguistic manipulation and
        representation mechanisms to perform language tasks.   \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/33951259\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"bfLf9ctdFTNt\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"e28d5105-e5bf-4447-85ac-d4fcf984c7b4\",\"title\":\"Letter
        fluency in 7-8-year-old children is related to the anterior, but not posterior,
        ventral occipito-temporal cortex during an auditory phonological task.\",\"authors\":\"Jin
        Wang; Marc F. Joanisse; James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC7750687\",\"pmid\":\"33341533\",\"doi\":\"10.1016/j.dcn.2020.100898\",\"articleYear\":\"2021\",\"journal\":\"Developmental
        Cognitive Neuroscience\",\"abstractText\":\"\\nPrevious studies have shown
        that reading skill in 3- to 6-year-old children is related to the automatic
        activation of the posterior left ventral occipitotemporal cortex (vOT) during
        spoken language processing, whereas 8- to 15-year-old children and adult readers
        activate the anterior vOT. However, it is unknown how children who are between
        these two age groups automatically activate orthographic representations in
        vOT for spoken language. In the current study, we recruited 153 7- to 8-year-old
        children to fill the age gap from previous studies. Using functional magnetic
        resonance imaging (fMRI), we measured children's reading-related skills and
        brain activity during an auditory phonological task with both a small (i.e.
        onset) and a large (i.e. rhyme) grain size condition. We found that letter
        fluency, but not reading accuracy, was correlated with activation in the anterior
        vOT for the rhyme condition. There were no reading-related skill correlations
        for the posterior vOT or for activation during the onset condition in this
        age group. Our findings reveal that automatic activation in the anterior vOT
        during spoken language processing already occurs in higher skilled 7- to 8-year-old
        children. In addition, increases in naming automaticity is the primary determinant
        of the engagement of vOT during phonological awareness tasks.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/33341533\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"6DPgsG2DmPi4\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"b1284d63-c059-4b39-a6b1-61423966b407\",\"title\":\"An
        fMRI study of sentence-embedded lexical-semantic decision in children and
        adults.\",\"authors\":\"Erin Nicole Moore-Parks; Erin L. Burns; Rebecca Bazzill;
        Sarah Levy; Valerie Posada; Ralph-Axel M\xFCller\",\"keywords\":\"\",\"pmcid\":\"PMC3630793\",\"pmid\":\"20627366\",\"doi\":\"10.1016/j.bandl.2010.03.009\",\"articleYear\":\"2010\",\"journal\":\"Brain
        and Language\",\"abstractText\":\"Lexical-semantic knowledge is a core language
        component that undergoes prolonged development throughout childhood and is
        therefore highly amenable to developmental studies. Most previous lexical-semantic
        functional MRI (fMRI) studies have been limited to single-word or word-pair
        tasks, outside a sentence context. Our objective was to investigate the development
        of lexical-semantic language networks in typically developing children using
        a more 'ecological' sentence-embedded semantic task that permitted performance
        monitoring while minimizing head movement by avoiding overt speech. Sixteen
        adults and 23 children completed two fMRI runs of an auditory lexical-semantic
        decision task with a button-press response, using reverse speech as control
        condition. Children and adults showed similar activation in bilateral temporal
        and left inferior frontal regions. Greater activation in adults than in children
        was seen in left inferior parietal, premotor, and inferior frontal regions,
        and in bilateral supplementary motor area (SMA). Specifically for semantically
        incongruous sentences, adults also showed greater activation than children
        in left inferior frontal cortex, possibly related to enhanced 'top-down' control.
        Age-dependent activation increases in motor-related regions were shown to
        be unrelated to overt motor responses, but could be associated with covert
        speech accompanying semantic decision. Unlike previous studies, age-dependent
        differences were not detected in posterior sensory cortices (such as extrastriate
        cortex), nor in middle temporal gyrus.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/20627366\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"3UFjR2x4jcDk\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"de202cb7-c234-4c62-aca9-fe0027b6bed5\",\"title\":\"Auditory
        observation of infant-directed speech by mothers: experience-dependent interaction
        between language and emotion in the basal ganglia.\",\"authors\":\"Yoshi-Taka
        Matsuda; Kenichi Ueno; Kang Cheng; Yukuo Konishi; Reiko Mazuka; Kazuo Okanoya\",\"keywords\":\"\",\"pmcid\":\"PMC4226166\",\"pmid\":\"25426054\",\"doi\":\"10.3389/fnhum.2014.00907\",\"articleYear\":\"2014\",\"journal\":\"Frontiers
        in Human Neuroscience\",\"abstractText\":\"\\nAdults address infants with
        a special speech register known as infant-directed speech (IDS), which conveys
        both linguistic and emotional information through its characteristic lexicon
        and exaggerated prosody (e.g., higher pitched, slower, and hyperarticulated).
        Although caregivers are known to regulate the usage of IDS (linguistic and
        emotional components) depending on their child's development, the underlying
        neural substrates of this flexible modification are largely unknown. Here,
        using an auditory observation method and functional magnetic resonance imaging
        (fMRI) of four different groups of females, we revealed the experience-dependent
        influence of the emotional component on linguistic processing in the right
        caudate nucleus when mothers process IDS: (1) non-mothers, who do not use
        IDS regularly, showed no significant difference between IDS and adult-directed
        speech (ADS); (2) mothers with preverbal infants, who primarily use the emotional
        component of IDS, showed the main effect of the emotional component of IDS;
        (3) mothers with toddlers at the two-word stage, who use both linguistic and
        emotional components of IDS, showed an interaction between the linguistic
        and emotional components of IDS; and (4) mothers with school-age children,
        who use ADS rather than IDS toward their children, showed a tendency toward
        the main effect of ADS. The task that was most comparable to the naturalistic
        categories of IDS (i.e., explicit-language and implicit-emotion processing)
        recruited the right caudate nucleus, but it was not recruited in the control,
        less naturalistic condition (explicit-emotion and implicit-language processing).
        Our results indicate that the right caudate nucleus processes experience-and
        task-dependent interactions between language and emotion in mothers' IDS.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/25426054\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"4TnMnMxC99pw\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"1633b0e9-e726-4f20-91ec-7a04464b1233\",\"title\":\"Brain
        bases of morphological processing in young children.\",\"authors\":\"Maria
        M. Arredondo; Ka I Ip; Lucy Shih Ju Hsu; Twila Tardif; Ioulia Kovelman\",\"keywords\":\"\",\"pmcid\":\"PMC5374976\",\"pmid\":\"25930011\",\"doi\":\"10.1002/hbm.22815\",\"articleYear\":\"2015\",\"journal\":\"Human
        Brain Mapping\",\"abstractText\":\"How does the developing brain support the
        transition from spoken language to print? Two spoken language abilities form
        the initial base of child literacy across languages: knowledge of language
        sounds (phonology) and knowledge of the smallest units that carry meaning
        (morphology). While phonology has received much attention from the field,
        the brain mechanisms that support morphological competence for learning to
        read remain largely unknown. In the present study, young English-speaking
        children completed an auditory morphological awareness task behaviorally (n
        = 69, ages 6-12) and in fMRI (n = 16). The data revealed two findings: First,
        children with better morphological abilities showed greater activation in
        left temporoparietal regions previously thought to be important for supporting
        phonological reading skills, suggesting that this region supports multiple
        language abilities for successful reading acquisition. Second, children showed
        activation in left frontal regions previously found active in young Chinese
        readers, suggesting morphological processes for reading acquisition might
        be similar across languages. These findings offer new insights for developing
        a comprehensive model of how spoken language abilities support children's
        reading acquisition across languages.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/25930011\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"4ZroLh7noc7e\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"076e1cd6-4b99-461d-9ff8-c369294e070b\",\"title\":\"Parallel
        contributions of socioeconomic status and bilingual experiences on executive
        function and the brain in young children.\",\"authors\":\"Gavkhar Abdurokhmonova;
        Ellie K. Taylor-Robinette; S. Alexa McDorman; Alexus G. Ramirez; Junaid S.
        Merchant; John D.E. Gabrieli; Rachel R. Romeo\",\"keywords\":\"\",\"pmcid\":\"PMC13218402\",\"pmid\":\"41793923\",\"doi\":\"10.1016/j.bandl.2026.105737\",\"articleYear\":\"2026\",\"journal\":\"Brain
        and Language\",\"abstractText\":\"Executive functions (EF) are foundational
        for children's cognitive, socio-emotional, and academic outcomes, and socioeconomic
        status (SES) is consistently associated with disparities in children's EF
        performance and EF-related brain function. While bilingual children sometimes
        exhibit an \\\"advantage\\\" on certain EF tasks compared to their monolingual
        counterparts, it is unknown whether early bilingual experience may buffer
        the effects of low SES on EF in either brain or behavior. A SES-diverse sample
        (n\_=\_80) of monolingual and bilingual children (4-6\_years old) completed
        behavioral measures of EF and functional magnetic resonance imaging (fMRI)
        while engaging in a dichotic listening auditory selective attention task.
        Bilingualism was measured both by subjective parental report of children's
        language knowledge, as well as objective annotations of two daylong recordings
        of children's naturalistic language exposure. Selective auditory attention
        (vs. normal binaural speech) elicited activation in canonical attention/EF
        (posterior cingulate, precuneus, and cuneus) and language (posterior temporal
        gyrus and inferior frontal gyrus) regions. While there was no evidence of
        a protective effect of bilingualism, there were independent main effects of
        both SES and bilingual experience. Specifically, higher SES was associated
        with better EF performance and greater activation in bilateral precunei, independent
        of mono/bilingual status. While parent-reported bilingual knowledge was not
        associated with either brain or behavior independent of SES, children who
        had more balanced bilingual exposure at home exhibited better EF performance
        than those with more unbalanced or monolingual exposure in either language.
        Findings contribute to our understanding of the independent influences of
        specific experiences on children's EF development across contexts.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/41793923\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"mtrpzWiEpCXs\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"310772d9-a222-40fb-82f8-6766d5682fc7\",\"title\":\"Neural
        selectivity for communicative auditory signals in Phelan-McDermid syndrome\",\"authors\":\"A.
        Ting Wang; Teresa Lim; Jesslyn Jamison; Lauren Bush; Latha V. Soorya; Teresa
        Tavassoli; Paige M. Siper; Joseph D. Buxbaum; Alexander Kolevzon\",\"keywords\":\"\",\"pmcid\":\"PMC4763436\",\"pmid\":\"26909118\",\"doi\":\"10.1186/s11689-016-9138-9\",\"articleYear\":\"2016\",\"journal\":\"Journal
        of Neurodevelopmental Disorders\",\"abstractText\":\"BACKGROUND: Phelan-McDermid
        syndrome (PMS), a neurodevelopmental disorder caused by deletion or mutation
        in the SHANK3 gene, is one of the more common single-locus causes of autism
        spectrum disorder (ASD). PMS is characterized by global developmental delay,
        hypotonia, delayed or absent speech, increased risk of seizures, and minor
        dysmorphic features. Impairments in language and communication are one of
        the most consistent characteristics of PMS. Although there is considerable
        overlap in the social communicative deficits associated with PMS and ASD,
        there is a dearth of data on underlying abnormalities at the level of neural
        systems in PMS. No controlled neuroimaging studies of PMS have been reported
        to date. The goal of this study was to examine the neural circuitry supporting
        the perception of auditory communicative signals in children with PMS as compared
        to idiopathic ASD (iASD). METHODS: Eleven children with PMS and nine comparison
        children with iASD were scanned using functional magnetic resonance imaging
        (fMRI) under light sedation. The fMRI paradigm was a previously validated
        passive auditory task, which presented communicative (e.g., speech, sounds
        of agreement, disgust) and non-communicative vocalizations (e.g., sneezing,
        coughing, yawning). RESULTS: Previous research has shown that the superior
        temporal gyrus (STG) responds selectively to communicative vocal signals in
        typically developing children and adults. Here, selective activity for communicative
        relative to non-communicative vocalizations was detected in the right STG
        in the PMS group, but not in the iASD group. The PMS group also showed preferential
        activity for communicative vocalizations in a range of other brain regions
        associated with social cognition, such as the medial prefrontal cortex (MPFC),
        insula, and inferior frontal gyrus. Interestingly, better orienting toward
        social sounds was positively correlated with selective activity in the STG
        and other \\\"social brain\\\" regions, including the MPFC, in the PMS group.
        Finally, selective MPFC activity for communicative sounds was associated with
        receptive language level in the PMS group and expressive language in the iASD
        group. CONCLUSIONS: Despite shared behavioral features, children with PMS
        differed from children with iASD in their neural response to communicative
        vocal sounds and showed relative strengths in this area. Furthermore, the
        relationship between clinical characteristics and neural selectivity also
        differed between the two groups, suggesting that shared ASD features may partially
        reflect different neurofunctional abnormalities due to differing etiologies.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/26909118\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"6rRsGPqoVMQ8\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"7d35bd16-eb45-44dc-8794-6b0456d256ef\",\"title\":\"Age-related
        connectivity changes in fMRI data from children listening to stories.\",\"authors\":\"Prasanna
        R. Karunanayaka; Scott K. Holland; Vincent J. Schmithorst; Ana Solodkin; E.
        Elinor Chen; Jerzy P. Szaflarski; Elena Plante\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"17064940\",\"doi\":\"10.1016/j.neuroimage.2006.08.028\",\"articleYear\":\"2007\",\"journal\":\"NeuroImage\",\"abstractText\":\"The
        way humans comprehend narrative speech plays an important part in human development
        and experience. A group of 313 children with ages 5-18 were subjected to a
        large-scale functional magnetic resonance imaging (fMRI) study in order to
        investigate the neural correlates of auditory narrative comprehension. The
        results were analyzed to investigate the age-related brain activity changes
        involved in the narrative language comprehension circuitry. We found age-related
        differences in brain activity which may either reflect changes in local neuroplasticity
        (of the regions involved) in the developing brain or a more global transformation
        of brain activity related to neuroplasticity. To investigate this issue, Structural
        Equation Modeling (SEM) was applied to the results obtained from a group independent
        component analysis (Schmithorst, V.J., Holland, S.K., et al., 2005. Cognitive
        modules utilized for narrative comprehension in children: a functional magnetic
        resonance imaging study. NeuroImage) and the age-related differences were
        examined in terms of changes in path coefficients between brain regions. The
        group Independent Component Analysis (ICA) had identified five bilateral task-related
        components comprising the primary auditory cortex, the mid-superior temporal
        gyrus, the most posterior aspect of the superior temporal gyrus, the hippocampus,
        the angular gyrus and the medial aspect of the parietal lobule (precuneus/posterior
        cingulate). Furthermore, a left-lateralized network (sixth component) was
        also identified comprising the inferior frontal gyrus (including Broca's area),
        the inferior parietal lobule, and the medial temporal gyrus. The components
        (brain regions) for the SEM were identified based on the ICA maps and the
        results are discussed in light of recent neuroimaging studies corroborating
        the functional segregation of Broca's and Wernicke's areas and the important
        role played by the right hemisphere in narrative comprehension. The classical
        Wernicke-Geschwind (WG) model for speech processing is expanded to a two-route
        model involving a direct route between Broca's and Wernicke's area and an
        indirect route involving the parietal lobe.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/17064940\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"FgRw6ff5ttH7\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"eafaaec3-86f2-4090-9da5-4d4320991a81\",\"title\":\"Cortical
        recruitment patterns in children born prematurely compared with control subjects
        during a passive listening functional magnetic resonance imaging task\",\"authors\":\"Laura
        R. Ment; Bradley S. Peterson; Betty Vohr; Walter Allan; Karen C. Schneider;
        Cheryl Lacadie; Karol H. Katz; Jill Maller-Kesselman; Kenneth Pugh; Charles
        C. Duncan; Robert W. Makuch; R. Todd Constable\",\"keywords\":\"\",\"pmcid\":\"PMC2386989\",\"pmid\":\"17011320\",\"doi\":\"10.1016/j.jpeds.2006.06.007\",\"articleYear\":\"2006\",\"journal\":\"The
        Journal of Pediatrics\",\"abstractText\":\"OBJECTIVES: To use functional magnetic
        resonance imaging (fMRI) to test the hypothesis that subjects who were born
        prematurely develop alternative systems for processing language. STUDY DESIGN:
        Subjects who were born prematurely (n = 14; 600-1250 g birthweight) without
        neonatal brain injury and 10 matched term control subjects were examined with
        a fMRI passive listening task of language, the Clinical Evaluation of Language
        Fundamentals (CELF) and portions of the Comprehensive Test of Phonological
        Processing (CTOPP). The fMRI task was evaluated for both phonologic and semantic
        processing. RESULTS: Although there were differences in CELF scores between
        the subjects born prematurely and control subjects, there were no significant
        differences in the CTOPP measures in the 2 groups. fMRI studies demonstrated
        that the groups differentially engaged neural systems known to process language.
        Children born at term were significantly more likely to activate systems for
        the semantic processing of language, whereas subjects born prematurely preferentially
        engaged regions that subserve phonology. CONCLUSIONS: At 12 years of age,
        children born prematurely and children born at term activate neural systems
        for the auditory processing of language differently. Subjects born prematurely
        engage different networks for phonologic processing; this strategy is associated
        with phonologic language scores that are similar to those of control subjects.
        These biologically based developmental strategies may provide the substrate
        for the improving language skills noted in children who are born prematurely.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/17011320\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"5PHBLvU3CXhm\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"71c835c0-b241-4434-ab3c-95e489b488a8\",\"title\":\"Speech
        cortical activation and connectivity in typically developing children and
        those with listening difficulties\",\"authors\":\"Hannah J. Stewart; Erin
        K. Cash; Lisa L. Hunter; Thomas Maloney; Jennifer Vannest; David R. Moore\",\"keywords\":\"\",\"pmcid\":\"PMC9467868\",\"pmid\":\"36087559\",\"doi\":\"10.1016/j.nicl.2022.103172\",\"articleYear\":\"2022\",\"journal\":\"NeuroImage
        Clinical\",\"abstractText\":\"  Highlights  \\n  \\nAll participants had clinically
        normal hearing. \\n  \\nNo group differences in cortical activation during
        speech recognition. \\n  \\nComplex speech processing networks showed group
        differences in temporal connectivity. \\n  \\nStrength of connections related
        to listening and cognitive test outcomes. \\n  \\n  \\nListening difficulties
        (LiD) in people who have normal audiometry are a widespread but poorly understood
        form of hearing impairment. Recent research suggests that childhood LiD are
        cognitive rather than auditory in origin. We examined decoding of sentences
        using a novel combination of behavioral testing and fMRI with 43 typically
        developing children and 42 age matched (6\u201313\_years old) children with
        LiD, categorized by caregiver report (ECLiPS). Both groups had clinically
        normal hearing. For sentence listening tasks, we found no group differences
        in fMRI brain cortical activation by increasingly complex speech stimuli that
        progressed in emphasis from phonology to intelligibility to semantics. Using
        resting state fMRI, we examined the temporal connectivity of cortical auditory
        and related speech perception networks. We found significant group differences
        only in cortical connections engaged when processing more complex speech stimuli.
        The strength of the affected connections was related to the children\u2019s
        performance on tests of dichotic listening, speech-in-noise, attention, memory
        and verbal vocabulary. Together, these results support the novel hypothesis
        that childhood LiD reflects difficulties in language rather than in auditory
        or phonological processing. \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/36087559\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"PrdVj784R4oQ\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"586fedad-87c3-44b1-8078-01a33d02cb88\",\"title\":\"Auditory
        rhythm discrimination in adults who stutter: An fMRI study.\",\"authors\":\"Emily
        O. Garnett; J. Devin McAuley; Elizabeth A. Wieland; Ho Ming Chow; David C.
        Zhu; Laura C. Dilley; Soo-Eun Chang\",\"keywords\":\"\",\"pmcid\":\"PMC12955694\",\"pmid\":\"36577315\",\"doi\":\"10.1016/j.bandl.2022.105219\",\"articleYear\":\"2022\",\"journal\":\"Brain
        and Language\",\"abstractText\":\"Rhythm perception deficits have been linked
        to neurodevelopmental disorders affecting speech and language. Children who
        stutter have shown poorer rhythm discrimination and attenuated functional
        connectivity in rhythm-related brain areas, which may negatively impact timing
        control required for speech. It is unclear whether adults who stutter (AWS),
        who are likely to have acquired compensatory adaptations in response to rhythm
        processing/timing deficits, are similarly affected. We compared rhythm discrimination
        in AWS and controls (total n\_=\_36) during fMRI in two matched conditions:
        simple rhythms that consistently reinforced a periodic beat, and complex rhythms
        that did not (requiring greater reliance on internal timing). Consistent with
        an internal beat deficit hypothesis, behavioral results showed poorer complex
        rhythm discrimination for AWS than controls. In AWS, greater stuttering severity
        was associated with poorer rhythm discrimination. AWS showed increased activity
        within beat-based timing regions and increased functional connectivity between
        putamen and cerebellum (supporting interval-based timing) for simple rhythms.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/36577315\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"WCAbRKvL9qqv\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"cda4f5bc-8fee-4a91-a3a7-b20945734e90\",\"title\":\"Atypical
        Neural Responses to Native and Non-Native Language in Infants at High Likelihood
        for Developing Autism\",\"authors\":\"Wagner, Lauren; Banchik, Megan; Tsang,
        Tawny; Okada, Nana J.; Altshuler, Rebecca; McDonald, Nicole; Bookheimer, Susan
        Y.; Jeste, Shafali S.; Green, Shulamite A.; Dapretto, Mirella\",\"keywords\":\"\",\"pmcid\":\"11643322\",\"pmid\":\"39678338\",\"doi\":\"10.21203/rs.3.rs-5190659/v1\",\"articleYear\":\"2024\",\"journal\":\"Molecular
        Autism\",\"abstractText\":\" \\n## Background \\n  \\nLanguage difficulties
        are common in autism spectrum disorder (ASD), a neurodevelopmental condition
        characterized by impairments in social communication as well as restricted
        and repetitive behaviors. Amongst infant siblings of children with an ASD
        diagnosis \u2013 who are at higher likelihood for developing ASD \u2013 a
        high proportion also show difficulties and delays in language acquisition.
        \\n\\n\\n## Methods \\n  \\nIn this study, we used functional magnetic resonance
        imaging (fMRI) to examine atypicalities associated with language processing
        in 9-month-old infants at high (HL) and typical (TL) familial likelihood for
        ASD. Infants were presented with native (English) and novel (Japanese) speech
        while sleeping naturally in the scanner. Whole-brain and   a priori   region-of-interest
        analyses were conducted to evaluate neural differences in language processing
        based on likelihood group and language condition. \\n\\n\\n## Results \\n
        \ \\nHL infants showed attenuated responses to speech in general, particularly
        in left temporal language areas, as well as a lack of neural discrimination
        between the native and novel languages compared to the TL group. Importantly,
        we also demonstrate that HL infants show distinctly atypical patterns of greater
        rightward lateralization for speech processing. Limitations: The sample size,
        particularly for the TL group, is relatively modest due to the challenges
        inherent to collecting auditory stimulus-evoked data from sleeping participants,
        as well as retention and follow-up difficulties posed by the COVID-19 pandemic.
        Additionally, the groups were not matched on some demographic variables; however,
        the present findings held even after accounting for these differences. \\n\\n\\n##
        Conclusions \\n  \\nTo our knowledge, this is the first fMRI study to directly
        measure autism-associated atypicalities in native language uptake during infancy.
        These findings provide a better understanding of the neurodevelopmental underpinnings
        of language delay in ASD, which is a prerequisite step for developing earlier
        and more effective interventions for autistic children and HL siblings who
        experience language impairments. \\n\\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/39678338\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"64C97WxP5idW\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"09ee66d4-736d-4614-b945-c761d063f445\",\"title\":\"Atypical
        early neural responses to native and non-native language in infants at high
        likelihood for developing autism\",\"authors\":\"Lauren Wagner; Megan Banchik;
        Tawny Tsang; Nana J. Okada; Rebecca Altshuler; Nicole McDonald; Susan Y. Bookheimer;
        Shafali S. Jeste; Shulamite Green; Mirella Dapretto\",\"keywords\":\"\",\"pmcid\":\"PMC11792659\",\"pmid\":\"39901290\",\"doi\":\"10.1186/s13229-025-00640-w\",\"articleYear\":\"2025\",\"journal\":\"Molecular
        Autism\",\"abstractText\":\" \\n## Background \\n  \\nLanguage difficulties
        are common in autism spectrum disorder (ASD), a neurodevelopmental condition
        characterized by impairments in social communication as well as restricted
        and repetitive behaviors. Amongst infant siblings of children with an ASD
        diagnosis \u2013 who are at higher likelihood for developing ASD \u2013 a
        high proportion also show difficulties and delays in language acquisition.
        \\n\\n\\n## Methods \\n  \\nIn this study, we used functional magnetic resonance
        imaging (fMRI) to examine differences in language processing in 9-month-old
        infants at high (HL) and typical (TL) familial likelihood for ASD. Infants
        were presented with native (English) and novel (Japanese) speech while sleeping
        naturally in the scanner. Whole-brain and a priori region-of-interest analyses
        were conducted to evaluate neural differences in language processing based
        on likelihood group and language condition. \\n\\n\\n## Results \\n  \\nHL
        infants showed attenuated responses to speech in general, particularly in
        left temporal language areas, as well as a lack of neural discrimination between
        the native and novel languages compared to the TL group. Importantly, we also
        demonstrate that HL infants show distinctly atypical patterns of lateralization
        for speech processing, particularly during native speech processing, suggesting
        a failure to left-lateralize.   Limitations  : The sample size, particularly
        for the TL group, is relatively modest because of the challenges inherent
        to collecting auditory stimulus-evoked data from sleeping participants, as
        well as retention and follow-up difficulties posed by the COVID-19 pandemic.
        The groups were not matched on some demographic variables, but the present
        findings held even after accounting for these differences. \\n\\n\\n## Conclusions
        \\n  \\nTo our knowledge, this is the first fMRI study to directly measure
        autism-associated atypicalities in native language uptake during infancy.
        These findings provide a better understanding of the neurodevelopmental underpinnings
        of language delay in ASD, which is a prerequisite step for developing earlier
        and more effective interventions for autistic children and HL siblings who
        experience language impairments. \\n\\n\\n## Supplementary Information \\n
        \ \\nThe online version contains supplementary material available at 10.1186/s13229-025-00640-w.
        \\n\\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/39901290\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"YQH7Vd4fMA3p\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"8ca3b790-0045-4728-81fa-d8e85da85e55\",\"title\":\"Evidence
        for normal letter-sound integration, but altered language pathways in a  case
        of recovered Landau-Kleffner Syndrome.\",\"authors\":\"Pim Pullens; Will Pullens;
        Vera Blau; Bettina Sorger; Bernadette M. Jansma; Rainer Goebel\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"26232266\",\"doi\":\"10.1016/j.bandc.2015.07.003\",\"articleYear\":\"2015\",\"journal\":\"Brain
        and Cognition\",\"abstractText\":\"Landau-Kleffner Syndrome (LKS) is a rare
        form of acquired aphasia in children, characterized by epileptic discharges,
        which occur mostly during sleep. After normal speech and language development,
        aphasia develops between the ages of 3-7 years in a period ranging from days
        to months. The epileptic discharges usually disappear after reaching adulthood,
        but language outcomes are usually poor if no treatment focused on restoration
        of (non-) verbal communication is given. Patients often appear deaf-mute,
        but sign language, as part of the treatment, may lead to recovery of communication.
        The neural mechanisms underlying poor language outcomes in LKS are not yet
        understood. In this detailed functional MRI study of a recovered LKS patient
        - that is, a patient no longer suffering from epileptic discharges, audiovisual
        multi-sensory processing was investigated, since LKS patients are often proficient
        in reading, but not in speech perception. In the recovered LKS patient a large
        difference in the neural activation to auditory stimuli was found in the left
        versus the right auditory cortex, which cannot be attributed to hearing loss.
        Compared to healthy proficient readers investigated earlier with the same
        fMRI experiment, the patient demonstrated normal letter-sound integration
        in the superior temporal gyrus as demonstrated by the multi-sensory interaction
        index, indicating intact STG function. Diffusion Tensor Imaging (DTI) based
        fiber tracking in the LKS patient showed fibers originating from Heschl's
        gyrus that seem to be left-right inverted with respect to HG fiber pattern
        described in the literature for healthy controls. In the patient, in both
        hemispheres we found arcuate fibers projecting from (homologues of) Broca's
        to Wernicke's areas, and a lack of fibers from arcuate left inferior parietal
        and sylvian areas reported in healthy subjects. We observed short arcuate
        segments in the right hemisphere. Although speculative, our results suggest
        intact temporal lobe processing but an altered temporal to frontal connectivity.
        The altered connectivity might explain observed short-term verbal memory problems,
        disturbed (speech) sound-motor interaction and online feedback of speech and
        might be one of the neuronal factors underlying LKS.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/26232266\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7VcpqAzrSWLe\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"6ebe11de-f648-4162-a025-7827b50d2eca\",\"title\":\"Reading
        ability in both deaf and hearing adults is linked to neural representations
        of abstract phonology derived from visual speech\",\"authors\":\"Samuel Evans;
        Cathy J. Price; J\xF6rn Diedrichsen; Tae Twomey; Indie Beedie; Maggie Fraser;
        Mair\xE9ad MacSweeney\",\"keywords\":\"\",\"pmcid\":\"PMC13229273\",\"pmid\":\"42190012\",\"doi\":\"10.1073/pnas.2535704123\",\"articleYear\":\"2026\",\"journal\":\"Proceedings
        of the National Academy of Sciences\",\"abstractText\":\"Reading is central
        to academic and vocational success. Some deaf children face reading challenges
        due to limited access to spoken or signed language. Robust phonological representations
        are key to reading development in hearing children. Spoken language phonology
        may be one of many contributors to reading development in deaf children. Indeed,
        speechreading ability correlates with reading skill in both deaf and hearing
        individuals, suggesting it is linked to reading development regardless of
        hearing status. Further support for this hypothesis would be provided by evidence
        that similar neural representations of speech phonology are evoked by visual
        speech and other language forms (auditory speech and text), and that these
        neural representations are related to reading proficiency. We used fMRI and
        Representational Similarity Analysis (RSA) to identify shared neural representations
        of spoken language phonological structure. A group of deaf adult participants
        (N=22), with a mixture of sign language and spoken language backgrounds and
        reading abilities, were presented with single lexical items as visual speech
        and dynamic text (cursive text, revealed letter-by-letter to promote a phonological
        reading strategy). Adult hearing participants (N=25) were presented with the
        same words, but as visual speech and auditory speech. Shared neural representations
        of phonological structure of English words were found in each group in the
        superior and middle temporal cortex (STC/MTC) and these abstract representations
        were more similar across different language forms in better readers. Our data
        provide neurobiological evidence of the contribution of visual speech to abstract
        phonological representations of spoken language, that relate to reading proficiency,
        in both deaf and hearing adults. Significance Statement Reading is an essential
        skill, yet some deaf children face reading challenges due to reduced access
        to signed or spoken language. In hearing children, successful reading depends
        on abstract phonological representations, but whether spoken language phonology
        relates to reading in deaf individuals remains unclear. Using fMRI and RSA,
        we show that deaf and hearing adults recruit neural representations of phonology
        that are shared by visual speech and other language forms (visual/auditory
        speech in hearing; visual speech/dynamic text in deaf) in the superior and
        middle temporal cortex. Critically, greater cross-modal alignment of neural
        representations of phonological structure was associated with better reading
        in both groups. These findings provide neurobiological evidence that visual
        speech contributes to phonological representations that relate to reading,
        regardless of hearing status.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/42190012\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"n3W2KfsbSMrt\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"694a36a2-d6cc-4e2a-91f7-914f39cf93da\",\"title\":\"Developmental
        changes in brain regions involved in phonological and orthographic processing
        during spoken language processing\",\"authors\":\"Nadia E. Cone; Douglas D.
        Burman; Tali Bitan; Donald J. Bolger; James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC2443702\",\"pmid\":\"18413290\",\"doi\":\"10.1016/j.neuroimage.2008.02.055\",\"articleYear\":\"2008\",\"journal\":\"NeuroImage\",\"abstractText\":\"Developmental
        differences in brain activation of 9- to 15-year-old children were examined
        during an auditory rhyme decision task to spoken words using functional magnetic
        resonance imaging (fMRI). As a group, children showed activation in the left
        superior/middle temporal gyri (BA 22, 21), right middle temporal gyrus (BA
        21), dorsal (BA 45, pars opercularis) and ventral (BA 46, pars triangularis)
        aspects of the left inferior frontal gyrus, and left fusiform gyrus (BA 37).
        There was a developmental increase in activation in the left middle temporal
        gyrus (BA 22) across all lexical conditions, suggesting that automatic semantic
        processing increases with age regardless of task demands. Activation in the
        left dorsal inferior frontal gyrus also showed developmental increases for
        the conflicting (e.g. PINT-MINT) compared to the non-conflicting (e.g. PRESS-LIST)
        non-rhyming conditions, indicating that this area becomes increasingly involved
        in strategic phonological processing in the face of conflicting orthographic
        and phonological representations. Left inferior temporal/fusiform gyrus (BA
        37) activation was also greater for the conflicting (e.g. PINT-MINT) condition,
        and a developmental increase was found in the positive relationship between
        individuals' reaction time and activation in the left lingual/fusiform gyrus
        (BA 18) in this condition, indicating an age-related increase in the association
        between longer reaction times and greater visual-orthographic processing in
        this conflicting condition. These results suggest that orthographic processing
        is automatically engaged by children in a task that does not require access
        to orthographic information for correct performance, especially when orthographic
        and phonological representations conflict, and especially for longer response
        latencies in older children.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/18413290\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7Sh9spX7tMDQ\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"e2a98d85-c044-4e65-9789-2836bc0932b1\",\"title\":\"Reading
        acquisition reorganizes the phonological awareness network only in alphabetic
        writing systems.\",\"authors\":\"Christine Brennan; Fan Cao; Nicole Pedroarena\u2010Leal;
        Chris McNorgan; James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC3537870\",\"pmid\":\"22815229\",\"doi\":\"10.1002/hbm.22147\",\"articleYear\":\"2013\",\"journal\":\"Human
        Brain Mapping\",\"abstractText\":\"It is unknown how experience with different
        types of orthographies influences the neural basis of oral language processing.
        In order to determine the effects of alphabetic and nonalphabetic writing
        systems, the current study examined the influence of learning to read on oral
        language in English and Chinese speakers. Children (8-12 years olds) and adults
        made rhyming judgments to pairs of spoken words during functional magnetic
        resonance imaging (fMRI). Developmental increases were seen only for English
        speakers in the left hemisphere phonological network (superior temporal gyrus
        (STG), inferior parietal lobule, and inferior frontal gyrus). The increase
        in the STG was more pronounced for words with conflicting orthography (e.g.
        pint-mint; jazz-has) even though access to orthography was irrelevant to the
        task. Moreover, higher reading skill was correlated with greater activation
        in the STG only for English speaking children. The effects suggest that learning
        to read reorganizes the phonological awareness network only for alphabetic
        and not logographic writing systems because of differences in the principles
        for mapping between orthographic and phonological representations. The reorganization
        of the auditory cortex may result in better phonological awareness skills
        in alphabetic readers.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/22815229\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"khkR92ECXyvg\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"7dd1c933-bca7-4ea6-af3e-a14a4fcc5c85\",\"title\":\"Development
        of brain networks involved in spoken word processing of Mandarin Chinese.\",\"authors\":\"Fan
        Cao; Kainat Khalid; Rebecca Lee; Christine Brennan; Yanhui Yang; Kuncheng
        Li; Donald J. Bolger; James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC3049201\",\"pmid\":\"20884355\",\"doi\":\"10.1016/j.neuroimage.2010.09.047\",\"articleYear\":\"2011\",\"journal\":\"NeuroImage\",\"abstractText\":\"Developmental
        differences in phonological and orthographic processing of Chinese spoken
        words were examined in 9-year-olds, 11-year-olds and adults using functional
        magnetic resonance imaging (fMRI). Rhyming and spelling judgments were made
        to two-character words presented sequentially in the auditory modality. Developmental
        comparisons between adults and both groups of children combined showed that
        age-related changes in activation in visuo-orthographic regions depended on
        a task. There were developmental increases in the left inferior temporal gyrus
        and the right inferior occipital gyrus in the spelling task, suggesting more
        extensive visuo-orthographic processing in a task that required access to
        these representations. Conversely, there were developmental decreases in activation
        in the left fusiform gyrus and left middle occipital gyrus in the rhyming
        task, suggesting that the development of reading is marked by reduced involvement
        of orthography in a spoken language task that does not require access to these
        orthographic representations. Developmental decreases may arise from the existence
        of extensive homophony (auditory words that have multiple spellings) in Chinese.
        In addition, we found that 11-year-olds and adults showed similar activation
        in the left superior temporal gyrus across tasks, with both groups showing
        greater activation than 9-year-olds. This pattern suggests early development
        of perceptual representations of phonology. In contrast, 11-year-olds and
        9-year-olds showed similar activation in the left inferior frontal gyrus across
        tasks, with both groups showing weaker activation than adults. This pattern
        suggests late development of controlled retrieval and selection of lexical
        representations. Altogether, this study suggests differential effects of character
        acquisition on development of components of the language network in Chinese
        as compared to previous reports on alphabetic languages.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/20884355\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"3PnVgeBPA7Qb\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"8e2935b8-c0e8-4dd8-ae1a-ba50a3e2cd63\",\"title\":\"Mapping
        cortical responses to speech using high-density diffuse optical tomography\",\"authors\":\"Mahlega
        S. Hassanpour; Adam T. Eggebrecht; Joseph P. Culver; Jonathan E. Peelle\",\"keywords\":\"\",\"pmcid\":\"PMC4512921\",\"pmid\":\"26026816\",\"doi\":\"10.1016/j.neuroimage.2015.05.058\",\"articleYear\":\"2015\",\"journal\":\"NeuroImage\",\"abstractText\":\"The
        functional neuroanatomy of speech processing has been investigated using positron
        emission tomography (PET) and functional magnetic resonance imaging (fMRI)
        for more than 20years. However, these approaches have relatively poor temporal
        resolution and/or challenges of acoustic contamination due to the constraints
        of echoplanar fMRI. Furthermore, these methods are contraindicated because
        of safety concerns in longitudinal studies and research with children (PET)
        or in studies of patients with metal implants (fMRI). High-density diffuse
        optical tomography (HD-DOT) permits presenting speech in a quiet acoustic
        environment, has excellent temporal resolution relative to the hemodynamic
        response, and provides noninvasive and metal-compatible imaging. However,
        the performance of HD-DOT in imaging the brain regions involved in speech
        processing is not fully established. In the current study, we use an auditory
        sentence comprehension task to evaluate the ability of HD-DOT to map the cortical
        networks supporting speech processing. Using sentences with two levels of
        linguistic complexity, along with a control condition consisting of unintelligible
        noise-vocoded speech, we recovered a hierarchically organized speech network
        that matches the results of previous fMRI studies. Specifically, hearing intelligible
        speech resulted in increased activity in bilateral temporal cortex and left
        frontal cortex, with syntactically complex speech leading to additional activity
        in left posterior temporal cortex and left inferior frontal gyrus. These results
        demonstrate the feasibility of using HD-DOT to map spatially distributed brain
        networks supporting higher-order cognitive faculties such as spoken language.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/26026816\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7uRT83VYPKJX\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"a59da78a-d4b5-4ccc-b20c-824a39f2d3ff\",\"title\":\"Sign
        and speech: amodal commonality in left hemisphere dominance for comprehension
        of sentences.\",\"authors\":\"Kuniyoshi L. Sakai; Yoshinori Tatsuno; Kei Suzuki;
        Harumi Kimura; Yasuhiro Ichida\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"15728651\",\"doi\":\"10.1093/brain/awh465\",\"articleYear\":\"2005\",\"journal\":\"Brain\",\"abstractText\":\"The
        neural basis of functional lateralization in language processing is a fundamental
        issue in systems neuroscience. We used functional MRI (fMRI) to examine hemispheric
        dominance during the processing of signed and spoken sentences. By using tasks
        involving comprehension of sentences (Sc) and sentential non-word detection
        (Sn), we compared different groups and stimulus conditions. Under the sign
        condition with sentence stimuli in Japanese Sign Language (JSL), we tested
        two groups of subjects: Deaf signers (Deaf) of JSL, and hearing bilinguals
        (children of Deaf adults, CODA) of JSL and Japanese (JPN). Under the speech
        condition, we tested hearing monolinguals (Mono) of JPN with auditory JPN
        stimuli alone (AUD), or with an audiovisual presentation of JPN and JSL stimuli
        (A&V). We found that the overall bilateral activation patterns under the four
        experimental conditions of Deaf, CODA, AUD and A&V were almost identical,
        despite differences in stimuli (JSL and JPN) and groups (Deaf, CODA and Mono).
        Moreover, consistently left-dominant activations involving frontal and temporo-parietal
        regions were observed across all four conditions. Furthermore, irrespective
        of the modalities of sign and speech, the main effects of task (Sc-Sn) were
        found primarily in the left regions: the ventral part of the inferior frontal
        gyrus (F3t/F3O), the precentral sulcus, the superior frontal gyrus, the middle
        temporal gyrus, the angular gyrus and the inferior parietal gyrus. Among these
        regions, only the left F3t/F3O showed no main effects of modality condition.
        These results demonstrate amodal commonality in the functional dominance of
        the left cortical regions for comprehension of sentences, as well as the essential
        and universal role of the left F3t/F3O in processing linguistic information
        from both signed and spoken sentences.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/15728651\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"4yr5pRdePxuJ\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"4e444ba3-1f68-470a-9566-a38650b99f81\",\"title\":\"Altered
        integration of speech and gesture in children with autism spectrum disorders\",\"authors\":\"Amy
        L. Hubbard; Kristin McNealy; Ashley A. Scott\u2010Van Zeeland; Daniel E. Callan;
        Susan Y. Bookheimer; Mirella Dapretto\",\"keywords\":\"\",\"pmcid\":\"PMC3489813\",\"pmid\":\"23139906\",\"doi\":\"10.1002/brb3.81\",\"articleYear\":\"2012\",\"journal\":\"Brain
        and Behavior\",\"abstractText\":\"The presence of gesture during speech has
        been shown to impact perception, comprehension, learning, and memory in normal
        adults and typically developing children. In neurotypical individuals, the
        impact of viewing co-speech gestures representing an object and/or action
        (i.e., iconic gesture) or speech rhythm (i.e., beat gesture) has also been
        observed at the neural level. Yet, despite growing evidence of delayed gesture
        development in children with autism spectrum disorders (ASD), few studies
        have examined how the brain processes multimodal communicative cues occurring
        during everyday communication in individuals with ASD. Here, we used a previously
        validated functional magnetic resonance imaging (fMRI) paradigm to examine
        the neural processing of co-speech beat gesture in children with ASD and matched
        controls. Consistent with prior observations in adults, typically developing
        children showed increased responses in right superior temporal gyrus and sulcus
        while listening to speech accompanied by beat gesture. Children with ASD,
        however, exhibited no significant modulatory effects in secondary auditory
        cortices for the presence of co-speech beat gesture. Rather, relative to their
        typically developing counterparts, children with ASD showed significantly
        greater activity in visual cortex while listening to speech accompanied by
        beat gesture. Importantly, the severity of their socio-communicative impairments
        correlated with activity in this region, such that the more impaired children
        demonstrated the greatest activity in visual areas while viewing co-speech
        beat gesture. These findings suggest that although the typically developing
        brain recognizes beat gesture as communicative and successfully integrates
        it with co-occurring speech, information from multiple sensory modalities
        is not effectively integrated during social communication in the autistic
        brain.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/23139906\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"4HWqZGxzg79A\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"116a1df6-7058-43f6-bcfa-ab6816c18159\",\"title\":\"The
        neural basis of non-native speech perception in bilingual children.\",\"authors\":\"Pilar
        Archila-Suerte; Jason Zevin; Aurora Isabel Ramos; Arturo E. Hernandez\",\"keywords\":\"\",\"pmcid\":\"PMC5942220\",\"pmid\":\"23123633\",\"doi\":\"10.1016/j.neuroimage.2012.10.023\",\"articleYear\":\"2013\",\"journal\":\"NeuroImage\",\"abstractText\":\"The
        goal of the present study is to reveal how the neural mechanisms underlying
        non-native speech perception change throughout childhood. In a pre-attentive
        listening fMRI task, English monolingual and Spanish-English bilingual children
        - divided into groups of younger (6-8yrs) and older children (9-10yrs) - were
        asked to watch a silent movie while several English syllable combinations
        played through a pair of headphones. Two additional groups of monolingual
        and bilingual adults were included in the analyses. Our results show that
        the neural mechanisms supporting speech perception throughout development
        differ in monolinguals and bilinguals. While monolinguals recruit perceptual
        areas (i.e., superior temporal gyrus) in early and late childhood to process
        native speech, bilinguals recruit perceptual areas (i.e., superior temporal
        gyrus) in early childhood and higher-order executive areas in late childhood
        (i.e., bilateral middle frontal gyrus and bilateral inferior parietal lobule,
        among others) to process non-native speech. The findings support the Perceptual
        Assimilation Model and the Speech Learning Model and suggest that the neural
        system processes phonological information differently depending on the stage
        of L2 speech learning.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/23123633\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"wFAUNLW7ctTr\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"1bad288f-8c5a-4ecd-b331-ebf4d25e5bb4\",\"title\":\"Speech
        cortical activation and connectivity in typically developing children and
        those with listening difficulties\",\"authors\":\"Hannah J. Stewart; Erin
        K. Cash; Lisa L. Hunter; Thomas Maloney; Jennifer Vannest; David R. Moore\",\"keywords\":\"\",\"pmcid\":\"PMC9467868\",\"pmid\":\"36087559\",\"doi\":\"10.1016/j.nicl.2022.103172\",\"articleYear\":\"2022\",\"journal\":\"NeuroImage
        Clinical\",\"abstractText\":\"  Highlights  \\n  \\nAll participants had clinically
        normal hearing. \\n  \\nNo group differences in cortical activation during
        speech recognition. \\n  \\nComplex speech processing networks showed group
        differences in temporal connectivity. \\n  \\nStrength of connections related
        to listening and cognitive test outcomes. \\n  \\n  \\nListening difficulties
        (LiD) in people who have normal audiometry are a widespread but poorly understood
        form of hearing impairment. Recent research suggests that childhood LiD are
        cognitive rather than auditory in origin. We examined decoding of sentences
        using a novel combination of behavioral testing and fMRI with 43 typically
        developing children and 42 age matched (6\u201313\_years old) children with
        LiD, categorized by caregiver report (ECLiPS). Both groups had clinically
        normal hearing. For sentence listening tasks, we found no group differences
        in fMRI brain cortical activation by increasingly complex speech stimuli that
        progressed in emphasis from phonology to intelligibility to semantics. Using
        resting state fMRI, we examined the temporal connectivity of cortical auditory
        and related speech perception networks. We found significant group differences
        only in cortical connections engaged when processing more complex speech stimuli.
        The strength of the affected connections was related to the children\u2019s
        performance on tests of dichotic listening, speech-in-noise, attention, memory
        and verbal vocabulary. Together, these results support the novel hypothesis
        that childhood LiD reflects difficulties in language rather than in auditory
        or phonological processing. \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/36087559\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"PrdVj784R4oQ\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"1db363c1-404b-4083-b1d1-98c90cb998c7\",\"title\":\"Neural
        correlates of interindividual differences in children's audiovisual speech
        perception.\",\"authors\":\"Audrey R. Nath; Eswen E. Fava; Michael S. Beauchamp\",\"keywords\":\"\",\"pmcid\":\"PMC3203203\",\"pmid\":\"21957257\",\"doi\":\"10.1523/JNEUROSCI.2605-11.2011\",\"articleYear\":\"2011\",\"journal\":\"Journal
        of Neuroscience\",\"abstractText\":\"Children use information from both the
        auditory and visual modalities to aid in understanding speech. A dramatic
        illustration of this multisensory integration is the McGurk effect, an illusion
        in which an auditory syllable is perceived differently when it is paired with
        an incongruent mouth movement. However, there are significant interindividual
        differences in McGurk perception: some children never perceive the illusion,
        while others always do. Because converging evidence suggests that the posterior
        superior temporal sulcus (STS) is a critical site for multisensory integration,
        we hypothesized that activity within the STS would predict susceptibility
        to the McGurk effect. To test this idea, we used BOLD fMRI in 17 children
        aged 6-12 years to measure brain responses to the following three audiovisual
        stimulus categories: McGurk incongruent, non-McGurk incongruent, and congruent
        syllables. Two separate analysis approaches, one using independent functional
        localizers and another using whole-brain voxel-based regression, showed differences
        in the left STS between perceivers and nonperceivers. The STS of McGurk perceivers
        responded significantly more than that of nonperceivers to McGurk syllables,
        but not to other stimuli, and perceivers' hemodynamic responses in the STS
        were significantly prolonged. In addition to the STS, weaker differences between
        perceivers and nonperceivers were observed in the fusiform face area and extrastriate
        visual cortex. These results suggest that the STS is an important source of
        interindividual variability in children's audiovisual speech perception.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/21957257\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"bkjMkd3GZsh4\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"19c556ae-0a5b-40ab-b754-7cacf46dc755\",\"title\":\"Longitudinal
        changes in cortical responses to letter-speech sound stimuli in 8\u201311
        year-old children\",\"authors\":\"Linda Romanovska; Roef Janssen; Milene Bonte\",\"keywords\":\"\",\"pmcid\":\"PMC8789908\",\"pmid\":\"35079026\",\"doi\":\"10.1038/s41539-021-00118-3\",\"articleYear\":\"2022\",\"journal\":\"npj
        Science of Learning\",\"abstractText\":\" \\nWhile children are able to name
        letters fairly quickly, the automatisation of letter-speech sound mappings
        continues over the first years of reading development. In the current longitudinal
        fMRI study, we explored developmental changes in cortical responses to letters
        and speech sounds across 3 yearly measurements in a sample of 18 8\u201311
        year old children. We employed a text-based recalibration paradigm in which
        combined exposure to text and ambiguous speech sounds shifts participants\u2019
        later perception of the ambiguous sounds towards the text. Our results showed
        that activity of the left superior temporal and lateral inferior precentral
        gyri followed a non-linear developmental pattern across the measurement sessions.
        This pattern is reminiscent of previously reported inverted-u-shape developmental
        trajectories in children\u2019s visual cortical responses to text. Our findings
        suggest that the processing of letters and speech sounds involves non-linear
        changes in the brain\u2019s spoken language network possibly related to progressive
        automatisation of reading skills. \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/35079026\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"BqWvaDFk4rRV\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"70b1f97d-cdde-4a65-873d-8a1f29ffff61\",\"title\":\"Cortical
        responses to letters and ambiguous speech vary with reading skills in dyslexic
        and typically reading children.\",\"authors\":\"Linda Romanovska; Roef Janssen;
        Milene Bonte\",\"keywords\":\"\",\"pmcid\":\"PMC7907898\",\"pmid\":\"33618236\",\"doi\":\"10.1016/j.nicl.2021.102588\",\"articleYear\":\"2021\",\"journal\":\"NeuroImage
        Clinical\",\"abstractText\":\"One of the proposed issues underlying reading
        difficulties in dyslexia is insufficiently automatized letter-speech sound
        associations. In the current fMRI experiment, we employ text-based recalibration
        to investigate letter-speech sound mappings in 8-10\_year-old children with
        and without dyslexia. Here an ambiguous speech sound /a?a/ midway between
        /aba/ and /ada/ is combined with disambiguating \\\"aba\\\" or \\\"ada\\\"
        text causing a perceptual shift of the ambiguous /a?a/ sound towards the text
        (recalibration). This perceptual shift has been found to be reduced in adults
        but not in children with dyslexia compared to typical readers. Our fMRI results
        show significantly reduced activation in the left fusiform in dyslexic compared
        to typical readers, despite comparable behavioural performance. Furthermore,
        enhanced audio-visual activation within this region was linked to better reading
        and phonological skills. In contrast, higher activation in bilateral superior
        temporal cortex was associated with lower letter-speech sound identification
        fluency. These findings reflect individual differences during the early stages
        of reading development with reduced recruitment of the left fusiform in dyslexic
        readers together with an increased involvement of the superior temporal cortex
        in children with less automatized letter-speech sound associations.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/33618236\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"8AXg57oQmDZR\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"2f86d5ee-c545-40a4-ba59-edae0c2e5096\",\"title\":\"Deviant
        functional magnetic resonance imaging patterns of brain activity to speech
        in 2-3-year-old children with autism spectrum disorder.\",\"authors\":\"Elizabeth
        Redcay; Eric Courchesne\",\"keywords\":\"\",\"pmcid\":\"PMC2879340\",\"pmid\":\"18672231\",\"doi\":\"10.1016/j.biopsych.2008.05.020\",\"articleYear\":\"2008\",\"journal\":\"Biological
        Psychiatry\",\"abstractText\":\"BACKGROUND: A failure to develop normal language
        is one of the most common first signs that a toddler might be at risk for
        autism. Currently the neural bases underlying this failure to develop language
        are unknown. METHODS: In this study, functional magnetic resonance imaging
        (fMRI) was used to identify the brain regions involved in speech perception
        in 12 2-3-year-old children with autism spectrum disorder (ASD) during natural
        sleep. We also recorded fMRI data from two typically developing control groups:
        a mental age-matched (MA) (n = 11) and a chronological age-matched (CA) (n
        = 12) group. During fMRI data acquisition, forward and backward speech stimuli
        were presented with intervening periods of no sound presentation. RESULTS:
        Direct statistical comparison between groups revealed significant differences
        in regions recruited to process speech. In comparison with their MA-matched
        control subjects, the ASD group showed reduced activity in an extended network
        of brain regions, which are recruited in typical early language acquisition.
        In comparison with their CA-matched control subjects, ASD participants showed
        greater activation primarily within right and medial frontal regions. Laterality
        analyses revealed a trend toward greater recruitment of right hemisphere regions
        in the ASD group and left hemisphere regions in the CA group during the forward
        speech condition. Furthermore, correlation analyses revealed a significant
        positive relationship between right hemisphere frontal and temporal activity
        to forward speech and receptive language skill. CONCLUSIONS: These findings
        suggest that at 2-3 years, children with ASD might be on a deviant developmental
        trajectory characterized by a greater recruitment of right hemisphere regions
        during speech perception.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/18672231\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"uSuMyidZqM5g\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"28ba6cee-f2c1-436c-abfd-ddf838daedc4\",\"title\":\"The
        integration of prosodic speech in high functioning autism: a preliminary FMRI
        study.\",\"authors\":\"Isabelle Hesling; Bixente Dilharreguy; Sue Pepp\xE9;
        Marion Amirault; Manuel Bouvard; Mich\xE8le Allard\",\"keywords\":\"\",\"pmcid\":\"PMC2903486\",\"pmid\":\"20644633\",\"doi\":\"10.1371/journal.pone.0011571\",\"articleYear\":\"2010\",\"journal\":\"PLoS
        ONE\",\"abstractText\":\"BACKGROUND: Autism is a neurodevelopmental disorder
        characterized by a specific triad of symptoms such as abnormalities in social
        interaction, abnormalities in communication and restricted activities and
        interests. While verbal autistic subjects may present a correct mastery of
        the formal aspects of speech, they have difficulties in prosody (music of
        speech), leading to communication disorders. Few behavioural studies have
        revealed a prosodic impairment in children with autism, and among the few
        fMRI studies aiming at assessing the neural network involved in language,
        none has specifically studied prosodic speech. The aim of the present study
        was to characterize specific prosodic components such as linguistic prosody
        (intonation, rhythm and emphasis) and emotional prosody and to correlate them
        with the neural network underlying them. METHODOLOGY/PRINCIPAL FINDINGS: We
        used a behavioural test (Profiling Elements of the Prosodic System, PEPS)
        and fMRI to characterize prosodic deficits and investigate the neural network
        underlying prosodic processing. Results revealed the existence of a link between
        perceptive and productive prosodic deficits for some prosodic components (rhythm,
        emphasis and affect) in HFA and also revealed that the neural network involved
        in prosodic speech perception exhibits abnormal activation in the left SMG
        as compared to controls (activation positively correlated with intonation
        and emphasis) and an absence of deactivation patterns in regions involved
        in the default mode. CONCLUSIONS/SIGNIFICANCE: These prosodic impairments
        could not only result from activation patterns abnormalities but also from
        an inability to adequately use the strategy of the default network inhibition,
        both mechanisms that have to be considered for decreasing task performance
        in High Functioning Autism.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/20644633\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7RitrvtcyviK\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"ae61ab4f-008f-46bc-857f-18c54c4724a9\",\"title\":\"Altered
        engagement of the speech motor network is associated with reduced phonological
        working memory in autism.\",\"authors\":\"Amanda M. O'Brien; Tyler K. Perrachione;
        Lisa Wisman Weil; Yoel Sanchez Araujo; Kelly Halverson; Adrianne Harris; Irina
        Ostrovskaya; Margaret Kjelgaard; Kenneth Wexler; Helen Tager-Flusberg; John
        D.E. Gabrieli; Zhenghan Qi\",\"keywords\":\"\",\"pmcid\":\"PMC9830373\",\"pmid\":\"36584426\",\"doi\":\"10.1016/j.nicl.2022.103299\",\"articleYear\":\"2022\",\"journal\":\"NeuroImage
        Clinical\",\"abstractText\":\"Nonword repetition, a common clinical measure
        of phonological working memory, involves component processes of speech perception,
        working memory, and speech production. Autistic children often show behavioral
        challenges in nonword repetition, as do many individuals with communication
        disorders. It is unknown which subprocesses of phonological working memory
        are vulnerable in autistic individuals, and whether the same brain processes
        underlie the transdiagnostic difficulty with nonword repetition. We used functional
        magnetic resonance imaging (fMRI) to investigate the brain bases for nonword
        repetition challenges in autism. We compared activation during nonword repetition
        in functional brain networks subserving speech perception, working memory,
        and speech production between neurotypical and autistic children. Autistic
        children performed worse than neurotypical children on nonword repetition
        and had reduced activation in response to increasing phonological working
        memory load in the supplementary motor area. Multivoxel pattern analysis within
        the speech production network classified shorter vs longer nonword-repetition
        trials less accurately for autistic than neurotypical children. These speech
        production motor-specific differences were not observed in a group of children
        with reading disability who had similarly reduced nonword repetition behavior.
        These findings suggest that atypical function in speech production brain regions
        may contribute to nonword repetition difficulties in autism.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/36584426\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7unjkQpmZYDF\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"27cb3bd7-eccd-4f85-ab18-2973ca6c7e2d\",\"title\":\"Functional
        neuroimaging of speech perception during a pivotal period in language acquisition.\",\"authors\":\"Elizabeth
        Redcay; Frank Haist; Eric Courchesne\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"18333980\",\"doi\":\"10.1111/j.1467-7687.2008.00674.x\",\"articleYear\":\"2008\",\"journal\":\"Developmental
        Science\",\"abstractText\":\"A pivotal period in the development of language
        occurs in the second year of life, when language comprehension undergoes rapid
        acceleration. However, the brain bases of these advances remain speculative
        as there is currently no functional magnetic resonance imaging (fMRI) data
        from healthy, typically developing toddlers at this age. We investigated the
        neural basis of speech comprehension in this critical age period by measuring
        fMRI activity during passive speech comprehension in 10 toddlers (mean +/-
        SD; 21 +/- 4 mo) and 10 3-year-old children (39 +/- 3 mo) during natural sleep.
        During sleep, the children were presented passages of forward and backward
        speech in 20-second blocks separated by 20-second periods of no sound presentation.
        Toddlers produced significantly greater activation in frontal, occipital,
        and cerebellar regions than 3-year-old children in response to forward speech.
        Our results suggest that rapid language acquisition during the second year
        of life may require the utilization of frontal, cerebellar, and occipital
        regions in addition to classical superior temporal language areas. These findings
        are consistent with the interactive specialization hypothesis, which proposes
        that cognitive abilities develop from the interaction of brain regions that
        include and extend beyond those used in the adult brain.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/18333980\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"h2gzYiDqDNr8\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"89281ad3-47b9-4e75-aaff-fb9f4fb65534\",\"title\":\"Reading
        ability in both deaf and hearing adults is linked to neural representations
        of abstract phonology derived from visual speech\",\"authors\":\"Samuel Evans;
        Cathy J. Price; J\xF6rn Diedrichsen; Tae Twomey; Indie Beedie; Maggie Fraser;
        Mair\xE9ad MacSweeney\",\"keywords\":\"\",\"pmcid\":\"PMC13229273\",\"pmid\":\"42190012\",\"doi\":\"10.1073/pnas.2535704123\",\"articleYear\":\"2026\",\"journal\":\"Proceedings
        of the National Academy of Sciences\",\"abstractText\":\"Reading is central
        to academic and vocational success. Some deaf children face reading challenges
        due to limited access to spoken or signed language. Robust phonological representations
        are key to reading development in hearing children. Spoken language phonology
        may be one of many contributors to reading development in deaf children. Indeed,
        speechreading ability correlates with reading skill in both deaf and hearing
        individuals, suggesting it is linked to reading development regardless of
        hearing status. Further support for this hypothesis would be provided by evidence
        that similar neural representations of speech phonology are evoked by visual
        speech and other language forms (auditory speech and text), and that these
        neural representations are related to reading proficiency. We used fMRI and
        Representational Similarity Analysis (RSA) to identify shared neural representations
        of spoken language phonological structure. A group of deaf adult participants
        (N=22), with a mixture of sign language and spoken language backgrounds and
        reading abilities, were presented with single lexical items as visual speech
        and dynamic text (cursive text, revealed letter-by-letter to promote a phonological
        reading strategy). Adult hearing participants (N=25) were presented with the
        same words, but as visual speech and auditory speech. Shared neural representations
        of phonological structure of English words were found in each group in the
        superior and middle temporal cortex (STC/MTC) and these abstract representations
        were more similar across different language forms in better readers. Our data
        provide neurobiological evidence of the contribution of visual speech to abstract
        phonological representations of spoken language, that relate to reading proficiency,
        in both deaf and hearing adults. Significance Statement Reading is an essential
        skill, yet some deaf children face reading challenges due to reduced access
        to signed or spoken language. In hearing children, successful reading depends
        on abstract phonological representations, but whether spoken language phonology
        relates to reading in deaf individuals remains unclear. Using fMRI and RSA,
        we show that deaf and hearing adults recruit neural representations of phonology
        that are shared by visual speech and other language forms (visual/auditory
        speech in hearing; visual speech/dynamic text in deaf) in the superior and
        middle temporal cortex. Critically, greater cross-modal alignment of neural
        representations of phonological structure was associated with better reading
        in both groups. These findings provide neurobiological evidence that visual
        speech contributes to phonological representations that relate to reading,
        regardless of hearing status.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/42190012\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"n3W2KfsbSMrt\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"64801427-3973-4dce-9b2f-508128374a0a\",\"title\":\"Neural
        Correlates of Phonological Processing in Speech Sound Disorder: A Functional
        Magnetic Resonance Imaging Study\",\"authors\":\"Jean A. Tkach; Xu Chen; Lisa
        A. Freebairn; Vincent J. Schmithorst; Scott K. Holland; Barbara A. Lewis\",\"keywords\":\"\",\"pmcid\":\"PMC3162995\",\"pmid\":\"21458852\",\"doi\":\"10.1016/j.bandl.2011.02.002\",\"articleYear\":\"2011\",\"journal\":\"Brain
        and Language\",\"abstractText\":\"Speech sound disorders (SSD) are the largest
        group of communication disorders observed in children. One explanation for
        these disorders is that children with SSD fail to form stable phonological
        representations when acquiring the speech sound system of their language due
        to poor phonological memory (PM). The goal of this study was to examine PM
        in individuals with histories of SSD employing functional MR imaging (fMRI).
        Participants were six right-handed adolescents with a history of early childhood
        SSD and seven right-handed matched controls with no history of speech and
        language disorders. We performed an fMRI study using an overt non-word repetition
        (NWR). Right lateralized hypoactivation in the inferior frontal gyrus and
        middle temporal gyrus was observed. The former suggests a deficit in the phonological
        processing loop supporting PM, while the later may indicate a deficit in speech
        perception. Both are cognitive processes involved in speech production. Bilateral
        hyperactivation observed in the pre and supplementary motor cortex, inferior
        parietal, supramarginal gyrus and cerebellum raised the possibility of compensatory
        increases in cognitive effort or reliance on the other components of the articulatory
        rehearsal network and phonologic store. These findings may be interpreted
        to support the hypothesis that individuals with SSD may have a deficit in
        PM and to suggest the involvement of compensatory mechanisms to counteract
        dysfunction of the normal network.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/21458852\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7XNit2xadXky\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"81e8bb1b-6038-49ba-a9e8-55beb3818eef\",\"title\":\"Developmental
        refinement of cortical systems for speech and voice processing.\",\"authors\":\"Milene
        Bonte; Anke Ley; Wolfgang Scharke; Elia Formisano\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"26777479\",\"doi\":\"10.1016/j.neuroimage.2016.01.015\",\"articleYear\":\"2016\",\"journal\":\"NeuroImage\",\"abstractText\":\"Development
        typically leads to optimized and adaptive neural mechanisms for the processing
        of voice and speech. In this fMRI study we investigated how this adaptive
        processing reaches its mature efficiency by examining the effects of task,
        age and phonological skills on cortical responses to voice and speech in children
        (8-9years), adolescents (14-15years) and adults. Participants listened to
        vowels (/a/, /i/, /u/) spoken by different speakers (boy, girl, man) and performed
        delayed-match-to-sample tasks on vowel and speaker identity. Across age groups,
        similar behavioral accuracy and comparable sound evoked auditory cortical
        fMRI responses were observed. Analysis of task-related modulations indicated
        a developmental enhancement of responses in the (right) superior temporal
        cortex during the processing of speaker information. This effect was most
        evident through an analysis based on individually determined voice sensitive
        regions. Analysis of age effects indicated that the recruitment of regions
        in the temporal-parietal cortex and posterior cingulate/cingulate gyrus decreased
        with development. Beyond age-related changes, the strength of speech-evoked
        activity in left posterior and right middle superior temporal regions significantly
        scaled with individual differences in phonological skills. Together, these
        findings suggest a prolonged development of the cortical functional network
        for speech and voice processing. This development includes a progressive refinement
        of the neural mechanisms for the selection and analysis of auditory information
        relevant to the ongoing behavioral task.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/26777479\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"GPWw4AS5KR8t\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"282479ec-131c-4e00-bb77-a90e8937751f\",\"title\":\"An
        audiovisual integration deficit underlies reading failure in nontransparent
        writing systems: An fMRI study of Chinese children with dyslexia\",\"authors\":\"Yang
        Yang; Ying Hui Yang; Junjun Li; Min Xu; Hong-Yan Bi\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"\",\"doi\":\"10.1016/j.jneuroling.2019.100884\",\"articleYear\":\"2020\",\"journal\":\"Journal
        of Neurolinguistics\",\"abstractText\":\"Establishing the associations between
        speech sounds and visual scripts is an essential step for reading acquisition.
        Audiovisual integration deficits have been proposed to be a cause of developmental
        dyslexia, and this has been evidenced by behavioral and neural findings from
        alphabetic languages with relatively transparent orthographies. Here, using
        functional magnetic resonance imaging (fMRI) in a lexical decision task, this
        study examined the neural correlates of audiovisual integration deficits in
        Chinese children with dyslexia and age-matched controls. The results indicated
        that the children with dyslexia showed a reduced audiovisual congruency effect
        in the left angular gyrus, left superior temporal gyrus and left middle and
        superior frontal gyrus. Moreover, dyslexics showed reduced functional connectivity
        for the congruency effect between the left angular gyrus and both the left
        lingual gyrus and left cerebellum. The regional activation and functional
        connectivity abnormalities might underlie the ill-developed correspondence
        between orthographic and phonological information in Chinese dyslexia. This
        study, for the first time, illustrates the neural mechanisms of the audiovisual
        integration deficit in dyslexia in a nontransparent logographic writing system,
        extending our understanding of the neural basis of dyslexia.\",\"articleLink\":\"\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"EkEpyL9sxSY6\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"e6cf6d8c-4511-4068-b426-97bb1bc2d85e\",\"title\":\"Overt
        speech critically changes lateralization index and did not allow determination
        of hemispheric dominance for language: an fMRI study.\",\"authors\":\"David
        Hassanein Berro; Jean-Michel Lem\xE9e; Louis-Marie Leiber; Evelyne Emery;
        Philippe Menei; Aram Ter Minassian\",\"keywords\":\"\",\"pmcid\":\"PMC8638205\",\"pmid\":\"34852787\",\"doi\":\"10.1186/s12868-021-00671-y\",\"articleYear\":\"2021\",\"journal\":\"BMC
        Neuroscience\",\"abstractText\":\"BACKGROUND\\nPre-surgical mapping of language
        using functional MRI aimed principally to determine the dominant hemisphere.
        This mapping is currently performed using covert linguistic task in way to
        avoid motion artefacts potentially biasing the results. However, overt task
        is closer to natural speaking, allows a control on the performance of the
        task, and may be easier to perform for stressed patients and children. However,
        overt task, by activating phonological areas on both hemispheres and areas
        involved in pitch prosody control in the non-dominant hemisphere, is expected
        to modify the determination of the dominant hemisphere by the calculation
        of the lateralization index (LI).\\nOBJECTIVE\\nHere, we analyzed the modifications
        in the LI and the interactions between cognitive networks during covert and
        overt speech task.\\nMETHODS\\nThirty-three volunteers participated in this
        study, all but four were right-handed. They performed three functional sessions
        consisting of (1) covert and (2) overt generation of a short sentence semantically
        linked with an audibly presented word, from which we estimated the \\\"Covert\\\"
        and \\\"Overt\\\" contrasts, and a (3) resting-state session. The resting-state
        session was submitted to spatial independent component analysis to identify
        language network at rest (LANG), cingulo-opercular network (CO), and ventral
        attention network (VAN). The LI was calculated using the bootstrapping method.\\nRESULTS\\nThe
        LI of the LANG was the most left-lateralized (0.66\u2009\xB1\u20090.38). The
        LI shifted from a moderate leftward lateralization for the Covert contrast
        (0.32\u2009\xB1\u20090.38) to a right lateralization for the Overt contrast
        (-\_0.13\u2009\xB1\u20090.30). The LI significantly differed from each other.
        This rightward shift was due to the recruitment of right hemispheric temporal
        areas together with the nodes of the CO.\\nCONCLUSION\\nAnalyzing the overt
        speech by fMRI allowed improvement in the physiological knowledge regarding
        the coordinated activity of the intrinsic connectivity networks. However,
        the rightward shift of the LI in this condition did not provide the basic
        information on the hemispheric language dominance. Overt linguistic task cannot
        be recommended for clinical purpose when determining hemispheric dominance
        for language.\\n\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/34852787\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"3otgTK9kwaCb\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"4f1e3385-61f0-42a2-aad4-510925798a99\",\"title\":\"Resting-state
        connectivity reveals a role for sensorimotor systems in vocal emotional processing
        in children.\",\"authors\":\"Ana Isabel Correia; Paulo Branco; Marta Martins;
        Ana Mafalda Reis; Nuno Martins; S\xE3o Lu\xEDs Castro; C\xE9sar F. Lima\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"31351162\",\"doi\":\"10.1016/j.neuroimage.2019.116052\",\"articleYear\":\"2019\",\"journal\":\"NeuroImage\",\"abstractText\":\"Voices
        are a primary source of emotional information in everyday interactions. Being
        able to process non-verbal vocal emotional cues, namely those embedded in
        speech prosody, impacts on our behaviour and communication. Extant research
        has delineated the role of temporal and inferior frontal brain regions for
        vocal emotional processing. A growing number of studies also suggest the involvement
        of the motor system, but little is known about such potential involvement.
        Using resting-state fMRI, we ask if the patterns of motor system intrinsic
        connectivity play a role in emotional prosody recognition in children. Fifty-five
        8-year-old children completed an emotional prosody recognition task and a
        resting-state scan. Better performance in emotion recognition was predicted
        by a stronger connectivity between the inferior frontal gyrus (IFG) and motor
        regions including primary motor, lateral premotor and supplementary motor
        sites. This is mostly driven by the IFG pars triangularis and cannot be explained
        by differences in domain-general cognitive abilities. These findings indicate
        that individual differences in the engagement of sensorimotor systems, and
        in its coupling with inferior frontal regions, underpin variation in children's
        emotional speech perception skills. They suggest that sensorimotor and higher-order
        evaluative processes interact to aid emotion recognition, and have implications
        for models of vocal emotional communication.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/31351162\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"5srWSu8pmmeR\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"0c18aaa5-c501-4b28-9a75-5d1fa1b994a2\",\"title\":\"Resting-state
        functional connectivity indexes reading competence in children and  adults.\",\"authors\":\"M.
        S. Koyama; A. Di Martino; X.-N. Zuo; C. Kelly; M. Mennes; D. R. Jutagir; F.
        X. Castellanos; M. P. Milham\",\"keywords\":\"\",\"pmcid\":\"PMC3893355\",\"pmid\":\"21653865\",\"doi\":\"10.1523/JNEUROSCI.4865-10.2011\",\"articleYear\":\"2011\",\"journal\":\"Journal
        of Neuroscience\",\"abstractText\":\"Task-based neuroimaging studies face
        the challenge of developing tasks capable of equivalently probing reading
        networks across different age groups. Resting-state fMRI, which requires no
        specific task, circumvents these difficulties. Here, in 25 children (8-14
        years) and 25 adults (21-46 years), we examined the extent to which individual
        differences in reading competence can be related to resting-state functional
        connectivity (RSFC) of regions implicated in reading. In both age groups,
        reading standard scores correlated positively with RSFC between the left precentral
        gyrus and other motor regions, and between Broca's and Wernicke's areas. This
        suggests that, regardless of age group, stronger coupling among motor regions,
        as well as between language/speech regions, subserves better reading, presumably
        reflecting automatized articulation. We also observed divergent RSFC-behavior
        relationships in children and adults, particularly those anchored in the left
        fusiform gyrus (FFG) (the visual word form area). In adults, but not children,
        better reading performance was associated with stronger positive correlations
        between FFG and phonology-related regions (Broca's area and the left inferior
        parietal lobule), and with stronger negative relationships between FFG and
        regions of the \\\"task-negative\\\" default network. These results suggest
        that both positive RSFC (functional coupling) between reading regions and
        negative RSFC (functional segregation) between a reading region and default
        network regions are important for automatized reading, characteristic of adult
        readers. Together, our task-independent RSFC findings highlight the importance
        of appreciating developmental changes in the neural correlates of reading
        competence, and suggest that RSFC may serve to facilitate the identification
        of reading disorders in different age groups.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/21653865\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"84qPgzGFYYun\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"08c41d7f-6307-4be7-ad56-347058fed029\",\"title\":\"Auditory
        rhythm discrimination in adults who stutter: An fMRI study.\",\"authors\":\"Emily
        O. Garnett; J. Devin McAuley; Elizabeth A. Wieland; Ho Ming Chow; David C.
        Zhu; Laura C. Dilley; Soo-Eun Chang\",\"keywords\":\"\",\"pmcid\":\"PMC12955694\",\"pmid\":\"36577315\",\"doi\":\"10.1016/j.bandl.2022.105219\",\"articleYear\":\"2022\",\"journal\":\"Brain
        and Language\",\"abstractText\":\"Rhythm perception deficits have been linked
        to neurodevelopmental disorders affecting speech and language. Children who
        stutter have shown poorer rhythm discrimination and attenuated functional
        connectivity in rhythm-related brain areas, which may negatively impact timing
        control required for speech. It is unclear whether adults who stutter (AWS),
        who are likely to have acquired compensatory adaptations in response to rhythm
        processing/timing deficits, are similarly affected. We compared rhythm discrimination
        in AWS and controls (total n\_=\_36) during fMRI in two matched conditions:
        simple rhythms that consistently reinforced a periodic beat, and complex rhythms
        that did not (requiring greater reliance on internal timing). Consistent with
        an internal beat deficit hypothesis, behavioral results showed poorer complex
        rhythm discrimination for AWS than controls. In AWS, greater stuttering severity
        was associated with poorer rhythm discrimination. AWS showed increased activity
        within beat-based timing regions and increased functional connectivity between
        putamen and cerebellum (supporting interval-based timing) for simple rhythms.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/36577315\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"WCAbRKvL9qqv\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"709c0b58-89ee-4c9a-8df9-b8812535210c\",\"title\":\"Neural
        initialization of audiovisual integration in prereaders at varying risk for
        developmental dyslexia.\",\"authors\":\"Iliana I. Karipidis; Georgette Pleisch;
        Martina R\xF6thlisberger; Christoph Hofstetter; Dario Dornbierer; Philipp
        St\xE4mpfli; Silvia Brem\",\"keywords\":\"\",\"pmcid\":\"PMC6866885\",\"pmid\":\"27739608\",\"doi\":\"10.1002/hbm.23437\",\"articleYear\":\"2016\",\"journal\":\"Human
        Brain Mapping\",\"abstractText\":\"Learning letter-speech sound correspondences
        is a major step in reading acquisition and is severely impaired in children
        with dyslexia. Up to now, it remains largely unknown how quickly neural networks
        adopt specific functions during audiovisual integration of linguistic information
        when prereading children learn letter-speech sound correspondences. Here,
        we simulated the process of learning letter-speech sound correspondences in
        20 prereading children (6.13-7.17 years) at varying risk for dyslexia by training
        artificial letter-speech sound correspondences within a single experimental
        session. Subsequently, we acquired simultaneously event-related potentials
        (ERP) and functional magnetic resonance imaging (fMRI) scans during implicit
        audiovisual presentation of trained and untrained pairs. Audiovisual integration
        of trained pairs correlated with individual learning rates in right superior
        temporal, left inferior temporal, and bilateral parietal areas and with phonological
        awareness in left temporal areas. In correspondence, a differential left-lateralized
        parietooccipitotemporal ERP at 400 ms for trained pairs correlated with learning
        achievement and familial risk. Finally, a late (650 ms) posterior negativity
        indicating audiovisual congruency of trained pairs was associated with increased
        fMRI activation in the left occipital cortex. Taken together, a short (<30
        min) letter-speech sound training initializes audiovisual integration in neural
        systems that are responsible for processing linguistic information in proficient
        readers. To conclude, the ability to learn grapheme-phoneme correspondences,
        the familial history of reading disability, and phonological awareness of
        prereading children account for the degree of audiovisual integration in a
        distributed brain network. Such findings on emerging linguistic audiovisual
        integration could allow for distinguishing between children with typical and
        atypical reading development. Hum Brain Mapp 38:1038-1055, 2017. \xA9 2016
        Wiley Periodicals, Inc.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/27739608\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"ma58LTjxv5NH\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"517e177d-8d72-491c-9d01-6c4dc15fc8e6\",\"title\":\"Differential
        activation of the visual word form area during auditory phoneme perception
        in youth with dyslexia.\",\"authors\":\"Lisa L. Conant; Einat Liebenthal;
        Anjali Desai; Mark S. Seidenberg; Jeffrey R. Binder\",\"keywords\":\"\",\"pmcid\":\"PMC7535924\",\"pmid\":\"32598966\",\"doi\":\"10.1016/j.neuropsychologia.2020.107543\",\"articleYear\":\"2020\",\"journal\":\"Neuropsychologia\",\"abstractText\":\"Developmental
        dyslexia is a learning disorder characterized by difficulties reading words
        accurately and/or fluently. Several behavioral studies have suggested the
        presence of anomalies at an early stage of phoneme processing, when the complex
        spectrotemporal patterns in the speech signal are analyzed and assigned to
        phonemic categories. In this study, fMRI was used to compare brain responses
        associated with categorical discrimination of speech syllables (P) and acoustically
        matched nonphonemic stimuli (N) in children and adolescents with dyslexia
        and in typically developing (TD) controls, aged 8-17 years. The TD group showed
        significantly greater activation during the P condition relative to N in an
        area of the left ventral occipitotemporal cortex that corresponds well with
        the region referred to as the \\\"visual word form area\\\" (VWFA). Regression
        analyses using reading performance as a continuous variable across the full
        group of participants yielded similar results. Overall, the findings are consistent
        with those of previous neuroimaging studies using print stimuli in individuals
        with dyslexia that found reduced activation in left occipitotemporal regions;
        however, the current study shows that these activation differences seen during
        reading are apparent during auditory phoneme discrimination in youth with
        dyslexia, suggesting that the primary deficit in at least a subset of children
        may lie early in the speech processing stream and that categorical perception
        may be an important target of early intervention in children at risk for dyslexia.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/32598966\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"nWDvrsL2953n\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"7cd60843-3391-4f16-a305-fe34a5ec68ed\",\"title\":\"The
        brain signature of emerging reading in two contrasting languages\",\"authors\":\"Katarzyna
        Chyl; Bartosz Kossowski; Shuai Wang; Agnieszka D\u0119bska; Magdalena \u0141uniewska;
        Artur Marchewka; Marek Wypych; Mark van den Bunt; William Mencl; Kenneth Pugh;
        Katarzyna Jednor\xF3g\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"33130273\",\"doi\":\"10.1016/j.neuroimage.2020.117503\",\"articleYear\":\"2020\",\"journal\":\"NeuroImage\",\"abstractText\":\"Despite
        dissimilarities among scripts, a universal hallmark of literacy in skilled
        readers is the convergent brain activity for print and speech. Little is known,
        however, whether this differs as a function of grapheme to phoneme transparency
        in beginning readers. Here we compare speech and orthographic processing circuits
        in two contrasting languages, Polish and English, in 100 7-year-old children
        performing fMRI language localizer tasks. Results show limited language variation,
        with speech-print convergence evident mostly in left frontotemporal perisylvian
        regions. Correlational and intersect analyses revealed subtle differences
        in the strength of this coupling in several regions of interest. Specifically,
        speech-print convergence was higher for transparent Polish than opaque English
        in the right temporal area, associated with phonological processing. Conversely,
        speech-print convergence was higher for English than Polish in left fusiform,
        associated with visual word recognition. We conclude that speech-print convergence
        is a universal marker of reading even at the beginning of reading acquisition
        with minor variations that can be explained by the differences in grapheme
        to phoneme transparency. This finding at the earliest stages of reading acquisition
        conforms well with claims that reading exhibits a good deal of universality
        despite writing systems differences.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/33130273\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"4crUGEEfvxQF\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"7f678f32-843a-4416-bec4-85a67a0f0cdb\",\"title\":\"Neural
        selectivity for communicative auditory signals in Phelan-McDermid syndrome\",\"authors\":\"A.
        Ting Wang; Teresa Lim; Jesslyn Jamison; Lauren Bush; Latha V. Soorya; Teresa
        Tavassoli; Paige M. Siper; Joseph D. Buxbaum; Alexander Kolevzon\",\"keywords\":\"\",\"pmcid\":\"PMC4763436\",\"pmid\":\"26909118\",\"doi\":\"10.1186/s11689-016-9138-9\",\"articleYear\":\"2016\",\"journal\":\"Journal
        of Neurodevelopmental Disorders\",\"abstractText\":\"BACKGROUND: Phelan-McDermid
        syndrome (PMS), a neurodevelopmental disorder caused by deletion or mutation
        in the SHANK3 gene, is one of the more common single-locus causes of autism
        spectrum disorder (ASD). PMS is characterized by global developmental delay,
        hypotonia, delayed or absent speech, increased risk of seizures, and minor
        dysmorphic features. Impairments in language and communication are one of
        the most consistent characteristics of PMS. Although there is considerable
        overlap in the social communicative deficits associated with PMS and ASD,
        there is a dearth of data on underlying abnormalities at the level of neural
        systems in PMS. No controlled neuroimaging studies of PMS have been reported
        to date. The goal of this study was to examine the neural circuitry supporting
        the perception of auditory communicative signals in children with PMS as compared
        to idiopathic ASD (iASD). METHODS: Eleven children with PMS and nine comparison
        children with iASD were scanned using functional magnetic resonance imaging
        (fMRI) under light sedation. The fMRI paradigm was a previously validated
        passive auditory task, which presented communicative (e.g., speech, sounds
        of agreement, disgust) and non-communicative vocalizations (e.g., sneezing,
        coughing, yawning). RESULTS: Previous research has shown that the superior
        temporal gyrus (STG) responds selectively to communicative vocal signals in
        typically developing children and adults. Here, selective activity for communicative
        relative to non-communicative vocalizations was detected in the right STG
        in the PMS group, but not in the iASD group. The PMS group also showed preferential
        activity for communicative vocalizations in a range of other brain regions
        associated with social cognition, such as the medial prefrontal cortex (MPFC),
        insula, and inferior frontal gyrus. Interestingly, better orienting toward
        social sounds was positively correlated with selective activity in the STG
        and other \\\"social brain\\\" regions, including the MPFC, in the PMS group.
        Finally, selective MPFC activity for communicative sounds was associated with
        receptive language level in the PMS group and expressive language in the iASD
        group. CONCLUSIONS: Despite shared behavioral features, children with PMS
        differed from children with iASD in their neural response to communicative
        vocal sounds and showed relative strengths in this area. Furthermore, the
        relationship between clinical characteristics and neural selectivity also
        differed between the two groups, suggesting that shared ASD features may partially
        reflect different neurofunctional abnormalities due to differing etiologies.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/26909118\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"6rRsGPqoVMQ8\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"460f8298-82ee-429f-875e-a28f7be7c892\",\"title\":\"Auditory-motor
        integration during fast repetition: the neuronal correlates of shadowing.\",\"authors\":\"C.
        Peschke; W. Ziegler; J. Kappes; A. Baumgaertner\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"19345269\",\"doi\":\"10.1016/j.neuroimage.2009.03.061\",\"articleYear\":\"2009\",\"journal\":\"NeuroImage\",\"abstractText\":\"This
        fMRI study examined which structures of a proposed dorsal stream system are
        involved in the auditory-motor integration during fast overt repetition. We
        used a shadowing task which requires immediate repetition of an auditory-verbal
        input and is supposed to elicit unconscious imitation effects of phonologically
        irrelevant speech parameters. Subjects' responses were recorded in the scanner.
        To examine automated auditory-motor mapping of speech gestures of others onto
        one's own speech production system we contrasted the shadowing of pseudowords
        produced by multiple speakers (men, women, and children) with the shadowing
        of pseudowords produced by a single speaker. Furthermore, we asked whether
        behavioral variables predicted changes in functional activation during shadowing.
        Shadowing multiple speakers compared to a single speaker elicited increased
        bilateral activation predominantly in the superior temporal sulci. These regions
        may mediate acoustic-phonetic speaker normalization in preparation of a translation
        of perceptual into motor information. Additional activation in Broca's area
        and the thalamus may reflect motor effects of the adaptation to multiple speaker
        models. Item-wise correlational analyses of response latencies with BOLD signal
        changes indicated that longer latencies were associated with increased activation
        in the left parietal operculum, suggesting that this area plays a central
        role in the actual transfer of auditory-verbal information to speech motor
        representations. A multiple regression of behavioral with imaging data showed
        activation in a right inferior parietal area near the temporo-parietal boundary
        which correlated positively with the degree of speech rate imitation and negatively
        with response latency. This activation may be attributable to attentional
        and/or paralinguistic processes.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/19345269\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"5qu4oTnT9sbh\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"ce0e234b-1cf9-4d86-a6cf-d8131a2a78a4\",\"title\":\"Evidence
        for normal letter-sound integration, but altered language pathways in a  case
        of recovered Landau-Kleffner Syndrome.\",\"authors\":\"Pim Pullens; Will Pullens;
        Vera Blau; Bettina Sorger; Bernadette M. Jansma; Rainer Goebel\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"26232266\",\"doi\":\"10.1016/j.bandc.2015.07.003\",\"articleYear\":\"2015\",\"journal\":\"Brain
        and Cognition\",\"abstractText\":\"Landau-Kleffner Syndrome (LKS) is a rare
        form of acquired aphasia in children, characterized by epileptic discharges,
        which occur mostly during sleep. After normal speech and language development,
        aphasia develops between the ages of 3-7 years in a period ranging from days
        to months. The epileptic discharges usually disappear after reaching adulthood,
        but language outcomes are usually poor if no treatment focused on restoration
        of (non-) verbal communication is given. Patients often appear deaf-mute,
        but sign language, as part of the treatment, may lead to recovery of communication.
        The neural mechanisms underlying poor language outcomes in LKS are not yet
        understood. In this detailed functional MRI study of a recovered LKS patient
        - that is, a patient no longer suffering from epileptic discharges, audiovisual
        multi-sensory processing was investigated, since LKS patients are often proficient
        in reading, but not in speech perception. In the recovered LKS patient a large
        difference in the neural activation to auditory stimuli was found in the left
        versus the right auditory cortex, which cannot be attributed to hearing loss.
        Compared to healthy proficient readers investigated earlier with the same
        fMRI experiment, the patient demonstrated normal letter-sound integration
        in the superior temporal gyrus as demonstrated by the multi-sensory interaction
        index, indicating intact STG function. Diffusion Tensor Imaging (DTI) based
        fiber tracking in the LKS patient showed fibers originating from Heschl's
        gyrus that seem to be left-right inverted with respect to HG fiber pattern
        described in the literature for healthy controls. In the patient, in both
        hemispheres we found arcuate fibers projecting from (homologues of) Broca's
        to Wernicke's areas, and a lack of fibers from arcuate left inferior parietal
        and sylvian areas reported in healthy subjects. We observed short arcuate
        segments in the right hemisphere. Although speculative, our results suggest
        intact temporal lobe processing but an altered temporal to frontal connectivity.
        The altered connectivity might explain observed short-term verbal memory problems,
        disturbed (speech) sound-motor interaction and online feedback of speech and
        might be one of the neuronal factors underlying LKS.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/26232266\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7VcpqAzrSWLe\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"4a4f1c47-3cde-4c3c-880d-9cfdd46a95e7\",\"title\":\"Neurocognitive
        mechanisms of co-occurring math difficulties in dyslexia: Differences in executive
        function and visuospatial processing\",\"authors\":\"Rebecca A. Marks; Courtney
        Pollack; Steven L. Meisler; Anila M. D'Mello; Tracy M. Centanni; Rachel R.
        Romeo; Karolina Wade; Anna A. Matejko; Daniel Ansari; John D. E. Gabrieli;
        Joanna A. Christodoulou\",\"keywords\":\"\",\"pmcid\":\"PMC10918042\",\"pmid\":\"37675857\",\"doi\":\"10.1111/desc.13443\",\"articleYear\":\"2023\",\"journal\":\"Developmental
        Science\",\"abstractText\":\"Children with dyslexia frequently also struggle
        with math. However, studies of reading disability (RD) rarely assess math
        skill, and the neurocognitive mechanisms underlying co- occurring math disability
        (RD+MD) are not clear. The current study aimed to identify behavioral and
        neurocognitive factors associated with co-occurring MD among 86 children with
        RD. Within this sample, 43% had co-occurring RD+MD and 22% demonstrated a
        possible vulnerability in math, while 35% had no math difficulties (RD-Only).
        We investigated whether RD-Only and RD+MD students differed behaviorally in
        their phonological awareness, reading skills, or executive functions, as well
        as in the brain mechanisms underlying word reading and visuospatial working
        memory using fMRI. The RD+MD group did not differ from RD-Only on behavioral
        or brain measures of phonological awareness related to speech or print. However,
        the RD+MD group demonstrated significantly worse working memory and processing
        speed performance than the RD-Only group. The RD+MD group also exhibited reduced
        brain activations for visuospatial working memory relative to RD-Only. Exploratory
        brain-behavior correlations along a broad spectrum of math ability revealed
        that stronger math skills were associated with greater activation in bilateral
        visual cortex. These converging neuro-behavioral findings suggest that poor
        executive function in general, including differences in visuospatial working
        memory, are specifically associated with co-occurring MD in the context of
        RD.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/37675857\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"hwuMonNUarCX\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"80c63a21-4090-4186-a50e-c34b9f9ffb9a\",\"title\":\"Individual
        Differences in Adult Reading Are Associated with Left Temporo-parietal to
        Dorsal Striatal Functional Connectivity.\",\"authors\":\"Sanjay Achal; Fumiko
        Hoeft; Signe Bray\",\"keywords\":\"\",\"pmcid\":\"PMC5028000\",\"pmid\":\"26400921\",\"doi\":\"10.1093/cercor/bhv214\",\"articleYear\":\"2015\",\"journal\":\"Cerebral
        Cortex\",\"abstractText\":\"Reading skills vary widely in both children and
        adults, with a number of factors contributing to this variability. The most
        prominent factor may be related to efficiency of storage, representation,
        or retrieval of speech sounds. This phonological hypothesis is supported by
        findings of reduced activation in poor readers in left hemisphere ventro-lateral
        prefrontal and temporo-parietal phonological processing regions. Less well
        explained by phonological theories are reported hyperactivation in prefrontal,
        striatal, and insular regions. This study investigated functional connectivity
        of a core phonological processing region, the temporo-parietal junction (TPJ),
        in relation to reading skill in an adult community sample. We hypothesized
        that connectivity between TPJ and regions implicated in meta-analyses of reading
        disorder would correlate with individual differences in reading. Forty-four
        adults aged 30-54, ranging in reading ability, underwent resting fMRI scans.
        Data-driven connectivity clustering was used to identify TPJ subregions for
        seed-based connectivity analyses. Correlations were assessed between TPJ connectivity
        and timed-pseudoword reading (decoding) ability. We found a significant correlation
        wherein greater left supramarginal gyrus to anterior caudate connectivity
        was associated with weaker decoding. This suggests that hyperactivation of
        the dorsal striatum, reported in poor readers during reading tasks, may reflect
        compensatory or inefficient overintegration into attention networks.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/26400921\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"k36dcsbe8oTY\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"e0e706ee-dac9-4d12-b944-80159e1aec5a\",\"title\":\"The
        neural basis of non-native speech perception in bilingual children.\",\"authors\":\"Pilar
        Archila-Suerte; Jason Zevin; Aurora Isabel Ramos; Arturo E. Hernandez\",\"keywords\":\"\",\"pmcid\":\"PMC5942220\",\"pmid\":\"23123633\",\"doi\":\"10.1016/j.neuroimage.2012.10.023\",\"articleYear\":\"2013\",\"journal\":\"NeuroImage\",\"abstractText\":\"The
        goal of the present study is to reveal how the neural mechanisms underlying
        non-native speech perception change throughout childhood. In a pre-attentive
        listening fMRI task, English monolingual and Spanish-English bilingual children
        - divided into groups of younger (6-8yrs) and older children (9-10yrs) - were
        asked to watch a silent movie while several English syllable combinations
        played through a pair of headphones. Two additional groups of monolingual
        and bilingual adults were included in the analyses. Our results show that
        the neural mechanisms supporting speech perception throughout development
        differ in monolinguals and bilinguals. While monolinguals recruit perceptual
        areas (i.e., superior temporal gyrus) in early and late childhood to process
        native speech, bilinguals recruit perceptual areas (i.e., superior temporal
        gyrus) in early childhood and higher-order executive areas in late childhood
        (i.e., bilateral middle frontal gyrus and bilateral inferior parietal lobule,
        among others) to process non-native speech. The findings support the Perceptual
        Assimilation Model and the Speech Learning Model and suggest that the neural
        system processes phonological information differently depending on the stage
        of L2 speech learning.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/23123633\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"wFAUNLW7ctTr\",\"importId\":\"f1ed2543-c423-4d02-bcd3-4f6aadacac4b\"},{\"id\":\"feb7e94e-d7af-4767-bcee-c8697a52c55f\",\"title\":\"Speech
        cortical activation and connectivity in typically developing children and
        those with listening difficulties\",\"authors\":\"Hannah J. Stewart; Erin
        K. Cash; Lisa L. Hunter; Thomas Maloney; Jennifer Vannest; David R. Moore\",\"keywords\":\"\",\"pmcid\":\"PMC9467868\",\"pmid\":\"36087559\",\"doi\":\"10.1016/j.nicl.2022.103172\",\"articleYear\":\"2022\",\"journal\":\"NeuroImage
        Clinical\",\"abstractText\":\"  Highlights  \\n  \\nAll participants had clinically
        normal hearing. \\n  \\nNo group differences in cortical activation during
        speech recognition. \\n  \\nComplex speech processing networks showed group
        differences in temporal connectivity. \\n  \\nStrength of connections related
        to listening and cognitive test outcomes. \\n  \\n  \\nListening difficulties
        (LiD) in people who have normal audiometry are a widespread but poorly understood
        form of hearing impairment. Recent research suggests that childhood LiD are
        cognitive rather than auditory in origin. We examined decoding of sentences
        using a novel combination of behavioral testing and fMRI with 43 typically
        developing children and 42 age matched (6\u201313\_years old) children with
        LiD, categorized by caregiver report (ECLiPS). Both groups had clinically
        normal hearing. For sentence listening tasks, we found no group differences
        in fMRI brain cortical activation by increasingly complex speech stimuli that
        progressed in emphasis from phonology to intelligibility to semantics. Using
        resting state fMRI, we examined the temporal connectivity of cortical auditory
        and related speech perception networks. We found significant group differences
        only in cortical connections engaged when processing more complex speech stimuli.
        The strength of the affected connections was related to the children\u2019s
        performance on tests of dichotic listening, speech-in-noise, attention, memory
        and verbal vocabulary. Together, these results support the novel hypothesis
        that childhood LiD reflects difficulties in language rather than in auditory
        or phonological processing. \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/36087559\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"PrdVj784R4oQ\",\"importId\":\"f1ed2543-c423-4d02-bcd3-4f6aadacac4b\"},{\"id\":\"8b840b84-178d-4647-a5d2-ae653b6310ef\",\"title\":\"Altered
        engagement of the speech motor network is associated with reduced phonological
        working memory in autism.\",\"authors\":\"Amanda M. O'Brien; Tyler K. Perrachione;
        Lisa Wisman Weil; Yoel Sanchez Araujo; Kelly Halverson; Adrianne Harris; Irina
        Ostrovskaya; Margaret Kjelgaard; Kenneth Wexler; Helen Tager-Flusberg; John
        D.E. Gabrieli; Zhenghan Qi\",\"keywords\":\"\",\"pmcid\":\"PMC9830373\",\"pmid\":\"36584426\",\"doi\":\"10.1016/j.nicl.2022.103299\",\"articleYear\":\"2022\",\"journal\":\"NeuroImage
        Clinical\",\"abstractText\":\"Nonword repetition, a common clinical measure
        of phonological working memory, involves component processes of speech perception,
        working memory, and speech production. Autistic children often show behavioral
        challenges in nonword repetition, as do many individuals with communication
        disorders. It is unknown which subprocesses of phonological working memory
        are vulnerable in autistic individuals, and whether the same brain processes
        underlie the transdiagnostic difficulty with nonword repetition. We used functional
        magnetic resonance imaging (fMRI) to investigate the brain bases for nonword
        repetition challenges in autism. We compared activation during nonword repetition
        in functional brain networks subserving speech perception, working memory,
        and speech production between neurotypical and autistic children. Autistic
        children performed worse than neurotypical children on nonword repetition
        and had reduced activation in response to increasing phonological working
        memory load in the supplementary motor area. Multivoxel pattern analysis within
        the speech production network classified shorter vs longer nonword-repetition
        trials less accurately for autistic than neurotypical children. These speech
        production motor-specific differences were not observed in a group of children
        with reading disability who had similarly reduced nonword repetition behavior.
        These findings suggest that atypical function in speech production brain regions
        may contribute to nonword repetition difficulties in autism.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/36584426\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7unjkQpmZYDF\",\"importId\":\"f1ed2543-c423-4d02-bcd3-4f6aadacac4b\"},{\"id\":\"40b6dffc-49da-4923-966e-0441ad20bc32\",\"title\":\"Neural
        Correlates of Phonological Processing in Speech Sound Disorder: A Functional
        Magnetic Resonance Imaging Study\",\"authors\":\"Jean A. Tkach; Xu Chen; Lisa
        A. Freebairn; Vincent J. Schmithorst; Scott K. Holland; Barbara A. Lewis\",\"keywords\":\"\",\"pmcid\":\"PMC3162995\",\"pmid\":\"21458852\",\"doi\":\"10.1016/j.bandl.2011.02.002\",\"articleYear\":\"2011\",\"journal\":\"Brain
        and Language\",\"abstractText\":\"Speech sound disorders (SSD) are the largest
        group of communication disorders observed in children. One explanation for
        these disorders is that children with SSD fail to form stable phonological
        representations when acquiring the speech sound system of their language due
        to poor phonological memory (PM). The goal of this study was to examine PM
        in individuals with histories of SSD employing functional MR imaging (fMRI).
        Participants were six right-handed adolescents with a history of early childhood
        SSD and seven right-handed matched controls with no history of speech and
        language disorders. We performed an fMRI study using an overt non-word repetition
        (NWR). Right lateralized hypoactivation in the inferior frontal gyrus and
        middle temporal gyrus was observed. The former suggests a deficit in the phonological
        processing loop supporting PM, while the later may indicate a deficit in speech
        perception. Both are cognitive processes involved in speech production. Bilateral
        hyperactivation observed in the pre and supplementary motor cortex, inferior
        parietal, supramarginal gyrus and cerebellum raised the possibility of compensatory
        increases in cognitive effort or reliance on the other components of the articulatory
        rehearsal network and phonologic store. These findings may be interpreted
        to support the hypothesis that individuals with SSD may have a deficit in
        PM and to suggest the involvement of compensatory mechanisms to counteract
        dysfunction of the normal network.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/21458852\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7XNit2xadXky\",\"importId\":\"f1ed2543-c423-4d02-bcd3-4f6aadacac4b\"},{\"id\":\"73e0c261-a974-45fb-b124-0d67ff63a70e\",\"title\":\"Altered
        engagement of the speech motor network is associated with reduced phonological
        working memory in autism.\",\"authors\":\"Amanda M. O'Brien; Tyler K. Perrachione;
        Lisa Wisman Weil; Yoel Sanchez Araujo; Kelly Halverson; Adrianne Harris; Irina
        Ostrovskaya; Margaret Kjelgaard; Kenneth Wexler; Helen Tager-Flusberg; John
        D.E. Gabrieli; Zhenghan Qi\",\"keywords\":\"\",\"pmcid\":\"PMC9830373\",\"pmid\":\"36584426\",\"doi\":\"10.1016/j.nicl.2022.103299\",\"articleYear\":\"2022\",\"journal\":\"NeuroImage
        Clinical\",\"abstractText\":\"Nonword repetition, a common clinical measure
        of phonological working memory, involves component processes of speech perception,
        working memory, and speech production. Autistic children often show behavioral
        challenges in nonword repetition, as do many individuals with communication
        disorders. It is unknown which subprocesses of phonological working memory
        are vulnerable in autistic individuals, and whether the same brain processes
        underlie the transdiagnostic difficulty with nonword repetition. We used functional
        magnetic resonance imaging (fMRI) to investigate the brain bases for nonword
        repetition challenges in autism. We compared activation during nonword repetition
        in functional brain networks subserving speech perception, working memory,
        and speech production between neurotypical and autistic children. Autistic
        children performed worse than neurotypical children on nonword repetition
        and had reduced activation in response to increasing phonological working
        memory load in the supplementary motor area. Multivoxel pattern analysis within
        the speech production network classified shorter vs longer nonword-repetition
        trials less accurately for autistic than neurotypical children. These speech
        production motor-specific differences were not observed in a group of children
        with reading disability who had similarly reduced nonword repetition behavior.
        These findings suggest that atypical function in speech production brain regions
        may contribute to nonword repetition difficulties in autism.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/36584426\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7unjkQpmZYDF\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"bd7ac39d-a58c-4011-9454-3606feaacf50\",\"title\":\"Reading
        ability in both deaf and hearing adults is linked to neural representations
        of abstract phonology derived from visual speech\",\"authors\":\"Samuel Evans;
        Cathy J. Price; J\xF6rn Diedrichsen; Tae Twomey; Indie Beedie; Maggie Fraser;
        Mair\xE9ad MacSweeney\",\"keywords\":\"\",\"pmcid\":\"PMC13229273\",\"pmid\":\"42190012\",\"doi\":\"10.1073/pnas.2535704123\",\"articleYear\":\"2026\",\"journal\":\"Proceedings
        of the National Academy of Sciences\",\"abstractText\":\"Reading is central
        to academic and vocational success. Some deaf children face reading challenges
        due to limited access to spoken or signed language. Robust phonological representations
        are key to reading development in hearing children. Spoken language phonology
        may be one of many contributors to reading development in deaf children. Indeed,
        speechreading ability correlates with reading skill in both deaf and hearing
        individuals, suggesting it is linked to reading development regardless of
        hearing status. Further support for this hypothesis would be provided by evidence
        that similar neural representations of speech phonology are evoked by visual
        speech and other language forms (auditory speech and text), and that these
        neural representations are related to reading proficiency. We used fMRI and
        Representational Similarity Analysis (RSA) to identify shared neural representations
        of spoken language phonological structure. A group of deaf adult participants
        (N=22), with a mixture of sign language and spoken language backgrounds and
        reading abilities, were presented with single lexical items as visual speech
        and dynamic text (cursive text, revealed letter-by-letter to promote a phonological
        reading strategy). Adult hearing participants (N=25) were presented with the
        same words, but as visual speech and auditory speech. Shared neural representations
        of phonological structure of English words were found in each group in the
        superior and middle temporal cortex (STC/MTC) and these abstract representations
        were more similar across different language forms in better readers. Our data
        provide neurobiological evidence of the contribution of visual speech to abstract
        phonological representations of spoken language, that relate to reading proficiency,
        in both deaf and hearing adults. Significance Statement Reading is an essential
        skill, yet some deaf children face reading challenges due to reduced access
        to signed or spoken language. In hearing children, successful reading depends
        on abstract phonological representations, but whether spoken language phonology
        relates to reading in deaf individuals remains unclear. Using fMRI and RSA,
        we show that deaf and hearing adults recruit neural representations of phonology
        that are shared by visual speech and other language forms (visual/auditory
        speech in hearing; visual speech/dynamic text in deaf) in the superior and
        middle temporal cortex. Critically, greater cross-modal alignment of neural
        representations of phonological structure was associated with better reading
        in both groups. These findings provide neurobiological evidence that visual
        speech contributes to phonological representations that relate to reading,
        regardless of hearing status.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/42190012\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"n3W2KfsbSMrt\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"dff30084-36c1-4fa7-a058-fc059d7f454a\",\"title\":\"Neural
        Correlates of Phonological Processing in Speech Sound Disorder: A Functional
        Magnetic Resonance Imaging Study\",\"authors\":\"Jean A. Tkach; Xu Chen; Lisa
        A. Freebairn; Vincent J. Schmithorst; Scott K. Holland; Barbara A. Lewis\",\"keywords\":\"\",\"pmcid\":\"PMC3162995\",\"pmid\":\"21458852\",\"doi\":\"10.1016/j.bandl.2011.02.002\",\"articleYear\":\"2011\",\"journal\":\"Brain
        and Language\",\"abstractText\":\"Speech sound disorders (SSD) are the largest
        group of communication disorders observed in children. One explanation for
        these disorders is that children with SSD fail to form stable phonological
        representations when acquiring the speech sound system of their language due
        to poor phonological memory (PM). The goal of this study was to examine PM
        in individuals with histories of SSD employing functional MR imaging (fMRI).
        Participants were six right-handed adolescents with a history of early childhood
        SSD and seven right-handed matched controls with no history of speech and
        language disorders. We performed an fMRI study using an overt non-word repetition
        (NWR). Right lateralized hypoactivation in the inferior frontal gyrus and
        middle temporal gyrus was observed. The former suggests a deficit in the phonological
        processing loop supporting PM, while the later may indicate a deficit in speech
        perception. Both are cognitive processes involved in speech production. Bilateral
        hyperactivation observed in the pre and supplementary motor cortex, inferior
        parietal, supramarginal gyrus and cerebellum raised the possibility of compensatory
        increases in cognitive effort or reliance on the other components of the articulatory
        rehearsal network and phonologic store. These findings may be interpreted
        to support the hypothesis that individuals with SSD may have a deficit in
        PM and to suggest the involvement of compensatory mechanisms to counteract
        dysfunction of the normal network.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/21458852\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7XNit2xadXky\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"59dfc2ab-637a-4e66-99a2-393f427d777f\",\"title\":\"An
        audiovisual integration deficit underlies reading failure in nontransparent
        writing systems: An fMRI study of Chinese children with dyslexia\",\"authors\":\"Yang
        Yang; Ying Hui Yang; Junjun Li; Min Xu; Hong-Yan Bi\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"\",\"doi\":\"10.1016/j.jneuroling.2019.100884\",\"articleYear\":\"2020\",\"journal\":\"Journal
        of Neurolinguistics\",\"abstractText\":\"Establishing the associations between
        speech sounds and visual scripts is an essential step for reading acquisition.
        Audiovisual integration deficits have been proposed to be a cause of developmental
        dyslexia, and this has been evidenced by behavioral and neural findings from
        alphabetic languages with relatively transparent orthographies. Here, using
        functional magnetic resonance imaging (fMRI) in a lexical decision task, this
        study examined the neural correlates of audiovisual integration deficits in
        Chinese children with dyslexia and age-matched controls. The results indicated
        that the children with dyslexia showed a reduced audiovisual congruency effect
        in the left angular gyrus, left superior temporal gyrus and left middle and
        superior frontal gyrus. Moreover, dyslexics showed reduced functional connectivity
        for the congruency effect between the left angular gyrus and both the left
        lingual gyrus and left cerebellum. The regional activation and functional
        connectivity abnormalities might underlie the ill-developed correspondence
        between orthographic and phonological information in Chinese dyslexia. This
        study, for the first time, illustrates the neural mechanisms of the audiovisual
        integration deficit in dyslexia in a nontransparent logographic writing system,
        extending our understanding of the neural basis of dyslexia.\",\"articleLink\":\"\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"EkEpyL9sxSY6\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"3b82b983-ec23-48c8-bc92-c7dd77de248c\",\"title\":\"Speech
        cortical activation and connectivity in typically developing children and
        those with listening difficulties\",\"authors\":\"Hannah J. Stewart; Erin
        K. Cash; Lisa L. Hunter; Thomas Maloney; Jennifer Vannest; David R. Moore\",\"keywords\":\"\",\"pmcid\":\"PMC9467868\",\"pmid\":\"36087559\",\"doi\":\"10.1016/j.nicl.2022.103172\",\"articleYear\":\"2022\",\"journal\":\"NeuroImage
        Clinical\",\"abstractText\":\"  Highlights  \\n  \\nAll participants had clinically
        normal hearing. \\n  \\nNo group differences in cortical activation during
        speech recognition. \\n  \\nComplex speech processing networks showed group
        differences in temporal connectivity. \\n  \\nStrength of connections related
        to listening and cognitive test outcomes. \\n  \\n  \\nListening difficulties
        (LiD) in people who have normal audiometry are a widespread but poorly understood
        form of hearing impairment. Recent research suggests that childhood LiD are
        cognitive rather than auditory in origin. We examined decoding of sentences
        using a novel combination of behavioral testing and fMRI with 43 typically
        developing children and 42 age matched (6\u201313\_years old) children with
        LiD, categorized by caregiver report (ECLiPS). Both groups had clinically
        normal hearing. For sentence listening tasks, we found no group differences
        in fMRI brain cortical activation by increasingly complex speech stimuli that
        progressed in emphasis from phonology to intelligibility to semantics. Using
        resting state fMRI, we examined the temporal connectivity of cortical auditory
        and related speech perception networks. We found significant group differences
        only in cortical connections engaged when processing more complex speech stimuli.
        The strength of the affected connections was related to the children\u2019s
        performance on tests of dichotic listening, speech-in-noise, attention, memory
        and verbal vocabulary. Together, these results support the novel hypothesis
        that childhood LiD reflects difficulties in language rather than in auditory
        or phonological processing. \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/36087559\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"PrdVj784R4oQ\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"f312bc34-d487-4c75-b48b-538974ffd666\",\"title\":\"The
        neural basis of non-native speech perception in bilingual children.\",\"authors\":\"Pilar
        Archila-Suerte; Jason Zevin; Aurora Isabel Ramos; Arturo E. Hernandez\",\"keywords\":\"\",\"pmcid\":\"PMC5942220\",\"pmid\":\"23123633\",\"doi\":\"10.1016/j.neuroimage.2012.10.023\",\"articleYear\":\"2013\",\"journal\":\"NeuroImage\",\"abstractText\":\"The
        goal of the present study is to reveal how the neural mechanisms underlying
        non-native speech perception change throughout childhood. In a pre-attentive
        listening fMRI task, English monolingual and Spanish-English bilingual children
        - divided into groups of younger (6-8yrs) and older children (9-10yrs) - were
        asked to watch a silent movie while several English syllable combinations
        played through a pair of headphones. Two additional groups of monolingual
        and bilingual adults were included in the analyses. Our results show that
        the neural mechanisms supporting speech perception throughout development
        differ in monolinguals and bilinguals. While monolinguals recruit perceptual
        areas (i.e., superior temporal gyrus) in early and late childhood to process
        native speech, bilinguals recruit perceptual areas (i.e., superior temporal
        gyrus) in early childhood and higher-order executive areas in late childhood
        (i.e., bilateral middle frontal gyrus and bilateral inferior parietal lobule,
        among others) to process non-native speech. The findings support the Perceptual
        Assimilation Model and the Speech Learning Model and suggest that the neural
        system processes phonological information differently depending on the stage
        of L2 speech learning.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/23123633\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"wFAUNLW7ctTr\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"203d8652-b6f2-4a24-a7ad-6b5340d6894d\",\"title\":\"Cortical
        responses to letters and ambiguous speech vary with reading skills in dyslexic
        and typically reading children.\",\"authors\":\"Linda Romanovska; Roef Janssen;
        Milene Bonte\",\"keywords\":\"\",\"pmcid\":\"PMC7907898\",\"pmid\":\"33618236\",\"doi\":\"10.1016/j.nicl.2021.102588\",\"articleYear\":\"2021\",\"journal\":\"NeuroImage
        Clinical\",\"abstractText\":\"One of the proposed issues underlying reading
        difficulties in dyslexia is insufficiently automatized letter-speech sound
        associations. In the current fMRI experiment, we employ text-based recalibration
        to investigate letter-speech sound mappings in 8-10\_year-old children with
        and without dyslexia. Here an ambiguous speech sound /a?a/ midway between
        /aba/ and /ada/ is combined with disambiguating \\\"aba\\\" or \\\"ada\\\"
        text causing a perceptual shift of the ambiguous /a?a/ sound towards the text
        (recalibration). This perceptual shift has been found to be reduced in adults
        but not in children with dyslexia compared to typical readers. Our fMRI results
        show significantly reduced activation in the left fusiform in dyslexic compared
        to typical readers, despite comparable behavioural performance. Furthermore,
        enhanced audio-visual activation within this region was linked to better reading
        and phonological skills. In contrast, higher activation in bilateral superior
        temporal cortex was associated with lower letter-speech sound identification
        fluency. These findings reflect individual differences during the early stages
        of reading development with reduced recruitment of the left fusiform in dyslexic
        readers together with an increased involvement of the superior temporal cortex
        in children with less automatized letter-speech sound associations.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/33618236\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"8AXg57oQmDZR\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"bf9f773c-368b-4a22-a82e-aebe5c34bfbc\",\"title\":\"Resting-state
        functional connectivity indexes reading competence in children and  adults.\",\"authors\":\"M.
        S. Koyama; A. Di Martino; X.-N. Zuo; C. Kelly; M. Mennes; D. R. Jutagir; F.
        X. Castellanos; M. P. Milham\",\"keywords\":\"\",\"pmcid\":\"PMC3893355\",\"pmid\":\"21653865\",\"doi\":\"10.1523/JNEUROSCI.4865-10.2011\",\"articleYear\":\"2011\",\"journal\":\"Journal
        of Neuroscience\",\"abstractText\":\"Task-based neuroimaging studies face
        the challenge of developing tasks capable of equivalently probing reading
        networks across different age groups. Resting-state fMRI, which requires no
        specific task, circumvents these difficulties. Here, in 25 children (8-14
        years) and 25 adults (21-46 years), we examined the extent to which individual
        differences in reading competence can be related to resting-state functional
        connectivity (RSFC) of regions implicated in reading. In both age groups,
        reading standard scores correlated positively with RSFC between the left precentral
        gyrus and other motor regions, and between Broca's and Wernicke's areas. This
        suggests that, regardless of age group, stronger coupling among motor regions,
        as well as between language/speech regions, subserves better reading, presumably
        reflecting automatized articulation. We also observed divergent RSFC-behavior
        relationships in children and adults, particularly those anchored in the left
        fusiform gyrus (FFG) (the visual word form area). In adults, but not children,
        better reading performance was associated with stronger positive correlations
        between FFG and phonology-related regions (Broca's area and the left inferior
        parietal lobule), and with stronger negative relationships between FFG and
        regions of the \\\"task-negative\\\" default network. These results suggest
        that both positive RSFC (functional coupling) between reading regions and
        negative RSFC (functional segregation) between a reading region and default
        network regions are important for automatized reading, characteristic of adult
        readers. Together, our task-independent RSFC findings highlight the importance
        of appreciating developmental changes in the neural correlates of reading
        competence, and suggest that RSFC may serve to facilitate the identification
        of reading disorders in different age groups.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/21653865\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"84qPgzGFYYun\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"8922cb6f-1558-4efb-9415-a6839739d8fb\",\"title\":\"Neural
        initialization of audiovisual integration in prereaders at varying risk for
        developmental dyslexia.\",\"authors\":\"Iliana I. Karipidis; Georgette Pleisch;
        Martina R\xF6thlisberger; Christoph Hofstetter; Dario Dornbierer; Philipp
        St\xE4mpfli; Silvia Brem\",\"keywords\":\"\",\"pmcid\":\"PMC6866885\",\"pmid\":\"27739608\",\"doi\":\"10.1002/hbm.23437\",\"articleYear\":\"2016\",\"journal\":\"Human
        Brain Mapping\",\"abstractText\":\"Learning letter-speech sound correspondences
        is a major step in reading acquisition and is severely impaired in children
        with dyslexia. Up to now, it remains largely unknown how quickly neural networks
        adopt specific functions during audiovisual integration of linguistic information
        when prereading children learn letter-speech sound correspondences. Here,
        we simulated the process of learning letter-speech sound correspondences in
        20 prereading children (6.13-7.17 years) at varying risk for dyslexia by training
        artificial letter-speech sound correspondences within a single experimental
        session. Subsequently, we acquired simultaneously event-related potentials
        (ERP) and functional magnetic resonance imaging (fMRI) scans during implicit
        audiovisual presentation of trained and untrained pairs. Audiovisual integration
        of trained pairs correlated with individual learning rates in right superior
        temporal, left inferior temporal, and bilateral parietal areas and with phonological
        awareness in left temporal areas. In correspondence, a differential left-lateralized
        parietooccipitotemporal ERP at 400 ms for trained pairs correlated with learning
        achievement and familial risk. Finally, a late (650 ms) posterior negativity
        indicating audiovisual congruency of trained pairs was associated with increased
        fMRI activation in the left occipital cortex. Taken together, a short (<30
        min) letter-speech sound training initializes audiovisual integration in neural
        systems that are responsible for processing linguistic information in proficient
        readers. To conclude, the ability to learn grapheme-phoneme correspondences,
        the familial history of reading disability, and phonological awareness of
        prereading children account for the degree of audiovisual integration in a
        distributed brain network. Such findings on emerging linguistic audiovisual
        integration could allow for distinguishing between children with typical and
        atypical reading development. Hum Brain Mapp 38:1038-1055, 2017. \xA9 2016
        Wiley Periodicals, Inc.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/27739608\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"ma58LTjxv5NH\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"ca950400-bf1f-4b99-b93b-dfd7968363e0\",\"title\":\"Individual
        Differences in Adult Reading Are Associated with Left Temporo-parietal to
        Dorsal Striatal Functional Connectivity.\",\"authors\":\"Sanjay Achal; Fumiko
        Hoeft; Signe Bray\",\"keywords\":\"\",\"pmcid\":\"PMC5028000\",\"pmid\":\"26400921\",\"doi\":\"10.1093/cercor/bhv214\",\"articleYear\":\"2015\",\"journal\":\"Cerebral
        Cortex\",\"abstractText\":\"Reading skills vary widely in both children and
        adults, with a number of factors contributing to this variability. The most
        prominent factor may be related to efficiency of storage, representation,
        or retrieval of speech sounds. This phonological hypothesis is supported by
        findings of reduced activation in poor readers in left hemisphere ventro-lateral
        prefrontal and temporo-parietal phonological processing regions. Less well
        explained by phonological theories are reported hyperactivation in prefrontal,
        striatal, and insular regions. This study investigated functional connectivity
        of a core phonological processing region, the temporo-parietal junction (TPJ),
        in relation to reading skill in an adult community sample. We hypothesized
        that connectivity between TPJ and regions implicated in meta-analyses of reading
        disorder would correlate with individual differences in reading. Forty-four
        adults aged 30-54, ranging in reading ability, underwent resting fMRI scans.
        Data-driven connectivity clustering was used to identify TPJ subregions for
        seed-based connectivity analyses. Correlations were assessed between TPJ connectivity
        and timed-pseudoword reading (decoding) ability. We found a significant correlation
        wherein greater left supramarginal gyrus to anterior caudate connectivity
        was associated with weaker decoding. This suggests that hyperactivation of
        the dorsal striatum, reported in poor readers during reading tasks, may reflect
        compensatory or inefficient overintegration into attention networks.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/26400921\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"k36dcsbe8oTY\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"b5951b79-a99e-4d63-ab76-9df3c1dce2c2\",\"title\":\"Neurocognitive
        mechanisms of co-occurring math difficulties in dyslexia: Differences in executive
        function and visuospatial processing\",\"authors\":\"Rebecca A. Marks; Courtney
        Pollack; Steven L. Meisler; Anila M. D'Mello; Tracy M. Centanni; Rachel R.
        Romeo; Karolina Wade; Anna A. Matejko; Daniel Ansari; John D. E. Gabrieli;
        Joanna A. Christodoulou\",\"keywords\":\"\",\"pmcid\":\"PMC10918042\",\"pmid\":\"37675857\",\"doi\":\"10.1111/desc.13443\",\"articleYear\":\"2023\",\"journal\":\"Developmental
        Science\",\"abstractText\":\"Children with dyslexia frequently also struggle
        with math. However, studies of reading disability (RD) rarely assess math
        skill, and the neurocognitive mechanisms underlying co- occurring math disability
        (RD+MD) are not clear. The current study aimed to identify behavioral and
        neurocognitive factors associated with co-occurring MD among 86 children with
        RD. Within this sample, 43% had co-occurring RD+MD and 22% demonstrated a
        possible vulnerability in math, while 35% had no math difficulties (RD-Only).
        We investigated whether RD-Only and RD+MD students differed behaviorally in
        their phonological awareness, reading skills, or executive functions, as well
        as in the brain mechanisms underlying word reading and visuospatial working
        memory using fMRI. The RD+MD group did not differ from RD-Only on behavioral
        or brain measures of phonological awareness related to speech or print. However,
        the RD+MD group demonstrated significantly worse working memory and processing
        speed performance than the RD-Only group. The RD+MD group also exhibited reduced
        brain activations for visuospatial working memory relative to RD-Only. Exploratory
        brain-behavior correlations along a broad spectrum of math ability revealed
        that stronger math skills were associated with greater activation in bilateral
        visual cortex. These converging neuro-behavioral findings suggest that poor
        executive function in general, including differences in visuospatial working
        memory, are specifically associated with co-occurring MD in the context of
        RD.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/37675857\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"hwuMonNUarCX\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"78498df5-9d90-46c1-8d9c-9e4940448bc7\",\"title\":\"Developmental
        refinement of cortical systems for speech and voice processing.\",\"authors\":\"Milene
        Bonte; Anke Ley; Wolfgang Scharke; Elia Formisano\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"26777479\",\"doi\":\"10.1016/j.neuroimage.2016.01.015\",\"articleYear\":\"2016\",\"journal\":\"NeuroImage\",\"abstractText\":\"Development
        typically leads to optimized and adaptive neural mechanisms for the processing
        of voice and speech. In this fMRI study we investigated how this adaptive
        processing reaches its mature efficiency by examining the effects of task,
        age and phonological skills on cortical responses to voice and speech in children
        (8-9years), adolescents (14-15years) and adults. Participants listened to
        vowels (/a/, /i/, /u/) spoken by different speakers (boy, girl, man) and performed
        delayed-match-to-sample tasks on vowel and speaker identity. Across age groups,
        similar behavioral accuracy and comparable sound evoked auditory cortical
        fMRI responses were observed. Analysis of task-related modulations indicated
        a developmental enhancement of responses in the (right) superior temporal
        cortex during the processing of speaker information. This effect was most
        evident through an analysis based on individually determined voice sensitive
        regions. Analysis of age effects indicated that the recruitment of regions
        in the temporal-parietal cortex and posterior cingulate/cingulate gyrus decreased
        with development. Beyond age-related changes, the strength of speech-evoked
        activity in left posterior and right middle superior temporal regions significantly
        scaled with individual differences in phonological skills. Together, these
        findings suggest a prolonged development of the cortical functional network
        for speech and voice processing. This development includes a progressive refinement
        of the neural mechanisms for the selection and analysis of auditory information
        relevant to the ongoing behavioral task.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/26777479\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"GPWw4AS5KR8t\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"767c7f14-580c-40d8-9849-9d562ea5ab1d\",\"title\":\"Overt
        speech critically changes lateralization index and did not allow determination
        of hemispheric dominance for language: an fMRI study.\",\"authors\":\"David
        Hassanein Berro; Jean-Michel Lem\xE9e; Louis-Marie Leiber; Evelyne Emery;
        Philippe Menei; Aram Ter Minassian\",\"keywords\":\"\",\"pmcid\":\"PMC8638205\",\"pmid\":\"34852787\",\"doi\":\"10.1186/s12868-021-00671-y\",\"articleYear\":\"2021\",\"journal\":\"BMC
        Neuroscience\",\"abstractText\":\"BACKGROUND\\nPre-surgical mapping of language
        using functional MRI aimed principally to determine the dominant hemisphere.
        This mapping is currently performed using covert linguistic task in way to
        avoid motion artefacts potentially biasing the results. However, overt task
        is closer to natural speaking, allows a control on the performance of the
        task, and may be easier to perform for stressed patients and children. However,
        overt task, by activating phonological areas on both hemispheres and areas
        involved in pitch prosody control in the non-dominant hemisphere, is expected
        to modify the determination of the dominant hemisphere by the calculation
        of the lateralization index (LI).\\nOBJECTIVE\\nHere, we analyzed the modifications
        in the LI and the interactions between cognitive networks during covert and
        overt speech task.\\nMETHODS\\nThirty-three volunteers participated in this
        study, all but four were right-handed. They performed three functional sessions
        consisting of (1) covert and (2) overt generation of a short sentence semantically
        linked with an audibly presented word, from which we estimated the \\\"Covert\\\"
        and \\\"Overt\\\" contrasts, and a (3) resting-state session. The resting-state
        session was submitted to spatial independent component analysis to identify
        language network at rest (LANG), cingulo-opercular network (CO), and ventral
        attention network (VAN). The LI was calculated using the bootstrapping method.\\nRESULTS\\nThe
        LI of the LANG was the most left-lateralized (0.66\u2009\xB1\u20090.38). The
        LI shifted from a moderate leftward lateralization for the Covert contrast
        (0.32\u2009\xB1\u20090.38) to a right lateralization for the Overt contrast
        (-\_0.13\u2009\xB1\u20090.30). The LI significantly differed from each other.
        This rightward shift was due to the recruitment of right hemispheric temporal
        areas together with the nodes of the CO.\\nCONCLUSION\\nAnalyzing the overt
        speech by fMRI allowed improvement in the physiological knowledge regarding
        the coordinated activity of the intrinsic connectivity networks. However,
        the rightward shift of the LI in this condition did not provide the basic
        information on the hemispheric language dominance. Overt linguistic task cannot
        be recommended for clinical purpose when determining hemispheric dominance
        for language.\\n\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/34852787\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"3otgTK9kwaCb\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"9a915d4a-3133-4669-9169-b4f998a495e5\",\"title\":\"The
        brain signature of emerging reading in two contrasting languages\",\"authors\":\"Katarzyna
        Chyl; Bartosz Kossowski; Shuai Wang; Agnieszka D\u0119bska; Magdalena \u0141uniewska;
        Artur Marchewka; Marek Wypych; Mark van den Bunt; William Mencl; Kenneth Pugh;
        Katarzyna Jednor\xF3g\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"33130273\",\"doi\":\"10.1016/j.neuroimage.2020.117503\",\"articleYear\":\"2020\",\"journal\":\"NeuroImage\",\"abstractText\":\"Despite
        dissimilarities among scripts, a universal hallmark of literacy in skilled
        readers is the convergent brain activity for print and speech. Little is known,
        however, whether this differs as a function of grapheme to phoneme transparency
        in beginning readers. Here we compare speech and orthographic processing circuits
        in two contrasting languages, Polish and English, in 100 7-year-old children
        performing fMRI language localizer tasks. Results show limited language variation,
        with speech-print convergence evident mostly in left frontotemporal perisylvian
        regions. Correlational and intersect analyses revealed subtle differences
        in the strength of this coupling in several regions of interest. Specifically,
        speech-print convergence was higher for transparent Polish than opaque English
        in the right temporal area, associated with phonological processing. Conversely,
        speech-print convergence was higher for English than Polish in left fusiform,
        associated with visual word recognition. We conclude that speech-print convergence
        is a universal marker of reading even at the beginning of reading acquisition
        with minor variations that can be explained by the differences in grapheme
        to phoneme transparency. This finding at the earliest stages of reading acquisition
        conforms well with claims that reading exhibits a good deal of universality
        despite writing systems differences.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/33130273\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"4crUGEEfvxQF\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"91c7b7f6-c781-4342-b236-7eb634e63e5a\",\"title\":\"Auditory-motor
        integration during fast repetition: the neuronal correlates of shadowing.\",\"authors\":\"C.
        Peschke; W. Ziegler; J. Kappes; A. Baumgaertner\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"19345269\",\"doi\":\"10.1016/j.neuroimage.2009.03.061\",\"articleYear\":\"2009\",\"journal\":\"NeuroImage\",\"abstractText\":\"This
        fMRI study examined which structures of a proposed dorsal stream system are
        involved in the auditory-motor integration during fast overt repetition. We
        used a shadowing task which requires immediate repetition of an auditory-verbal
        input and is supposed to elicit unconscious imitation effects of phonologically
        irrelevant speech parameters. Subjects' responses were recorded in the scanner.
        To examine automated auditory-motor mapping of speech gestures of others onto
        one's own speech production system we contrasted the shadowing of pseudowords
        produced by multiple speakers (men, women, and children) with the shadowing
        of pseudowords produced by a single speaker. Furthermore, we asked whether
        behavioral variables predicted changes in functional activation during shadowing.
        Shadowing multiple speakers compared to a single speaker elicited increased
        bilateral activation predominantly in the superior temporal sulci. These regions
        may mediate acoustic-phonetic speaker normalization in preparation of a translation
        of perceptual into motor information. Additional activation in Broca's area
        and the thalamus may reflect motor effects of the adaptation to multiple speaker
        models. Item-wise correlational analyses of response latencies with BOLD signal
        changes indicated that longer latencies were associated with increased activation
        in the left parietal operculum, suggesting that this area plays a central
        role in the actual transfer of auditory-verbal information to speech motor
        representations. A multiple regression of behavioral with imaging data showed
        activation in a right inferior parietal area near the temporo-parietal boundary
        which correlated positively with the degree of speech rate imitation and negatively
        with response latency. This activation may be attributable to attentional
        and/or paralinguistic processes.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/19345269\",\"exclusionTag\":\"neurosynth_duplicate_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"5qu4oTnT9sbh\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"}]},{\"id\":\"e44517e4-e2bc-4d6c-83c5-21ac6e1f61fa\",\"name\":\"Screening\",\"stubStudies\":[{\"id\":\"dce73966-7fee-4a39-9ec1-3555fae5f71b\",\"title\":\"An
        fMRI study of sentence-embedded lexical-semantic decision in children and
        adults.\",\"authors\":\"Erin Nicole Moore-Parks; Erin L. Burns; Rebecca Bazzill;
        Sarah Levy; Valerie Posada; Ralph-Axel M\xFCller\",\"keywords\":\"\",\"pmcid\":\"PMC3630793\",\"pmid\":\"20627366\",\"doi\":\"10.1016/j.bandl.2010.03.009\",\"articleYear\":\"2010\",\"journal\":\"Brain
        and Language\",\"abstractText\":\"Lexical-semantic knowledge is a core language
        component that undergoes prolonged development throughout childhood and is
        therefore highly amenable to developmental studies. Most previous lexical-semantic
        functional MRI (fMRI) studies have been limited to single-word or word-pair
        tasks, outside a sentence context. Our objective was to investigate the development
        of lexical-semantic language networks in typically developing children using
        a more 'ecological' sentence-embedded semantic task that permitted performance
        monitoring while minimizing head movement by avoiding overt speech. Sixteen
        adults and 23 children completed two fMRI runs of an auditory lexical-semantic
        decision task with a button-press response, using reverse speech as control
        condition. Children and adults showed similar activation in bilateral temporal
        and left inferior frontal regions. Greater activation in adults than in children
        was seen in left inferior parietal, premotor, and inferior frontal regions,
        and in bilateral supplementary motor area (SMA). Specifically for semantically
        incongruous sentences, adults also showed greater activation than children
        in left inferior frontal cortex, possibly related to enhanced 'top-down' control.
        Age-dependent activation increases in motor-related regions were shown to
        be unrelated to overt motor responses, but could be associated with covert
        speech accompanying semantic decision. Unlike previous studies, age-dependent
        differences were not detected in posterior sensory cortices (such as extrastriate
        cortex), nor in middle temporal gyrus.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/20627366\",\"exclusionTag\":\"e3add4e2-e8ac-458e-9345-64a6322e461b\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"3UFjR2x4jcDk\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"27c7b84f-a502-403f-9f28-461b49647016\",\"title\":\"Social
        relationship-dependent neural response to speech in dogs.\",\"authors\":\"Anna
        G\xE1bor; Attila Andics; \xC1d\xE1m Mikl\xF3si; K\xE1lm\xE1n Czeibert; Cec\xEDlia
        Carreiro; M\xE1rta G\xE1csi\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"34411741\",\"doi\":\"10.1016/j.neuroimage.2021.118480\",\"articleYear\":\"2021\",\"journal\":\"NeuroImage\",\"abstractText\":\"In
        humans, social relationship with the speaker affects neural processing of
        speech, as exemplified by children's auditory and reward responses to their
        mother's utterances. Family dogs show human analogue attachment behavior towards
        the owner, and neuroimaging revealed auditory cortex and reward center sensitivity
        to verbal praises in dog brains. Combining behavioral and non-invasive fMRI
        data, we investigated the effect of dogs' social relationship with the speaker
        on speech processing. Dogs listened to praising and neutral speech from their
        owners and a control person. We found positive correlation between dogs' behaviorally
        measured attachment scores towards their owners and neural activity increase
        for the owner's voice in the caudate nucleus; and activity increase in the
        secondary auditory caudal ectosylvian gyrus and the caudate nucleus for the
        owner's praise. Through identifying social relationship-dependent neural reward
        responses, our study reveals similarities in neural mechanisms modulated by
        infant-mother and dog-owner attachment.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/34411741\",\"exclusionTag\":\"neurosynth_irrelevant_exclusion\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"gx2zzUbbydf9\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"c668376f-0c0e-4421-8b0d-a8fb56effd15\",\"title\":\"Auditory
        observation of infant-directed speech by mothers: experience-dependent interaction
        between language and emotion in the basal ganglia.\",\"authors\":\"Yoshi-Taka
        Matsuda; Kenichi Ueno; Kang Cheng; Yukuo Konishi; Reiko Mazuka; Kazuo Okanoya\",\"keywords\":\"\",\"pmcid\":\"PMC4226166\",\"pmid\":\"25426054\",\"doi\":\"10.3389/fnhum.2014.00907\",\"articleYear\":\"2014\",\"journal\":\"Frontiers
        in Human Neuroscience\",\"abstractText\":\"\\nAdults address infants with
        a special speech register known as infant-directed speech (IDS), which conveys
        both linguistic and emotional information through its characteristic lexicon
        and exaggerated prosody (e.g., higher pitched, slower, and hyperarticulated).
        Although caregivers are known to regulate the usage of IDS (linguistic and
        emotional components) depending on their child's development, the underlying
        neural substrates of this flexible modification are largely unknown. Here,
        using an auditory observation method and functional magnetic resonance imaging
        (fMRI) of four different groups of females, we revealed the experience-dependent
        influence of the emotional component on linguistic processing in the right
        caudate nucleus when mothers process IDS: (1) non-mothers, who do not use
        IDS regularly, showed no significant difference between IDS and adult-directed
        speech (ADS); (2) mothers with preverbal infants, who primarily use the emotional
        component of IDS, showed the main effect of the emotional component of IDS;
        (3) mothers with toddlers at the two-word stage, who use both linguistic and
        emotional components of IDS, showed an interaction between the linguistic
        and emotional components of IDS; and (4) mothers with school-age children,
        who use ADS rather than IDS toward their children, showed a tendency toward
        the main effect of ADS. The task that was most comparable to the naturalistic
        categories of IDS (i.e., explicit-language and implicit-emotion processing)
        recruited the right caudate nucleus, but it was not recruited in the control,
        less naturalistic condition (explicit-emotion and implicit-language processing).
        Our results indicate that the right caudate nucleus processes experience-and
        task-dependent interactions between language and emotion in mothers' IDS.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/25426054\",\"exclusionTag\":\"e3add4e2-e8ac-458e-9345-64a6322e461b\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"4TnMnMxC99pw\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"3d13a562-be13-47ea-aa73-d1db6d1b1fb5\",\"title\":\"Auditory
        rhythm discrimination in adults who stutter: An fMRI study.\",\"authors\":\"Emily
        O. Garnett; J. Devin McAuley; Elizabeth A. Wieland; Ho Ming Chow; David C.
        Zhu; Laura C. Dilley; Soo-Eun Chang\",\"keywords\":\"\",\"pmcid\":\"PMC12955694\",\"pmid\":\"36577315\",\"doi\":\"10.1016/j.bandl.2022.105219\",\"articleYear\":\"2022\",\"journal\":\"Brain
        and Language\",\"abstractText\":\"Rhythm perception deficits have been linked
        to neurodevelopmental disorders affecting speech and language. Children who
        stutter have shown poorer rhythm discrimination and attenuated functional
        connectivity in rhythm-related brain areas, which may negatively impact timing
        control required for speech. It is unclear whether adults who stutter (AWS),
        who are likely to have acquired compensatory adaptations in response to rhythm
        processing/timing deficits, are similarly affected. We compared rhythm discrimination
        in AWS and controls (total n\_=\_36) during fMRI in two matched conditions:
        simple rhythms that consistently reinforced a periodic beat, and complex rhythms
        that did not (requiring greater reliance on internal timing). Consistent with
        an internal beat deficit hypothesis, behavioral results showed poorer complex
        rhythm discrimination for AWS than controls. In AWS, greater stuttering severity
        was associated with poorer rhythm discrimination. AWS showed increased activity
        within beat-based timing regions and increased functional connectivity between
        putamen and cerebellum (supporting interval-based timing) for simple rhythms.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/36577315\",\"exclusionTag\":\"e3add4e2-e8ac-458e-9345-64a6322e461b\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"WCAbRKvL9qqv\",\"importId\":\"f1ed2543-c423-4d02-bcd3-4f6aadacac4b\"},{\"id\":\"04617329-3439-45d0-8466-ca72ea3c4781\",\"title\":\"Task-independent
        neural bases of peer presence effect on cognition in children and adults.\",\"authors\":\"Leslie
        Tricoche; Denis P\xE9lisson; L\xE9a Longo; Eric Koun; Alice Poisson; J\xE9r\xF4me
        Prado; Martine Meunier\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"37385049\",\"doi\":\"10.1016/j.neuroimage.2023.120247\",\"articleYear\":\"2023\",\"journal\":\"NeuroImage\",\"abstractText\":\"There
        is ample behavioral evidence that others' mere presence can affect any behavior
        in human and non-human animals, generally facilitating the expression of mastered
        responses while impairing the acquisition of novel ones. Much less is known
        about i) how the brain orchestrates the modulation of such a wide array of
        behaviors by others' presence and ii) when these neural underpinnings mature
        during development. To address these issues, fMRI data were collected in children
        and adults alternately observed and unobserved by a familiar peer. Subjects
        performed a numerosity comparison task and a phonological comparison task.
        While the former involves number-processing brain areas, the latter involves
        language-processing areas. Consistent with previous behavioral findings, adults'
        and children's performance improved in both tasks when observed by a peer.
        Across all participants, task-specific brain regions showed no reliable change
        in activity under peer observation. Rather, we found task-independent changes
        in domain-general brain regions typically involved in mentalizing, reward,
        and attention. Bayesian analyses singled out the attention network as the
        exception to the close child-adult resemblance of peer observation neural
        substrates. These findings suggest that i) social facilitation of some human
        education-related skills is primarily orchestrated by domain-general brain
        networks, rather than by task-selective substrates, and ii) apart from attention,
        peer presence neural processing is largely mature in children.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/37385049\",\"exclusionTag\":\"e3add4e2-e8ac-458e-9345-64a6322e461b\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"cBwm6VfEfZEt\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"5a1fbab9-3f9a-431f-b105-a6b7a07b81b2\",\"title\":\"Dough,
        tough, cough, rough: A \u201Cfast\u201D fMRI localizer of component processes
        in reading\",\"authors\":\"Jeffrey G. Malins; Nina Gumkowski; Bonnie Buis;
        Peter Molfese; Jay G. Rueckl; Stephen J. Frost; Kenneth R. Pugh; Robin Morris;
        W. Einar Mencl\",\"keywords\":\"\",\"pmcid\":\"PMC5089170\",\"pmid\":\"27592331\",\"doi\":\"10.1016/j.neuropsychologia.2016.08.027\",\"articleYear\":\"2016\",\"journal\":\"Neuropsychologia\",\"abstractText\":\"In
        the current study, we present a novel fMRI protocol in which words, pseudowords,
        and other word-like stimuli are passively presented in a rapid, sequential
        fashion. In this \\\"fast\\\" localizer paradigm, items are presented in groups
        of four; within sets, words are related in orthographic, phonological, and/or
        semantic properties. We tested this protocol with a group of skilled adult
        readers (N=18). Analyses uncovered key regions of the reading network that
        were sensitive to different component processes at the group level; namely,
        left fusiform gyrus as well as the pars opercularis subregion of inferior
        frontal gyrus were sensitive to lexicality; several regions including left
        precentral gyrus and left supramarginal gyrus were sensitive to spelling-sound
        consistency; the pars triangularis subregion of inferior frontal gyrus was
        sensitive to semantic similarity. Additionally, in a number of key brain regions,
        activation in response to semantically similar words was related to individual
        differences in reading comprehension outside the scanner. Importantly, these
        findings are in line with previous investigations of the reading network,
        yet data were obtained using much less imaging time than comparable paradigms
        currently available, especially relative to the number of indices of component
        processes obtained. This feature, combined with the relatively simple nature
        of the task, renders it appropriate for groups of subjects with a wide range
        of reading abilities, including children with impairments.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/27592331\",\"exclusionTag\":\"e3add4e2-e8ac-458e-9345-64a6322e461b\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"43JvxTYAcSbz\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"cb4f30a7-aacf-4822-bfaf-992f9e73434a\",\"title\":\"Neural
        basis of protracted developmental changes in visuo-spatial working memory\",\"authors\":\"H.
        Kwon; A. L. Reiss; V. Menon\",\"keywords\":\"\",\"pmcid\":\"PMC130634\",\"pmid\":\"12244209\",\"doi\":\"10.1073/pnas.162486399\",\"articleYear\":\"2002\",\"journal\":\"Proceedings
        of the National Academy of Sciences\",\"abstractText\":\"Developmental studies
        have shown that visuo-spatial working memory (VSWM) performance improves throughout
        childhood and adolescence into young adulthood. The neural basis of this protracted
        development is poorly understood. In this study, we used functional MRI (fMRI)
        to examine VSWM function in children, adolescents, and young adults, ages
        7-22. Subjects performed a 2-back VSWM experiment that required dynamic storage
        and manipulation of spatial information. Accuracy and response latency on
        the VSWM task improved gradually, extending into young adulthood. Age-related
        increases in brain activation were observed in focal regions of the left and
        right dorsolateral prefrontal cortex, left ventrolateral prefrontal cortex
        (including Broca's area), left premotor cortex, and left and right posterior
        parietal cortex. Multiple regression analysis was used to examine the relative
        contributions of age, accuracy, and response latency on activation. Our analysis
        showed that age was the most significant predictor of activation in these
        brain regions. These findings provide strong evidence for a process of protracted
        functional maturation of bilateral fronto-parietal neural networks involved
        in VSWM development. At least two neural systems involved in VSWM mature together:
        (i) a right hemisphere visuo-spatial attentional system, and (ii) a left hemisphere
        phonological storage and rehearsal system. These observations suggest that
        visually and verbally mediated mnemonic processes, and their neural representations,
        develop concurrently during childhood and adolescence and into young adulthood.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/12244209\",\"exclusionTag\":\"e3add4e2-e8ac-458e-9345-64a6322e461b\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"335hoSEVBLgr\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"af541318-3218-41e6-95d0-1b6004524f1d\",\"title\":\"The
        Effects of Age and Reading Experience on the Lifespan Neurodevelopment for
        Reading Comprehension.\",\"authors\":\"Xinyang Liu; Lihuan Zhang; Saiwen Yu;
        Zilin Bai; Ting Qi; Hengyu Mao; Zonglei Zhen; Qi Dong; Li Liu\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"38010312\",\"doi\":\"10.1162/jocn_a_02086\",\"articleYear\":\"2024\",\"journal\":\"Journal
        of Cognitive Neuroscience\",\"abstractText\":\"\\nReading comprehension is
        a vital cognitive skill that individuals use throughout their lives. The neurodevelopment
        of reading comprehension across the lifespan, however, remains underresearched.
        Furthermore, factors such as maturation and experience significantly influence
        functional brain development. Given the complexity of reading comprehension,
        which incorporates lower-level word reading process and higher-level semantic
        integration process, our study aims to investigate how age and reading experience
        influence the neurobiology underpinning these two processes across the lifespan.
        fMRI data of 158 participants aged from 7 to 77 years were collected during
        a passive word viewing task and a sentence comprehension task to engage the
        lower- and higher-level processes, respectively. We found that the neurodevelopment
        of the lower-level process was primarily influenced by age, showing increased
        activation and connectivity with age in parieto-occipital and middle/inferior
        frontal lobes related to morphological-semantic mapping while decreased activation
        in the temporoparietal regions linked to phonological processing. However,
        the brain function of the higher-level process was primarily influenced by
        reading experience, exhibiting a greater reliance on the frontotemporal semantic
        network with enhanced sentence-level reading performance. Furthermore, reading
        experience did not significantly affect the brain function of children, but
        had a positive effect on young adults in the lower-level process and on middle-aged
        and older adults in the higher-level process. These findings indicate that
        the brain function for lower- and higher-level processes of reading comprehension
        is differently affected by maturation and reading experience, and the experience
        effect is contingent on age regarding the two processes.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/38010312\",\"exclusionTag\":\"e3add4e2-e8ac-458e-9345-64a6322e461b\",\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"MfWRPqcgXV6t\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"}]},{\"id\":\"e4523d31-e657-4722-a281-84bd3c8a1c5a\",\"name\":\"Eligibility\",\"stubStudies\":[]},{\"id\":\"ae52f102-547a-4c15-85f1-ac20b6b7a100\",\"name\":\"Included\",\"stubStudies\":[{\"id\":\"a9e0e20b-b10f-41ab-a71d-0e48974049f2\",\"title\":\"Language
        lateralization and the role of the fusiform gyrus in semantic processing in
        young children\",\"authors\":\"L.M. Balsamo; B. Xu; W.D. Gaillard\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"16545581\",\"doi\":\"10.1016/j.neuroimage.2006.01.027\",\"articleYear\":\"2006\",\"journal\":\"NeuroImage\",\"abstractText\":\"We
        used blood oxygen-dependent (BOLD) fMRI technique at 1.5 T to examine brain
        regions associated with language comprehension in normally developing children,
        age 5 to 10 years. Twenty-three children participated in the study using an
        auditory semantic decision task which varied in task difficulty. Analysis
        of individual participants' data showed patterns of activation largely consistent
        with previous neuroimaging findings in adult language processing. Group data
        analysis also showed a strong left-lateralized pattern of activation that
        closely resembles those typically observed in adults. In addition, significant
        activation in the left fusiform gyrus was observed and was associated with
        task accuracy. This finding suggests that auditory semantic processing in
        young children may recruit cortical regions associated with word reading in
        adults prior to the initiation of a semantic category decision, a process
        which is consistent with patterns of early word recognition process and language
        development.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/16545581\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"68anrsJjGjFW\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"e9c13701-3b3c-4fab-97ce-67e7d987d404\",\"title\":\"Autistic
        children show reduced activity in left superior temporal cortex in response
        to social-emotional meaning in language.\",\"authors\":\"Hanlin Wu; Matthew
        Ganquan Shi; Phoebe Wai-Yu Chan; Peilun Song; Siu-Fung Lau; Gary Yu-Hin Lam;
        Xin Kang; Patrick C.M. Wong; Xiujuan Geng\",\"keywords\":\"\",\"pmcid\":\"PMC13573696\",\"pmid\":\"42715647\",\"doi\":\"10.1016/j.nicl.2026.104059\",\"articleYear\":\"2026\",\"journal\":\"NeuroImage
        Clinical\",\"abstractText\":\"\\nAutistic children often differ from non-autistic
        peers in social interaction, emotional processing, and language communication.
        While the neural differences between autistic and non-autistic children in
        processing paralinguistic social-emotional cues, such as emotional prosody,
        are well-documented, much less is known about how the brain processes the
        social-emotional meaning carried by the language content itself. In non-autistic
        adults, the left superior temporal sulcus (STS) and adjacent gyrus show a
        social-emotional bias, responding more strongly to social-emotional content
        than to content describing inanimate objects. We investigated whether this
        bias is present in children and whether it is altered in autistic children.
        We recruited 78 right-handed children who underwent functional magnetic resonance
        imaging (fMRI) scanning while listening to sentences describing either people
        in emotional situations (social-emotional sentences) or non-human objects,
        events, or concepts (object sentences). After excluding those with excessive
        head motion, we analyzed data from 58 of them (37 autistic and 21 non-autistic;
        mean age 10\_years). Across the sample as a whole, the left STS responded
        more strongly to social-emotional sentences than to object sentences, indicating
        that this social-emotional bias is already present in childhood. Importantly,
        this bias was reduced in autistic children compared to non-autistic controls,
        whereas no group difference was observed in general auditory or lexico-syntactic
        processing. This reduced activity in the left STS in response to social-emotional
        semantics may contribute to autistic children's social communication challenges.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/42715647\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"ETzXwMmE8wSF\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"536bb2dc-2562-4bc3-96b4-5f3dcd7e5a99\",\"title\":\"Auditory
        verb perception recruits motor systems in the developing brain: an fMRI investigation.\",\"authors\":\"Karin
        Harman James; Josita Maouene\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"19840036\",\"doi\":\"10.1111/j.1467-7687.2009.00919.x\",\"articleYear\":\"2009\",\"journal\":\"Developmental
        Science\",\"abstractText\":\"This study investigated neural activation patterns
        during verb processing in children, using fMRI (functional Magnetic Resonance
        Imaging). Preschool children (aged 4-6) passively listened to lists of verbs
        and adjectives while neural activation was measured. Findings indicated that
        verbs were processed differently than adjectives, as the verbs recruited motor
        systems in the frontal cortex during auditory perception, but the adjectives
        did not. Further evidence suggested that different types of verbs activated
        different regions in the motor cortex. The results demonstrate that the motor
        system is recruited during verb perception in the developing brain, reflecting
        the embodied nature of language learning and processing.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/19840036\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"kfcQT423RrgA\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"63ff101d-e1cc-430f-bb57-ef211ae25104\",\"title\":\"Language
        Processing in Toddlers with Permanent Congenital Sensorineural Hearing Impairment:
        A Preliminary Functional Magnetic Resonance Imaging (fMRI) Study\",\"authors\":\"Prasanna
        Karunanayaka\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"\",\"doi\":\"10.34297/ajbsr.2020.10.001471\",\"articleYear\":\"2020\",\"journal\":\"American
        Journal of Biomedical Science & Research\",\"abstractText\":\"Objective: To
        evaluate the utility of functional magnetic resonance imaging (fMRI) in toddlers
        under sedation (with permanent congenital sensorineural hearing impairment)
        who are candidates for Cochlear Implantation (CI). Methods: Infants with normal
        hearing (NH) and with bilateral (severe to profound) sensorineural hearing
        impairment (HI) participated in a clinically indicated fMRI study under sedation.
        All subjects were 9-24 months of age. NH subjects were recruited from the
        clinical MRI schedule for non-hearing related scan procedures. Results: NH
        infants activated language-related brain regions (superior temporal and angular
        gyri) under sedation. These brain regions are typically activated in older
        children during similar fMRI language tasks. In contrast to the NH group,
        the HI group exhibited strong frontal activation. This suggests different
        sound processing mechanisms in HI compared to the NH group. Conclusion: Infants
        with residual hearing elicited greater fMRI BOLD activation in auditory and
        language brain regions in response to auditory stimulation. Residual hearing
        in infants before CI is known to be an effective predictor for enhanced spoken
        language abilities post CI. The results of this preliminary study suggest
        that fMRI can be an effective clinical prescreening-tool for predicting and
        monitoring the benefits of CI-induced amplification-ensuring timely intervention
        strategies in HI infants.\",\"articleLink\":\"\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"pWNgWM5PuEaJ\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"a70a8743-dea1-4a98-ac73-d72db77d501c\",\"title\":\"Cerebral
        cortex functional reorganization in preschool children with congenital sensorineural
        hearing loss: a resting-state fMRI study\",\"authors\":\"Yi Yin; Xinyue Lyu;
        Jian Zhou; Kunlin Yu; Mingming Huang; Guiquan Shen; Cheng Hao; Zhengfu Wang;
        Hui Yu; Bo Gao\",\"keywords\":\"\",\"pmcid\":\"11234816\",\"pmid\":\"38988601\",\"doi\":\"10.3389/fneur.2024.1423956\",\"articleYear\":\"2024\",\"journal\":\"Frontiers
        in Neurology\",\"abstractText\":\" \\n## Purpose \\n  \\nHow cortical functional
        reorganization occurs after hearing loss in preschool children with congenital
        sensorineural hearing loss (CSNHL) is poorly understood. Therefore, we used
        resting-state functional MRI (rs-fMRI) to explore the characteristics of cortical
        reorganization in these patents. \\n\\n\\n## Methods \\n  \\nSixty-three preschool
        children with CSNHL and 32 healthy controls (HCs) were recruited, and the
        Categories of Auditory Performance (CAP) scores were determined at the 6-month
        follow-up after cochlear implantation (CI). First, rs-fMRI data were preprocessed,
        and amplitude of low-frequency fluctuation (ALFF) and regional homogeneity
        (ReHo) were calculated. Second, whole-brain functional connectivity (FC) analysis
        was performed using bilateral primary auditory cortex as seed points. Finally,
        Spearman correlation analysis was performed between the differential ALFF,
        ReHo and FC values and the CAP score. \\n\\n\\n## Results \\n  \\nALFF analysis
        showed that preschool children with CSNHL had lower ALFF values in the bilateral
        prefrontal cortex and superior temporal gyrus than HCs, but higher ALFF values
        in the bilateral thalamus and calcarine gyrus. And correlation analysis showed
        that some abnormal brain regions were weak negatively correlated with CAP
        score (  p  \u2009<\u20090.05). The ReHo values in the bilateral superior
        temporal gyrus, part of the prefrontal cortex and left insular gyrus were
        lower, whereas ReHo values in the bilateral thalamus, right caudate nucleus
        and right precentral gyrus were higher, in children with CSNHL than HCs. However,
        there was no correlation between ReHo values and the CAP scores (  p  \u2009<\u20090.05).
        Using primary auditory cortex (PAC) as seed-based FC further analysis revealed
        enhanced FC in the visual cortex, proprioceptive cortex and motor cortex.
        And there were weak negative correlations between the FC values in the bilateral
        superior temporal gyrus, occipital lobe, left postcentral gyrus and right
        thalamus were weakly negatively correlated and the CAP score (  p  \u2009<\u20090.05).
        \\n\\n\\n## Conclusion \\n  \\nAfter auditory deprivation in preschool children
        with CSNHL, the local functions of auditory cortex, visual cortex, prefrontal
        cortex and somatic motor cortex are changed, and the prefrontal cortex plays
        a regulatory role in this process. There is functional reorganization or compensation
        between children\u2019s hearing and these areas, which may not be conducive
        to auditory language recovery after CI in deaf children. \\n\\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/38988601\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"4EkAWgynGFLD\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"9d909519-0cd0-4bf8-9605-180c311f74bd\",\"title\":\"Comparison
        of fMRI data from passive listening and active-response story processing tasks
        in children\",\"authors\":\"Jennifer J. Vannest; Prasanna R. Karunanayaka;
        Mekibib Altaye; Vincent J. Schmithorst; Elena M. Plante; Kenneth J. Eaton;
        Jerod M. Rasmussen; Scott K. Holland\",\"keywords\":\"\",\"pmcid\":\"PMC2763568\",\"pmid\":\"19306445\",\"doi\":\"10.1002/jmri.21694\",\"articleYear\":\"2009\",\"journal\":\"Journal
        of Magnetic Resonance Imaging\",\"abstractText\":\"PURPOSE: To use functional
        MRI (fMRI) methods to visualize a network of auditory and language-processing
        brain regions associated with processing an aurally-presented story. We compare
        a passive listening (PL) story paradigm to an active-response (AR) version
        including online performance monitoring and a sparse acquisition technique.
        MATERIALS AND METHODS: Twenty children (ages 11-13 years) completed PL and
        AR story processing tasks. The PL version presented alternating 30-second
        blocks of stories and tones; the AR version presented story segments, comprehension
        questions, and 5-second tone sequences, with fMRI acquisitions between stimuli.
        fMRI data was analyzed using a general linear model approach and paired t-test
        identifying significant group activation. RESULTS: Both tasks showed activation
        in the primary auditory cortex, superior temporal gyrus bilaterally, and left
        inferior frontal gyrus (IFG). The AR task demonstrated more extensive activation,
        including the dorsolateral prefrontal cortex and anterior/posterior cingulate
        cortex. Comparison of effect size in each paradigm showed a larger effect
        for the AR paradigm in a left inferior frontal region-of-interest (ROI). CONCLUSION:
        Activation patterns for story processing in children are similar in PL and
        AR tasks. Increases in extent and magnitude of activation in the AR task are
        likely associated with memory and attention resources engaged across acquisition
        intervals.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/19306445\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"5FNQ4YKq2iMd\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"6a2d7ea1-3609-40d9-b945-d20d111947c1\",\"title\":\"Alterations
        in neural connectivity in preterm children at school age\",\"authors\":\"Yeisid
        Gozzo; Betty Vohr; Cheryl Lacadie; Michelle Hampson; Karol H. Katz; Jill Maller-Kesselman;
        Karen C. Schneider; Bradley S. Peterson; Nallakkandi Rajeevan; Robert W. Makuch;
        R. Todd Constable; Laura R. Ment\",\"keywords\":\"\",\"pmcid\":\"PMC2775072\",\"pmid\":\"19560547\",\"doi\":\"10.1016/j.neuroimage.2009.06.046\",\"articleYear\":\"2009\",\"journal\":\"NeuroImage\",\"abstractText\":\"Converging
        data suggest recovery from injury in the preterm brain. We used functional
        magnetic resonance imaging (fMRI) to test the hypothesis that cerebral connectivity
        involving Wernicke's area and other important cortical language regions would
        differ between preterm (PT) and term (T) control school age children during
        performance of an auditory language task. Fifty-four PT children (600-1250
        g birth weight) and 24 T controls were evaluated using an fMRI passive language
        task and neurodevelopmental assessments including: the Wechsler Intelligence
        Scale for Children - III (WISC-III), the Peabody Individual Achievement Test
        - Revised (PIAT-R) and the Peabody Picture Vocabulary Test - Revised (PPVT-R)
        at 8 years of age. Neural activity was assessed for language processing and
        the data were evaluated for connectivity and correlations to cognitive outcomes.
        We found that PT subjects scored significantly lower on all components of
        the WISC-III (p<0.009), the PIAT-R Reading Comprehension test (p=0.013), and
        the PPVT-R (p=0.001) compared to term subjects. Connectivity analyses revealed
        significantly stronger neural circuits in PT children between Wernicke's area
        and the right inferior frontal gyrus (R IFG, Broca's area homologue) and both
        the left and the right supramarginal gyri (SMG) components of the inferior
        parietal lobules (p</=0.02 for all). We conclude that PT subjects employ neural
        systems for auditory language function at school age differently than T controls;
        these alterations may represent a delay in maturation of neural networks or
        the engagement of alternate circuits for language processing.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/19560547\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"5QD9atF5jC7w\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"4e6b0dba-84ab-40bc-80ee-2f604b5ccd32\",\"title\":\"Syntactic
        and Semantic Specialization and Integration in 5- to 6-Year-Old Children during
        Auditory Sentence Processing.\",\"authors\":\"Jin Wang; Mabel L. Rice; James
        R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC8905464\",\"pmid\":\"31596168\",\"doi\":\"10.1162/jocn_a_01477\",\"articleYear\":\"2019\",\"journal\":\"Journal
        of Cognitive Neuroscience\",\"abstractText\":\"Previous studies have found
        specialized syntactic and semantic processes in the adult brain during language
        comprehension. Young children have sophisticated semantic and syntactic aspects
        of language, yet many previous fMRI studies failed to detect this specialization,
        possibly due to experimental design and analytical methods. In this current
        study, 5- to 6-year-old children completed a syntactic task and a semantic
        task to dissociate these two processes. Multivoxel pattern analysis was used
        to examine the correlation of patterns within a task (between runs) or across
        tasks. We found that the left middle temporal gyrus showed more similar patterns
        within the semantic task compared with across tasks, whereas there was no
        difference in the correlation within the syntactic task compared with across
        tasks, suggesting its specialization in semantic processing. Moreover, the
        left superior temporal gyrus showed more similar patterns within both the
        semantic task and the syntactic task as compared with across tasks, suggesting
        its role in integration of semantic and syntactic information. In contrast
        to the temporal lobe, we did not find specialization or integration effects
        in either the opercular or triangular part of the inferior frontal gyrus.
        Overall, our study showed that 5- to 6-year-old children have already developed
        specialization and integration in the temporal lobe, but not in the frontal
        lobe, consistent with developmental neurocognitive models of language comprehension
        in typically developing young children.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/31596168\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"cVp8tKXwc7Uz\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"fcfe5687-9ddc-4733-8ce1-fad54aeaf9fb\",\"title\":\"Cerebellar
        language mapping and cerebral language dominance in pediatric epilepsy surgery
        patients.\",\"authors\":\"Jennifer N. Gelinas; Kevin P.V. Fitzpatrick; Hong
        Cheol Kim; Bruce H. Bjornson\",\"keywords\":\"\",\"pmcid\":\"PMC4215475\",\"pmid\":\"25379442\",\"doi\":\"10.1016/j.nicl.2014.06.016\",\"articleYear\":\"2014\",\"journal\":\"NeuroImage
        Clinical\",\"abstractText\":\"OBJECTIVE\\nChildren with epilepsy often have
        reorganization of language networks and abnormal brain anatomy, making determination
        of language lateralization difficult. We characterized the proportion and
        distribution of language task activation in the cerebellum to determine the
        relationship to cerebral language lateralization.\\nMETHODS\\nForty-six pediatric
        epilepsy surgery candidates (aged 7-19 years) completed an fMRI auditory semantic
        decision language task. Distribution of activated voxels and language laterality
        indices were computed using: (a) Broca's and Wernicke's areas and their right
        cerebral homologues; and (b) left and right cerebellar hemispheres. Language
        task activation was anatomically localized in the cerebellum.\\nRESULTS\\nLateralized
        language task activation in either cerebral hemisphere was highly correlated
        with lateralized language task activation in the contralateral cerebellar
        hemisphere (Broca vs. cerebellar: \u03C1 = -0.54, p < 0.01). Cerebellar language
        activation was located within Crus I/II, areas previously implicated in non-motor
        functional networks.\\nCONCLUSIONS\\nCerebellar language activation occurs
        in homologous regions of Crus I/II contralateral to cerebral language activation
        in patients with both right and left cerebral language dominance. Cerebellar
        language laterality could contribute to comprehensive pre-operative evaluation
        of language lateralization in pediatric epilepsy surgery patients. Our data
        suggest that patients with atypical cerebellar language activation are at
        risk for having atypical cerebral language organization.\\n\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/25379442\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"34yZyiu4Rrrz\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"9aac16b0-dcc5-461a-81ad-942da2889386\",\"title\":\"A
        Decisional Space for fMRI Pattern Separation Using the Principal Component
        Analysis \u2013A Comparative Study of Language Networks in Pediatric Epilepsy\",\"authors\":\"X.
        You; M. Adjouadi; Jin Wang; M. Guillen; B. Bernal; J. Sullivan; E. Donner;
        B. Bjornson; M. Berl; W. Gaillard\",\"keywords\":\"\",\"pmcid\":\"PMC3398237\",\"pmid\":\"22461299\",\"doi\":\"10.1002/hbm.22069\",\"articleYear\":\"2012\",\"journal\":\"Human
        Brain Mapping\",\"abstractText\":\"Atypical functional magnetic resonance
        imaging (fMRI) language patterns may be identified by visual inspection or
        by region of interest (ROI)\u2010based laterality indices (LI) but are constrained
        by a priori assumptions. We compared a data\u2010driven novel application
        of principal component analysis (PCA) to conventional methods. We studied
        122 fMRI data sets from control and localization\u2010related epilepsy patients
        provided by five children's hospitals. Each subject performed an auditory
        description decision task. The data sets, acquired with different scanners
        but similar acquisition parameters, were processed through fMRIB software
        library to obtain 3D activation maps in standard space. A PCA analysis was
        applied to generate the decisional space and the data cluster into three distinct
        activation patterns. The classified activation maps were interpreted by (1)
        blinded reader rating based on predefined language patterns and (2) by language
        area ROI\u2010based LI (i.e., fixed threshold vs. bootstrap approaches). The
        different classification results were compared through \u03BA inter\u2010rater
        agreement statistics. The unique decisional space classified activation maps
        into three clusters (a) lower intensity typical language representation, (b)
        higher intensity typical, as well as (c) higher intensity atypical representation.
        Inter\u2010rater agreements among the three raters were excellent (Fleiss
        \u03BA = 0.85, P = 0.05). There was substantial to excellent agreement between
        the conventional visual rating and LI methods (\u03BA = 0.69\u20130.82, P
        = 0.05). The PCA\u2010based method yielded excellent agreement with conventional
        methods (\u03BA = 0.82, P = 0.05). The automated and data\u2010driven PCA
        decisional space segregates language\u2010related activation patterns in excellent
        agreement with current clinical rating and ROI\u2010based methods. Hum Brain
        Mapp 34:2330\u20132342, 2013. \xA9 2012 Wiley Periodicals, Inc.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/22461299\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"ZehxV2SJSqqb\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"e67647f8-2030-429f-a163-28a1ac05f4e2\",\"title\":\"Unilateral
        deafness in children affects development of multi-modal modulation and default
        mode networks.\",\"authors\":\"Vincent J. Schmithorst; Elena Plante; Scott
        Holland\",\"keywords\":\"\",\"pmcid\":\"PMC3971169\",\"pmid\":\"24723873\",\"doi\":\"10.3389/fnhum.2014.00164\",\"articleYear\":\"2014\",\"journal\":\"Frontiers
        in Human Neuroscience\",\"abstractText\":\"Monaural auditory input due to
        congenital or acquired unilateral hearing loss (UHL) may have neurobiological
        effects on the developing brain. Using functional magnetic resonance imaging
        (fMRI), we investigated the effect of UHL on the development of functional
        brain networks used for cross-modal processing. Children ages 7-12 with moderate
        or greater unilateral hearing loss of sensorineural origin (UHL-SN; N = 21)
        and normal-hearing controls (N = 23) performed an fMRI-compatible adaptation
        of the Token Test involving listening to a sentence such as \\\"touched the
        small green circle and the large blue square\\\" and simultaneously viewing
        an arrow touching colored shapes on a video. Children with right or severe-to-profound
        UHL-SN displayed smaller activation in a region encompassing the right inferior
        temporal, middle temporal, and middle occipital gyrus (BA 19/37/39), evidencing
        differences due to monaural hearing in cross-modal modulation of the visual
        processing pathway. Children with UHL-SN displayed increased activation in
        the left posterior superior temporal gyrus, likely the result either of more
        effortful low-level processing of auditory stimuli or differences in cross-modal
        modulation of the auditory processing pathway. Additionally, children with
        UHL-SN displayed reduced deactivation of anterior and posterior regions of
        the default mode network. Results suggest that monaural hearing affects the
        development of brain networks related to cross-modal sensory processing and
        the regulation of the default network during processing of spoken language.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/24723873\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"BcAP9ASyvVdJ\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"6c042c1d-f53e-4ad8-9a71-7f8a29c01586\",\"title\":\"Relation
        between functional connectivity and rhythm discrimination in children who
        do and do not stutter\",\"authors\":\"Soo-Eun Chang; Ho Ming Chow; Elizabeth
        A. Wieland; J. Devin McAuley\",\"keywords\":\"\",\"pmcid\":\"PMC5008055\",\"pmid\":\"27622141\",\"doi\":\"10.1016/j.nicl.2016.08.021\",\"articleYear\":\"2016\",\"journal\":\"NeuroImage
        Clinical\",\"abstractText\":\"Our ability to perceive and produce rhythmic
        patterns in the environment supports fundamental human capacities ranging
        from music and language processing to the coordination of action. This article
        considers whether spontaneous correlated brain activity within a basal ganglia-thalamocortical
        (rhythm) network is associated with individual differences in auditory rhythm
        discrimination. Moreover, do children who stutter with demonstrated deficits
        in rhythm perception have weaker links between rhythm network functional connectivity
        and rhythm discrimination? All children in the study underwent a resting-state
        fMRI session, from which functional connectivity measures within the rhythm
        network were extracted from spontaneous brain activity. In a separate session,
        the same children completed an auditory rhythm-discrimination task, where
        behavioral performance was assessed using signal detection analysis. We hypothesized
        that in typically developing children, rhythm network functional connectivity
        would be associated with behavioral performance on the rhythm discrimination
        task, but that this relationship would be attenuated in children who stutter.
        Results supported our hypotheses, lending strong support for the view that
        (1) children who stutter have weaker rhythm network connectivity and (2) the
        lack of a relation between rhythm network connectivity and rhythm discrimination
        in children who stutter may be an important contributing factor to the etiology
        of stuttering.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/27622141\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"42b73Ex6hsRQ\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"86786f44-a2c9-4fab-9d38-ec8c88039869\",\"title\":\"Neural
        processing of vision and language in kindergarten is associated with prereading
        skills and predicts future literacy\",\"authors\":\"Johanna Liebig; Eva Froehlich;
        Teresa Sylvester; Mario Braun; Hauke R. Heekeren; Johannes C. Ziegler; Arthur
        M. Jacobs\",\"keywords\":\"\",\"pmcid\":\"PMC8249894\",\"pmid\":\"33942958\",\"doi\":\"10.1002/hbm.25449\",\"articleYear\":\"2021\",\"journal\":\"Human
        Brain Mapping\",\"abstractText\":\" \\nThe main objective of this longitudinal
        study was to investigate the neural predictors of reading acquisition. For
        this purpose, we followed a sample of 54 children from the end of kindergarten
        to the end of second grade. Preliterate children were tested for visual symbol
        (checkerboards, houses, faces, written words) and auditory language processing
        (spoken words) using a passive functional magnetic resonance imaging paradigm.
        To examine brain\u2013behavior relationships, we also tested cognitive\u2013linguistic
        prereading skills at kindergarten age and reading performance of 48 of the
        same children 2\u2009years later. Face\u2010selective response in the bilateral
        fusiform gyrus was positively associated with rapid automatized naming (RAN).
        Response to both spoken and written words at preliterate age was negatively
        associated with RAN in the dorsal temporo\u2010parietal language system. Longitudinally,
        neural response to faces in the ventral stream predicted future reading fluency.
        Here, stronger neural activity in inferior and middle temporal gyri at kindergarten
        age was associated with higher reading performance. Our results suggest that
        interindividual differences in the neural system of language and reading affect
        literacy acquisition and thus might serve as a marker for successful reading
        acquisition in preliterate children. \\n  \\nLongitudinal study examining
        reading acquisition from preliterate kindergarten age to the end of the second
        year of primary school. We used a passive fMRI paradigm to study the brain\u2013behavior
        relationships of vision, language and reading.   \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/33942958\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"Z3sFosZftv7q\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"9bc26950-0302-4207-9e8e-5c376c2390b8\",\"title\":\"Classification
        of fMRI patterns--a study of the language network segregation in pediatric
        localization related epilepsy.\",\"authors\":\"Jin Wang; Xiaozhen You; Wensong
        Wu; Magno R. Guillen; Mercedes Cabrerizo; Joseph Sullivan; Elizabeth Donner;
        Bruce Bjornson; William D. Gaillard; Malek Adjouadi\",\"keywords\":\"\",\"pmcid\":\"PMC3748221\",\"pmid\":\"23450847\",\"doi\":\"10.1002/hbm.22265\",\"articleYear\":\"2014\",\"journal\":\"Human
        Brain Mapping\",\"abstractText\":\"\\nThis article describes a pattern classification
        algorithm for pediatric epilepsy using fMRI language-related activation maps.
        122 fMRI datasets from a control group (64) and localization related epilepsy
        patients (58) provided by five children's hospitals were used. Each subject
        performed an auditory description decision task. Using the artificial data
        as training data, incremental Principal Component Analysis was used in order
        to generate the feature space while overcoming memory requirements of large
        datasets. The nearest-neighbor classifier (NNC) and the distance-based fuzzy
        classifier (DFC) were used to perform group separation into left dominant,
        right dominant, bilateral, and others. The results show no effect of age,
        age at seizure onset, seizure duration, or seizure etiology on group separation.
        Two sets of parameters were significant for group separation, the patient
        vs. control populations and handedness. Of the 122 real datasets, 90 subjects
        gave the same classification results across all the methods (three raters,
        LI, bootstrap LI, NNC, and DFC). For the remaining datasets, 18 cases for
        the IPCA-NNC and 21 cases for the IPCA-DFC agreed with the majority of the
        five classification results (three visual ratings and two LI results). Kappa
        values vary from 0.59 to 0.73 for NNC and 0.61 to 0.75 for DFC, which indicate
        good agreement between NNC or DFC with traditional methods. The proposed method
        as designed can serve as an alternative method to corroborate existing LI
        and visual rating classification methods and to resolve some of the cases
        near the boundaries in between categories.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/23450847\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"x3NZiz5cpjFk\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"446e0916-d97f-428a-a1b2-963879582e8c\",\"title\":\"Sub-Patterns
        of Language Network Reorganization in Pediatric Localization Related Epilepsy:
        A Multisite Study\",\"authors\":\"Xiaozhen You; Malek Adjouadi; Magno R. Guillen;
        Melvin Ayala; Armando Barreto; Naphtali Rishe; Joseph Sullivan; Dennis Dlugos;
        John VanMeter; Drew Morris; Elizabeth Donner; Bruce Bjornson; Mary Lou Smith;
        Byron Bernal; Madison Berl; William D. Gaillard\",\"keywords\":\"\",\"pmcid\":\"PMC3640868\",\"pmid\":\"21484949\",\"doi\":\"10.1002/hbm.21066\",\"articleYear\":\"2011\",\"journal\":\"Human
        Brain Mapping\",\"abstractText\":\"To study the neural networks reorganization
        in pediatric epilepsy, a consortium of imaging centers was established to
        collect functional imaging data. Common paradigms and similar acquisition
        parameters were used. We studied 122 children (64 control and 58 LRE patients)
        across five sites using EPI BOLD fMRI and an auditory description decision
        task. After normalization to the MNI atlas, activation maps generated by FSL
        were separated into three sub-groups using a distance method in the principal
        component analysis (PCA)-based decisional space. Three activation patterns
        were identified: (1) the typical distributed network expected for task in
        left inferior frontal gyrus (Broca's) and along left superior temporal gyrus
        (Wernicke's) (60 controls, 35 patients); (2) a variant left dominant pattern
        with greater activation in IFG, mesial left frontal lobe, and right cerebellum
        (three controls, 15 patients); and (3) activation in the right counterparts
        of the first pattern in Broca's area (one control, eight patients). Patients
        were over represented in Groups 2 and 3 (P < 0.0004). There were no scanner
        (P = 0.4) or site effects (P = 0.6). Our data-driven method for fMRI activation
        pattern separation is independent of a priori notions and bias inherent in
        region of interest and visual analyses. In addition to the anticipated atypical
        right dominant activation pattern, a sub-pattern was identified that involved
        intensity and extent differences of activation within the distributed left
        hemisphere language processing network. These findings suggest a different,
        perhaps less efficient, cognitive strategy for LRE group to perform the task.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/21484949\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"3W6pygaj9JV4\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"31369780-5b72-4fae-a66d-ed3b903f8e94\",\"title\":\"Relationship
        between receptive vocabulary and the neural substrates for story processing
        in preschoolers.\",\"authors\":\"M. Claire Sroka; Jennifer Vannest; Thomas
        C. Maloney; Tzipi Horowitz-Kraus; Anna W. Byars; Scott K. Holland\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"25533780\",\"doi\":\"10.1007/s11682-014-9342-8\",\"articleYear\":\"2015\",\"journal\":\"Brain
        Imaging and Behavior\",\"abstractText\":\"\\nA left-lateralized fronto-temporo-parietal
        language network has been well-characterized in adults; however, the neural
        basis of this fundamental network has hardly been explored in the preschool
        years, despite this being a time for rapid language development and vocabulary
        growth. We examined the functional imaging correlates associated with vocabulary
        ability and narrative comprehension in 30 preschool children ages 3 to 5.
        Bilateral auditory cortex and superior temporal activation as well as left
        angular and supramarginal gyrus activation were observed during a passive
        listening-to-stories task. Boys showed greater activation than girls in the
        right anterior cingulate and right superior frontal gyrus (SFG). Finally,
        children with higher vocabulary scores showed increased grey matter left-lateralization
        and greater activation in bilateral thalamus, hippocampus, and left angular
        gyrus. This study is novel in its approach to relate left-hemisphere language
        regions and vocabulary scores in preschool-aged children using fMRI.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/25533780\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"poRj3vsAVp3z\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"d8d47e47-d205-48f9-a27f-d74b131643a5\",\"title\":\"How
        restful is it with all that noise? Comparison of Interleaved silent steady
        state (ISSS) and conventional imaging in resting-state fMRI.\",\"authors\":\"J.
        Andoh; M. Ferreira; I.R. Leppert; R. Matsushita; B. Pike; R.J. Zatorre\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"27902936\",\"doi\":\"10.1016/j.neuroimage.2016.11.065\",\"articleYear\":\"2016\",\"journal\":\"NeuroImage\",\"abstractText\":\"Resting-state
        fMRI studies have become very important in cognitive neuroscience because
        they are able to identify BOLD fluctuations in brain circuits involved in
        motor, cognitive, or perceptual processes without the use of an explicit task.
        Such approaches have been fruitful when applied to various disordered populations,
        or to children or the elderly. However, insufficient attention has been paid
        to the consequences of the loud acoustic scanner noise associated with conventional
        fMRI acquisition, which could be an important confounding factor affecting
        auditory and/or cognitive networks in resting-state fMRI. Several approaches
        have been developed to mitigate the effects of acoustic noise on fMRI signals,
        including sparse sampling protocols and interleaved silent steady state (ISSS)
        acquisition methods, the latter being used only for task-based fMRI. Here,
        we developed an ISSS protocol for resting-state fMRI (rs-ISSS) consisting
        of rapid acquisition of a set of echo planar imaging volumes following each
        silent period, during which the steady state longitudinal magnetization was
        maintained with a train of relatively silent slice-selective excitation pulses.
        We evaluated the test-retest reliability of intensity and spatial extent of
        connectivity networks of fMRI BOLD signal across three different days for
        rs-ISSS and compared it with a standard resting-state fMRI (rs-STD). We also
        compared the strength and distribution of connectivity networks between rs-ISSS
        and rs-STD. We found that both rs-ISSS and rs-STD showed high reproducibility
        of fMRI signal across days. In addition, rs-ISSS showed a more robust pattern
        of functional connectivity within the somatosensory and motor networks, as
        well as an auditory network compared with rs-STD. An increased connectivity
        between the default mode network and the language network and with the anterior
        cingulate cortex (ACC) network was also found for rs-ISSS compared with rs-STD.
        Finally, region of interest analysis showed higher interhemispheric connectivity
        in Heschl's gyri in rs-ISSS compared with rs-STD, with lower variability across
        days. The present findings suggest that rs-ISSS may be advantageous for detecting
        network connectivity in a less noisy environment, and that resting-state studies
        carried out with standard scanning protocols should consider the potential
        effects of loud noise on the measured networks.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/27902936\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"4jGeUw8imSg4\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"da298f18-dc0c-460f-86cd-4e5905886a32\",\"title\":\"Neural
        Changes in Children With Residual Speech Sound Disorder After Ultrasound Biofeedback
        Speech Therapy.\",\"authors\":\"Caroline Spencer, Jennifer Vannest, Jonathan
        L Preston, Edwin Maas, Erin Redle Sizemore, Tara McAllister, D H Whalen, Thomas
        Maloney, Suzanne Boyce\",\"keywords\":\"\",\"pmcid\":\"PMC10558148\",\"pmid\":\"37524116\",\"doi\":\"10.1044/2023_JSLHR-22-00430\",\"articleYear\":\"2023\",\"journal\":\"Journal
        of speech, language, and hearing research : JSLHR\",\"abstractText\":\"PURPOSE\\nChildren
        with residual speech sound disorders (RSSD) have shown differences in neural
        function for speech production, as compared to their typical peers; however,
        information about how these differences may change over time and relative
        to speech therapy is needed. To address this gap, we used functional magnetic
        resonance imaging (fMRI) to examine functional activation and connectivity
        on adaptations of the syllable repetition task (SRT-Early Sounds and SRT-Late
        Sounds) in children with RSSD before and after a speech therapy program.\\nMETHOD\\nSixteen
        children with RSSD completed an fMRI experiment before (Time 1) and after
        (Time 2) a speech therapy program with ultrasound visual feedback for /\u0279/
        misarticulation. Progress in therapy was measured via perceptual ratings of
        productions of untreated /\u0279/ word probes. To control for practice effects
        and developmental change in patterns of activation and connectivity, 17 children
        with typical speech development (TD) completed the fMRI at Time 1 and Time
        2. Functional activation was analyzed using a region-of-interest approach
        and functional connectivity was analyzed using a seed-to-voxel approach.\\nRESULTS\\nChildren
        with RSSD showed a range of responses to therapy. After correcting for multiple
        comparisons, we did not observe any statistically significant cross-sectional
        differences or longitudinal changes in functional activation. A negative relationship
        between therapy effect size and functional activation in the left visual association
        cortex was on the SRT-Late Sounds after therapy, but it did not survive correction
        for multiple comparisons. Significant longitudinal changes in functional connectivity
        were observed for the RSSD group on SRT-Early Sounds and SRT-Late Sounds,
        as well as for the TD group on the SRT-Early Sounds. RSSD and TD groups showed
        connectivity differences near the left insula on the SRT-Late Sounds at Time
        2.\\nCONCLUSION\\nRSSD and treatment with ultrasound visual feedback may thus
        be associated with neural differences in speech motor and visual association
        processes recruited for speech production.\\n\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/37524116\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"oBnexKuGAwNt\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"b7550d9c-c0b0-4b94-ab3c-1e4cb908f5cd\",\"title\":\"The
        Neural Basis of Speech Parsing in Children and Adults\",\"authors\":\"Kristin
        McNealy; John C. Mazziotta; Mirella Dapretto\",\"keywords\":\"\",\"pmcid\":\"PMC3229831\",\"pmid\":\"20136936\",\"doi\":\"10.1111/j.1467-7687.2009.00895.x\",\"articleYear\":\"2010\",\"journal\":\"Developmental
        Science\",\"abstractText\":\"Word segmentation, detecting word boundaries
        in continuous speech, is a fundamental aspect of language learning that can
        occur solely by the computation of statistical and speech cues. Fifty-four
        children underwent functional magnetic resonance imaging (fMRI) while listening
        to three streams of concatenated syllables, which contained either high statistical
        regularities, high statistical regularities and speech cues, or no easily-detectable
        cues. Significant signal increases over time in temporal cortices suggest
        that children utilized the cues to implicitly segment the speech streams.
        This was confirmed by the findings of a second fMRI run where children displayed
        reliably greater activity in left inferior frontal gyrus when listening to
        \u2018words\u2019 that occurred more frequently in the streams of speech they
        just heard. Finally, comparisons between activity observed in these children
        vs. previously-studied adults indicate significant developmental changes in
        the neural substrate of speech parsing.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/20136936\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"2DJT3V9MstN6\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"96167f6c-d462-41be-bf18-ca874270e100\",\"title\":\"Cortical
        connectivity in speech and sensory networks associated with childrens\u2019
        listening and attention disorders\",\"authors\":\"Hannah J. Stewart; Erin
        Cash; Lisa L. Hunter; Jonathan E. Peelle; Leanne Tamm; Stephen P. Becker;
        Jennifer Vannest; David R. Moore\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"\",\"doi\":\"\",\"articleYear\":\"2025\",\"journal\":\"medRxiv\",\"abstractText\":\"Children
        with neurodevelopmental disorders have a high rate of listening difficulties,
        but despite decades of research, the relation between these conditions remains
        unclear. Using resting state fMRI to image the child's brain noninvasively,
        we investigate the distribution of speech, non-speech 'sound', and visual
        processing networks in the forebrain, and examine a cross-section of age differences
        within these networks in children (6-14 years old) with normal hearing, including
        typically developing children, children with listening difficulties (LiD),
        and children with attention-deficit/hyperactivity disorder (ADHD). Relative
        to typically developing children, a reduction in functional connectivity of
        the speech network was found in children with LiD. No reduction was found
        in connections processing non-speech sounds or visual stimuli in the children
        with LiD, suggesting a specific deficit in speech processing. A second group
        of children diagnosed with ADHD showed reduced connectivity in both speech
        and sound networks, but not in the visual network, suggesting a common underlying
        cause for auditory and speech difficulties in the auditory system of children
        with ADHD. We conclude that listening difficulties in children are mediated
        by speech-specific neural mechanisms. The findings strengthen research calls
        for obligatory speech intelligibility testing under challenging listening
        conditions (noise, reverberation) as a component of clinical pediatric audiological
        assessment.\",\"articleLink\":\"\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"XBcHUWEjfBVH\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"04024534-cbd2-4b8c-9d28-e76dccb87287\",\"title\":\"Functional
        MRI evidence for fine motor praxis dysfunction in children with persistent
        speech disorders\",\"authors\":\"Erin Redle; Jennifer Vannest; Thomas Maloney;
        Rebecca K. Tsevat; Sarah Eikenberry; Barbara Lewis; Lawrence D. Shriberg;
        Jean Tkach; Scott K. Holland\",\"keywords\":\"\",\"pmcid\":\"PMC4340817\",\"pmid\":\"25481413\",\"doi\":\"10.1016/j.brainres.2014.11.047\",\"articleYear\":\"2015\",\"journal\":\"Brain
        Research\",\"abstractText\":\"Children with persistent speech disorders (PSD)
        often present with overt or subtle motor deficits; the possibility that speech
        disorders and motor deficits could arise from a shared neurological base is
        currently unknown. Functional MRI (fMRI) was used to examine the brain networks
        supporting fine motor praxis in children with PSD and without clinically identified
        fine motor deficits. METHODS: This case-control study included 12 children
        with PSD (mean age 7.42 years, four female) and 12 controls (mean age 7.44
        years, four female). Children completed behavioral evaluations using standardized
        motor assessments and parent reported functional measures. During fMRI scanning,
        participants completed a cued finger tapping task contrasted passive listening.
        A general linear model approach identified brain regions associated with finger
        tapping in each group and regions that differed between groups. The relationship
        between regional fMRI activation and fine motor skill was assessed using a
        regression analysis. RESULTS: Children with PSD had significantly poorer results
        for rapid speech production and fine motor praxis skills, but did not differ
        on classroom functional skills. Functional MRI results showed that children
        with PSD had significantly more activation in the cerebellum during finger
        tapping. Positive correlations between performance on a fine motor praxis
        test and activation multiple cortical regions were noted for children with
        PSD but not for controls. CONCLUSIONS: Over-activation in the cerebellum during
        a motor task may reflect a subtle abnormality in the non-speech motor neural
        circuitry in children with PSD.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/25481413\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"5amuJFX3TXtc\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"64b07a7f-a806-47c4-ba9b-a4345202d8ec\",\"title\":\"Investigating
        the Neural Correlates of Voice versus Speech-Sound Directed Information in
        Pre-School Children\",\"authors\":\"Nora Maria Raschle; Sara Ashley Smith;
        Jennifer Zuk; Maria Regina Dauvermann; Michael Joseph Figuccio; Nadine Gaab\",\"keywords\":\"\",\"pmcid\":\"PMC4274095\",\"pmid\":\"25532132\",\"doi\":\"10.1371/journal.pone.0115549\",\"articleYear\":\"2014\",\"journal\":\"PLoS
        ONE\",\"abstractText\":\"Studies in sleeping newborns and infants propose
        that the superior temporal sulcus is involved in speech processing soon after
        birth. Speech processing also implicitly requires the analysis of the human
        voice, which conveys both linguistic and extra-linguistic information. However,
        due to technical and practical challenges when neuroimaging young children,
        evidence of neural correlates of speech and/or voice processing in toddlers
        and young children remains scarce. In the current study, we used functional
        magnetic resonance imaging (fMRI) in 20 typically developing preschool children
        (average age  = 5.8 y; range 5.2-6.8 y) to investigate brain activation during
        judgments about vocal identity versus the initial speech sound of spoken object
        words. FMRI results reveal common brain regions responsible for voice-specific
        and speech-sound specific processing of spoken object words including bilateral
        primary and secondary language areas of the brain. Contrasting voice-specific
        with speech-sound specific processing predominantly activates the anterior
        part of the right-hemispheric superior temporal sulcus. Furthermore, the right
        STS is functionally correlated with left-hemispheric temporal and right-hemispheric
        prefrontal regions. This finding underlines the importance of the right superior
        temporal sulcus as a temporal voice area and indicates that this brain region
        is specialized, and functions similarly to adults by the age of five. We thus
        extend previous knowledge of voice-specific regions and their functional connections
        to the young brain which may further our understanding of the neuronal mechanism
        of speech-specific processing in children with developmental disorders, such
        as autism or specific language impairments.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/25532132\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"rz9YMMb7dyRi\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"e5e21408-3325-404a-922d-edba408780c0\",\"title\":\"Functional
        connectivity differences in speech production networks in Chinese children
        with Rolandic epilepsy.\",\"authors\":\"Yun Wu; Fang Fang; Ke Li; Zhen Jin;
        Xiaotun Ren; Junlan Lv; Changhong Ding; Chunhong Chen; Tongli Han; Weihua
        Zhang; Nizhuan Wang; Zhenglong Lin\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"35835716\",\"doi\":\"10.1016/j.yebeh.2022.108819\",\"articleYear\":\"2022\",\"journal\":\"Epilepsy
        & Behavior\",\"abstractText\":\"\\nPrevious studies have demonstrated that
        language impairments are frequently observed in patients with benign epilepsy
        with centrotemporal spikes (BECTS). However, how BECTS affects language processing
        in the Chinese population remains unclear. With the use of functional magnetic
        resonance imaging (fMRI) in an overt picture-naming task, the present study
        examined functional connectivity in 27 children with BECTS and 26 healthy
        controls. The results indicated that children with BECTS showed altered functional
        connectivity associated with speech production between the left precuneus
        and the right cerebellum, between the right precuneus and the bilateral thalamus
        and the left superior temporal gyrus, between the right cuneus and the right
        postcentral gyrus and the right inferior parietal lobule, and between the
        right cerebellum and right middle frontal gyrus. Collectively, the findings
        in this study demonstrate the abnormal functional connectivity basis of speech
        production in Chinese children with BECTS, providing clues to understanding
        the brain mechanisms of language-related network in patients with BECTS.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/35835716\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"t3sjzPPSP7Lp\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"4f2ce4ab-9135-46a9-bdf0-42aa6bde6eaf\",\"title\":\"The
        neural basis of nonword repetition in children with developmental speech or
        language disorder: An fMRI study.\",\"authors\":\"Lauren Pigdon, Catherine
        Willmott, Sheena Reilly, Gina Conti-Ramsden, Frederique Liegeois, Alan Connelly,
        Angela T Morgan\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"31917203\",\"doi\":\"10.1016/j.neuropsychologia.2019.107312\",\"articleYear\":\"2020\",\"journal\":\"Neuropsychologia\",\"abstractText\":\"Developmental
        language disorder (DLD) and developmental speech disorder (DSD) are highly
        prevalent childhood conditions. An impaired ability to repeat nonsense words
        (\\\"nonword repetition\\\"), is claimed to be a robust behavioural marker
        for these conditions. Yet how brain function is altered during this task remains
        poorly understood. Previous research suggests that DLD or DSD may be associated
        with reduced brain activation in the inferior frontal and posterior temporal
        regions when compared to controls. However, this research is limited by within
        and between group variability in age, speech/language phenotype, and comorbidities.
        Here, we used functional MRI to examine brain activation during nonword repetition.
        As anticipated, behavioural findings confirmed that the DLD and DSD groups
        had poorer nonword repetition performance compared to typical controls. In
        contrast, fMRI revealed no statistically significant differences in brain
        activation, despite the groups appearing to engage slightly different regions
        when compared at identical thresholds. Therefore, whilst nonword repetition
        is a sensitive clinical marker for DLD and DSD, the findings from this study
        suggest that this task is not a sensitive brain MRI marker for children with
        these disorders, unlike for individuals with single gene mutations like FOXP2
        mutations.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/31917203\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"6ygkQPhVHPMX\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"1ab57b0a-c1c9-440e-bcfa-237e12b87161\",\"title\":\"Topological
        properties of the resting-state functional network in nonsyndromic cleft lip
        and palate children after speech rehabilitation.\",\"authors\":\"Bo Rao; Hua
        Cheng; Yang Fan; Wenjing Zhang; Renji Chen; Yun Peng\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"32706192\",\"doi\":\"10.31083/j.jin.2020.02.19\",\"articleYear\":\"2020\",\"journal\":\"Journal
        of Integrative Neuroscience\",\"abstractText\":\"Speech therapy has been widely
        used as an essential therapy for compensatory articulation errors in nonsyndromic
        cleft lip and palate patients. We sought to identify potential biomarkers
        of nonsyndromic cleft lip and palate children after speech rehabilitation
        based on resting-state fMRI and graph theory techniques. We scanned 28 nonsyndromic
        cleft lip and palate and 28 typically developing children for resting-state
        fMRI on a 3T MRI scanner. Functional networks were constructed, and their
        topological properties were obtained for assessing between-group differences
        (two-sample t-tests). Also, language clear degree scale scores were obtained
        for correlation analysis with the topological features in nonsyndromic cleft
        lip and palate patients. Significant between-group differences of local properties
        were detected in brain regions involved in higher-order language and social
        cognition. There were no significant correlations between topological feature
        differences and language clear degree scale scores in nonsyndromic cleft lip
        and palate patients. Graph theory provided valuable insight into the neurobiological
        mechanisms of speech rehabilitation in nonsyndromic cleft lip and palate patients.
        The global network features, small-world index, nodal clustering coefficient,
        and nodal shortest path length may represent potential imaging biomarkers
        for the estimation of effective speech rehabilitation.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/32706192\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"RMf6AJpFnBUD\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"1f62a0c9-91e3-4bcc-ac24-a72021821082\",\"title\":\"Brain
        sensitivity to print emerges when children learn letter-speech sound correspondences.\",\"authors\":\"Silvia
        Brem; Silvia Bach; Karin Kucian; Janne V. Kujala; Tomi K. Guttorm; Ernst Martin;
        Heikki Lyytinen; Daniel Brandeis; Ulla Richardson\",\"keywords\":\"\",\"pmcid\":\"PMC2867899\",\"pmid\":\"20395549\",\"doi\":\"10.1073/pnas.0904402107\",\"articleYear\":\"2010\",\"journal\":\"Proceedings
        of the National Academy of Sciences\",\"abstractText\":\"The acquisition of
        reading skills is a major landmark process in a human's cognitive development.
        On the neural level, a new functional network develops during this time, as
        children typically learn to associate the well-known sounds of their spoken
        language with unfamiliar characters in alphabetic languages and finally access
        the meaning of written words, allowing for later reading. A critical component
        of the mature reading network located in the left occipito-temporal cortex,
        termed the \\\"visual word-form system\\\" (VWFS), exhibits print-sensitive
        activation in readers. When and how the sensitivity of the VWFS to print comes
        about remains an open question. In this study, we demonstrate the initiation
        of occipito-temporal cortex sensitivity to print using functional MRI (fMRI)
        (n = 16) and event-related potentials (ERP) (n = 32) in a controlled, longitudinal
        training study. Print sensitivity of fast (<250 ms) processes in posterior
        occipito-temporal brain regions accompanied basic associative learning of
        letter-speech sound correspondences in young (mean age 6.4 +/- 0.08 y) nonreading
        kindergarten children, as shown by concordant ERP and fMRI results. The occipito-temporal
        print sensitivity thus is established during the earliest phase of reading
        acquisition in childhood, suggesting that a crucial part of the later reading
        network first adopts a role in mapping print and sound.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/20395549\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7BukDMdpTaWD\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"cb18234b-05cc-4637-8b26-d229d507207b\",\"title\":\"Narrative
        speech production: an fMRI study using continuous arterial spin labeling.\",\"authors\":\"Vanessa
        Troiani; Maria A. Fern\xE1ndez-Seara; Ze Wang; John A. Detre; Sherry Ash;
        Murray Grossman\",\"keywords\":\"\",\"pmcid\":\"PMC2291537\",\"pmid\":\"18201906\",\"doi\":\"10.1016/j.neuroimage.2007.12.002\",\"articleYear\":\"2008\",\"journal\":\"NeuroImage\",\"abstractText\":\"Functional
        magnetic resonance imaging (fMRI) with continuous arterial spin labeling (CASL)
        was employed to monitor brain activation during narrative production of a
        semi-structured speech sample in healthy young adults. Subjects were asked
        to describe a wordless children's picture story. Significant activations were
        found in bilateral prefrontal and left temporal-parietal regions during narrative
        production relative to description of a single picture and relative to viewing
        the wordless picture story while producing a nonsense word. We conclude that
        inferior frontal cortex serves as a top-down organizational resource for narrative
        production and demonstrate the feasibility of collecting extended speech samples
        using CASL perfusion fMRI.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/18201906\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"dfrTqVU8szSs\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"e4fbe0da-db31-4937-ac83-64ca2cf8ed1e\",\"title\":\"Prosodic
        Processing by Children: an fMRI Study\",\"authors\":\"Elena Plante; Scott
        K. Holland; Vince J. Schmithorst\",\"keywords\":\"\",\"pmcid\":\"PMC1463022\",\"pmid\":\"16460792\",\"doi\":\"10.1016/j.bandl.2005.12.004\",\"articleYear\":\"2006\",\"journal\":\"Brain
        and Language\",\"abstractText\":\"Prosodic information in the speech signal
        carries information about linguistic structure as well as emotional content.
        Although children are known to use prosodic information from infancy onward
        to assist linguistic decoding, the brain correlates of this skill in childhood
        have not yet been the subject of study. Brain activation associated with processing
        of linguistic prosody was examined in a study of 284 normally developing children
        between the ages of 5 and 18 years. Children listened to low-pass filtered
        sentences and were asked to detect those that matched a target sentence. fMRI
        scanning revealed multiple regions of activation that predicted behavioral
        performance, independent of age-related changes in activation. Likewise, age-related
        changes in task activation were found that were independent of differences
        in task accuracy. The overall pattern of activation is interpreted in light
        of task demands and factors that may underlie age-related changes in task
        performance.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/16460792\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"3XKDPKj7QRex\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"65b74b5d-4a45-4f9a-85c4-6fcebc003e96\",\"title\":\"Left
        ear advantage in speech-related dichotic listening is not specific to auditory
        processing disorder in children: A machine-learning fMRI and DTI study\",\"authors\":\"Vincent
        J. Schmithorst; Rola Farah; Robert W. Keith\",\"keywords\":\"\",\"pmcid\":\"PMC3791276\",\"pmid\":\"24179844\",\"doi\":\"10.1016/j.nicl.2013.06.016\",\"articleYear\":\"2013\",\"journal\":\"NeuroImage
        Clinical\",\"abstractText\":\"Dichotic listening (DL) tests are among the
        most frequently included in batteries for the diagnosis of auditory processing
        disorders (APD) in children. A finding of atypical left ear advantage (LEA)
        for speech-related stimuli is often taken by clinical audiologists as an indicator
        for APD. However, the precise etiology of ear advantage in DL tests has been
        a source of debate for decades. It is uncertain whether a finding of LEA is
        truly indicative of a sensory processing deficit such as APD, or whether attentional
        or other supramodal factors may also influence ear advantage. Multivariate
        machine learning was used on diffusion tensor imaging (DTI) and functional
        MRI (fMRI) data from a cohort of children ages 7-14 referred for APD testing
        with LEA, and typical controls with right-ear advantage (REA). LEA was predicted
        by: increased axial diffusivity in the left internal capsule (sublenticular
        region), and decreased functional activation in the left frontal eye fields
        (BA 8) during words presented diotically as compared to words presented dichotically,
        compared to children with right-ear advantage (REA). These results indicate
        that both sensory and attentional deficits may be predictive of LEA, and thus
        a finding of LEA, while possibly due to sensory factors, is not a specific
        indicator of APD as it may stem from a supramodal etiology.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/24179844\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7tvgJUmfA9pK\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"db76809a-e059-46b8-b318-1fe3635a58c8\",\"title\":\"Young
        children's neural processing of their mother's voice: An fMRI study.\",\"authors\":\"Pan
        Liu; Pamela M. Cole; Rick O. Gilmore; Koraly E. P\xE9rez-Edgar; Michelle C.
        Vigeant; Peter Moriarty; K. Suzanne Scherf\",\"keywords\":\"\",\"pmcid\":\"PMC6334756\",\"pmid\":\"30528586\",\"doi\":\"10.1016/j.neuropsychologia.2018.12.003\",\"articleYear\":\"2019\",\"journal\":\"Neuropsychologia\",\"abstractText\":\"\\nIn
        addition to semantic content, human speech carries paralinguistic information
        that conveys important social cues such as a speaker's identity. For young
        children, their own mothers' voice is one of the most salient vocal inputs
        in their daily environment. Indeed, qualities of mothers' voices are shown
        to contribute to children's social development. Our knowledge of how the mother's
        voice is processed at the neural level, however, is limited. This study investigated
        whether the voice of a mother modulates activation in the network of regions
        activated by the human voice in young children differently than the voice
        of an unfamiliar mother. We collected fMRI data from 32 typically developing
        7- and 8-year-olds as they listened to natural speech produced by their mother
        and another child's mother. We used emotionally-varied natural speech stimuli
        to approximate the range of children's day-to-day experience. We individually-defined
        functional ROIs in children's voice-sensitive neural network and then independently
        investigated the extent to which activation in these regions is modulated
        by speaker identity. The bilateral posterior auditory cortex, superior temporal
        gyrus (STG), and inferior frontal gyrus (IFG) exhibit enhanced activation
        in response to the voice of one's own mother versus that of an unfamiliar
        mother. The findings indicate that children process the voice of their own
        mother uniquely, and pave the way for future studies of how social information
        processing contributes to the trajectory of child social development.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/30528586\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"EpSWta6Ja2jj\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"a4d43cc9-4f69-40ec-8162-beac2eb6c1b8\",\"title\":\"Audiovisual
        integration in reading among school-aged children: Evidence from combined
        fMRI and EEG\",\"authors\":\"Jinglei Ren; Haiwa Wang; Nicole Landi; Marc F.
        Joanisse; Vincent Gracco; Dan Kleinman; Kelly Mahaffy; Aahana Bajracharya;
        Roeland Hancock; Kenneth Pugh; Fumiko Hoeft\",\"keywords\":\"\",\"pmcid\":\"PMC13147406\",\"pmid\":\"42068687\",\"doi\":\"10.1016/j.dcn.2026.101729\",\"articleYear\":\"2026\",\"journal\":\"Developmental
        Cognitive Neuroscience\",\"abstractText\":\"Reading fluency depends on rapid
        integration of print and speech, yet the spatiotemporal mechanisms supporting
        this integration in school aged children remain poorly understood. This study
        combined fMRI and EEG to examine AV integration (i.e., additive enhancement
        and congruency effects) during single- and multi-letter detection tasks in
        7\u201310-year-old children (N\u202F=\u202F56). Multiple neural indices were
        examined to capture complementary spatial and temporal aspects of AV integration.
        fMRI results revealed additive enhancement in bilateral STG and Heschl\u2019s
        gyrus, congruency effects in the left IFG and left STG and increased functional
        connectivity between left IFG and STG during incongruent trials. EEG showed
        convergent temporal dynamics, with AV-related enhancement in P200 amplitude
        (190\u2013230\u202Fms) and theta-band (4\u20137\u202FHz) power over left frontotemporal
        electrodes. Individual differences analyses showed that additive enhancement
        in left STG was associated with higher spelling (\u03B2 = 0.28, p\u202F=\u202F0.034).
        Congruency effects in left STG (\u03B2 = 0.31, p\u202F=\u202F0.018) and left
        IFG (\u03B2 = 0.38, p\u202F=\u202F0.004), as well as IFG\u2013STG connectivity
        (\u03B2 = 0.34, p\u202F=\u202F0.011), were linked to higher reading efficiency.
        Larger P200 amplitude (\u03B2 = 0.32, p\u202F=\u202F0.015) and greater theta
        power (\u03B2 = 0.31, p\u202F=\u202F0.021; \u03B2 = 0.28, p\u202F=\u202F0.034)
        were associated with higher spelling and fluency, respectively. Findings delineate
        complementary sensory-convergence and conflict-monitoring pathways for print\u2013speech
        integration and show that integrating spatial and temporal neural indices
        improves explanation of reading skills in school-aged children.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/42068687\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"mmJmJxWKrePz\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"f40c3225-1228-4d8a-ae60-070ed6d93675\",\"title\":\"Auditory
        comprehension of language in young children: neural networks identified with
        fMRI.\",\"authors\":\"Z. Ahmad; L. M. Balsamo; B. C. Sachs; B. Xu; W. D. Gaillard\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"12771248\",\"doi\":\"10.1212/01.wnl.0000059865.32155.86\",\"articleYear\":\"2003\",\"journal\":\"Neurology\",\"abstractText\":\"OBJECTIVE\\nThe
        organization of neuronal systems that process language in young children is
        poorly understood. The authors used fMRI to identify brain regions underlying
        auditory comprehension in healthy young children.\\nMETHODS\\nFifteen right-handed
        children (mean age 6.8 years) underwent fMRI at 1.5-T using blood oxygen level
        dependent echoplanar imaging. They listened to stories with a reverse speech
        control condition. Group data were analyzed with statistical parametric mapping.
        Individual subject data were analyzed with a region of interest approach based
        on t-maps. An asymmetry index (AI = [(L-R)/(L+R)]) was calculated for each
        region.\\nRESULTS\\nGroup analysis showed significant activation in the left
        middle temporal gyrus (Brodmann area [BA] 21) and left superior temporal gyrus
        (BA 22) along the superior temporal sulcus extending back to the angular gyrus
        (BA 39). Individual maps showed lateralized activation in temporal regions
        (AI > 0.49 +/- 0.39). There was minimal activation in the frontal lobe. There
        were no significant correlations between age and regional AI.\\nCONCLUSION\\nNetworks
        for auditory language processing are regionally localized and lateralized
        by age 5. These data may provide a means to interpret language fMRI studies
        performed in preparation for brain surgery, and may be employed to investigate
        the effect of chronic disease states, such as epilepsy, on language organization
        during critical periods for plasticity.\\n\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/12771248\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"xPrv3XRL2cd5\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"c2f89088-a0c5-4013-86bc-c8807dc260cc\",\"title\":\"Preliminary
        study on the neural mechanisms of four tone recognition in deaf children using
        fMRI\",\"authors\":\"Qiang Li; Yuan Meng; Qiuli Li; Heng Zhao; Shiyu Li\",\"keywords\":\"\",\"pmcid\":\"PMC12301459\",\"pmid\":\"40717154\",\"doi\":\"10.1038/s41598-025-13308-5\",\"articleYear\":\"2025\",\"journal\":\"Scientific
        Reports\",\"abstractText\":\"Vocal intonation, a fundamental element of speech,
        is pivotal for comprehending and communicating effectively. Nevertheless,
        children suffering from hearing impairment encounter difficulties in recognizing
        vocal intonation patterns, primarily stemming from their auditory deficits.
        In 2020, a study conducted at Tianjin Medical University General Hospital
        in Tianjin, China, recruited five deaf children and two children with normal
        hearing (male; mean age\u2009=\u200910.21\u2009\xB1\u20090.4 years) to compare
        the differences between deaf and normal children in four Chinese tone recognition
        tasks. The results revealed that (1) Due to hearing loss, some of the auditory
        cortices responsible for processing vocal intonation in deaf children do not
        function optimally, (2) When decoding vocal intonation information, deaf children
        might utilize alternative neural pathways or networks, (3) Deaf children exhibit
        hemispheric specialization in their processing of vocal intonation cues.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/40717154\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"JKjCP84fXMPv\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"c34c16e5-4b16-443a-ae29-65b6b7901414\",\"title\":\"Mapping
        cortical responses to speech using high-density diffuse optical tomography\",\"authors\":\"Mahlega
        S. Hassanpour; Adam T. Eggebrecht; Joseph P. Culver; Jonathan E. Peelle\",\"keywords\":\"\",\"pmcid\":\"PMC4512921\",\"pmid\":\"26026816\",\"doi\":\"10.1016/j.neuroimage.2015.05.058\",\"articleYear\":\"2015\",\"journal\":\"NeuroImage\",\"abstractText\":\"The
        functional neuroanatomy of speech processing has been investigated using positron
        emission tomography (PET) and functional magnetic resonance imaging (fMRI)
        for more than 20years. However, these approaches have relatively poor temporal
        resolution and/or challenges of acoustic contamination due to the constraints
        of echoplanar fMRI. Furthermore, these methods are contraindicated because
        of safety concerns in longitudinal studies and research with children (PET)
        or in studies of patients with metal implants (fMRI). High-density diffuse
        optical tomography (HD-DOT) permits presenting speech in a quiet acoustic
        environment, has excellent temporal resolution relative to the hemodynamic
        response, and provides noninvasive and metal-compatible imaging. However,
        the performance of HD-DOT in imaging the brain regions involved in speech
        processing is not fully established. In the current study, we use an auditory
        sentence comprehension task to evaluate the ability of HD-DOT to map the cortical
        networks supporting speech processing. Using sentences with two levels of
        linguistic complexity, along with a control condition consisting of unintelligible
        noise-vocoded speech, we recovered a hierarchically organized speech network
        that matches the results of previous fMRI studies. Specifically, hearing intelligible
        speech resulted in increased activity in bilateral temporal cortex and left
        frontal cortex, with syntactically complex speech leading to additional activity
        in left posterior temporal cortex and left inferior frontal gyrus. These results
        demonstrate the feasibility of using HD-DOT to map spatially distributed brain
        networks supporting higher-order cognitive faculties such as spoken language.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/26026816\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7uRT83VYPKJX\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"21f87777-9eac-423e-b71f-e5fc0f66fc41\",\"title\":\"Age-related
        connectivity changes in fMRI data from children listening to stories.\",\"authors\":\"Prasanna
        R. Karunanayaka; Scott K. Holland; Vincent J. Schmithorst; Ana Solodkin; E.
        Elinor Chen; Jerzy P. Szaflarski; Elena Plante\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"17064940\",\"doi\":\"10.1016/j.neuroimage.2006.08.028\",\"articleYear\":\"2007\",\"journal\":\"NeuroImage\",\"abstractText\":\"The
        way humans comprehend narrative speech plays an important part in human development
        and experience. A group of 313 children with ages 5-18 were subjected to a
        large-scale functional magnetic resonance imaging (fMRI) study in order to
        investigate the neural correlates of auditory narrative comprehension. The
        results were analyzed to investigate the age-related brain activity changes
        involved in the narrative language comprehension circuitry. We found age-related
        differences in brain activity which may either reflect changes in local neuroplasticity
        (of the regions involved) in the developing brain or a more global transformation
        of brain activity related to neuroplasticity. To investigate this issue, Structural
        Equation Modeling (SEM) was applied to the results obtained from a group independent
        component analysis (Schmithorst, V.J., Holland, S.K., et al., 2005. Cognitive
        modules utilized for narrative comprehension in children: a functional magnetic
        resonance imaging study. NeuroImage) and the age-related differences were
        examined in terms of changes in path coefficients between brain regions. The
        group Independent Component Analysis (ICA) had identified five bilateral task-related
        components comprising the primary auditory cortex, the mid-superior temporal
        gyrus, the most posterior aspect of the superior temporal gyrus, the hippocampus,
        the angular gyrus and the medial aspect of the parietal lobule (precuneus/posterior
        cingulate). Furthermore, a left-lateralized network (sixth component) was
        also identified comprising the inferior frontal gyrus (including Broca's area),
        the inferior parietal lobule, and the medial temporal gyrus. The components
        (brain regions) for the SEM were identified based on the ICA maps and the
        results are discussed in light of recent neuroimaging studies corroborating
        the functional segregation of Broca's and Wernicke's areas and the important
        role played by the right hemisphere in narrative comprehension. The classical
        Wernicke-Geschwind (WG) model for speech processing is expanded to a two-route
        model involving a direct route between Broca's and Wernicke's area and an
        indirect route involving the parietal lobe.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/17064940\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"FgRw6ff5ttH7\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"3b2f16a5-8d21-43ce-9b71-c65d9befb1bd\",\"title\":\"Altered
        effective connectivity on rapid automatized naming deficits in Chinese children
        with developmental dyslexia: An rs-fMRI study with Ganger causality analysis.\",\"authors\":\"Si
        Tan; Simin Deng; Xiaojing Song; Xintong Su; Jingxian Zhao; Kaize Yang; Hailin
        Li; Daosen Wang; Jiaxuan Fu; Ranran Gong; Xinyun Lin; Xiuhong Li\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"38749297\",\"doi\":\"10.1016/j.jpsychires.2024.05.027\",\"articleYear\":\"2024\",\"journal\":\"Journal
        of Psychiatric Research\",\"abstractText\":\"Rapid Automatized Naming (RAN)
        is the core defect of developmental dyslexia (DD), requiring collaboration
        among brain areas to complete. However, it's still unclear which effective
        connectivity (EC) among brain areas are crucial for RAN deficits in Chinses
        children with DD. The current study aims to explore the EC among brain areas
        related to RAN deficits in Chinese children with DD. We recruited 36 Chinese
        children with DD and 64 typically developing (TD) children aged 8-12 to complete
        resting-state functional magnetic resonance imaging (rs-fMRI) scan. Granger
        causality analysis (GCA) was employed to analysis the EC among brain areas
        related to RAN, and to calculate the relationship between EC and RAN scores.
        Compared to TD group, the DD group exhibited significantly decreased EC from
        left precentral gyrus (PG) to right precuneus, left anterior cingulate and
        paracingulate gyrus (ACG), left calcarine and right angular, from left middle
        frontal gyrus (MFG) to left calcarine. Additionally, the DD group showed increased
        EC from right cuneus to left inferior frontal gyrus triangular part (IFGtri).
        The EC from left PG to left ACG was positively correlated with letters-RAN
        score. The results showed Chinese children with DD had both defect and compensatory
        mechanisms for their RAN deficits. The decreased EC output from left PG may
        be the core problem of the RAN deficits, which may influence the integration
        of visual-spatial information, attention, memory retrieval, and speech motor
        in speech production. The current study has important clinic implications
        for establishing intervention measures targeted brain.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/38749297\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"D4cTJhj4Edmm\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"ef09f7d6-7664-425c-888f-5a926eaee00a\",\"title\":\"Learning
        math by hand: The neural effects of gesture-based instruction in 8-year-old
        children.\",\"authors\":\"Elizabeth M. Wakefield; Eliza L. Congdon; Miriam
        A. Novack; Susan Goldin-Meadow; Karin H. James\",\"keywords\":\"\",\"pmcid\":\"PMC12973445\",\"pmid\":\"31111452\",\"doi\":\"10.3758/s13414-019-01755-y\",\"articleYear\":\"2019\",\"journal\":\"Attention
        Perception & Psychophysics\",\"abstractText\":\"\\nProducing gesture can be
        a powerful tool for facilitating learning. This effect has been replicated
        across a variety of academic domains, including algebra, chemistry, geometry,
        and word learning. Yet the mechanisms underlying the effect are poorly understood.
        Here we address this gap using functional magnetic resonance imaging (fMRI).
        We examine the neural correlates underlying how children solve mathematical
        equivalence problems learned with the help of either a speech + gesture strategy,
        or a speech-alone strategy. Children who learned through a speech + gesture
        were more likely to recruit motor regions when subsequently solving problems
        during a scan than children who learned through speech alone. This suggests
        that gesture promotes learning, at least in part, because it is a type of
        action. In an exploratory analysis, we also found that children who learned
        through speech + gesture showed subthreshold activation in regions outside
        the typical action-learning network, corroborating behavioral findings suggesting
        that the mechanisms supporting learning through gesture and action are not
        identical. This study is one of the first to explore the neural mechanisms
        of learning through gesture.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/31111452\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"sM9v2SLJ9NhV\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"0911816c-6dda-40c2-9523-df531f0f010f\",\"title\":\"Neurodevelopmental
        trajectories of letter and speech sound processing from preschool to the end
        of elementary school\",\"authors\":\"S.V. Di Pietro; I.I. Karipidis; G. Pleisch;
        S. Brem\",\"keywords\":\"\",\"pmcid\":\"PMC10203735\",\"pmid\":\"37196374\",\"doi\":\"10.1016/j.dcn.2023.101255\",\"articleYear\":\"2023\",\"journal\":\"Developmental
        Cognitive Neuroscience\",\"abstractText\":\" \\nLearning to read alphabetic
        languages starts with learning letter\u2013speech-sound associations. How
        this process changes brain function during development is still largely unknown.
        We followed 102 children with varying reading skills in a mixed-longitudinal/cross-sectional
        design from the prereading stage to the end of elementary school over five
        time points (n\_=\_46 with two and more time points, of which n\_=\_16 fully-longitudinal)
        to investigate the neural trajectories of letter and speech sound processing
        using fMRI. Children were presented with letters and speech sounds visually,
        auditorily, and audiovisually in kindergarten (6.7yo), at the middle (7.3yo)
        and end of first grade (7.6yo), and in second (8.4yo) and fifth grades (11.5yo).
        Activation of the ventral occipitotemporal cortex for visual and audiovisual
        processing followed a complex trajectory, with two peaks in first and fifth
        grades. The superior temporal gyrus (STG) showed an inverted U-shaped trajectory
        for audiovisual letter processing, a development that in poor readers was
        attenuated in middle STG and absent in posterior STG. Finally, the trajectories
        for letter-speech-sound integration were modulated by reading skills and showed
        differing directionality in the congruency effect depending on the time point.
        This unprecedented study captures the development of letter processing across
        elementary school and its neural trajectories in children with varying reading
        skills. \\n   Highlights  \\n  \\nNeurodevelopmental trajectories of audiovisual
        (AV) letter processing. \\n  \\nMeasurements at five time points from preschool
        across primary school with fMRI. \\n  \\nActivation in ventral occipitotemporal
        cortex followed a complex trajectory. \\n  \\nActivation in superior temporal
        gyrus followed an inverted U-shaped development. \\n  \\nTrajectories for
        AV processing and integration were modulated by reading skills. \\n  \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/37196374\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"yfdaGUpLjKWp\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"4c9e07ad-5c0c-4723-a2c0-afef69cb0283\",\"title\":\"To
        speak, or not to speak? The feasibility of imaging overt speech in children
        with epilepsy.\",\"authors\":\"L.J. Croft; P.M. Rankin; F. Li\xE9geois; T.
        Banks; J.H. Cross; F. Vargha-Khadem; T. Baldeweg\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"24054425\",\"doi\":\"10.1016/j.eplepsyres.2013.08.008\",\"articleYear\":\"2013\",\"journal\":\"Epilepsy
        Research\",\"abstractText\":\"We systematically compared fMRI results for
        covert (silent) and overt (spoken) versions of a language task in a representative
        sample of children with lesional focal epilepsy being considered for neurosurgical
        treatment (N=38, aged 6-17 years). The overt task was advantageous for presurgical
        fMRI assessments of language; it produced higher quality scans, was more sensitive
        for identifying activation in core language regions on an individual basis,
        and provided an online measure of performance crucial for improving the yield
        of presurgical fMRI.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/24054425\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"eyeU7Mic9haP\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"e2c1ec9b-04e2-4ab3-90ef-977a242873a9\",\"title\":\"Dishabituation
        of the BOLD response to speech sounds\",\"authors\":\"Jason D Zevin; Bruce
        D McCandliss\",\"keywords\":\"\",\"pmcid\":\"PMC1143777\",\"pmid\":\"15953396\",\"doi\":\"10.1186/1744-9081-1-4\",\"articleYear\":\"2005\",\"journal\":\"Behavioral
        and Brain Functions\",\"abstractText\":\"BACKGROUND: Neural systems show habituation
        responses at multiple levels, including relatively abstract language categories.
        Dishabituation - responses to non-habituated stimuli - can provide a window
        into the structure of these categories, without requiring an overt task. METHODS:
        We used an event-related fMRI design with short interval habituation trials,
        in which trains of stimuli were presented passively during 1.5 second intervals
        of relative silence between clustered scans. Trains of four identical stimuli
        (standard trials) and trains of three identical stimuli followed by a stimulus
        from a different phonetic category (deviant trials) were presented. This paradigm
        allowed us to measure and compare the time course of overall responses to
        speech, and responses to phonetic change. RESULTS: Comparisons between responses
        to speech and silence revealed strong responses throughout the extent of superior
        temporal gyrus (STG) bilaterally. Comparisons between deviant and standard
        trials revealed dishabituation responses in a restricted region of left posterior
        STG, near the border with supramarginal gyrus (SMG). Novelty responses to
        deviant trials were also observed in right frontal regions and hippocampus.
        CONCLUSION: A passive, dishabituation paradigm provides results similar to
        studies requiring overt responses. This paradigm can readily be extended for
        the study of pre-attentive processing of speech in populations such as children
        and second-language learners whose overt behavior is often difficult to interpret
        because of ancillary task demands.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/15953396\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"AV7S7B2fyFZg\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"9518fad0-7c20-42aa-9af9-fdbaff22387a\",\"title\":\"Development
        of Print-Speech Integration in the Brain of Beginning Readers With Varying
        Reading Skills.\",\"authors\":\"Fang Wang; Iliana I. Karipidis; Georgette
        Pleisch; Gorka Fraga-Gonz\xE1lez; Silvia Brem\",\"keywords\":\"\",\"pmcid\":\"PMC7457077\",\"pmid\":\"32922271\",\"doi\":\"10.3389/fnhum.2020.00289\",\"articleYear\":\"2020\",\"journal\":\"Frontiers
        in Human Neuroscience\",\"abstractText\":\"\\nLearning print-speech sound
        correspondences is a crucial step at the beginning of reading acquisition
        and often impaired in children with developmental dyslexia. Despite increasing
        insight into audiovisual language processing, it remains largely unclear how
        integration of print and speech develops at the neural level during initial
        learning in the first years of schooling. To investigate this development,
        32 healthy, German-speaking children at varying risk for developmental dyslexia
        (17 typical readers and 15 poor readers) participated in a longitudinal study
        including behavioral and fMRI measurements in first (T1) and second (T2) grade.
        We used an implicit audiovisual (AV) non-word target detection task aimed
        at characterizing differential activation to congruent (AVc) and incongruent
        (AVi) audiovisual non-word pairs. While children's brain activation did not
        differ between AVc and AVi pairs in first grade, an incongruency effect (AVi
        > AVc) emerged in bilateral inferior temporal and superior frontal gyri in
        second grade. Of note, pseudoword reading performance improvements with time
        were associated with the development of the congruency effect (AVc > AVi)
        in the left posterior superior temporal gyrus (STG) from first to second grade.
        Finally, functional connectivity analyses indicated divergent development
        and reading expertise dependent coupling from the left occipito-temporal and
        superior temporal cortex to regions of the default mode (precuneus) and fronto-temporal
        language networks. Our results suggest that audiovisual integration areas
        as well as their functional coupling to other language areas and areas of
        the default mode network show a different development in poor vs. typical
        readers at varying familial risk for dyslexia.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/32922271\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"i2HGBHEpyHiZ\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"b6b0cb13-d9a5-4d44-9547-8c2849fb7364\",\"title\":\"Audiovisual
        speech integration in the superior temporal region is dysfunctional in dyslexia\",\"authors\":\"Zheng
        Ye; Jascha R\xFCsseler; Ivonne Gerth; Thomas F. M\xFCnte\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"28527953\",\"doi\":\"10.1016/j.neuroscience.2017.05.017\",\"articleYear\":\"2017\",\"journal\":\"Neuroscience\",\"abstractText\":\"Dyslexia
        is an impairment of reading and spelling that affects both children and adults
        even after many years of schooling. Dyslexic readers have deficits in the
        integration of auditory and visual inputs but the neural mechanisms of the
        deficits are still unclear. This fMRI study examined the neural processing
        of auditorily presented German numbers 0-9 and videos of lip movements of
        a German native speaker voicing numbers 0-9 in unimodal (auditory or visual)
        and bimodal (always congruent) conditions in dyslexic readers and their matched
        fluent readers. We confirmed results of previous studies that the superior
        temporal gyrus/sulcus plays a critical role in audiovisual speech integration:
        fluent readers showed greater superior temporal activations for combined audiovisual
        stimuli than auditory-/visual-only stimuli. Importantly, such an enhancement
        effect was absent in dyslexic readers. Moreover, the auditory network (bilateral
        superior temporal regions plus medial PFC) was dynamically modulated during
        audiovisual integration in fluent, but not in dyslexic readers. These results
        suggest that superior temporal dysfunction may underly poor audiovisual speech
        integration in readers with dyslexia.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/28527953\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"M9BzBpUrczrz\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"93b7f892-0900-44b5-b76e-94ad442b85bf\",\"title\":\"Prereader
        to beginning reader: changes induced by reading acquisition in print and speech
        brain networks.\",\"authors\":\"Katarzyna Chyl; Bartosz Kossowski; Agnieszka
        D\u0119bska; Magdalena \u0141uniewska; Anna Banaszkiewicz; Agata \u017Belechowska;
        Stephen J. Frost; William Einar Mencl; Marek Wypych; Artur Marchewka; Kenneth
        R. Pugh; Katarzyna Jednor\xF3g\",\"keywords\":\"\",\"pmcid\":\"PMC5729096\",\"pmid\":\"28691732\",\"doi\":\"10.1111/jcpp.12774\",\"articleYear\":\"2018\",\"journal\":\"Journal
        of Child Psychology and Psychiatry\",\"abstractText\":\"BACKGROUND\\nLiteracy
        acquisition is a demanding process that induces significant changes in the
        brain, especially in the spoken and written language networks. Nevertheless,
        large-scale paediatric fMRI studies are still limited.\\nMETHODS\\nWe analyzed
        fMRI data to show how individual differences in reading performance correlate
        with brain activation for speech and print in 111 children attending kindergarten
        or first grade and examined group differences between a matched subset of
        emergent-readers and prereaders.\\nRESULTS\\nAcross the entire cohort, individual
        differences analysis revealed that reading skill was positively correlated
        with the magnitude of activation difference between words and symbol strings
        in left superior temporal, inferior frontal and fusiform gyri. Group comparisons
        of the matched subset of pre- and emergent-readers showed higher activity
        for emergent-readers in left inferior frontal, precentral, and postcentral
        gyri. Individual differences in activation for natural versus vocoded speech
        were also positively correlated with reading skill, primarily in the left
        temporal cortex. However, in contrast to studies on adult illiterates, group
        comparisons revealed higher activity in prereaders compared to readers in
        the frontal lobes. Print-speech coactivation was observed only in readers
        and individual differences analyses revealed a positive correlation between
        convergence and reading skill in the left superior temporal sulcus.\\nCONCLUSIONS\\nThese
        results emphasise that a child's brain undergoes several modifications to
        both visual and oral language systems in the process of learning to read.
        They also suggest that print-speech convergence is a hallmark of acquiring
        literacy.\\n\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/28691732\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"UBf68ULJkc5w\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"bd7ac9fe-a7f1-4478-8cf3-bba7e417c84d\",\"title\":\"Children's
        neural reactivity to maternal praise and criticism: Associations with early
        depressive symptoms and maternal depression.\",\"authors\":\"Matthew R.J.
        Vandermeer; Pan Liu; Ola Mohamed Ali; Andrew R. Daoust; Marc F. Joanisse;
        Deanna M. Barch; Elizabeth P. Hayden\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"36039979\",\"doi\":\"10.1017/s0954579422000840\",\"articleYear\":\"2024\",\"journal\":\"Development
        and Psychopathology\",\"abstractText\":\"Caregiving experiences are implicated
        in children's depression risk; however, children's neural reactivity to positive
        and negative feedback from mothers, a potential mediator of depression risk,
        is poorly understood. In a sample of 81 children ( = 11.12 years,  = 0.63),
        some of whom were recruited based on a maternal history of depression ( =
        29), we used fMRI to characterize children's neural responses to maternal
        praise and criticism. Maternal history of depression was unrelated to children's
        brain activity during both the praise and criticism conditions; however, ROI
        analyses showed that children's self-reported depressive symptoms were negatively
        associated with functional activity in the left anterior insula and right
        putamen while hearing maternal criticism. Whole-brain analyses showed that
        children's depressive symptoms were positively associated with left inferior
        frontal gyrus activity while listening to maternal praise. These findings
        complement past work implicating these brain regions in the processing of
        emotionally salient stimuli, reward processing, and internal speech. Given
        associations between early depressive symptoms and later disorder, findings
        suggest that maladaptive neural processing of maternal feedback may contribute
        to children's early emerging risk for depression.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/36039979\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"hZSYy3kQ4fb9\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"064f057c-eb05-40e5-8fac-5e2c04235499\",\"title\":\"Letter
        and Speech Sound Association in Emerging Readers With Familial Risk of Dyslexia\",\"authors\":\"Joanna
        Plewko; Katarzyna Chyl; \u0141ukasz Bola; Magdalena \u0141uniewska; Agnieszka
        D\u0119bska; Anna Banaszkiewicz; Marek Wypych; Artur Marchewka; Nienke van
        Atteveldt; Katarzyna Jednor\xF3g\",\"keywords\":\"\",\"pmcid\":\"PMC6176073\",\"pmid\":\"30333739\",\"doi\":\"10.3389/fnhum.2018.00393\",\"articleYear\":\"2018\",\"journal\":\"Frontiers
        in Human Neuroscience\",\"abstractText\":\" \\nIn alphabetic scripts, learning
        letter-sound (LS) association (i.e., letter knowledge) is a strong predictor
        of later reading skills. LS integration is related to left superior temporal
        cortex (STC) activity and its disruption was previously observed in dyslexia
        (DYS). Whether disruption in LS association is a cause of reading impairment
        or a consequence of decreased exposure to print remains unclear. Using fMRI,
        we compared activation for letters, speech sounds and LS association in emerging
        readers with (FHD+,   N   = 50) and without (FHD\u2212,   N   = 35) familial
        history of DYS, out of whom 17 developed DYS 2 years later. Despite having
        similar reading skills, FHD+ and FHD\u2212 groups showed opposite pattern
        of activation in left STC: In FHD\u2212 children activation was higher for
        incongruent compared to congruent, whereas in FHD+ it was higher for congruent
        LS pairs. Higher activation to congruent LS pairs was also characteristic
        of future DYS. The magnitude of incongruency effect in left STC was positively
        related to early reading skills, but only in FHD\u2212 children and (retrospectively)
        in typical readers. We show that alterations in brain activity during LS association
        can be detected at very early stages of reading acquisition, suggesting their
        causal involvement in later reading impairments. Increased response of left
        STC to incongruent LS pairs in FHD\u2212 group might reflect an early stage
        of automatizing LS associations, where the brain responds actively to conflicting
        pairs. The absence of such response in FHD+ children could lead to failures
        in suppressing incongruent information during reading acquisition, which could
        result in future reading problems. \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/30333739\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"BZVUtCUqXuwg\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"2704594e-fbff-495d-a9f5-39244ff37081\",\"title\":\"Parallel
        contributions of socioeconomic status and bilingual experiences on executive
        function and the brain in young children.\",\"authors\":\"Gavkhar Abdurokhmonova;
        Ellie K. Taylor-Robinette; S. Alexa McDorman; Alexus G. Ramirez; Junaid S.
        Merchant; John D.E. Gabrieli; Rachel R. Romeo\",\"keywords\":\"\",\"pmcid\":\"PMC13218402\",\"pmid\":\"41793923\",\"doi\":\"10.1016/j.bandl.2026.105737\",\"articleYear\":\"2026\",\"journal\":\"Brain
        and Language\",\"abstractText\":\"Executive functions (EF) are foundational
        for children's cognitive, socio-emotional, and academic outcomes, and socioeconomic
        status (SES) is consistently associated with disparities in children's EF
        performance and EF-related brain function. While bilingual children sometimes
        exhibit an \\\"advantage\\\" on certain EF tasks compared to their monolingual
        counterparts, it is unknown whether early bilingual experience may buffer
        the effects of low SES on EF in either brain or behavior. A SES-diverse sample
        (n\_=\_80) of monolingual and bilingual children (4-6\_years old) completed
        behavioral measures of EF and functional magnetic resonance imaging (fMRI)
        while engaging in a dichotic listening auditory selective attention task.
        Bilingualism was measured both by subjective parental report of children's
        language knowledge, as well as objective annotations of two daylong recordings
        of children's naturalistic language exposure. Selective auditory attention
        (vs. normal binaural speech) elicited activation in canonical attention/EF
        (posterior cingulate, precuneus, and cuneus) and language (posterior temporal
        gyrus and inferior frontal gyrus) regions. While there was no evidence of
        a protective effect of bilingualism, there were independent main effects of
        both SES and bilingual experience. Specifically, higher SES was associated
        with better EF performance and greater activation in bilateral precunei, independent
        of mono/bilingual status. While parent-reported bilingual knowledge was not
        associated with either brain or behavior independent of SES, children who
        had more balanced bilingual exposure at home exhibited better EF performance
        than those with more unbalanced or monolingual exposure in either language.
        Findings contribute to our understanding of the independent influences of
        specific experiences on children's EF development across contexts.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/41793923\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"mtrpzWiEpCXs\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"4540dcd1-9d3d-4e7f-ab47-209dbab3d0b4\",\"title\":\"Cortical
        networks for vision and language in dyslexic and normal children of variable
        socio-economic status.\",\"authors\":\"Karla Monzalvo; Joel Fluss; Catherine
        Billard; Stanislas Dehaene; Ghislaine Dehaene-Lambertz\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"22387166\",\"doi\":\"10.1016/j.neuroimage.2012.02.035\",\"articleYear\":\"2012\",\"journal\":\"NeuroImage\",\"abstractText\":\"In
        dyslexia, anomalous activations have been described in both left temporo-parietal
        language cortices and in left ventral visual occipito-temporal cortex. However,
        the reproducibility, task-dependency, and presence of these brain anomalies
        in childhood rather than adulthood remain debated. We probed the large-scale
        organization of ventral visual and spoken language areas in dyslexic children
        using minimal target-detection tasks that were performed equally well by all
        groups. In 23 normal and 23 dyslexic 10-year-old children from two different
        socio-economic status (SES) backgrounds, we compared fMRI activity to visually
        presented houses, faces, and written strings, and to spoken sentences in the
        native or in a foreign language. Our results confirm a disorganization of
        both ventral visual and spoken language areas in dyslexic children. Visually,
        dyslexic children showed a normal lateral-to-medial mosaic of preferences,
        as well as normal responses to houses and checkerboards, but a reduced activation
        to words in the visual word form area (VWFA) and to faces in the right fusiform
        face area (FFA). Auditorily, dyslexic children exhibited reduced responses
        to speech in posterior temporal cortex, left insula and supplementary motor
        area, as well as reduced responses to maternal language in subparts of the
        planum temporale, left basal language area and VWFA. By correlating these
        two findings, we identify spoken-language predictors of VWFA activation to
        written words, which differ for dyslexic and normal readers. Similarities
        in fMRI deficits in both SES groups emphasize the existence of a core set
        of brain activation anomalies in dyslexia, regardless of culture, language
        and SES, without however resolving whether these anomalies are a cause or
        a consequence of impaired reading.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/22387166\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"tv3JEeEFSdK5\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"7f9ad03b-6584-41d8-acf4-588ad971f69c\",\"title\":\"Strategies
        for tonal and atonal musical interpretation in blind and normally sighted
        children: an fMRI study.\",\"authors\":\"Coral Guerrero Arenas; Silvia S.
        Hidalgo Tob\xF3n; Pilar Dies Suarez; Eduardo Barrag\xE1n P\xE9rez; Eduardo
        Castro Sierra; Julio Garc\xEDa; Benito de Celis Alonso\",\"keywords\":\"\",\"pmcid\":\"PMC4802423\",\"pmid\":\"27066309\",\"doi\":\"10.1002/brb3.450\",\"articleYear\":\"2016\",\"journal\":\"Brain
        and Behavior\",\"abstractText\":\"INTRODUCTION: Early childhood is known to
        be a period when cortical plasticity phenomena are at a maximum. Music is
        a stimulus known to modulate these mechanisms. On the other hand, neurological
        impairments like blindness are also known to affect cortical plasticity. Here,
        we address how tonal and atonal musical stimuli are processed in control and
        blind young children. We aimed to understand the differences between the two
        groups when processing this physiological information. RESULTS: Atonal stimuli
        produced larger activations in cerebellum, fusiform, and temporal lobe structures
        than tonal. In contrast, tonal stimuli induced larger frontal lobe representations
        than atonal. Control participants presented large activations in cerebellum,
        fusiform, and temporal lobe. A correlation/connectivity study showed that
        the blind group incorporated larger amounts of perceptual information (somatosensory
        and motor) into tonal processing through the function of the anterior prefrontal
        cortex (APC). They also used the visual cortex in conjunction with the Wernicke's
        area to process this information. In contrast, controls processed sound with
        perceptual stimuli from auditory cortex structures (including Wernicke's area).
        In this case, information was processed through the dorsal posterior cingulate
        cortex and not the APC. The orbitofrontal cortex also played a key role for
        atonal interpretation in this group. DISCUSSION: Wernicke's area, known to
        be involved in speech, was heavily involved for both groups and all stimuli.
        The two groups presented clear differences in strategies for music processing,
        with very different recruitment of brain regions.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/27066309\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"4YZY3zUz87bH\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"97025ecd-f20b-4038-ace6-dd93a84f10cc\",\"title\":\"Sign
        and speech: amodal commonality in left hemisphere dominance for comprehension
        of sentences.\",\"authors\":\"Kuniyoshi L. Sakai; Yoshinori Tatsuno; Kei Suzuki;
        Harumi Kimura; Yasuhiro Ichida\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"15728651\",\"doi\":\"10.1093/brain/awh465\",\"articleYear\":\"2005\",\"journal\":\"Brain\",\"abstractText\":\"The
        neural basis of functional lateralization in language processing is a fundamental
        issue in systems neuroscience. We used functional MRI (fMRI) to examine hemispheric
        dominance during the processing of signed and spoken sentences. By using tasks
        involving comprehension of sentences (Sc) and sentential non-word detection
        (Sn), we compared different groups and stimulus conditions. Under the sign
        condition with sentence stimuli in Japanese Sign Language (JSL), we tested
        two groups of subjects: Deaf signers (Deaf) of JSL, and hearing bilinguals
        (children of Deaf adults, CODA) of JSL and Japanese (JPN). Under the speech
        condition, we tested hearing monolinguals (Mono) of JPN with auditory JPN
        stimuli alone (AUD), or with an audiovisual presentation of JPN and JSL stimuli
        (A&V). We found that the overall bilateral activation patterns under the four
        experimental conditions of Deaf, CODA, AUD and A&V were almost identical,
        despite differences in stimuli (JSL and JPN) and groups (Deaf, CODA and Mono).
        Moreover, consistently left-dominant activations involving frontal and temporo-parietal
        regions were observed across all four conditions. Furthermore, irrespective
        of the modalities of sign and speech, the main effects of task (Sc-Sn) were
        found primarily in the left regions: the ventral part of the inferior frontal
        gyrus (F3t/F3O), the precentral sulcus, the superior frontal gyrus, the middle
        temporal gyrus, the angular gyrus and the inferior parietal gyrus. Among these
        regions, only the left F3t/F3O showed no main effects of modality condition.
        These results demonstrate amodal commonality in the functional dominance of
        the left cortical regions for comprehension of sentences, as well as the essential
        and universal role of the left F3t/F3O in processing linguistic information
        from both signed and spoken sentences.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/15728651\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"4yr5pRdePxuJ\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"05402d25-5252-4498-ac3f-4597f30828fd\",\"title\":\"Cognitive
        modules utilized for narrative comprehension in children: a functional  magnetic
        resonance imaging study.\",\"authors\":\"Vincent J. Schmithorst; Scott K.
        Holland; Elena Plante\",\"keywords\":\"\",\"pmcid\":\"PMC1357541\",\"pmid\":\"16109491\",\"doi\":\"10.1016/j.neuroimage.2005.07.020\",\"articleYear\":\"2006\",\"journal\":\"NeuroImage\",\"abstractText\":\"The
        ability to comprehend narratives constitutes an important component of human
        development and experience. The neural correlates of auditory narrative comprehension
        in children were investigated in a large-scale functional magnetic resonance
        imaging (fMRI) study involving 313 subjects ages 5-18. Using group independent
        component analysis (ICA), bilateral task-related components were found comprising
        the primary auditory cortex, the mid-superior temporal gyrus, the hippocampus,
        the angular gyrus, and medial aspect of the parietal lobule (precuneus/posterior
        cingulate). In addition, a right-lateralized component was found involving
        the most posterior aspect of the superior temporal gyrus, and a left-lateralized
        component was found comprising the inferior frontal gyrus (including Broca's
        area), the inferior parietal lobule, and the medial temporal gyrus. Using
        a novel data-driven analysis technique, increased task-related activity related
        to age was found in the components comprising the mid-superior temporal gyrus
        (Wernicke's area) and the posterior aspect of the superior temporal gyrus,
        while decreased activity related to age was found in the component comprising
        the angular gyrus. The results are discussed in light of recent hypotheses
        involving the functional segregation of Wernicke's area and the specific role
        of the mid-superior temporal gyrus in speech comprehension.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/16109491\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"ocUjJ5XSLmXm\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"993469c2-04dd-407a-ac00-2cc6475a460b\",\"title\":\"Gesture
        in the developing brain\",\"authors\":\"Anthony Steven Dick; Susan Goldin\u2010Meadow;
        Ana Solodkin; Steven L. Small\",\"keywords\":\"\",\"pmcid\":\"PMC3515080\",\"pmid\":\"22356173\",\"doi\":\"10.1111/j.1467-7687.2011.01100.x\",\"articleYear\":\"2011\",\"journal\":\"Developmental
        Science\",\"abstractText\":\"Speakers convey meaning not only through words,
        but also through gestures. Although children are exposed to co-speech gestures
        from birth, we do not know how the developing brain comes to connect meaning
        conveyed in gesture with speech. We used functional magnetic resonance imaging
        (fMRI) to address this question and scanned 8- to 11-year-old children and
        adults listening to stories accompanied by hand movements, either meaningful
        co-speech gestures or meaningless self-adaptors. When listening to stories
        accompanied by both types of hand movements, both children and adults recruited
        inferior frontal, inferior parietal, and posterior temporal brain regions
        known to be involved in processing language not accompanied by hand movements.
        There were, however, age-related differences in activity in posterior superior
        temporal sulcus (STSp), inferior frontal gyrus, pars triangularis (IFGTr),
        and posterior middle temporal gyrus (MTGp) regions previously implicated in
        processing gesture. Both children and adults showed sensitivity to the meaning
        of hand movements in IFGTr and MTGp, but in different ways. Finally, we found
        that hand movement meaning modulates interactions between STSp and other posterior
        temporal and inferior parietal regions for adults, but not for children. These
        results shed light on the developing neural substrate for understanding meaning
        contributed by co-speech gesture.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/22356173\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"Agxbfktn822E\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"3b6bdf12-6bc5-4207-a382-fde62785d8f2\",\"title\":\"Changes
        in the functional connectivity of auditory and language-related brain regions
        in children with congenital severe sensorineural hearing loss: An fMRI study\",\"authors\":\"Qiang
        Li; Huang Guo; Lihua Liu; Shuang Xia\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"\",\"doi\":\"10.1016/j.jneuroling.2019.01.005\",\"articleYear\":\"2019\",\"journal\":\"Journal
        of Neurolinguistics\",\"abstractText\":\"Abstract Early hearing deprivation
        can affect the development of hearing, language, and vision. Thirty-four infants
        with congenital severe sensorineural hearing loss (CSSHL) and 20 age- and
        sex-matched subjects with normal hearing were recruited. The amplitude of
        low-frequency fluctuation (ALFF) of auditory and language-related brain areas
        was compared between infants with deafness and control subjects. Relative
        to subjects with normal hearing, infants with CSSHL had decreased ALFF values
        in the right Brodmann's area (BA) 22 region and in parts of several language-related
        regions. As the duration of hearing loss increased, the ALFF values in the
        left auditory and linguistic brain regions increased. These findings indicate
        that hearing deprivation affects the functional connectivity between auditory
        and language-related brain regions and the corresponding sensory and visual
        functional brain regions and that this functional connectivity decreases as
        the duration of hearing loss increases. Cochlear implantation performed after
        24 months may limit the habilitation of hearing and speech functions due to
        functional reorganization of the auditory and linguistic brain areas over
        time.\",\"articleLink\":\"\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"pQZGeAxUP25P\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"01086a86-4fd3-45fd-ac54-b5b4735e53c7\",\"title\":\"A
        preliminary fMRI study of relative clause in comprehension among native and
        non-native Malay language speakers\",\"authors\":\"Nurul Bayti binti Sumardi;
        Hui Ying Jong; Aini Ismafairus Abd Hamid\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"\",\"doi\":\"10.31117/neuroscirn.v5i1.113\",\"articleYear\":\"2022\",\"journal\":\"Neuroscience
        Research Notes\",\"abstractText\":\"This study investigates (a) whether there
        is a functional neural activation at the frontal and temporal brain regions
        during the comprehension of Malay relative clause (RC), and (b) the differences
        in the activated areas among native (L1) and non-native (L2) Malay language
        speakers. The subject relative clause (SRC), object relative clause (ORC),
        and subject-verb-object (SVO) were used as the study stimuli. Participants
        were asked to do a sentence-picture matching task during an fMRI measurement.
        The random-effect analysis (RFX) using two-way ANOVA was conducted for the
        fMRI data. The main effect of the group at the puncorrected < 0.001, cluster
        size > 20 voxels found that the comprehension of Malay relative clauses had
        activated frontal and temporal brain regions in L1 and L2. The multiple comparisons
        of L1>L2 showed a significant difference left-lateralised in the temporo-parietal
        region. While for L2>L1, the significant activations were indicated as distributed
        to the frontal, temporal, parietal, and occipital regions that lateralised
        to the right hemisphere. Conclusions: The findings suggested that the comprehension
        of Malay relative clauses had caused the activation at different brain regions
        amongst L1 and L2 groups. It was also found that both L1 and L2 groups showed
        their preference in SRC, the mean reaction time showed that they had a faster
        reaction time to comprehend SRC than ORC. The findings from this study can
        also be applied in clinical language intervention, and it is expected to benefit
        children and adults with speech and language disorders.\",\"articleLink\":\"\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"8RRf27tWCc3f\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"c6901841-9644-47ae-9b99-b35e5c207392\",\"title\":\"Atypical
        early neural responses to native and non-native language in infants at high
        likelihood for developing autism\",\"authors\":\"Lauren Wagner; Megan Banchik;
        Tawny Tsang; Nana J. Okada; Rebecca Altshuler; Nicole McDonald; Susan Y. Bookheimer;
        Shafali S. Jeste; Shulamite Green; Mirella Dapretto\",\"keywords\":\"\",\"pmcid\":\"PMC11792659\",\"pmid\":\"39901290\",\"doi\":\"10.1186/s13229-025-00640-w\",\"articleYear\":\"2025\",\"journal\":\"Molecular
        Autism\",\"abstractText\":\" \\n## Background \\n  \\nLanguage difficulties
        are common in autism spectrum disorder (ASD), a neurodevelopmental condition
        characterized by impairments in social communication as well as restricted
        and repetitive behaviors. Amongst infant siblings of children with an ASD
        diagnosis \u2013 who are at higher likelihood for developing ASD \u2013 a
        high proportion also show difficulties and delays in language acquisition.
        \\n\\n\\n## Methods \\n  \\nIn this study, we used functional magnetic resonance
        imaging (fMRI) to examine differences in language processing in 9-month-old
        infants at high (HL) and typical (TL) familial likelihood for ASD. Infants
        were presented with native (English) and novel (Japanese) speech while sleeping
        naturally in the scanner. Whole-brain and a priori region-of-interest analyses
        were conducted to evaluate neural differences in language processing based
        on likelihood group and language condition. \\n\\n\\n## Results \\n  \\nHL
        infants showed attenuated responses to speech in general, particularly in
        left temporal language areas, as well as a lack of neural discrimination between
        the native and novel languages compared to the TL group. Importantly, we also
        demonstrate that HL infants show distinctly atypical patterns of lateralization
        for speech processing, particularly during native speech processing, suggesting
        a failure to left-lateralize.   Limitations  : The sample size, particularly
        for the TL group, is relatively modest because of the challenges inherent
        to collecting auditory stimulus-evoked data from sleeping participants, as
        well as retention and follow-up difficulties posed by the COVID-19 pandemic.
        The groups were not matched on some demographic variables, but the present
        findings held even after accounting for these differences. \\n\\n\\n## Conclusions
        \\n  \\nTo our knowledge, this is the first fMRI study to directly measure
        autism-associated atypicalities in native language uptake during infancy.
        These findings provide a better understanding of the neurodevelopmental underpinnings
        of language delay in ASD, which is a prerequisite step for developing earlier
        and more effective interventions for autistic children and HL siblings who
        experience language impairments. \\n\\n\\n## Supplementary Information \\n
        \ \\nThe online version contains supplementary material available at 10.1186/s13229-025-00640-w.
        \\n\\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/39901290\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"YQH7Vd4fMA3p\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"1d293133-dc99-45cd-875c-613f6b446805\",\"title\":\"Atypical
        Neural Responses to Native and Non-Native Language in Infants at High Likelihood
        for Developing Autism\",\"authors\":\"Wagner, Lauren; Banchik, Megan; Tsang,
        Tawny; Okada, Nana J.; Altshuler, Rebecca; McDonald, Nicole; Bookheimer, Susan
        Y.; Jeste, Shafali S.; Green, Shulamite A.; Dapretto, Mirella\",\"keywords\":\"\",\"pmcid\":\"11643322\",\"pmid\":\"39678338\",\"doi\":\"10.21203/rs.3.rs-5190659/v1\",\"articleYear\":\"2024\",\"journal\":\"Molecular
        Autism\",\"abstractText\":\" \\n## Background \\n  \\nLanguage difficulties
        are common in autism spectrum disorder (ASD), a neurodevelopmental condition
        characterized by impairments in social communication as well as restricted
        and repetitive behaviors. Amongst infant siblings of children with an ASD
        diagnosis \u2013 who are at higher likelihood for developing ASD \u2013 a
        high proportion also show difficulties and delays in language acquisition.
        \\n\\n\\n## Methods \\n  \\nIn this study, we used functional magnetic resonance
        imaging (fMRI) to examine atypicalities associated with language processing
        in 9-month-old infants at high (HL) and typical (TL) familial likelihood for
        ASD. Infants were presented with native (English) and novel (Japanese) speech
        while sleeping naturally in the scanner. Whole-brain and   a priori   region-of-interest
        analyses were conducted to evaluate neural differences in language processing
        based on likelihood group and language condition. \\n\\n\\n## Results \\n
        \ \\nHL infants showed attenuated responses to speech in general, particularly
        in left temporal language areas, as well as a lack of neural discrimination
        between the native and novel languages compared to the TL group. Importantly,
        we also demonstrate that HL infants show distinctly atypical patterns of greater
        rightward lateralization for speech processing. Limitations: The sample size,
        particularly for the TL group, is relatively modest due to the challenges
        inherent to collecting auditory stimulus-evoked data from sleeping participants,
        as well as retention and follow-up difficulties posed by the COVID-19 pandemic.
        Additionally, the groups were not matched on some demographic variables; however,
        the present findings held even after accounting for these differences. \\n\\n\\n##
        Conclusions \\n  \\nTo our knowledge, this is the first fMRI study to directly
        measure autism-associated atypicalities in native language uptake during infancy.
        These findings provide a better understanding of the neurodevelopmental underpinnings
        of language delay in ASD, which is a prerequisite step for developing earlier
        and more effective interventions for autistic children and HL siblings who
        experience language impairments. \\n\\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/39678338\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"64C97WxP5idW\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"5a3901cb-a19d-4231-b302-9f053c4735d4\",\"title\":\"Print-specific
        multimodal brain activation in kindergarten improves prediction of reading
        skills in second grade.\",\"authors\":\"Silvia Bach; Ulla Richardson; Daniel
        Brandeis; Ernst Martin; Silvia Brem\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"23727320\",\"doi\":\"10.1016/j.neuroimage.2013.05.062\",\"articleYear\":\"2013\",\"journal\":\"NeuroImage\",\"abstractText\":\"Children
        who are poor readers usually experience troublesome school careers and consequently
        often suffer from secondary emotional and behavioural problems. Early identification
        and prediction of later reading problems thus are critical in order to start
        targeted interventions for those children with an elevated risk for emerging
        reading problems. In this study, behavioural precursors of reading were assessed
        in nineteen (aged 6.4 \xB1 0.3 years) non-reading kindergarteners before training
        letter-speech sound associations with a computerized game (Graphogame) for
        eight weeks. The training aimed to introduce the basic principles of letter-speech
        sound correspondences and to initialize the sensitization of specific brain
        areas to print. Event-related potentials (ERP) and functional magnetic resonance
        imaging (fMRI) data were recorded during an explicit word/symbol processing
        task after the training. Reading skills were assessed two years later in second
        grade. The focus of this study was on clarifying whether electrophysiological
        and fMRI data of kindergarten children significantly improve prediction of
        future reading skills in 2nd grade over behavioural data alone. Based on evidence
        from previous studies demonstrating the importance of initial print sensitivity
        in the left occipito-temporal visual word form system (VWFS) for learning
        to read, the first pronounced difference in processing words compared to symbols
        in the ERP, an occipito-temporal negativity (N1: 188-281 ms) along with the
        corresponding functional activation in the left occipito-temporal VWFS were
        defined as potential predictors. ERP and fMRI data in kindergarteners significantly
        improved the prediction of reading skills in 2nd grade over behavioural data
        alone. Together with the behavioural measures they explained up to 88% of
        the variance. An additional discriminant analysis revealed a remarkably high
        accuracy in classifying normal (n=11) and poor readers (n=6). Due to the key
        limitation of the study, i.e. the small group sizes, the results of our prediction
        analyses should be interpreted with caution and regarded as preliminary despite
        cross-validation. Nevertheless our results indicate the potential of combining
        neuroimaging and behavioural measures to improve prediction at an early stage,
        when literacy skills are acquired and interventions are most beneficial.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/23727320\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"43Dvwgzj9cPJ\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"cceb5454-e37b-4744-bfa7-7a703eab765e\",\"title\":\"Neural
        Mechanisms of Parental Communicative Adjustments in Spoken Language.\",\"authors\":\"Ryoko
        Kasaba; Koji Shimada; Akemi Tomoda\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"33346117\",\"doi\":\"10.1016/j.neuroscience.2020.12.002\",\"articleYear\":\"2021\",\"journal\":\"Neuroscience\",\"abstractText\":\"\\nDuring
        cultural transmission, caregivers typically adjust their form of speech according
        to the presumed characteristics of an infant/child, a phenomenon known as
        infant/child directed speech (IDS/CDS) or \\\"parentese.\\\" Although ventromedial
        prefrontal cortex (vmPFC) damage was previously found to be associated with
        failure in adjusting non-verbal communicative behaviors, little is known about
        the neural mechanisms of verbal communicative adjustments, such as IDS/CDS.
        In the current study, 30 healthy mothers with preschool-age children underwent
        functional magnetic resonance imaging (fMRI) while performing a picture naming
        task which required them to name an object for either a child or an adult.
        In the picture naming task, mothers exhibited a longer naming duration in
        the toward-child condition than the toward-adult control condition. Naming
        an object for a child, compared with naming it for an adult, resulted in greater
        involvement in the vmPFC and other regions (e.g., cerebellum) in the global
        caregiving network. In particular, the vmPFC exhibited task-related deactivation
        and decreased functional connectivity with the supplementary motor, precentral,
        postcentral, and supramarginal regions. These findings suggest that the vmPFC,
        which is included in the default mode network, is involved in optimizing communicative
        behaviors for the inter-generational transmission of knowledge. This function
        of the vmPFC may be considered as a prosocial drive to lead to prosocial communicative
        behaviors depending on the context. This study provides a better understanding
        of the neural mechanisms involved in communicative adjustments for children
        and insight into related applied research fields such as parenting, pedagogy,
        and education.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/33346117\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"jpniv3LzMpG3\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"2c447e71-8ef8-4038-beef-2150ece72f5d\",\"title\":\"Age
        and experience shape developmental changes in the neural basis of language-related
        learning\",\"authors\":\"Kristin McNealy; John C. Mazziotta; Mirella Dapretto\",\"keywords\":\"\",\"pmcid\":\"PMC3717169\",\"pmid\":\"22010887\",\"doi\":\"10.1111/j.1467-7687.2011.01075.x\",\"articleYear\":\"2011\",\"journal\":\"Developmental
        Science\",\"abstractText\":\"Very little is known about the neural underpinnings
        of language learning across the lifespan and how these might be modified by
        maturational and experiential factors. Building on behavioral research highlighting
        the importance of early word segmentation (i.e. the detection of word boundaries
        in continuous speech) for subsequent language learning, here we characterize
        developmental changes in brain activity as this process occurs online, using
        data collected in a mixed cross-sectional and longitudinal design. One hundred
        and fifty-six participants, ranging from age 5 to adulthood, underwent functional
        magnetic resonance imaging (fMRI) while listening to three novel streams of
        continuous speech, which contained either strong statistical regularities,
        strong statistical regularities and speech cues, or weak statistical regularities
        providing minimal cues to word boundaries. All age groups displayed significant
        signal increases over time in temporal cortices for the streams with high
        statistical regularities; however, we observed a significant right-to-left
        shift in the laterality of these learning-related increases with age. Interestingly,
        only the 5- to 10-year-old children displayed significant signal increases
        for the stream with low statistical regularities, suggesting an age-related
        decrease in sensitivity to more subtle statistical cues. Further, in a sample
        of 78 10-year-olds, we examined the impact of proficiency in a second language
        and level of pubertal development on learning-related signal increases, showing
        that the brain regions involved in language learning are influenced by both
        experiential and maturational factors.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/22010887\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"3bfWALnpzYVi\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"7e3d0ee3-6c88-4fe4-b55c-e0608de7586f\",\"title\":\"Neurobiological
        signatures of L2 proficiency: Evidence from a bi-directional cross-linguistic
        study.\",\"authors\":\"Henry Brice; William Einar Mencl; Stephen J. Frost;
        Atira Sara Bick; Jay G. Rueckl; Kenneth R. Pugh; Ram Frost\",\"keywords\":\"\",\"pmcid\":\"PMC6452641\",\"pmid\":\"30976136\",\"doi\":\"10.1016/j.jneuroling.2018.02.004\",\"articleYear\":\"2019\",\"journal\":\"Journal
        of Neurolinguistics\",\"abstractText\":\"Recent evidence has shown that convergence
        of print and speech processing across a network of primarily left-hemisphere
        regions of the brain is a predictor of future reading skills in children,
        and a marker of fluent reading ability in adults. The present study extends
        these findings into the domain of second-language (L2) literacy, through brain
        imaging data of English and Hebrew L2 learners. Participants received an fMRI
        brain scan, while performing a semantic judgement task on spoken and written
        words and pseudowords in both their L1 and L2, alongside a battery of L1 and
        L2 behavioural measures. Imaging results show, overall, show a similar network
        of activation for reading across the two languages, alongside significant
        convergence of print and speech processing across a network of left-hemisphere
        regions in both L1 and L2 and in both cohorts. Importantly, convergence is
        greater for L1 in occipito-temporal regions tied to automatic skilled reading
        processes including the visual word-form area, but greater for L2 in frontal
        regions of the reading network, tied to more effortful, active processing.
        The main groupwise brain effects tell a similar story, with greater L2 than
        L1 activation across frontal, temporal and parietal regions, but greater L1
        than L2 activation in parieto-occipital regions tied to automatic mapping
        processes in skilled reading. These results provide evidence for the shifting
        of the reading networks towards more automatic processing as reading proficiency
        rises and the mappings and statistics of the new orthography are learned and
        incorporated into the reading system.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/30976136\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"cByhjVtk6acK\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"d7be94c2-09bc-4941-8a3b-a1da57ddaafa\",\"title\":\"Acquired
        focal brain lesions in childhood: effects on development and reorganization
        of language.\",\"authors\":\"A CHILOSI\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"18267339\",\"doi\":\"10.1016/j.bandl.2007.12.010\",\"articleYear\":\"2008\",\"journal\":\"Brain
        and Language\",\"abstractText\":\"In the present paper, we address brain-behaviour
        relationships in children with acquired aphasia, by reviewing some recent
        studies on the effects of focal brain lesions on language development. Timing
        of the lesion, in terms of its occurrence, before or after the onset of speech
        and language acquisition, may be a major factor determining language outcome.
        However, it is still unclear which are the effects of aphasia occurring between
        2 and 5 years of age, a time window which is crucial for acquiring and automatizing
        the basic rules of native language. A comprehensive review of the literature
        on acquired childhood aphasia precedes the description of long-term follow-up
        (20 years) of two identical twins, one of whom became aphasic at 3 years and
        4 months after infarction of the left sylvian artery. Psycholinguistic analysis
        and fMRI data show a slow and incomplete recovery from non-fluent aphasia
        associated to an intra-hemispheric organization of language. These data, which
        support the potential but also the limits of neural plasticity during language
        development, are discussed in the light of the literature on the time-course
        and neural bases of acquired childhood aphasia.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/18267339\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"4HpdCusJF63R\",\"importId\":\"af361ff7-93bf-4ec3-a425-2a16c72e80a7\"},{\"id\":\"1afc3c7a-6a87-40f2-bf8c-792a4c2fff57\",\"title\":\"Neural
        correlates of interindividual differences in children's audiovisual speech
        perception.\",\"authors\":\"Audrey R. Nath; Eswen E. Fava; Michael S. Beauchamp\",\"keywords\":\"\",\"pmcid\":\"PMC3203203\",\"pmid\":\"21957257\",\"doi\":\"10.1523/JNEUROSCI.2605-11.2011\",\"articleYear\":\"2011\",\"journal\":\"Journal
        of Neuroscience\",\"abstractText\":\"Children use information from both the
        auditory and visual modalities to aid in understanding speech. A dramatic
        illustration of this multisensory integration is the McGurk effect, an illusion
        in which an auditory syllable is perceived differently when it is paired with
        an incongruent mouth movement. However, there are significant interindividual
        differences in McGurk perception: some children never perceive the illusion,
        while others always do. Because converging evidence suggests that the posterior
        superior temporal sulcus (STS) is a critical site for multisensory integration,
        we hypothesized that activity within the STS would predict susceptibility
        to the McGurk effect. To test this idea, we used BOLD fMRI in 17 children
        aged 6-12 years to measure brain responses to the following three audiovisual
        stimulus categories: McGurk incongruent, non-McGurk incongruent, and congruent
        syllables. Two separate analysis approaches, one using independent functional
        localizers and another using whole-brain voxel-based regression, showed differences
        in the left STS between perceivers and nonperceivers. The STS of McGurk perceivers
        responded significantly more than that of nonperceivers to McGurk syllables,
        but not to other stimuli, and perceivers' hemodynamic responses in the STS
        were significantly prolonged. In addition to the STS, weaker differences between
        perceivers and nonperceivers were observed in the fusiform face area and extrastriate
        visual cortex. These results suggest that the STS is an important source of
        interindividual variability in children's audiovisual speech perception.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/21957257\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"bkjMkd3GZsh4\",\"importId\":\"f1ed2543-c423-4d02-bcd3-4f6aadacac4b\"},{\"id\":\"548cf9f8-15f5-483b-a619-41c1ca5caeee\",\"title\":\"Altered
        integration of speech and gesture in children with autism spectrum disorders\",\"authors\":\"Amy
        L. Hubbard; Kristin McNealy; Ashley A. Scott\u2010Van Zeeland; Daniel E. Callan;
        Susan Y. Bookheimer; Mirella Dapretto\",\"keywords\":\"\",\"pmcid\":\"PMC3489813\",\"pmid\":\"23139906\",\"doi\":\"10.1002/brb3.81\",\"articleYear\":\"2012\",\"journal\":\"Brain
        and Behavior\",\"abstractText\":\"The presence of gesture during speech has
        been shown to impact perception, comprehension, learning, and memory in normal
        adults and typically developing children. In neurotypical individuals, the
        impact of viewing co-speech gestures representing an object and/or action
        (i.e., iconic gesture) or speech rhythm (i.e., beat gesture) has also been
        observed at the neural level. Yet, despite growing evidence of delayed gesture
        development in children with autism spectrum disorders (ASD), few studies
        have examined how the brain processes multimodal communicative cues occurring
        during everyday communication in individuals with ASD. Here, we used a previously
        validated functional magnetic resonance imaging (fMRI) paradigm to examine
        the neural processing of co-speech beat gesture in children with ASD and matched
        controls. Consistent with prior observations in adults, typically developing
        children showed increased responses in right superior temporal gyrus and sulcus
        while listening to speech accompanied by beat gesture. Children with ASD,
        however, exhibited no significant modulatory effects in secondary auditory
        cortices for the presence of co-speech beat gesture. Rather, relative to their
        typically developing counterparts, children with ASD showed significantly
        greater activity in visual cortex while listening to speech accompanied by
        beat gesture. Importantly, the severity of their socio-communicative impairments
        correlated with activity in this region, such that the more impaired children
        demonstrated the greatest activity in visual areas while viewing co-speech
        beat gesture. These findings suggest that although the typically developing
        brain recognizes beat gesture as communicative and successfully integrates
        it with co-occurring speech, information from multiple sensory modalities
        is not effectively integrated during social communication in the autistic
        brain.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/23139906\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"4HWqZGxzg79A\",\"importId\":\"f1ed2543-c423-4d02-bcd3-4f6aadacac4b\"},{\"id\":\"fbb55c52-dfcc-416c-a7ce-0e1a6300e8fc\",\"title\":\"Longitudinal
        changes in cortical responses to letter-speech sound stimuli in 8\u201311
        year-old children\",\"authors\":\"Linda Romanovska; Roef Janssen; Milene Bonte\",\"keywords\":\"\",\"pmcid\":\"PMC8789908\",\"pmid\":\"35079026\",\"doi\":\"10.1038/s41539-021-00118-3\",\"articleYear\":\"2022\",\"journal\":\"npj
        Science of Learning\",\"abstractText\":\" \\nWhile children are able to name
        letters fairly quickly, the automatisation of letter-speech sound mappings
        continues over the first years of reading development. In the current longitudinal
        fMRI study, we explored developmental changes in cortical responses to letters
        and speech sounds across 3 yearly measurements in a sample of 18 8\u201311
        year old children. We employed a text-based recalibration paradigm in which
        combined exposure to text and ambiguous speech sounds shifts participants\u2019
        later perception of the ambiguous sounds towards the text. Our results showed
        that activity of the left superior temporal and lateral inferior precentral
        gyri followed a non-linear developmental pattern across the measurement sessions.
        This pattern is reminiscent of previously reported inverted-u-shape developmental
        trajectories in children\u2019s visual cortical responses to text. Our findings
        suggest that the processing of letters and speech sounds involves non-linear
        changes in the brain\u2019s spoken language network possibly related to progressive
        automatisation of reading skills. \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/35079026\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"BqWvaDFk4rRV\",\"importId\":\"f1ed2543-c423-4d02-bcd3-4f6aadacac4b\"},{\"id\":\"25df9ebb-6ee2-45ce-a201-4c206a581428\",\"title\":\"Functional
        neuroimaging of speech perception during a pivotal period in language acquisition.\",\"authors\":\"Elizabeth
        Redcay; Frank Haist; Eric Courchesne\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"18333980\",\"doi\":\"10.1111/j.1467-7687.2008.00674.x\",\"articleYear\":\"2008\",\"journal\":\"Developmental
        Science\",\"abstractText\":\"A pivotal period in the development of language
        occurs in the second year of life, when language comprehension undergoes rapid
        acceleration. However, the brain bases of these advances remain speculative
        as there is currently no functional magnetic resonance imaging (fMRI) data
        from healthy, typically developing toddlers at this age. We investigated the
        neural basis of speech comprehension in this critical age period by measuring
        fMRI activity during passive speech comprehension in 10 toddlers (mean +/-
        SD; 21 +/- 4 mo) and 10 3-year-old children (39 +/- 3 mo) during natural sleep.
        During sleep, the children were presented passages of forward and backward
        speech in 20-second blocks separated by 20-second periods of no sound presentation.
        Toddlers produced significantly greater activation in frontal, occipital,
        and cerebellar regions than 3-year-old children in response to forward speech.
        Our results suggest that rapid language acquisition during the second year
        of life may require the utilization of frontal, cerebellar, and occipital
        regions in addition to classical superior temporal language areas. These findings
        are consistent with the interactive specialization hypothesis, which proposes
        that cognitive abilities develop from the interaction of brain regions that
        include and extend beyond those used in the adult brain.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/18333980\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"h2gzYiDqDNr8\",\"importId\":\"f1ed2543-c423-4d02-bcd3-4f6aadacac4b\"},{\"id\":\"fb77fe21-1aa4-4a7a-9d64-118b1ffbfc3c\",\"title\":\"Deviant
        functional magnetic resonance imaging patterns of brain activity to speech
        in 2-3-year-old children with autism spectrum disorder.\",\"authors\":\"Elizabeth
        Redcay; Eric Courchesne\",\"keywords\":\"\",\"pmcid\":\"PMC2879340\",\"pmid\":\"18672231\",\"doi\":\"10.1016/j.biopsych.2008.05.020\",\"articleYear\":\"2008\",\"journal\":\"Biological
        Psychiatry\",\"abstractText\":\"BACKGROUND: A failure to develop normal language
        is one of the most common first signs that a toddler might be at risk for
        autism. Currently the neural bases underlying this failure to develop language
        are unknown. METHODS: In this study, functional magnetic resonance imaging
        (fMRI) was used to identify the brain regions involved in speech perception
        in 12 2-3-year-old children with autism spectrum disorder (ASD) during natural
        sleep. We also recorded fMRI data from two typically developing control groups:
        a mental age-matched (MA) (n = 11) and a chronological age-matched (CA) (n
        = 12) group. During fMRI data acquisition, forward and backward speech stimuli
        were presented with intervening periods of no sound presentation. RESULTS:
        Direct statistical comparison between groups revealed significant differences
        in regions recruited to process speech. In comparison with their MA-matched
        control subjects, the ASD group showed reduced activity in an extended network
        of brain regions, which are recruited in typical early language acquisition.
        In comparison with their CA-matched control subjects, ASD participants showed
        greater activation primarily within right and medial frontal regions. Laterality
        analyses revealed a trend toward greater recruitment of right hemisphere regions
        in the ASD group and left hemisphere regions in the CA group during the forward
        speech condition. Furthermore, correlation analyses revealed a significant
        positive relationship between right hemisphere frontal and temporal activity
        to forward speech and receptive language skill. CONCLUSIONS: These findings
        suggest that at 2-3 years, children with ASD might be on a deviant developmental
        trajectory characterized by a greater recruitment of right hemisphere regions
        during speech perception.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/18672231\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"uSuMyidZqM5g\",\"importId\":\"f1ed2543-c423-4d02-bcd3-4f6aadacac4b\"},{\"id\":\"bdf93d0d-5855-4013-8892-bb705cefc61d\",\"title\":\"The
        integration of prosodic speech in high functioning autism: a preliminary FMRI
        study.\",\"authors\":\"Isabelle Hesling; Bixente Dilharreguy; Sue Pepp\xE9;
        Marion Amirault; Manuel Bouvard; Mich\xE8le Allard\",\"keywords\":\"\",\"pmcid\":\"PMC2903486\",\"pmid\":\"20644633\",\"doi\":\"10.1371/journal.pone.0011571\",\"articleYear\":\"2010\",\"journal\":\"PLoS
        ONE\",\"abstractText\":\"BACKGROUND: Autism is a neurodevelopmental disorder
        characterized by a specific triad of symptoms such as abnormalities in social
        interaction, abnormalities in communication and restricted activities and
        interests. While verbal autistic subjects may present a correct mastery of
        the formal aspects of speech, they have difficulties in prosody (music of
        speech), leading to communication disorders. Few behavioural studies have
        revealed a prosodic impairment in children with autism, and among the few
        fMRI studies aiming at assessing the neural network involved in language,
        none has specifically studied prosodic speech. The aim of the present study
        was to characterize specific prosodic components such as linguistic prosody
        (intonation, rhythm and emphasis) and emotional prosody and to correlate them
        with the neural network underlying them. METHODOLOGY/PRINCIPAL FINDINGS: We
        used a behavioural test (Profiling Elements of the Prosodic System, PEPS)
        and fMRI to characterize prosodic deficits and investigate the neural network
        underlying prosodic processing. Results revealed the existence of a link between
        perceptive and productive prosodic deficits for some prosodic components (rhythm,
        emphasis and affect) in HFA and also revealed that the neural network involved
        in prosodic speech perception exhibits abnormal activation in the left SMG
        as compared to controls (activation positively correlated with intonation
        and emphasis) and an absence of deactivation patterns in regions involved
        in the default mode. CONCLUSIONS/SIGNIFICANCE: These prosodic impairments
        could not only result from activation patterns abnormalities but also from
        an inability to adequately use the strategy of the default network inhibition,
        both mechanisms that have to be considered for decreasing task performance
        in High Functioning Autism.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/20644633\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7RitrvtcyviK\",\"importId\":\"f1ed2543-c423-4d02-bcd3-4f6aadacac4b\"},{\"id\":\"45557235-0b83-4b42-b59e-2305698e3d23\",\"title\":\"Differential
        activation of the visual word form area during auditory phoneme perception
        in youth with dyslexia.\",\"authors\":\"Lisa L. Conant; Einat Liebenthal;
        Anjali Desai; Mark S. Seidenberg; Jeffrey R. Binder\",\"keywords\":\"\",\"pmcid\":\"PMC7535924\",\"pmid\":\"32598966\",\"doi\":\"10.1016/j.neuropsychologia.2020.107543\",\"articleYear\":\"2020\",\"journal\":\"Neuropsychologia\",\"abstractText\":\"Developmental
        dyslexia is a learning disorder characterized by difficulties reading words
        accurately and/or fluently. Several behavioral studies have suggested the
        presence of anomalies at an early stage of phoneme processing, when the complex
        spectrotemporal patterns in the speech signal are analyzed and assigned to
        phonemic categories. In this study, fMRI was used to compare brain responses
        associated with categorical discrimination of speech syllables (P) and acoustically
        matched nonphonemic stimuli (N) in children and adolescents with dyslexia
        and in typically developing (TD) controls, aged 8-17 years. The TD group showed
        significantly greater activation during the P condition relative to N in an
        area of the left ventral occipitotemporal cortex that corresponds well with
        the region referred to as the \\\"visual word form area\\\" (VWFA). Regression
        analyses using reading performance as a continuous variable across the full
        group of participants yielded similar results. Overall, the findings are consistent
        with those of previous neuroimaging studies using print stimuli in individuals
        with dyslexia that found reduced activation in left occipitotemporal regions;
        however, the current study shows that these activation differences seen during
        reading are apparent during auditory phoneme discrimination in youth with
        dyslexia, suggesting that the primary deficit in at least a subset of children
        may lie early in the speech processing stream and that categorical perception
        may be an important target of early intervention in children at risk for dyslexia.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/32598966\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"nWDvrsL2953n\",\"importId\":\"f1ed2543-c423-4d02-bcd3-4f6aadacac4b\"},{\"id\":\"50a87391-042e-463d-80dd-8dbf16c6c990\",\"title\":\"Resting-state
        connectivity reveals a role for sensorimotor systems in vocal emotional processing
        in children.\",\"authors\":\"Ana Isabel Correia; Paulo Branco; Marta Martins;
        Ana Mafalda Reis; Nuno Martins; S\xE3o Lu\xEDs Castro; C\xE9sar F. Lima\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"31351162\",\"doi\":\"10.1016/j.neuroimage.2019.116052\",\"articleYear\":\"2019\",\"journal\":\"NeuroImage\",\"abstractText\":\"Voices
        are a primary source of emotional information in everyday interactions. Being
        able to process non-verbal vocal emotional cues, namely those embedded in
        speech prosody, impacts on our behaviour and communication. Extant research
        has delineated the role of temporal and inferior frontal brain regions for
        vocal emotional processing. A growing number of studies also suggest the involvement
        of the motor system, but little is known about such potential involvement.
        Using resting-state fMRI, we ask if the patterns of motor system intrinsic
        connectivity play a role in emotional prosody recognition in children. Fifty-five
        8-year-old children completed an emotional prosody recognition task and a
        resting-state scan. Better performance in emotion recognition was predicted
        by a stronger connectivity between the inferior frontal gyrus (IFG) and motor
        regions including primary motor, lateral premotor and supplementary motor
        sites. This is mostly driven by the IFG pars triangularis and cannot be explained
        by differences in domain-general cognitive abilities. These findings indicate
        that individual differences in the engagement of sensorimotor systems, and
        in its coupling with inferior frontal regions, underpin variation in children's
        emotional speech perception skills. They suggest that sensorimotor and higher-order
        evaluative processes interact to aid emotion recognition, and have implications
        for models of vocal emotional communication.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/31351162\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"5srWSu8pmmeR\",\"importId\":\"f1ed2543-c423-4d02-bcd3-4f6aadacac4b\"},{\"id\":\"9692ee32-c1a0-4354-a24d-8e294eb4f0b4\",\"title\":\"Neural
        selectivity for communicative auditory signals in Phelan-McDermid syndrome\",\"authors\":\"A.
        Ting Wang; Teresa Lim; Jesslyn Jamison; Lauren Bush; Latha V. Soorya; Teresa
        Tavassoli; Paige M. Siper; Joseph D. Buxbaum; Alexander Kolevzon\",\"keywords\":\"\",\"pmcid\":\"PMC4763436\",\"pmid\":\"26909118\",\"doi\":\"10.1186/s11689-016-9138-9\",\"articleYear\":\"2016\",\"journal\":\"Journal
        of Neurodevelopmental Disorders\",\"abstractText\":\"BACKGROUND: Phelan-McDermid
        syndrome (PMS), a neurodevelopmental disorder caused by deletion or mutation
        in the SHANK3 gene, is one of the more common single-locus causes of autism
        spectrum disorder (ASD). PMS is characterized by global developmental delay,
        hypotonia, delayed or absent speech, increased risk of seizures, and minor
        dysmorphic features. Impairments in language and communication are one of
        the most consistent characteristics of PMS. Although there is considerable
        overlap in the social communicative deficits associated with PMS and ASD,
        there is a dearth of data on underlying abnormalities at the level of neural
        systems in PMS. No controlled neuroimaging studies of PMS have been reported
        to date. The goal of this study was to examine the neural circuitry supporting
        the perception of auditory communicative signals in children with PMS as compared
        to idiopathic ASD (iASD). METHODS: Eleven children with PMS and nine comparison
        children with iASD were scanned using functional magnetic resonance imaging
        (fMRI) under light sedation. The fMRI paradigm was a previously validated
        passive auditory task, which presented communicative (e.g., speech, sounds
        of agreement, disgust) and non-communicative vocalizations (e.g., sneezing,
        coughing, yawning). RESULTS: Previous research has shown that the superior
        temporal gyrus (STG) responds selectively to communicative vocal signals in
        typically developing children and adults. Here, selective activity for communicative
        relative to non-communicative vocalizations was detected in the right STG
        in the PMS group, but not in the iASD group. The PMS group also showed preferential
        activity for communicative vocalizations in a range of other brain regions
        associated with social cognition, such as the medial prefrontal cortex (MPFC),
        insula, and inferior frontal gyrus. Interestingly, better orienting toward
        social sounds was positively correlated with selective activity in the STG
        and other \\\"social brain\\\" regions, including the MPFC, in the PMS group.
        Finally, selective MPFC activity for communicative sounds was associated with
        receptive language level in the PMS group and expressive language in the iASD
        group. CONCLUSIONS: Despite shared behavioral features, children with PMS
        differed from children with iASD in their neural response to communicative
        vocal sounds and showed relative strengths in this area. Furthermore, the
        relationship between clinical characteristics and neural selectivity also
        differed between the two groups, suggesting that shared ASD features may partially
        reflect different neurofunctional abnormalities due to differing etiologies.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/26909118\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"6rRsGPqoVMQ8\",\"importId\":\"f1ed2543-c423-4d02-bcd3-4f6aadacac4b\"},{\"id\":\"eb3b59d3-eb13-4bf6-beae-b023306b86c9\",\"title\":\"Evidence
        for normal letter-sound integration, but altered language pathways in a  case
        of recovered Landau-Kleffner Syndrome.\",\"authors\":\"Pim Pullens; Will Pullens;
        Vera Blau; Bettina Sorger; Bernadette M. Jansma; Rainer Goebel\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"26232266\",\"doi\":\"10.1016/j.bandc.2015.07.003\",\"articleYear\":\"2015\",\"journal\":\"Brain
        and Cognition\",\"abstractText\":\"Landau-Kleffner Syndrome (LKS) is a rare
        form of acquired aphasia in children, characterized by epileptic discharges,
        which occur mostly during sleep. After normal speech and language development,
        aphasia develops between the ages of 3-7 years in a period ranging from days
        to months. The epileptic discharges usually disappear after reaching adulthood,
        but language outcomes are usually poor if no treatment focused on restoration
        of (non-) verbal communication is given. Patients often appear deaf-mute,
        but sign language, as part of the treatment, may lead to recovery of communication.
        The neural mechanisms underlying poor language outcomes in LKS are not yet
        understood. In this detailed functional MRI study of a recovered LKS patient
        - that is, a patient no longer suffering from epileptic discharges, audiovisual
        multi-sensory processing was investigated, since LKS patients are often proficient
        in reading, but not in speech perception. In the recovered LKS patient a large
        difference in the neural activation to auditory stimuli was found in the left
        versus the right auditory cortex, which cannot be attributed to hearing loss.
        Compared to healthy proficient readers investigated earlier with the same
        fMRI experiment, the patient demonstrated normal letter-sound integration
        in the superior temporal gyrus as demonstrated by the multi-sensory interaction
        index, indicating intact STG function. Diffusion Tensor Imaging (DTI) based
        fiber tracking in the LKS patient showed fibers originating from Heschl's
        gyrus that seem to be left-right inverted with respect to HG fiber pattern
        described in the literature for healthy controls. In the patient, in both
        hemispheres we found arcuate fibers projecting from (homologues of) Broca's
        to Wernicke's areas, and a lack of fibers from arcuate left inferior parietal
        and sylvian areas reported in healthy subjects. We observed short arcuate
        segments in the right hemisphere. Although speculative, our results suggest
        intact temporal lobe processing but an altered temporal to frontal connectivity.
        The altered connectivity might explain observed short-term verbal memory problems,
        disturbed (speech) sound-motor interaction and online feedback of speech and
        might be one of the neuronal factors underlying LKS.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/26232266\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7VcpqAzrSWLe\",\"importId\":\"f1ed2543-c423-4d02-bcd3-4f6aadacac4b\"},{\"id\":\"0022c372-f734-400a-8ba1-8f3cbdf2e5e4\",\"title\":\"The
        interaction between orthographic and phonological information in children:
        an fMRI study.\",\"authors\":\"Tali Bitan; Douglas D. Burman; Tai\u2010Li
        Chou; Dong Lu; Nadia E. Cone; Fan Cao; Jordan D. Bigio; James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC2692515\",\"pmid\":\"17133384\",\"doi\":\"10.1002/hbm.20313\",\"articleYear\":\"2007\",\"journal\":\"Human
        Brain Mapping\",\"abstractText\":\"We examined the neural representations
        of orthographic and phonological processing in children, while manipulating
        the consistency between orthographic and phonological information. Participants,
        aged 9-15, were scanned while performing rhyming and spelling judgments on
        pairs of visually presented words. The orthographic and phonological similarity
        between words in the pair was independently manipulated, resulting in four
        conditions. In the nonconflicting conditions, both orthography and phonology
        of the words were either (1) similar (lime-dime) or (2) different (staff-gain);
        in conflicting conditions, words had (3) similar phonology and different orthography
        (jazz-has) or (4) different phonology and similar orthography (pint-mint).
        The comparison between tasks resulted in greater activation for the rhyming
        task in bilateral inferior frontal gyri (BA 45/47), and greater activation
        for the spelling task in bilateral inferior/superior parietal lobules (BA
        40/7), suggesting greater involvement of phonological and semantic processing
        in the rhyming task, and nonlinguistic spatial processing in the spelling
        task. Conflicting conditions were more difficult in both tasks and resulted
        in greater activation in the above regions. The results suggest that when
        children encounter inconsistency between orthographic and phonological information
        they show greater engagement of both orthographic and phonological processing.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/17133384\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"3j4TKcHme3Hv\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"f2258f63-3d85-481c-b616-046f84faa817\",\"title\":\"Neural
        correlates of phonological processing: Disrupted in children with dyslexia
        and enhanced in musically trained children\",\"authors\":\"Jennifer Zuk; Meaghan
        V. Perdue; Bryce Becker; Xi Yu; Michelle Chang; Nora Maria Raschle; Nadine
        Gaab\",\"keywords\":\"\",\"pmcid\":\"PMC6481189\",\"pmid\":\"30103188\",\"doi\":\"10.1016/j.dcn.2018.07.001\",\"articleYear\":\"2018\",\"journal\":\"Developmental
        Cognitive Neuroscience\",\"abstractText\":\"  Highlights  \\n  \\nFirst fMRI
        investigation of phonological processing in musically trained children. \\n
        \ \\nGreater bilateral activation with music training in regions disrupted
        in dyslexia. \\n  \\nImplications for music training to support compensatory
        neural network in dyslexia. \\n  \\n  \\nPhonological processing has been
        postulated as a core area of deficit among children with dyslexia. Reduced
        brain activation during phonological processing in children with dyslexia
        has been observed in left-hemispheric temporoparietal regions. Musical training
        has shown positive associations with phonological processing abilities, but
        the neural mechanisms underlying this relationship remain unspecified. The
        present research aims to distinguish neural correlates of phonological processing
        in school-age typically developing musically trained children, musically untrained
        children, and musically untrained children with dyslexia utilizing fMRI. A
        whole-brain ANCOVA, accounting for gender and nonverbal cognitive abilities,
        identified a main effect of group in bilateral temporoparietal regions. Subsequent
        region-of-interest analyses replicated temporoparietal hypoactivation in children
        with dyslexia relative to typically developing children. By contrast, musically
        trained children showed greater bilateral activation in temporoparietal regions
        when compared to each musically untrained group. Therefore, musical training
        shows associations with enhanced bilateral activation of left-hemispheric
        regions known to be important for reading. Findings suggest that engagement
        of these regions through musical training may underlie the putative positive
        effects of music on reading development. This supports the hypothesis that
        musical training may facilitate the development of a bilateral compensatory
        neural network, which aids children with atypical function in left-hemispheric
        temporoparietal regions. \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/30103188\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"DfKjavcu6ZqD\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"4e091bf2-43b3-450a-ab99-89ce7fd8f2a0\",\"title\":\"Effective
        brain connectivity in children with reading difficulties during phonological
        processing\",\"authors\":\"Fan Cao; Tali Bitan; James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC2676797\",\"pmid\":\"18226833\",\"doi\":\"10.1016/j.bandl.2007.12.009\",\"articleYear\":\"2008\",\"journal\":\"Brain
        and Language\",\"abstractText\":\"Using Dynamic Causal Modeling (DCM) and
        functional magnetic resonance imaging (fMRI), we examined effective connectivity
        between three left hemisphere brain regions (inferior frontal gyrus, inferior
        parietal lobule, fusiform gyrus) and bilateral medial frontal gyrus in 12
        children with reading difficulties (M age=12.4, range: 8.11-14.10) and 12
        control children (M age=12.3, range: 8.9-14.11) during rhyming judgments to
        visually presented words. More difficult conflicting trials either had similar
        orthography but different phonology (e.g. pint-mint) or similar phonology
        but different orthography (e.g. jazz-has). Easier non-conflicting trials had
        similar orthography and phonology (e.g. dime-lime) or different orthography
        and phonology (e.g. staff-gain). The modulatory effect from left fusiform
        gyrus to left inferior parietal lobule was stronger in controls than in children
        with reading difficulties only for conflicting trials. Modulatory effects
        from left fusiform gyrus and left inferior parietal lobule to left inferior
        frontal gyrus were stronger for conflicting trials than for non-conflicting
        trials only in control children but not in children with reading difficulties.
        Modulatory effects from left inferior frontal gyrus to inferior parietal lobule,
        from medial frontal gyrus to left inferior parietal lobule, and from left
        inferior parietal lobule to medial frontal gyrus were positively correlated
        with reading skill only in control children. These findings suggest that children
        with reading difficulties have deficits in integrating orthography and phonology
        utilizing left inferior parietal lobule, and in engaging phonological rehearsal/segmentation
        utilizing left inferior frontal gyrus possibly through the indirect pathway
        connecting posterior to anterior language processing regions, especially when
        the orthographic and phonological information is conflicting.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/18226833\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"83CJo3rUYc45\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"62dc3d86-23a6-4e29-9e49-6effb254d94c\",\"title\":\"Temporo-frontal
        activation during phonological processing predicts gains in arithmetic facts
        in young children\",\"authors\":\"Macarena Su\xE1rez-Pellicioni; Lynn Fuchs;
        James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC6974907\",\"pmid\":\"31785530\",\"doi\":\"10.1016/j.dcn.2019.100735\",\"articleYear\":\"2019\",\"journal\":\"Developmental
        Cognitive Neuroscience\",\"abstractText\":\"  Highlights  \\n  \\nActivation
        during phonological processing of rhymes predicts math gains. \\n  \\nTemporo-frontal
        activation predicts gains in fluency and multiplication skill. \\n  \\nBoth
        storage and access to phonology are important for math gains. \\n  \\nEffects
        were specific to younger children showing early importance of phonology. \\n
        \ \\nPredictive effects specific to math tasks relying on verbal retrieval.
        \\n  \\n  \\nBehavioral studies have shown discrepant results regarding the
        role of phonology in predicting math gains. The objective of this study was
        to use fMRI to study the role of activation during a rhyming judgment task
        in predicting behavioral gains on math fluency, multiplication, and subtraction
        skill. We focused within the left middle/superior temporal gyrus and left
        inferior frontal gyrus, brain areas associated with the storage of phonological
        representations and with their access, respectively. We ran multiple regression
        analyses to determine whether activation predicted gains in the three math
        measures, separately for younger (i.e. 10 years old) and older (i.e 12 years
        old) children. Results showed that activation in both temporal and frontal
        cortex only predicted gains in fluency and multiplication skill, and only
        for younger children. This study suggests that both temporal and frontal cortex
        activation during phonological processing are important in predicting gains
        in math tasks that involve the retrieval of facts that are stored as phonological
        codes in memory. Moreover, these results were specific to younger children,
        suggesting that phonology is most important in the early stages of math development.
        When the math task involved subtractions, which relies on quantity representations,
        phonological processes were not important in driving gains. \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/31785530\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"d8aqN7rHmkcm\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"74002f00-49f7-4e81-b9ab-1d1f0969616a\",\"title\":\"Deficient
        orthographic and phonological representations in children with dyslexia revealed
        by brain activation patterns.\",\"authors\":\"Fan Cao; Tali Bitan; Tai\u2010Li
        Chou; Douglas D. Burman; James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC2617739\",\"pmid\":\"17073983\",\"doi\":\"10.1111/j.1469-7610.2006.01684.x\",\"articleYear\":\"2006\",\"journal\":\"Journal
        of Child Psychology and Psychiatry\",\"abstractText\":\"BACKGROUND\\nThe current
        study examined the neuro-cognitive network of visual word rhyming judgment
        in 14 children with dyslexia and 14 age-matched control children (8- to 14-year-olds)
        using functional magnetic resonance imaging (fMRI).\\nMETHODS\\nIn order to
        manipulate the difficulty of mapping orthography to phonology, we used conflicting
        and non-conflicting trials. The words in conflicting trials either had similar
        orthography but different phonology (e.g., pint-mint) or similar phonology
        but different orthography (e.g., jazz-has). The words in non-conflicting trials
        had similar orthography and phonology (e.g., gate-hate) or different orthography
        and phonology (e.g., press-list).\\nRESULTS\\nThere were no differences in
        brain activation between the controls and children with dyslexia in the easier
        non-conflicting trials. However, the children with dyslexia showed less activation
        than the controls in left inferior frontal gyrus (BA 45/44/47/9), left inferior
        parietal lobule (BA 40), left inferior temporal gyrus/fusiform gyrus (BA 20/37)
        and left middle temporal gyrus (BA 21) for the more difficult conflicting
        trials. For the direct comparison of conflicting minus non-conflicting trials,
        controls showed greater activation than children with dyslexia in left inferior
        frontal gyrus (BA 9/45/46) and medial frontal gyrus (BA 8). Children with
        dyslexia did not show greater activation than controls for any comparison.\\nCONCLUSIONS\\nReduced
        activation in these regions suggests that children with dyslexia have deficient
        orthographic representations in ventral temporal cortex as well as deficits
        in mapping between orthographic and phonological representations in inferior
        parietal cortex. The greater activation for the controls in inferior frontal
        gyrus could reflect more effective top-down modulation of posterior representations.\\n\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/17073983\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"KhjhoUHo5ziG\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"12507610-d651-49dc-b46b-f737e6e24357\",\"title\":\"Dyslexic
        Children Show Short-Term Memory Deficits in Phonological Storage and Serial
        Rehearsal: An fMRI Study\",\"authors\":\"Harald Beneventi; Finn Egil T\xF8nnessen;
        Lars Ersland\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"19863259\",\"doi\":\"10.1080/00207450903139671\",\"articleYear\":\"2009\",\"journal\":\"International
        Journal of Neuroscience\",\"abstractText\":\"Dyslexia is primarily associated
        with a phonological processing deficit. However, the clinical manifestation
        also includes a reduced verbal working memory (WM) span. It is unclear whether
        this WM impairment is caused by the phonological deficit or a distinct WM
        deficit. The main aim of this study was to investigate neuronal activation
        related to phonological storage and rehearsal of serial order in WM in a sample
        of 13-year-old dyslexic children compared with age-matched nondyslexic children.
        A sequential verbal WM task with two tasks was used. In the Letter Probe task,
        the probe consisted of a single letter and the judgment was for the presence
        or absence of that letter in the prior sequence of six letters. In the Sequence
        Probe (SP) task, the probe consisted of all six letters and the judgment was
        for a match of their serial order with the temporal order in the prior sequence.
        Group analyses as well as single-subject analysis were performed with the
        statistical parametric mapping software SPM2. In the Letter Probe task, the
        dyslexic readers showed reduced activation in the left precentral gyrus (BA6)
        compared to control group. In the Sequence Probe task, the dyslexic readers
        showed reduced activation in the prefrontal cortex and the superior parietal
        cortex (BA7) compared to the control subjects. Our findings suggest that a
        verbal WM impairment in dyslexia involves an extended neural network including
        the prefrontal cortex and the superior parietal cortex. Reduced activation
        in the left BA6 in both the Letter Probe and Sequence Probe tasks may be caused
        by a deficit in phonological processing. However, reduced bilateral activation
        in the BA7 in the Sequence Probe task only could indicate a distinct working
        memory deficit in dyslexia associated with temporal order processing.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/19863259\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"V9n2pq2YXBwj\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"d45833c2-739a-43d8-917f-d95c036f378f\",\"title\":\"Neural
        Correlates of Orthographic and Phonological Consistency Effects in Children\",\"authors\":\"Donald
        J. Bolger; Jane Hornickel; Nadia E. Cone; Douglas D. Burman; James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC2667127\",\"pmid\":\"17957704\",\"doi\":\"10.1002/hbm.20476\",\"articleYear\":\"2008\",\"journal\":\"Human
        Brain Mapping\",\"abstractText\":\"The objective of this study was to examine
        the neural correlates of phonological inconsistency (relationship of spelling
        to sound) and orthographic inconsistency (relationship of sound to spelling)
        in visual word processing using functional magnetic resonance imaging (fMRI).
        Children (9- to 15-year-old) performed a rhyming and spelling task in which
        two words were presented sequentially in the visual modality. Consistent with
        previous studies in adults, higher phonological inconsistency was associated
        with greater activation in several regions including left inferior frontal
        gyrus and medial frontal gyrus/anterior cingulate cortex. We additionally
        demonstrated an effect of orthographic inconsistency in these same areas,
        suggesting that these regions are involved in the integration of orthographic
        and phonological information and, with respect to the medial frontal/anterior
        cingulate, greater demands on executive function. Higher phonological and
        orthographic consistency was associated with greater activation in precuneus/posterior
        cingulate cortex, the putative steady state system active during resting,
        suggesting lower demands on cognitive resources for consistent items. Both
        consistency effects were larger for the rhyming compared with the spelling
        task suggesting greater demands of integrating spelling and sound in the former
        task. Finally, accuracy on the rhyming task was negatively correlated with
        the consistency effect in left fusiform gyrus. In particular, this region
        showed insensitivity to consistency in low performers, sensitivity to inconsistency
        (higher activity) in moderate performers, and sensitivity to inconsistency
        (high activation) and to consistency (deactivation). In general, these results
        show that the influence of spelling-sound (and sound-spelling) correspondences
        on processing in fusiform gyrus develops as a function of skill.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/17957704\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"5d2Ffy39KuJy\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"cd6ca2da-c03c-487b-a9ec-b93f444068ad\",\"title\":\"Reciprocal
        relations between reading skill and the neural basis of phonological awareness
        in 7- to 9-year-old children\",\"authors\":\"Jin Wang; Julia Pines; Marc Joanisse;
        James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC8361856\",\"pmid\":\"33878381\",\"doi\":\"10.1016/j.neuroimage.2021.118083\",\"articleYear\":\"2021\",\"journal\":\"NeuroImage\",\"abstractText\":\"
        \\nBy using a longitudinal design and functional magnetic resonance imaging
        (fMRI), our previous study ( ) found a scaffolding effect of early phonological
        processing in the superior temporal gyrus (STG) in 6-year-old children on
        later behavioral reading skill in 7.5-year-old children. Other than this previous
        study, nothing is known about longitudinal change in the bidirectional relation
        between reading skill and phonological processing in the brain. To fill this
        gap, in the current study, we used the same experimental paradigm as in   to
        measure children\u2019s reading skill and brain activity during an auditory
        phonological awareness task, but with children who were 7.5 years old at Time
        1 (T1) and about 1.5 years later when they were 9 years old at Time 2 (T2).
        The phonological awareness task included both small grain (i.e., onset) and
        large grain (i.e., rhyme) conditions. In a univariate analysis, we found that
        better reading skill at T1 predicted lower brain activation in IFG at T2 for
        onset processing after controlling for brain activation and non-verbal IQ
        at T1. This suggests that early reading ability reduces the effort of phonemic
        access, thus supporting the refinement hypothesis. When using general psychophysiological
        interaction (gPPI), we found that higher functional connectivity from IFG
        to STG for rhyme processing at T1 predicted better reading skill at T2 after
        controlling for reading skill and non-verbal IQ at T1. This suggests that
        the early effectiveness of accessing rhyme representations scaffolds reading
        acquisition. As both results did not survive multiple comparison corrections,
        replication of these findings is needed. However, both findings are consistent
        with prior studies demonstrating that phonological access in the frontal lobe
        becomes important in older elementary school readers. Moreover, the refinement
        effect for onsets is consistent with the hypothesis that learning to read
        allows for better access of small grain phonology, and the scaffolding effect
        for rhymes supports the idea that reading progresses to larger grain orthography-to-phonology
        mapping in older skilled readers. The current study, along with our previous
        study on younger children, indicates that the development of reading skill
        is associated with (1) the early importance of the quality of the phonological
        representations to later access of these representations, and (2) early importance
        of small grain sizes to later development of large grain ones. \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/33878381\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"QAdEJfmyPkzD\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"dc7a6355-5dac-4ecd-bf1e-9ad771b6dd50\",\"title\":\"Early
        emergence of deviant frontal fMRI activity for phonological processes in poor
        beginning readers\",\"authors\":\"Silvia Bach; Daniel Brandeis; Christoph
        Hofstetter; Ernst Martin; Ulla Richardson; Silvia Brem\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"20600985\",\"doi\":\"10.1016/j.neuroimage.2010.06.039\",\"articleYear\":\"2010\",\"journal\":\"NeuroImage\",\"abstractText\":\"Phonological
        awareness refers to the ability to perceive and manipulate the sound structure
        of language and is especially important when children learn to read. Poor
        phonological awareness is considered the major cause for the emergence of
        reading difficulties. In this functional magnetic resonance imaging (fMRI)
        study, we examined the brain correlates of phonological processing in young
        beginning readers (aged 8.3+/-0.4 y, 2nd grade) with poor (<25th percentile)
        or normal, age-appropriate reading skills (>40th percentile) using a covert
        reading and mental letter substitution task. Letter substitution in words
        and nonwords induced pronounced activity in a left frontal language network
        related to phonological processing, with maxima in the left inferior frontal
        gyrus and in the insula. The activation within this frontal network increased
        with better reading skills and differentiated between normal and poor reading
        young children. Lateralization indices of overall frontal activity for normal
        and poor readers pointed to stronger left hemispheric involvement in normal
        readers as compared to the more bilateral activation pattern in poor readers.
        To summarize, young children with age-appropriate reading skills display a
        left hemispheric dominance characteristic for language processing already
        by grade two. The more bilateral activation pattern in poor readers points
        to an increased effort and the emergence of compensatory strategies for reading
        and phonological processing just 1.5 years after the start of formal reading
        instruction.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/20600985\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"5KakQYPybHsP\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"8bf5a6d7-ea59-4353-99f8-af8cbbf1cdfc\",\"title\":\"Neural
        correlates of mapping from phonology to orthography in children performing
        an auditory spelling task\",\"authors\":\"James R. Booth; Soojin Cho; Douglas
        D. Burman; Tali Bitan\",\"keywords\":\"\",\"pmcid\":\"PMC2638504\",\"pmid\":\"17552934\",\"doi\":\"10.1111/j.1467-7687.2007.00598.x\",\"articleYear\":\"2007\",\"journal\":\"Developmental
        Science\",\"abstractText\":\"Age-related differences (9- to 15-year-olds)
        in the neural correlates of mapping from phonology to orthography were examined
        with functional magnetic resonance imaging (fMRI). Participants were asked
        to determine if two spoken words had the same spelling for the rime (corresponding
        letters after the first consonant or consonant cluster). Some of the word
        pairs had conflicting orthography and phonology (e.g. jazz-has, pint-mint)
        whereas other pairs had non-conflicting information (e.g. press-list, gate-hate)
        (see Table 1). There were age-related increases in activation for lexical
        processing (across conflicting and non-conflicting conditions) in left inferior
        parietal lobule, suggesting that older children have a more elaborated system
        for mapping between phonology and orthography that includes connections at
        different grain sizes (e.g. phonemes, onset-rimes, syllables). In addition,
        we found that the conflicting conditions had lower accuracy, slower reaction
        time and greater activation in left inferior frontal gyrus as compared to
        non-conflicting conditions. Higher accuracy was also correlated with greater
        activation in left inferior frontal gyrus for the most difficult conflicting
        condition (e.g. jazz-has). The finding of both a conflict effect and a correlation
        with accuracy in left inferior frontal gyrus suggests that this region may
        be involved in resolving the conflict between orthographic and phonological
        representations.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/17552934\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"6TUrF7vwLEp3\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"03f83a50-317f-4ae3-bb8d-2d0021d69e09\",\"title\":\"Differential
        effects of orthographic and phonological consistency in cortex for children
        with and without reading impairment.\",\"authors\":\"Donald J. Bolger; Jennifer
        Minas; Douglas D. Burman; James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC2658621\",\"pmid\":\"18725239\",\"doi\":\"10.1016/j.neuropsychologia.2008.07.024\",\"articleYear\":\"2008\",\"journal\":\"Neuropsychologia\",\"abstractText\":\"One
        of the central challenges in mastering English is becoming sensitive to consistency
        from spelling to sound (i.e. phonological consistency) and from sound to spelling
        (i.e. orthographic consistency). Using functional magnetic resonance imaging
        (fMRI), we examined the neural correlates of consistency in 9-15-year-old
        Normal and Impaired Readers during a rhyming task in the visual modality.
        In line with our previous study [Bolger, D.J., Hornickel, J., Cone, N. E.,
        Burman, D. D., & Booth,J. R. (in press). Neural correlates of orthographic
        and phonological consistency effects in children. Human Brain Mapping], for
        Normal Readers, lower phonological and orthographic consistency were associated
        with greater activation in several regions including bilateral inferior/middle
        frontal gyri, bilateral anterior cingulate cortex as well as left fusiform
        gyrus. Impaired Readers activated only bilateral anterior cingulate cortex
        in response to decreasing consistency. Group comparisons revealed that, relative
        to Impaired Readers, Normal Readers exhibited a larger response in this network
        for lower phonological consistency whereas orthographic consistency differences
        were limited. Lastly, brain-behavior correlations revealed a significant relationship
        between skill (i.e. Phonological Awareness and non-word decoding) and cortical
        consistency effects for Impaired Readers in left inferior/middle frontal gyri
        and left fusiform gyrus. Impaired Readers with higher skill showed greater
        activation for higher consistency. This relationship was reliably different
        from that of Normal Readers in which higher skill was associated with greater
        activation for lower consistency. According to single-route or connectionist
        models, these results suggest that Impaired Readers with higher skill devote
        neural resources to representing the mapping between orthography and phonology
        for higher consistency words, and therefore do not robustly activate this
        network for lower consistency words.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/18725239\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7ncwqcYhsdTe\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"7413004e-6a6a-420d-81b4-3c91baa42654\",\"title\":\"Phonological
        processing in first-degree relatives of individuals with autism: an  fMRI
        study.\",\"authors\":\"Lisa B. Wilson; Jason R. Tregellas; Erin Slason; Bryce
        E. Pasko; Susan Hepburn; Donald C. Rojas\",\"keywords\":\"\",\"pmcid\":\"PMC4136540\",\"pmid\":\"22419478\",\"doi\":\"10.1002/hbm.22001\",\"articleYear\":\"2013\",\"journal\":\"Human
        Brain Mapping\",\"abstractText\":\"Autism spectrum disorders (ASD) are complex
        neurodevelopmental disorders. Twin studies have provided heritability estimates
        as high as 90% for idiopathic ASD. Further evidence for the spectrum's heritability
        is provided by the presence of the broad autism phenotype (BAP) in unaffected
        first-degree relatives. Language ability, specifically phonological processing,
        is proposed to be a core BAP trait. To date, however, no functional neuroimaging
        investigations of phonological processing in relatives of individuals with
        ASD have been undertaken. We conducted a functional magnetic resonance imaging
        (fMRI) study in parents of children with ASD utilizing a priming task probing
        implicit phonological processing. In our condition that placed heavier demands
        on phonological recoding, parents exhibited greater hemodynamic responses
        than controls in a network of cortical regions involved in phonological processing.
        Across conditions, parents exhibited enhanced priming-induced response suppression
        suggesting compensatory neural processing. A nonword repetition test used
        in previous studies of relatives was also administered. Correlations between
        this measure and our functional measures also suggested compensatory processing
        in parents. Regions exhibiting atypical responses in parents included regions
        previously implicated in the spectrum's language impairments and found to
        exhibit structural abnormalities in a parent study. These results suggest
        a possible neurobiological substrate of the phonological deficits proposed
        to be a core BAP trait. However, these results should be considered preliminary.
        No previous fMRI study has investigated phonological processing in ASD, so
        replication is required. Furthermore, interpretation of our fMRI results is
        limited by the fact that the parent group failed to exhibit behavioral evidence
        of phonological impairments.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/22419478\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"6Jwjc7HCNHfA\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"eea919a5-bd28-41e8-ac0c-6c9d346bef63\",\"title\":\"fMRI
        during word processing in dyslexic and normal reading children.\",\"authors\":\"P
        Georgiewa, R Rzanny, J M Hopf, R Knab, V Glauche, W A Kaiser, B Blanz\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"10599862\",\"doi\":\"10.1097/00001756-199911080-00036\",\"articleYear\":\"1999\",\"journal\":\"Neuroreport\",\"abstractText\":\"\\nThe
        present study addresses phonological processing in children with developmental
        dyslexia. Following the hypothesis of a core deficit of assembled phonology
        in dyslexia a set of hierarchically structured tasks was applied that specifically
        control for different kinds of phonological coding (assembled versus addressed
        phonological strategies). Seventeen developmental dyslexics and 17 normal
        reading children were scanned during four different tasks: (1) passive viewing
        of letter strings (control condition), (2) passive reading of non-words, (3)
        passive reading of legal words, and (4) a task requiring phonological transformation.
        Statistical analysis of the data was performed using statistical parametric
        mapping (SPM96). Comparison of patterns of activation in dyslexic and normal
        reading children revealed significant differences in Broca's area and the
        left inferior temporal region for both, non-word reading and the phonological
        transformation task. The present data provide new evidence for alteration
        of the phonological system in dyslexic children, and in particular, the system
        that mediates assembled phonological coding.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/10599862\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"LovZNbhv3iqW\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"a942a012-537e-40bf-913e-9df1ff4c656a\",\"title\":\"Both
        frontal and temporal cortex exhibit phonological and semantic specialization
        during spoken language processing in 7\u2010 to 8\u2010year\u2010old children\",\"authors\":\"Jin
        Wang; Brianna L. Yamasaki; Yael Weiss; James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC8249890\",\"pmid\":\"33951259\",\"doi\":\"10.1002/hbm.25450\",\"articleYear\":\"2021\",\"journal\":\"Human
        Brain Mapping\",\"abstractText\":\" \\nA previous functional magnetic resonance
        imaging (fMRI) study by Weiss et al. (Weiss et al., Human Brain Mapping, 2018,
        39, 4334\u20134348) examined brain specialization for phonological and semantic
        processing of spoken words in young children who were 5 to 6\u2009years old
        and found evidence for specialization in the temporal but not the frontal
        lobe. According to a prominent neurocognitive model of language development
        (Skeide & Friederici, Nature Reviews Neuroscience, 2016, 17, 323\u2013332),
        the frontal lobe matures later than the temporal lobe. Thus, the current study
        aimed to examine if brain specialization in the frontal lobe can be observed
        in a slightly older cohort of children aged 7 to 8\u2009years old using the
        same experimental and analytical approach as in Weiss et al. (Weiss et al.,
        Human Brain Mapping, 2018, 39, 4334\u20134348). One hundred and ten typically
        developing children were recruited and were asked to perform a sound judgment
        task, tapping into phonological processing, and a meaning judgment task, tapping
        into semantic processing, while in the MRI scanner. Direct task comparisons
        showed that these children exhibited language specialization in both the temporal
        and the frontal lobes, with the left posterior dorsal inferior frontal gyrus
        (IFG) showing greater activation for the sound than the meaning judgment task,
        and the left anterior ventral IFG and the left posterior middle temporal gyrus
        (MTG) showing greater activation for the meaning than the sound judgment task.
        These findings demonstrate that 7\u2010 to 8\u2010year\u2010old children have
        already begun to develop a language\u2010related specialization in the frontal
        lobe, suggesting that early elementary schoolers rely on both specialized
        linguistic manipulation and representation mechanisms to perform language
        tasks. \\n  \\nWe designed an auditory sound judgment task tapping into phonological
        processing and an auditory meaning judgment task tapping into semantic processing.
        We found that 7\u2010 to 8\u2010year\u2010old children exhibited language
        specialization in both the temporal and the frontal lobes, with the left posterior
        dorsal inferior frontal gyrus (IFG) showing greater activation for the sound
        than the meaning judgment task, and the left anterior ventral IFG and the
        left posterior middle temporal gyrus (MTG) showing greater activation for
        the meaning than the sound judgment task. Our findings suggest that early
        elementary schoolers rely on both specialized linguistic manipulation and
        representation mechanisms to perform language tasks.   \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/33951259\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"bfLf9ctdFTNt\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"8278d27d-8aef-4ed3-b441-1c94ac2c6d92\",\"title\":\"Letter
        fluency in 7-8-year-old children is related to the anterior, but not posterior,
        ventral occipito-temporal cortex during an auditory phonological task.\",\"authors\":\"Jin
        Wang; Marc F. Joanisse; James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC7750687\",\"pmid\":\"33341533\",\"doi\":\"10.1016/j.dcn.2020.100898\",\"articleYear\":\"2021\",\"journal\":\"Developmental
        Cognitive Neuroscience\",\"abstractText\":\"\\nPrevious studies have shown
        that reading skill in 3- to 6-year-old children is related to the automatic
        activation of the posterior left ventral occipitotemporal cortex (vOT) during
        spoken language processing, whereas 8- to 15-year-old children and adult readers
        activate the anterior vOT. However, it is unknown how children who are between
        these two age groups automatically activate orthographic representations in
        vOT for spoken language. In the current study, we recruited 153 7- to 8-year-old
        children to fill the age gap from previous studies. Using functional magnetic
        resonance imaging (fMRI), we measured children's reading-related skills and
        brain activity during an auditory phonological task with both a small (i.e.
        onset) and a large (i.e. rhyme) grain size condition. We found that letter
        fluency, but not reading accuracy, was correlated with activation in the anterior
        vOT for the rhyme condition. There were no reading-related skill correlations
        for the posterior vOT or for activation during the onset condition in this
        age group. Our findings reveal that automatic activation in the anterior vOT
        during spoken language processing already occurs in higher skilled 7- to 8-year-old
        children. In addition, increases in naming automaticity is the primary determinant
        of the engagement of vOT during phonological awareness tasks.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/33341533\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"6DPgsG2DmPi4\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"48dbc203-3449-4692-be83-bed7f8b16484\",\"title\":\"Reading
        networks in children with dyslexia compared to children with ocular motility
        disturbances revealed by fMRI.\",\"authors\":\"Ibone Saralegui; Jos\xE9 M.
        Onta\xF1\xF3n; Bego\xF1a Fernandez-Ruanova; Begonya Garcia-Zapirain; Alejandro
        Basterra; Ernesto J. Sanz-Arigita\",\"keywords\":\"\",\"pmcid\":\"PMC4237045\",\"pmid\":\"25477808\",\"doi\":\"10.3389/fnhum.2014.00936\",\"articleYear\":\"2014\",\"journal\":\"Frontiers
        in Human Neuroscience\",\"abstractText\":\"\\nKey PointsDyslexia is a neurological
        disorder with a genetic origin, but the underlying biological and cognitive
        causes are still being investigated.This study compares the brain activation
        pattern while reading in Spanish, a semitransparent language, in three groups
        of children: typically developing readers, dyslexic readers and readers with
        functional monocular vision.Based on our results Dyslexia would be a neurological
        disorder not related to vision impairments and would require a multidisciplinary
        treatment based on improving phonological awareness and language development.
        Developmental dyslexia is a neurological disorder the underlying biological
        and cognitive causes of which are still being investigated, a key point, because
        the findings will determine the best therapeutic approach to use. Using functional
        magnetic resonance imaging, we studied the brain activation pattern while
        reading in the language-related cortical areas from the two reading routes,
        phonological and orthographic, and the strength of their association with
        reading scores in 66 Spanish-speaking children aged 9-12 years divided into
        three groups: typically developing readers (controls), dyslexic readers and
        readers with monocular vision due to ocular motility disorders but with normal
        reading development, to assess whether (or not) the neuronal network for reading
        in children with dyslexia has similarities with that in children with impaired
        binocular vision due to ocular motility disorders. We found that Spanish-speaking
        children with dyslexia have a brain circuit for reading that differs from
        that in children with monocular vision. Individuals with dyslexia tend to
        hypoactivate some of the language-related areas in the left hemisphere engaged
        by the phonological route, especially the visual word form area and left Wernicke's
        area, and try to compensate this deficit by activating language-related areas
        related to the orthographic route, such as the anterior part of the visual
        word form area and the posterior part of both middle temporal gyri. That is,
        they seem to compensate for impairment in the phonological route through orthographic
        routes of both hemispheres. Our results suggest that ocular motility disturbances
        do not play a causal role in dyslexia. Dyslexia seems to be a neurological
        disorder that is unrelated to vision impairments and requires early recognition
        and multidisciplinary treatment, based on improving phonological awareness
        and language development, to achieve the best possible outcome.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/25477808\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"rnaDT5UGqEMp\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"003ae004-d61a-404c-8241-ba93fec0fd5e\",\"title\":\"Development
        of Brain Mechanisms for Processing Orthographic and Phonologic Representations\",\"authors\":\"James
        R. Booth; Douglas D. Burman; Joel R. Meyer; Darren R. Gitelman; Todd B. Parrish;
        M. Marsel Mesulam\",\"keywords\":\"\",\"pmcid\":\"PMC1382289\",\"pmid\":\"15453976\",\"doi\":\"10.1162/0898929041920496\",\"articleYear\":\"2004\",\"journal\":\"Journal
        of Cognitive Neuroscience\",\"abstractText\":\"Developmental differences in
        the neurocognitive networks for lexical processing were examined in 15 adults
        and 15 children (9- to 12-year-olds) using functional magnetic resonance imaging
        (fMRI). The lexical tasks involved spelling and rhyming judgments in either
        the visual or auditory modality. These lexical tasks were compared with nonlinguistic
        control tasks involving judgments of line patterns or tone sequences. The
        first main finding was that adults showed greater activation than children
        during the cross-modal lexical tasks in a region proposed to be involved in
        mapping between orthographic and phonologic representations. The visual rhyming
        task, which required conversion from orthography to phonology, produced greater
        activation for adults in the angular gyrus. The auditory spelling task, which
        required the conversion from phonology to orthography, also produced greater
        activation for adults in the angular gyrus. The greater activation for adults
        suggests they may have a more elaborated posterior heteromodal system for
        mapping between representational systems. The second main finding was that
        adults showed greater activation than children during the intra-modal lexical
        tasks in the angular gyrus. The visual spelling and auditory rhyming did not
        require conversion between orthography and phonology for correct performance
        but the adults showed greater activation in a system implicated for this mapping.
        The greater activation for adults suggests that they have more interactive
        convergence between representational systems during lexical processing.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/15453976\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"5NzUEX2Qk8Kj\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"bb56c2ad-f14b-40bd-bcb4-cade2341b661\",\"title\":\"Developmental
        Increase in Top\u2013Down and Bottom\u2013Up Processing in a Phonological
        Task: An Effective Connectivity, fMRI Study\",\"authors\":\"Tali Bitan; Jimmy
        Cheon; Dong Lu; Douglas D. Burman; James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC2821219\",\"pmid\":\"18702576\",\"doi\":\"10.1162/jocn.2009.21065\",\"articleYear\":\"2009\",\"journal\":\"Journal
        of Cognitive Neuroscience\",\"abstractText\":\"We examined age-related changes
        in the interactions among brain regions in children performing rhyming judgments
        on visually presented words. The difficulty of the task was manipulated by
        including a conflict between task-relevant (phonological) information and
        task-irrelevant (orthographic) information. The conflicting conditions included
        pairs of words that rhyme despite having different spelling patterns (jazz-has),
        or words that do not rhyme despite having similar spelling patterns (pint-mint).
        These were contrasted with nonconflicting pairs that have similar orthography
        and phonology (dime-lime) or different orthography and phonology (press-list).
        Using fMRI, we examined effective connectivity among five left hemisphere
        regions of interest: fusiform gyrus (FG), inferior frontal gyrus (IFG), intraparietal
        sulcus (IPS), lateral temporal cortex (LTC), and medial frontal gyrus (MeFG).
        Age-related increases were observed in the influence of the IFG and FG on
        the LTC, but only in conflicting conditions. These results reflect a developmental
        increase in the convergence of bottom-up and top-down information on the LTC.
        In older children, top-down control process may selectively enhance the sensitivity
        of the LTC to bottom-up information from the FG. This may be evident especially
        in situations that require selective enhancement of task-relevant versus task-irrelevant
        information. Altogether these results provide a direct evidence for a developmental
        increase in top-down control processes in language processing. The developmental
        increase in bottom-up processing may be secondary to the enhancement of top-down
        processes.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/18702576\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"6PNND2BLx5bR\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"6d5738d6-851c-4fe9-a3f0-c823b3e5faf9\",\"title\":\"A
        Developmental fMRI Study of Reading and Repetition Reveals Changes in Phonological
        and Visual Mechanisms Over Age\",\"authors\":\"J. A. Church; R. S. Coalson;
        H. M. Lugar; S. E. Petersen; B. L. Schlaggar\",\"keywords\":\"\",\"pmcid\":\"PMC2517103\",\"pmid\":\"18245043\",\"doi\":\"10.1093/cercor/bhm228\",\"articleYear\":\"2008\",\"journal\":\"Cerebral
        Cortex\",\"abstractText\":\"In this study of reading development, children
        (ages 7-10) and adults (ages 18-32) performed overt single-word reading and
        aural repetition tasks on high-frequency word stimuli during functional magnetic
        resonance imaging. Most regions showed similar activity across age groups.
        These widespread regions of similarity indicate that children and adults use
        largely overlapping mechanisms when processing high-frequency words. Significant
        task-related differences included greater activity in occipital cortex for
        the read task, and greater activity in temporal cortex for the repeat task;
        activity levels in these regions were similar for adults and children. However,
        age group differences were found in several posterior regions, including a
        set of regions implicated in adult reading: the left supramarginal gyrus,
        the left angular gyrus, and bilateral anterior extrastriate cortex. The angular
        and supramarginal gyrus regions, hypothesized to play a role in phonology,
        showed decreased activity in adults relative to children for high-frequency
        words. The extrastriate regions had significant activity for both the visual
        read task and auditory repeat task in children, but just for the read task
        in adults, showing significant task and age interactions. These results are
        consistent with decreasing reliance on phonological processing, and increasing
        tuning of visual mechanisms, with age.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/18245043\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7xPRF3RCsSEB\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"49b0aba4-d247-4d5a-a134-c8e958995c87\",\"title\":\"Developmental
        differences of neurocognitive networks for phonological and semantic processing
        in Chinese word reading.\",\"authors\":\"Fan Cao; Danling Peng; Li Liu; Zhen
        Jin; Ning Fan; Yuan Deng; James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC2823253\",\"pmid\":\"18330872\",\"doi\":\"10.1002/hbm.20546\",\"articleYear\":\"2009\",\"journal\":\"Human
        Brain Mapping\",\"abstractText\":\"Developmental differences in the neurocognitive
        networks for phonological and semantic processing in Chinese word reading
        were examined in 13 adults and 13 children using functional magnetic resonance
        imaging (fMRI). Rhyming and semantic association judgments were made to two-character
        words that were presented sequentially in the visual modality. These lexical
        tasks were compared with a nonlinguistic control task involving judgment of
        line patterns. The first main finding was that adults showed greater activation
        than children in right middle occipital gyrus on both the meaning and rhyming
        task, suggesting adults more effectively engage right hemisphere brain regions
        involved in the visual-spatial analysis of Chinese characters. The second
        main finding was that adults showed greater activation than children in left
        inferior parietal lobule for the rhyming as compared with the meaning task,
        suggesting greater specialization of phonological processing in adults. The
        third main finding was that children who had better performance in the rhyming
        task on characters with conflicting orthographic and phonological information
        relative to characters with nonconflicting information showed greater activation
        in left middle frontal gyrus, suggesting greater engagement of brain regions
        involved in the integration of orthography and phonology.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/18330872\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"3TKKmTHug3Q7\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"71caf908-5416-4194-9cd7-efb72b8d422a\",\"title\":\"Developmental
        dyslexia is characterized by the co-existence of visuospatial and phonological
        disorders in Chinese children.\",\"authors\":\"Wai Ting Siok; John A. Spinks;
        Zhen Jin; Li Hai Tan\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"19825347\",\"doi\":\"10.1016/j.cub.2009.08.014\",\"articleYear\":\"2009\",\"journal\":\"Current
        Biology\",\"abstractText\":\"\\nDevelopmental dyslexia is a neurological condition
        that is characterized by severe impairment in reading skill acquisition in
        people with adequate intelligence and typical schooling. For English readers,
        reading impairment is critically associated with a phonological processing
        disorder, which may co-occur with an orthographic (visual word form) processing
        deficit, but not with a general visual processing dysfunction in most dyslexics.
        The pathophysiology of dyslexia varies across languages: for instance, unlike
        English, written Chinese maps visually intricate graphic forms (characters)
        onto meanings; pronunciation of Chinese characters must be rote memorized.
        This suggests that, in Chinese, a fine-grained visuospatial analysis must
        be performed to activate characters' phonology and meaning; consequently,
        disordered phonological processing may commonly co-exist with abnormal visuospatial
        processing in Chinese dyslexia. To test this hypothesis, we conducted an fMRI
        experiment in which 12 Chinese dyslexics, shown previously to exhibit a phonological
        disorder, performed a physical size judgment measuring visuospatial dimensions.
        Compared with 12 control subjects, the dyslexics showed weaker activations
        in left intraparietal sulcus (IPS) mediating visuospatial processing. Analyses
        of individual dyslexics' performances further suggest that developmental dyslexia
        in Chinese is commonly associated with the co-existence of a visuospatial
        deficit and a phonological disorder.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/19825347\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"2temkBEzeqFx\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"3e2f59f9-f446-4e4f-a3ff-e20e72bc9ead\",\"title\":\"Altered
        Neuronal Response During Rapid Auditory Processing and Its Relation to Phonological
        Processing in Prereading Children at Familial Risk for Dyslexia.\",\"authors\":\"Nora
        M. Raschle; Patrice L. Stering; Sarah N. Meissner; Nadine Gaab\",\"keywords\":\"\",\"pmcid\":\"PMC4184369\",\"pmid\":\"23599167\",\"doi\":\"10.1093/cercor/bht104\",\"articleYear\":\"2014\",\"journal\":\"Cerebral
        Cortex\",\"abstractText\":\"Developmental dyslexia (DD) is a learning disability
        affecting 5-17% of children. Although researchers agree that DD is characterized
        by deficient phonological processing (PP), its cause is debated. It has been
        suggested that altered rapid auditory processing (RAP) may lead to deficient
        PP in DD and studies have shown deficient RAP in individuals with DD. Functional
        neuroimaging (fMRI) studies have implicated hypoactivations in left prefrontal
        brain regions during RAP in individuals with DD. When and how these neuronal
        alterations evolve remains unknown. In this article, we investigate functional
        networks during RAP in 28 children with (n = 14) and without (n = 14) a familial
        risk for DD before reading onset (mean: 5.6 years). Results reveal functional
        alterations in left-hemispheric prefrontal regions during RAP in prereading
        children at risk for DD, similar to findings in individuals with DD. Furthermore,
        activation during RAP in left prefrontal regions positively correlates with
        prereading measures of PP and with neuronal activation during PP in posterior
        dorsal and ventral brain areas. Our results suggest that neuronal differences
        during RAP predate reading instruction and thus are not due to experience-dependent
        brain changes resulting from DD itself and that there is a functional relationship
        between neuronal networks for RAP and PP within the prereading brain.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/23599167\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"RBcmD44VrhjL\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"fce293ad-7a05-4819-912c-b4e537988091\",\"title\":\"Decreased
        functional connectivity in the fronto-parietal network in children with mood
        disorders compared to children with dyslexia during rest: An fMRI study.\",\"authors\":\"Tzipi
        Horowitz-Kraus; Mackenzie Woodburn; Akila Rajagopal; Amelia L. Versace; Robert
        A. Kowatch; Michele A. Bertocci; Genna Bebko; Jorge R.C. Almeida; Susan B.
        Perlman; Michael J. Travis; Mary Kay Gill; Lisa Bonar; Claudiu Schirda; Vaibhav
        A. Diwadkar; Jeffrey L. Sunshine; Boris Birmaher; David Axelson; H. Gerry
        Taylor; Sarah M. Horwitz; Thomas Frazier; L. Eugene Arnold; Mary A. Fristad;
        Eric A. Youngstrom; Robert L. Findling; Mary L. Phillips; Scott K. Holland\",\"keywords\":\"\",\"pmcid\":\"PMC5964829\",\"pmid\":\"29845006\",\"doi\":\"10.1016/j.nicl.2018.02.034\",\"articleYear\":\"2018\",\"journal\":\"NeuroImage
        Clinical\",\"abstractText\":\"BACKGROUND: The DSM-5 separates the diagnostic
        criteria for mood and behavioral disorders. Both types of disorders share
        neurocognitive deficits of executive function and reading difficulties in
        childhood. Children with dyslexia also have executive function deficits, revealing
        a role of executive function circuitry in reading. The aim of the current
        study is to determine whether there is a significant relationship of functional
        connectivity within the fronto-parietal and cingulo-opercular cognitive control
        networks to reading measures for children with mood disorders, behavioral
        disorders, dyslexia, and healthy controls (HC). METHOD: Behavioral reading
        measures of phonological awareness, decoding, and orthography were collected.
        Resting state fMRI data were collected, preprocessed, and then analyzed for
        functional connectivity. Differences in the reading measures were tested for
        significance among the groups. Global efficiency (GE) measures were also tested
        for correlation with reading measures in 40 children with various disorders
        and 17 HCs. RESULTS: Significant differences were found between the four groups
        on all reading measures. Relative to HCs and children with mood disorders
        or behavior disorders, children with dyslexia as a primary diagnosis scored
        significantly lower on all three reading measures. Children with mood disorders
        scored significantly lower than controls on a test of phonological awareness.
        Phonological awareness deficits correlated with reduced resting state functional
        connectivity MRI (rsfcMRI) in the cingulo-opercular network for children with
        dyslexia. A significant difference was also found in fronto-parietal global
        efficiency in children with mood disorders relative to the other three groups.
        We also found a significant difference in cingulo-opercular global efficiency
        in children with mood disorders relative to the Dyslexia and Control groups.
        However, none of these differences correlate significantly with reading measures.
        CONCLUSIONS/SIGNIFICANCE: Reading difficulties involve abnormalities in different
        cognitive control networks in children with dyslexia compared to children
        with mood disorders. Findings of the current study suggest increased functional
        connectivity of one cognitive control network may compensate for reduced functional
        connectivity in the other network in children with mood disorders. These findings
        provide guidance to clinical professionals for design of interventions tailored
        for children suffering from reading difficulties originating from different
        pathologies.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/29845006\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7jercAEwU7Eb\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"b4f1a9e4-a025-4ada-942b-a7b1c6686920\",\"title\":\"Reading
        acquisition reorganizes the phonological awareness network only in alphabetic
        writing systems.\",\"authors\":\"Christine Brennan; Fan Cao; Nicole Pedroarena\u2010Leal;
        Chris McNorgan; James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC3537870\",\"pmid\":\"22815229\",\"doi\":\"10.1002/hbm.22147\",\"articleYear\":\"2013\",\"journal\":\"Human
        Brain Mapping\",\"abstractText\":\"It is unknown how experience with different
        types of orthographies influences the neural basis of oral language processing.
        In order to determine the effects of alphabetic and nonalphabetic writing
        systems, the current study examined the influence of learning to read on oral
        language in English and Chinese speakers. Children (8-12 years olds) and adults
        made rhyming judgments to pairs of spoken words during functional magnetic
        resonance imaging (fMRI). Developmental increases were seen only for English
        speakers in the left hemisphere phonological network (superior temporal gyrus
        (STG), inferior parietal lobule, and inferior frontal gyrus). The increase
        in the STG was more pronounced for words with conflicting orthography (e.g.
        pint-mint; jazz-has) even though access to orthography was irrelevant to the
        task. Moreover, higher reading skill was correlated with greater activation
        in the STG only for English speaking children. The effects suggest that learning
        to read reorganizes the phonological awareness network only for alphabetic
        and not logographic writing systems because of differences in the principles
        for mapping between orthographic and phonological representations. The reorganization
        of the auditory cortex may result in better phonological awareness skills
        in alphabetic readers.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/22815229\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"khkR92ECXyvg\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"fbac79a4-55c4-4a2b-92e0-476e4a63b689\",\"title\":\"The
        Brain Basis of the Phonological Deficit in Dyslexia is Independent of IQ\",\"authors\":\"Hiroko
        Tanaka; Jessica M. Black; Charles Hulme; Leanne M. Stanley; Shelli R. Kesler;
        Susan Whitfield-Gabrieli; Allan L. Reiss; John D. E. Gabrieli; Fumiko Hoeft\",\"keywords\":\"\",\"pmcid\":\"PMC4380286\",\"pmid\":\"22006060\",\"doi\":\"10.1177/0956797611419521\",\"articleYear\":\"2011\",\"journal\":\"Psychological
        Science\",\"abstractText\":\"Although the role of IQ in developmental dyslexia
        remains ambiguous, the dominant clinical and research approaches rely on a
        definition of dyslexia that requires reading skill to be significantly below
        the level expected given an individual\u2019s IQ. In the study reported here,
        we used functional MRI (fMRI) to examine whether differences in brain activation
        during phonological processing that are characteristic of dyslexia were similar
        or dissimilar in children with poor reading ability who had high IQ scores
        (discrepant readers) and in children with poor reading ability who had low
        IQ scores (nondiscrepant readers). In two independent samples including a
        total of 131 children, using univariate and multivariate pattern analyses,
        we found that discrepant and nondiscrepant poor readers exhibited similar
        patterns of reduced activation in brain areas such as left parietotemporal
        and occipitotemporal regions. These results converge with behavioral evidence
        indicating that, regardless of IQ, poor readers have similar kinds of reading
        difficulties in relation to phonological processing.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/22006060\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"p9LjYHpzDWYS\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"ff65ada7-5c33-4763-a59d-1f6ffc519ce8\",\"title\":\"Neural
        dissociation of phonological and visual attention span disorders in developmental
        dyslexia: FMRI evidence from two case reports.\",\"authors\":\"C. Peyrin;
        M. Lallier; J.F. D\xE9monet; C. Pernet; M. Baciu; J.F. Le Bas; S. Valdois\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"22285025\",\"doi\":\"10.1016/j.bandl.2011.12.015\",\"articleYear\":\"2012\",\"journal\":\"Brain
        and Language\",\"abstractText\":\"A dissociation between phonological and
        visual attention (VA) span disorders has been reported in dyslexic children.
        This study investigates whether this cognitively-based dissociation has a
        neurobiological counterpart through the investigation of two cases of developmental
        dyslexia. LL showed a phonological disorder but preserved VA span whereas
        FG exhibited the reverse pattern. During a phonological rhyme judgement task,
        LL showed decreased activation of the left inferior frontal gyrus whereas
        this region was activated at the level of the controls in FG. Conversely,
        during a visual categorization task, FG demonstrated decreased activation
        of the parietal lobules whereas these regions were activated in LL as in the
        controls. These contrasted patterns of brain activation thus mirror the cognitive
        disorders' dissociation. These findings provide the first evidence for an
        association between distinct brain mechanisms and distinct cognitive deficits
        in developmental dyslexia, emphasizing the importance of taking into account
        the heterogeneity of the reading disorder.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/22285025\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"5iBVfKrH89NY\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"46b44ec3-41fc-4b5d-96e4-7b0afb912c58\",\"title\":\"Neural
        deficits in second language reading: fMRI evidence from Chinese children with
        English reading impairment\",\"authors\":\"Hanlin You; Nadine Gaab; Na Wei;
        Alice Cheng-Lai; Zhengke Wang; Jie Jian; Meixia Song; Xiangzhi Meng; Guosheng
        Ding\",\"keywords\":\"\",\"pmcid\":\"PMC3499033\",\"pmid\":\"21146615\",\"doi\":\"10.1016/j.neuroimage.2010.12.003\",\"articleYear\":\"2011\",\"journal\":\"NeuroImage\",\"abstractText\":\"In
        alphabetic language systems, converging evidence indicates that developmental
        dyslexia represents a disorder of phonological processing both behaviorally
        and neurobiologically. However, it is still unknown whether, impaired phonological
        processing remains the core deficit of impaired English reading in individuals
        with English as their second language and how it is represented in the neural
        cortex. Using functional magnetic resonance imaging, the present study investigated
        the neural responses to letter rhyming judgment (phonological task) and letter
        same/different judgment (orthographic task) in Chinese school children with
        English and Chinese reading impairment compared to typically developing children.
        Whole brain analyses with multiple comparison correction revealed reduced
        activation within the left lingual/calcarine gyrus during orthographic processing
        in children with reading impairment compared to typical readers. An independent
        region of interest analysis showed reduced activation in occipitotemporal
        regions during orthographic processing, and reduced activation in parietotemporal
        regions during phonological processing, consistent with previous studies in
        English native speakers. These results suggest that similar neural deficits
        are involved for impaired phonological processing in English as both the first
        and the second language acquired. These findings pose implications for reading
        remediation, educational curriculum design, and educational policy for second
        language learners.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/21146615\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7Tv6KTXHiahR\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"f00f56a0-d122-4670-a87d-8766a3bdc684\",\"title\":\"Study
        of functional magnetic resonance imaging (fMRI) in children and adolescents
        with specific learning disorder (dyslexia).\",\"authors\":\"Sambhu Prasad;
        Rajesh Sagar; S. Senthil Kumaran; Manju Mehta\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"32086175\",\"doi\":\"10.1016/j.ajp.2020.101945\",\"articleYear\":\"2020\",\"journal\":\"Asian
        Journal of Psychiatry\",\"abstractText\":\"BACKGROUND\\nDyslexia is a type
        of specific learning disability (SLD) which has neurobiological origin. It
        is characterized by difficulties with accurate and/or fluent word recognition
        and by poor spelling and decoding abilities. The impaired reading in dyslexia
        is associated with inability to process the sensory input that enters the
        nervous system. Functional magnetic resonance imaging (fMRI) has emerged as
        a potential source in understanding the neurobiology and to identify the brain
        basis of sensory stimuli processed in dyslexic patients.\\nMETHODOLOGY\\nThe
        present study was conducted to assess the difference in neural changes using
        fMRI in children and adolescents with SLD compared with normal children and
        also the correlation of clinical parameters with BOLD - fMRI changes. Sixteen
        children and adolescents diagnosed as dyslexia were assessed with All India
        Institute of Medical Sciences (AIIMS) SLD Battery, Mini-International Neuropsychiatric
        Interview for Children and Adolescents (MINI KID) and Aggregated Neurobehavioral
        Student Health and Educational Review (ANSER) system and compared with 15
        controls matched with age and sex. Participants of both groups were asked
        to perform 3 tasks during the fMRI acquisition (phonological, picture-naming
        and semantic tasks).\\nRESULT\\nAs compared to control group, the participants
        with dyslexia show phonological decoding problem. During picture task, the
        participants with dyslexia use more areas of brain involve in recalling the
        memory events while during semantic tasks processing the occipito-temporal
        (fusiform) gyrus was less activated when in contrast to control.\\nCONCLUSION\\nThis
        study shows that participants with dyslexia fail to use normal brain regions
        specialized in language processing, but rather use different areas.\\n\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/32086175\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"wUduJTj6CP4R\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"d3b69250-a0e3-4fe0-9507-918960cb2595\",\"title\":\"Whole-Brain
        Functional Networks for Phonological and Orthographic Processing in Chinese
        Good and Poor Readers\",\"authors\":\"Jing Yang; Li Hai Tan\",\"keywords\":\"\",\"pmcid\":\"PMC6971169\",\"pmid\":\"31993008\",\"doi\":\"10.3389/fpsyg.2019.02945\",\"articleYear\":\"2019\",\"journal\":\"Frontiers
        in Psychology\",\"abstractText\":\" \\nThe neural basis of dyslexia in different
        languages remains unresolved, and it is unclear whether the phonological deficit
        as the core deficit of dyslexia is language-specific or universal. The current
        functional magnetic resonance imaging (fMRI) study using whole-brain data-driven
        network analyses investigated the neural mechanisms for phonological and orthographic
        processing in Chinese children with good and poor reading ability. Sixteen
        good readers and 16 poor readers were requested to make homophone judgments
        (phonological processing) and component judgments (visual-orthographic processing)
        of presented Chinese characters. Poor readers displayed worse performance
        than the good readers in phonological processing, but not in orthographic
        processing. Whole-brain activation analyses showed compensatory activations
        in the poor readers during phonological processing and automatic phonological
        production activation in the good readers during orthographic processing.
        Significant group differences in the topological properties of their brain
        networks were found only in orthographic processing. Analyses of nodal degree
        centrality and betweenness centrality revealed significant group differences
        in both phonological and orthographic processing. The present study supports
        the phonological core deficit hypothesis of reading difficulty in Chinese.
        It also suggests that Chinese good and poor readers might recruit different
        strategies and neural mechanisms for orthographic processing. \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/31993008\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"b7fKcu4Zs5LU\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"5a9be655-29e2-4acc-a7c7-33c2d0477b7c\",\"title\":\"Developmental
        changes in brain regions involved in phonological and orthographic processing
        during spoken language processing\",\"authors\":\"Nadia E. Cone; Douglas D.
        Burman; Tali Bitan; Donald J. Bolger; James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC2443702\",\"pmid\":\"18413290\",\"doi\":\"10.1016/j.neuroimage.2008.02.055\",\"articleYear\":\"2008\",\"journal\":\"NeuroImage\",\"abstractText\":\"Developmental
        differences in brain activation of 9- to 15-year-old children were examined
        during an auditory rhyme decision task to spoken words using functional magnetic
        resonance imaging (fMRI). As a group, children showed activation in the left
        superior/middle temporal gyri (BA 22, 21), right middle temporal gyrus (BA
        21), dorsal (BA 45, pars opercularis) and ventral (BA 46, pars triangularis)
        aspects of the left inferior frontal gyrus, and left fusiform gyrus (BA 37).
        There was a developmental increase in activation in the left middle temporal
        gyrus (BA 22) across all lexical conditions, suggesting that automatic semantic
        processing increases with age regardless of task demands. Activation in the
        left dorsal inferior frontal gyrus also showed developmental increases for
        the conflicting (e.g. PINT-MINT) compared to the non-conflicting (e.g. PRESS-LIST)
        non-rhyming conditions, indicating that this area becomes increasingly involved
        in strategic phonological processing in the face of conflicting orthographic
        and phonological representations. Left inferior temporal/fusiform gyrus (BA
        37) activation was also greater for the conflicting (e.g. PINT-MINT) condition,
        and a developmental increase was found in the positive relationship between
        individuals' reaction time and activation in the left lingual/fusiform gyrus
        (BA 18) in this condition, indicating an age-related increase in the association
        between longer reaction times and greater visual-orthographic processing in
        this conflicting condition. These results suggest that orthographic processing
        is automatically engaged by children in a task that does not require access
        to orthographic information for correct performance, especially when orthographic
        and phonological representations conflict, and especially for longer response
        latencies in older children.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/18413290\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7Sh9spX7tMDQ\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"e7ecc40a-dd19-4565-b946-501c8e095825\",\"title\":\"The
        homophone effect during visual word recognition in children: an fMRI study.\",\"authors\":\"Sharlene
        D. Newman\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"21660483\",\"doi\":\"10.1007/s00426-011-0347-2\",\"articleYear\":\"2012\",\"journal\":\"Psychological
        Research\",\"abstractText\":\"\\nFunctional magnetic resonance imaging was
        used to investigate the role of phonology in visual word recognition (VWR).
        A group of children between the ages of 7 and 13 participated in a lexical
        decision task in which lexical frequency and homophony were manipulated. A
        significant homophone effect was observed for the high-frequency condition,
        indicating that phonology does indeed play a significant role in VWR. The
        brain activation patterns also support this idea in that regions that have
        been linked to phonological processing, the inferior frontal gyrus and the
        inferior parietal lobe, also revealed a homophone effect. Additionally, the
        posterior superior temporal cortex showed a homophone effect; however, this
        activation is argued to be related to lexical competition generated by the
        high-frequency homophone via the activation of multiple semantic representations.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/21660483\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"VkQEuxNnAtuQ\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"d208b1b7-1475-47b3-87de-ff3153044594\",\"title\":\"Differences
        in effective connectivity between dyslexic children and normal readers during
        a pseudoword reading task: an fMRI study.\",\"authors\":\"V. Quaglino; B.
        Bourdin; G. Czternasty; P. Vrignaud; S. Fall; M.E. Meyer; P. Berquin; B. Devauchelle;
        G. de Marco\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"18423328\",\"doi\":\"10.1016/j.neucli.2007.12.007\",\"articleYear\":\"2008\",\"journal\":\"Neurophysiologie
        Clinique\",\"abstractText\":\"PURPOSE: This fMRI study investigated phonological
        and lexicosemantic processing in dyslexic and in chronological age- and reading
        level-matched children in a pseudoword reading task. MATERIALS AND METHODS:
        The effective connectivity network was compared between the three groups using
        a structural model including the supramarginal cortex (BA 40; BA: Brodmann
        area), fusiform cortex (BA 37) and inferior frontal cortex (BA 44/45) areas
        of the left hemisphere. RESULTS: The results revealed differences in connectivity
        patterns. In dyslexic patients, in contrast with chronological age- and reading
        level-matched groups, no causal relationship was demonstrated between BA 40
        and BA 44/45. However, a significant causal relationship was demonstrated
        between BA 37 and BA 44/45 both in dyslexic children and in the reading level-matched
        group. CONCLUSIONS: These findings were interpreted as evidence for a phonological
        deficit in developmental dyslexia.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/18423328\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"4Vxxp3xubEvN\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"f4658b83-ed6e-489e-a7a0-fb37dc02cca8\",\"title\":\"Distinct
        neural signatures of cognitive subtypes of dyslexia: effects of lexicality
        during phonological processing.\",\"authors\":\"Muna Ermingen-Marbach; Julia
        Pape-Neumann; Marion Grande; Anna Grabowska; Stefan Heim\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"24129489\",\"doi\":\"10.55782/ane-2013-1947\",\"articleYear\":\"2013\",\"journal\":\"Acta
        Neurobiologiae Experimentalis\",\"abstractText\":\"The present study investigates
        the neurobiological basis of two subtypes of dyslexia with either a double
        deficit (concerning phonological awareness and rapid naming) or a single rapid
        naming deficit. We compared such groups of German dyslexic primary school
        children to each other and with good reading children in a phoneme deletion
        task performed during fMRI scanning. Children heard German words or pseudowords
        and repeated the remainder of the stimulus while deleting the initial phoneme
        (e.g. tear - _ear). In four conditions, the input stimulus (word or pseudoword)
        could either become another word or pseudoword as output. The word-word condition
        stuck out against all other conditions involving pseudowords: Dyslexics with
        a double deficit showed a strong response in left areas 44 and 45 in Boca's
        region, whereas dyslexics with rapid naming difficulties revealed a contralateral
        effect in right areas 44 and 45. These findings, which were obtained without
        presenting written or pictorial stimuli, reveal that a double deficit in dyslexia
        is not the sum of single deficits, but rather involves the interaction of
        lexical and phonological processing, making strong demands on the left inferior
        frontal cortex. In general, the results stress the importance of considering
        subtypes of dyslexia differentially in order to obtain better insights in
        the neurocognitive mechanisms of impaired and successful reading.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/24129489\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"6B49EyNYbmYZ\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"faf53dba-4366-4993-af5c-c8919b2ad1b8\",\"title\":\"Children
        With Reading Difficulty Rely on Unimodal Neural Processing for Phonemic Awareness\",\"authors\":\"Melissa
        Randazzo; Emma B. Greenspon; James R. Booth; Chris McNorgan\",\"keywords\":\"\",\"pmcid\":\"PMC6868065\",\"pmid\":\"31798430\",\"doi\":\"10.3389/fnhum.2019.00390\",\"articleYear\":\"2019\",\"journal\":\"Frontiers
        in Human Neuroscience\",\"abstractText\":\" \\nPhonological awareness skills
        in children with reading difficulty (RD) may reflect impaired automatic integration
        of orthographic and phonological representations. However, little is known
        about the underlying neural mechanisms involved in phonological awareness
        for children with RD. Eighteen children with RD, ages 9\u201313, participated
        in a functional magnetic resonance imaging (fMRI) study designed to assess
        the relationship of two constructs of phonological awareness, phoneme synthesis,
        and phoneme analysis, with crossmodal rhyme judgment. Participants completed
        a rhyme judgment task presented in two modality conditions; unimodal auditory
        only and crossmodal audiovisual. Measures of phonological awareness were correlated
        with unimodal, but not crossmodal, lexical processing. Moreover, these relationships
        were found only in unisensory brain regions, and not in multisensory brain
        areas. The results of this study suggest that children with RD rely on unimodal
        representations and unisensory brain areas, and provide insight into the role
        of phonemic awareness in mapping between auditory and visual modalities during
        literacy acquisition. \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/31798430\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"ScCK2EwKjgbB\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"a7abfd1e-9727-4656-b82e-9f178ae38739\",\"title\":\"Similar
        alterations in brain function for phonological and semantic processing to
        visual characters in Chinese dyslexia.\",\"authors\":\"Li Liu; Wenjing Wang;
        Wenping You; Yi Li; Neha Awati; Xu Zhao; James R. Booth; Danling Peng\",\"keywords\":\"\",\"pmcid\":\"PMC3987122\",\"pmid\":\"22698991\",\"doi\":\"10.1016/j.neuropsychologia.2012.05.026\",\"articleYear\":\"2012\",\"journal\":\"Neuropsychologia\",\"abstractText\":\"Dyslexia
        in alphabetic languages has been extensively investigated and suggests a central
        deficit in orthography to phonology mapping in the left hemisphere. Compared
        to dyslexia in alphabetic languages, the central deficit for Chinese dyslexia
        is still unclear. Because of the logographic nature of Chinese characters,
        some have suggested that Chinese dyslexia should have larger deficits in the
        semantic system. To investigate this, Chinese children with reading disability
        (RD) were compared to typically developing (TD) children using functional
        magnetic resonance imaging (fMRI) on a rhyming judgment task and on a semantic
        association judgment task. RD children showed less activation for both tasks
        in right visual (BA18, 19) and left occipito-temporal cortex (BA 37), suggesting
        a deficit in visuo-orthographic processing. RD children also showed less activation
        for both tasks in left inferior frontal gyrus (BA44), which additionally showed
        significant correlations with activation of bilateral visuo-orthographic regions
        in the RD group, suggesting that the abnormalities in frontal cortex and in
        posterior visuo-orthographic regions may reflect a deficit in the connection
        between brain regions. Analyses failed to reveal larger differences between
        groups for the semantic compared to the rhyming task, suggesting that Chinese
        dyslexia is similarly impaired in the access to phonology and to semantics
        from the visual orthography.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/22698991\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"PRHidPEAnQc8\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"5405bf75-52e8-4465-bccb-a915549c414f\",\"title\":\"Brain
        bases of morphological processing in young children.\",\"authors\":\"Maria
        M. Arredondo; Ka I Ip; Lucy Shih Ju Hsu; Twila Tardif; Ioulia Kovelman\",\"keywords\":\"\",\"pmcid\":\"PMC5374976\",\"pmid\":\"25930011\",\"doi\":\"10.1002/hbm.22815\",\"articleYear\":\"2015\",\"journal\":\"Human
        Brain Mapping\",\"abstractText\":\"How does the developing brain support the
        transition from spoken language to print? Two spoken language abilities form
        the initial base of child literacy across languages: knowledge of language
        sounds (phonology) and knowledge of the smallest units that carry meaning
        (morphology). While phonology has received much attention from the field,
        the brain mechanisms that support morphological competence for learning to
        read remain largely unknown. In the present study, young English-speaking
        children completed an auditory morphological awareness task behaviorally (n
        = 69, ages 6-12) and in fMRI (n = 16). The data revealed two findings: First,
        children with better morphological abilities showed greater activation in
        left temporoparietal regions previously thought to be important for supporting
        phonological reading skills, suggesting that this region supports multiple
        language abilities for successful reading acquisition. Second, children showed
        activation in left frontal regions previously found active in young Chinese
        readers, suggesting morphological processes for reading acquisition might
        be similar across languages. These findings offer new insights for developing
        a comprehensive model of how spoken language abilities support children's
        reading acquisition across languages.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/25930011\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"4ZroLh7noc7e\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"431091c3-1d9c-444f-b4d2-acde4580b37e\",\"title\":\"Reading
        and spelling skills are differentially related to phonological processing:
        Behavioral and fMRI study\",\"authors\":\"Agnieszka D\u0119bska; Katarzyna
        Chyl; Gabriela Dzi\u0119giel; Agnieszka Kacprzak; Magdalena \u0141uniewska;
        Joanna Plewko; Artur Marchewka; Anna Grabowska; Katarzyna Jednor\xF3g\",\"keywords\":\"\",\"pmcid\":\"PMC6969364\",\"pmid\":\"31377570\",\"doi\":\"10.1016/j.dcn.2019.100683\",\"articleYear\":\"2019\",\"journal\":\"Developmental
        Cognitive Neuroscience\",\"abstractText\":\" \\nThe manuscript reports a study
        on a large sample (N\u202F=\u202F170) of Polish speaking 8\u201313\u202Fyear
        old children, whose brain activation was measured in relation to tasks that
        require auditory phonological processing. We aimed to relate brain activation
        to individual differences in reading and spelling. We found that individual
        proficiency in both reading and spelling significantly correlated with activation
        of the left ventral occipito-temporal cortex encompassing the Visual Word
        Form Area which has been implicated in automatic orthographic activations.
        Reading but not spelling was found to correlate with activation in the left
        anterior dorsal stream (anterior supramarginal and postcentral gyri). Our
        results indicate that the level of both reading and spelling is related to
        activity in areas involved in the storage of fine-grained orthographic representations.
        However, only the reading level is uniquely related to activity of regions
        responsible for the articulation, motor planning and grapheme-to-phoneme correspondence,
        which form the basis for effective decoding skill. \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/31377570\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"QQZiSdGpC2Tj\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"4e9a0a72-c80e-46ba-a245-451843fc7316\",\"title\":\"Examining
        the relationship between home literacy environment and neural correlates of
        phonological processing in beginning readers with and without a familial risk
        for dyslexia: an fMRI study.\",\"authors\":\"Sara J. Powers; Yingying Wang;
        Sara D. Beach; Georgios D. Sideridis; Nadine Gaab\",\"keywords\":\"\",\"pmcid\":\"PMC5061614\",\"pmid\":\"27550556\",\"doi\":\"10.1007/s11881-016-0134-2\",\"articleYear\":\"2016\",\"journal\":\"Annals
        of Dyslexia\",\"abstractText\":\"\\nDevelopmental dyslexia is a language-based
        learning disability characterized by persistent difficulty in learning to
        read. While an understanding of genetic contributions is emerging, the ways
        the environment affects brain functioning in children with developmental dyslexia
        are poorly understood. A relationship between the home literacy environment
        (HLE) and neural correlates of reading has been identified in typically developing
        children, yet it remains unclear whether similar effects are observable in
        children with a genetic predisposition for dyslexia. Understanding environmental
        contributions is important given that we do not understand why some genetically
        at-risk children do not develop dyslexia. Here, we investigate for the first
        time the relationship between HLE and the neural correlates of phonological
        processing in beginning readers with (FHD+, n\u2009=\u200929) and without
        (FHD-, n\u2009=\u200921) a family history of developmental dyslexia. We further\_controlled
        for socioeconomic status to isolate the neurobiological mechanism by which
        HLE affects reading development. Group differences revealed stronger correlation
        of HLE with brain activation in the left inferior/middle frontal and right
        fusiform gyri in FHD- compared to FHD+ children, suggesting greater impact
        of HLE on manipulation of phonological codes and recruitment of orthographic
        representations in typically developing children. In contrast, activation
        in the right precentral gyrus showed a significantly stronger correlation
        with HLE in FHD+ compared to FHD- children, suggesting emerging compensatory
        networks in genetically at-risk children. Overall, our results suggest that
        genetic predisposition for dyslexia alters contributions of HLE to early reading
        skills before formal reading instruction, which has important implications
        for educational practice and intervention models.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/27550556\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"ihsKFmL2z32K\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"7927468f-4f0c-4db9-87f0-66c9c079756a\",\"title\":\"Impaired
        semantic processing during sentence reading in children with dyslexia: Combined
        fMRI and ERP evidence\",\"authors\":\"E SCHULZ; U MAURER; S VANDERMARK; K
        BUCHER; S BREM; E MARTIN; D BRANDEIS\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"18378166\",\"doi\":\"10.1016/j.neuroimage.2008.02.012\",\"articleYear\":\"2008\",\"journal\":\"NeuroImage\",\"abstractText\":\"Developmental
        dyslexia is a specific disorder of reading acquisition characterized by a
        phonological core deficit. Sentence reading is also impaired in dyslexic readers,
        but whether semantic processing deficits contribute is unclear. Combining
        spatially and temporally sensitive neuroimaging techniques to focus on semantic
        processing can provide a more comprehensive characterization of sentence reading
        in dyslexia. We recorded brain activity from 52 children (16 with dyslexia,
        31 controls) with functional magnetic resonance imaging (fMRI) and event-related
        potentials (ERP) in two separate counterbalanced sessions. The children silently
        read and occasionally judged simple sentences with semantically congruous
        or incongruous endings. fMRI and ERP activation during sentence reading and
        semantic processing was analyzed across all children and also by comparing
        children with dyslexia to controls. For sentence reading, we analyzed the
        response to all words in a sentence; for semantic processing, we contrasted
        responses to incongruous and congruous endings. Sentence reading was characterized
        by activation in a left-lateralized language network. Semantic processing
        was characterized by activation in left-hemispheric regions of the inferior
        frontal and superior temporal cortex and by an electrophysiological N400 effect
        after 240 ms with consistent left anterior source localization. Children with
        dyslexia showed decreased activation for sentence reading in inferior parietal
        and frontal regions, and for semantic processing in inferior parietal regions,
        and during the N400 effect. Together, this suggests that semantic impairment
        during sentence reading reduces dyslexic children's response in left anterior
        brain regions underlying the more phasic N400 effect and subsequently modulates
        the more sustained BOLD response in left inferior parietal regions.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/18378166\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"5jVhxgiXBQb3\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"39df277a-bd64-48ff-8b81-d99da14a29ba\",\"title\":\"Neural
        correlates of priming effects in children during spoken word processing with
        orthographic demands\",\"authors\":\"Fan Cao; Kainat Khalid; Rishi Zaveri;
        Donald J. Bolger; Tali Bitan; James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC2891176\",\"pmid\":\"19665784\",\"doi\":\"10.1016/j.bandl.2009.07.005\",\"articleYear\":\"2010\",\"journal\":\"Brain
        and Language\",\"abstractText\":\"Priming effects were examined in 40 children
        (9-15 years old) using functional magnetic resonance imaging (fMRI). An orthographic
        judgment task required participants to determine if two sequentially presented
        spoken words had the same spelling for the rime. Four lexical conditions were
        designed: similar orthography and phonology (O(+)P(+)), similar orthography
        but different phonology (O(+)P(-)), similar phonology but different orthography
        (O(-)P(+)), and different orthography and phonology (O(-)P(-)). In left superior
        temporal gyrus, there was lower activation for targets in O(+)P(+) than for
        those in O(-)P(-) and higher accuracy was correlated with stronger activation
        across all lexical conditions. These results provide evidence for phonological
        priming in children and greater elaboration of phonological representations
        in higher skill children, respectively. In left fusiform gyrus, there was
        lower activation for targets in O(+)P(+) and O(+)P(-) than for those in O(-)P(-),
        suggesting that visual similarity resulted in orthographic priming even with
        only auditory input. In left middle temporal gyrus, there was lower activation
        for targets in O(+)P(+) than all other lexical conditions, suggesting that
        converging orthographic and phonological information resulted in a weaker
        influence on semantic representations. In addition, higher reading skill was
        correlated with weaker activation in left middle temporal gyrus across all
        lexical conditions, suggesting that higher skill children rely to a lesser
        degree on semantics as a compensatory mechanism. Finally, conflict effects
        but not priming effects were observed in left inferior frontal gyrus, suggesting
        that this region is involved in resolving conflicting orthographic and phonological
        information but not in perceptual priming.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/19665784\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"itaawrAFpzQn\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"940b6840-ab15-45c7-8346-8a440f42fcd0\",\"title\":\"Altered
        neural circuits accompany lower performance during narrative comprehension
        in children with reading difficulties: an fMRI study.\",\"authors\":\"Tzipi
        Horowitz-Kraus, Catherine Buck, Dana Dorrmann\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"26987654\",\"doi\":\"10.1007/s11881-016-0124-4\",\"articleYear\":\"2016\",\"journal\":\"Annals
        of Dyslexia\",\"abstractText\":\"\\nNarrative comprehension is a linguistic
        ability that is foundational for future reading ability. The aim of the current
        study was to examine the neural circuitry of children with reading difficulties
        (RD) compared to typical readers during a narrative-comprehension task. We
        hypothesized that due to deficient executive functions, which support narrative
        comprehension abilities, children with RD would display altered activation
        and functional connectivity, as well as lower performance on a narrative-comprehension
        task. Children with RD and typical readers were scanned during a narrative-comprehension
        task and administered reading behavioral tests. Children with RD scored significantly
        lower on the narrative-comprehension task than did typical readers. Composite
        activation maps showed more diffused activation during narrative comprehension
        in the RD group. Maps comparing the two reading groups showed more activation
        in the frontal lobes (regions responsible for executive functions), and functional
        connectivity showed higher global efficiency in children with RD than in typical
        readers. Global efficiency was negatively correlated with phonological awareness
        and reading and executive function scores in the entire study group. Children
        with RD may suffer from narrative-comprehension difficulties due to diffused
        activation of language areas, as was observed during a narrative-comprehension
        task. Greater effort in this task may be reflected by the engagement of brain
        regions related to executive functions and higher functional connectivity
        or attributed to difficulties in phonological processing and reading and executive
        functions. Therefore, the accommodation given to children with RD of reading
        aloud may need to be revised due to the observed difficulty in this domain.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/26987654\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"q6ACrM4Kv2tp\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"e03921ef-b8ca-412b-a008-7e1ee7884853\",\"title\":\"Manipulation
        of Length and Lexicality Localizes the Functional Neuroanatomy of Phonological
        Processing in Adult Readers\",\"authors\":\"Jessica A. Church; David A. Balota;
        Steven E. Petersen; Bradley L. Schlaggar\",\"keywords\":\"\",\"pmcid\":\"PMC2991592\",\"pmid\":\"20433237\",\"doi\":\"10.1162/jocn.2010.21515\",\"articleYear\":\"2011\",\"journal\":\"Journal
        of Cognitive Neuroscience\",\"abstractText\":\"In a previous study of single
        word reading, regions in the left supramarginal gyrus and left angular gyrus
        showed positive BOLD activity in children but significantly less activity
        in adults for high-frequency words [Church, J. A., Coalson, R. S., Lugar,
        H. M., Petersen, S. E., & Schlaggar, B. L. A developmental fMRI study of reading
        and repetition reveals changes in phonological and visual mechanisms over
        age. Cerebral Cortex, 18, 2054-2065, 2008]. This developmental decrease may
        reflect decreased reliance on phonological processing for familiar stimuli
        in adults. Therefore, in the present study, variables thought to influence
        phonological demand (string length and lexicality) were manipulated. Length
        and lexicality effects in the brain were explored using both ROI and whole-brain
        approaches. In the ROI analysis, the supramarginal and angular regions from
        the previous study were applied to this study. The supramarginal region showed
        a significant positive effect of length, consistent with a role in phonological
        processing, whereas the angular region showed only negative deflections from
        baseline with a strong effect of lexicality and other weaker effects. At the
        whole-brain level, varying effects of length and lexicality and their interactions
        were observed in 85 regions throughout the brain. The application of hierarchical
        clustering analysis to the BOLD time course data derived from these regions
        revealed seven clusters, with potentially revealing anatomical locations.
        Of note, a left angular gyrus region was the sole constituent of one cluster.
        Taken together, these findings in adult readers (1) provide support for a
        widespread set of brain regions affected by lexical variables, (2) corroborate
        a role for phonological processing in the left supramarginal gyrus, and (3)
        do not support a strong role for phonological processing in the left angular
        gyrus.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/20433237\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"8KCrPc86TwhA\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"22ed744f-c70e-4a27-8e01-f4fc9f7705a4\",\"title\":\"Cortical
        recruitment patterns in children born prematurely compared with control subjects
        during a passive listening functional magnetic resonance imaging task\",\"authors\":\"Laura
        R. Ment; Bradley S. Peterson; Betty Vohr; Walter Allan; Karen C. Schneider;
        Cheryl Lacadie; Karol H. Katz; Jill Maller-Kesselman; Kenneth Pugh; Charles
        C. Duncan; Robert W. Makuch; R. Todd Constable\",\"keywords\":\"\",\"pmcid\":\"PMC2386989\",\"pmid\":\"17011320\",\"doi\":\"10.1016/j.jpeds.2006.06.007\",\"articleYear\":\"2006\",\"journal\":\"The
        Journal of Pediatrics\",\"abstractText\":\"OBJECTIVES: To use functional magnetic
        resonance imaging (fMRI) to test the hypothesis that subjects who were born
        prematurely develop alternative systems for processing language. STUDY DESIGN:
        Subjects who were born prematurely (n = 14; 600-1250 g birthweight) without
        neonatal brain injury and 10 matched term control subjects were examined with
        a fMRI passive listening task of language, the Clinical Evaluation of Language
        Fundamentals (CELF) and portions of the Comprehensive Test of Phonological
        Processing (CTOPP). The fMRI task was evaluated for both phonologic and semantic
        processing. RESULTS: Although there were differences in CELF scores between
        the subjects born prematurely and control subjects, there were no significant
        differences in the CTOPP measures in the 2 groups. fMRI studies demonstrated
        that the groups differentially engaged neural systems known to process language.
        Children born at term were significantly more likely to activate systems for
        the semantic processing of language, whereas subjects born prematurely preferentially
        engaged regions that subserve phonology. CONCLUSIONS: At 12 years of age,
        children born prematurely and children born at term activate neural systems
        for the auditory processing of language differently. Subjects born prematurely
        engage different networks for phonologic processing; this strategy is associated
        with phonologic language scores that are similar to those of control subjects.
        These biologically based developmental strategies may provide the substrate
        for the improving language skills noted in children who are born prematurely.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/17011320\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"5PHBLvU3CXhm\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"f2e73401-2e20-4a3c-bdf7-4afe99e22217\",\"title\":\"Visual
        motion processing in Chinese children with developmental dyslexia: An fMRI
        study.\",\"authors\":\"Yu\u2010Fei Liu; Yi Qian; Hong\u2010Yan Bi\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"36329601\",\"doi\":\"10.1002/dys.1726\",\"articleYear\":\"2022\",\"journal\":\"Dyslexia\",\"abstractText\":\"\\nDorsal
        stream is an important pathway for visual information transmission. As a part
        of the dorsal pathway, the middle temporal visual motion areas (V5/MT+) are
        mainly responsible for visual motion processing and the ability of visual
        motion processing is closely related to reading. Compared with alphabetic
        scripts, the visual structure of Chinese characters is more complex and there
        are no clear grapheme-phoneme correspondence rules. So the ability of visual
        analysis plays an important role in Chinese character processing. This study
        first investigated the brain activation of Chinese dyslexic children and children
        of the same chronological age when they observed coherent motion stimuli.
        ROI analysis indicated that only the activation of left V5/MT+ was significantly
        weaker in dyslexics than that in the control group. The activity of the magnocellular-dorsal
        stream was closely related to orthographic awareness in the combined data
        (two groups) and the typical children. In dyslexia group, the stronger the
        activation of V5/MT+ was, the worse the phonological awareness, rapid naming
        performance and orthographic awareness were. In short, Chinese dyslexic children
        were deficient in the activation of the left V5/MT+ and the activity of the
        magnocellular-dorsal pathway was closely related to orthographic awareness
        in Chinese pupils.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/36329601\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"FdoJXCeawWQn\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"54e365da-90ec-4b25-8007-b1015ac9bca8\",\"title\":\"Developmental
        increases in effective connectivity to brain regions involved in phonological
        processing during tasks with orthographic demands.\",\"authors\":\"James R.
        Booth; Nitin Mehdiratta; Douglas D. Burman; Tali Bitan\",\"keywords\":\"\",\"pmcid\":\"PMC2692511\",\"pmid\":\"18068690\",\"doi\":\"10.1016/j.brainres.2007.10.080\",\"articleYear\":\"2008\",\"journal\":\"Brain
        Research\",\"abstractText\":\"Developmental differences (9- to 15-year-olds)
        in effective connectivity in left hemisphere regions were examined using dynamic
        causal modeling (DCM) of functional magnetic resonance imaging (fMRI) data.
        Children completed spelling tasks in the visual and auditory modalities in
        which they were asked to determine if two words were spelled the same from
        the first vowel onwards. Intrinsic (anatomical) connections were strongest
        from primary cortical regions to unimodal association areas - from Heschl's
        gyrus to superior temporal gyrus for the auditory spelling task and from calcarine
        to fusiform gyrus for the visual spelling task. The modulatory (experimental)
        effect for the visual spelling task from calcarine to superior temporal gyrus
        was stronger than all other effects from calcarine and this effect showed
        a developmental increase, suggesting automatic activation of phonology that
        increased with age. The modulatory effect from Heschl's gyrus to dorsal inferior
        frontal gyrus also showed a developmental increase, suggesting age-related
        increases in phonological segmentation in verbal working memory. All together,
        these results suggest that there are developmental increases in automatic
        access into brain regions involved in phonological processing in tasks that
        require orthographic processing.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/18068690\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"4GzoccsZkVJe\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"9ff26639-14e2-462f-8535-6fa4bea35c02\",\"title\":\"Neurofunctionally
        dissecting the reading system in children.\",\"authors\":\"Johanna Liebig;
        Eva Froehlich; Carmen Morawetz; Mario Braun; Arthur M. Jacobs; Hauke R. Heekeren;
        Johannes C. Ziegler\",\"keywords\":\"\",\"pmcid\":\"PMC6987884\",\"pmid\":\"28780219\",\"doi\":\"10.1016/j.dcn.2017.07.002\",\"articleYear\":\"2017\",\"journal\":\"Developmental
        Cognitive Neuroscience\",\"abstractText\":\"The reading system can be broken
        down into four basic subcomponents in charge of prelexical, orthographic,
        phonological, and lexico-semantic processes. These processes need to jointly
        work together to become a fluent and efficient reader. Using functional magnetic
        resonance imaging (fMRI), we systematically analyzed differences in neural
        activation patterns of these four basic subcomponents in children (N=41, 9-13
        years) using tasks specifically tapping each component (letter identification,
        orthographic decision, phonological decision, and semantic categorization).
        Regions of interest (ROI) were selected based on a meta-analysis of child
        reading and included the left ventral occipito-temporal cortex (vOT), left
        posterior parietal cortex (PPC), left inferior frontal gyrus (IFG), and bilateral
        supplementary motor area (SMA). Compared to a visual baseline task, enhanced
        activation in vOT and IFG was observed for all tasks with very little differences
        between tasks. Activity in the dorsal PPC system was confined to prelexical
        and phonological processing. Activity in the SMA was found in orthographic,
        phonological, and lexico-semantic tasks. Our results are consistent with the
        idea of an early engagement of the vOT accompanied by executive control functions
        in the frontal system, including the bilateral SMA.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/28780219\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"5DzCWhv4fjKz\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"02af8887-6d89-4ac2-b032-2b5401b4f5b7\",\"title\":\"A
        different finding on the role of cerebro-cerebellar RSFC in reading skills
        among Chinese children with developmental dyslexia.\",\"authors\":\"Yuying
        Jin; Jingxian Zhao; Xintong Su; Si Tan; Xiaojing Song; Kaize Yang; Simin Deng;
        Lizi Lin; Xiuhong Li\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"40250325\",\"doi\":\"10.1016/j.jpsychires.2025.04.024\",\"articleYear\":\"2025\",\"journal\":\"Journal
        of Psychiatric Research\",\"abstractText\":\"BACKGROUND: It's still unclear
        on the effect of the cerebellum on developmental dyslexia (DD). To narrow
        the gap, we compared the cerebro-cerebellar resting-state functional connectivity
        (RSFC) between children with and without DD, and analyzed the relationship
        of cerebro-cerebellar RSFC with reading skills.\\n\\nMETHODS: 43 children
        with DD (32 males, mean age\_=\_9.21 years) and 82 typical development (TD)
        children (47 males, mean age\_=\_8.96 years) were recruited from China. All
        participants completed rs-fMRI scan and reading tasks including phonological
        awareness, rapid automatized naming, and orthography awareness. Cerebro-cerebellar
        RSFC were compared between children with and without DD. And the correlations
        between cerebro-cerebellar RSFC and reading skills were analyzed in all subjects.\\n\\nRESULTS:
        Compared to the TD group, Chinese children with DD showed significantly increased
        RSFC between cerebellar vermis IX and right superior frontal gyrus, and between
        cerebellar vermis IX and left middle frontal gyrus. The RSFC between vermis
        IX and right superior frontal gyrus was correlated with response time of rapid
        automatized naming (r\_=\_0.198, p\_=\_0.028) and phonological awareness score
        (r\_=\_-0.288, p\_=\_0.002). And the RSFC between vermis IX and left middle
        frontal gyrus was also correlated with response time of rapid automatized
        naming (r\_=\_0.223, p\_=\_0.013) and phonological awareness score (r\_=\_-0.182,
        p\_=\_0.048).\\n\\nCONCLUSION: Chinese children with DD showed increased RSFC
        between the vermal cerebellum and bilateral frontal gyrus. It may potentially
        compensate for their phonological awareness and rapid automatized naming deficits.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/40250325\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"sUzsKmP8QaCK\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"12028e03-7338-4b2d-a618-1dcd6bc47d93\",\"title\":\"Functional
        parcellation of the right cerebellar lobule VI in children with normal or
        impaired reading.\",\"authors\":\"Hehui Li; James R. Booth; Xiaoxia Feng;
        Na Wei; Manli Zhang; Jia Zhang; Hejing Zhong; Chunming Lu; Li Liu; Guosheng
        Ding; Xiangzhi Meng\",\"keywords\":\"\",\"pmcid\":\"PMC7704787\",\"pmid\":\"32976851\",\"doi\":\"10.1016/j.neuropsychologia.2020.107630\",\"articleYear\":\"2020\",\"journal\":\"Neuropsychologia\",\"abstractText\":\"Neuroimaging
        studies have reported that the right cerebellar lobule VI is engaged in reading,
        but its role is unclear. The goal of our study was to identify functionally-dissociable
        subregions in the right lobule VI and how these subregions contribute to reading
        in children with normal or impaired reading. In Experiment I, typically developing
        children performed an orthographic task and a phonological task during functional
        magnetic resonance imaging (fMRI). We classified the voxels in the right lobule
        VI into seven zones based on the patterns of functional connectivity with
        the cerebrum across both tasks. In Experiment II, we compared the brain activation
        and cerebro-cerebellar connectivities of each subregion between children readers
        with different reading levels. We did not find significant group differences
        in cerebellar activation. However, we found that impaired readers had considerably
        higher functional connectivity between R1 and the right angular gyrus and
        the right precuneus compared to the control group in the phonological task.
        These findings show that the right cerebellar lobule VI is functionally parceled
        and its subregions might be differentially connected with the cerebrum between
        children with normal reading abilities and those with impaired reading.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/32976851\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"nPzEkPFqdKaF\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"3c808927-32ed-4c37-b32c-97181950127d\",\"title\":\"The
        left occipitotemporal system in reading: Disruption of focal fMRI connectivity
        to left inferior frontal and inferior parietal language areas in children
        with dyslexia\",\"authors\":\"Sanne van der Mark; Peter Klaver; Kerstin Bucher;
        Urs Maurer; Enrico Schulz; Silvia Brem; Ernst Martin; Daniel Brandeis\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"20934519\",\"doi\":\"10.1016/j.neuroimage.2010.10.002\",\"articleYear\":\"2011\",\"journal\":\"NeuroImage\",\"abstractText\":\"Developmental
        dyslexia is a severe reading disorder, which is characterized by dysfluent
        reading and impaired automaticity of visual word processing. Adults with dyslexia
        show functional deficits in several brain regions including the so-called
        \\\"Visual Word Form Area\\\" (VWFA), which is implicated in visual word processing
        and located within the larger left occipitotemporal VWF-System. The present
        study examines functional connections of the left occipitotemporal VWF-System
        with other major language areas in children with dyslexia. Functional connectivity
        MRI was used to assess connectivity of the VWF-System in 18 children with
        dyslexia and 24 age-matched controls (age 9.7-12.5 years) using five neighboring
        left occipitotemporal regions of interest (ROIs) during a continuous reading
        task requiring phonological and orthographic processing. First, the results
        revealed a focal origin of connectivity from the VWF-System, in that mainly
        the VWFA was functionally connected with typical left frontal and parietal
        language areas in control children. Adjacent posterior and anterior VWF-System
        ROIs did not show such connectivity, confirming the special role that the
        VWFA plays in word processing. Second, we detected a significant disruption
        of functional connectivity between the VWFA and left inferior frontal and
        left inferior parietal language areas in the children with dyslexia. The current
        findings add to our understanding of dyslexia by showing that functional disconnection
        of the left occipitotemporal system is limited to the small VWFA region crucial
        for automatic visual word processing, and emerges early during reading acquisition
        in children with dyslexia, along with deficits in orthographic and phonological
        processing of visual word forms.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/20934519\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"85XgXn5Zrdur\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"01372da3-2189-4df5-9b54-8db0a0b1d299\",\"title\":\"Children
        with Reading Difficulties Show Differences in Brain Regions Associated with
        Orthographic Processing During Spoken Language Processing\",\"authors\":\"Amy
        S. Desroches; Nadia E. Cone; Donald J. Bolger; Tali Bitan; Douglas D. Burman;
        James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC2942963\",\"pmid\":\"20691675\",\"doi\":\"10.1016/j.brainres.2010.07.097\",\"articleYear\":\"2010\",\"journal\":\"Brain
        Research\",\"abstractText\":\"We explored the neural basis of spoken language
        deficits in children with reading difficulty, specifically focusing on the
        role of orthography during spoken language processing. We used functional
        magnetic resonance imaging (fMRI) to examine differences in brain activation
        between children with reading difficulties (aged 9-to-15 years) and age-matched
        children with typical achievement during an auditory rhyming task. Both groups
        showed activation in bilateral superior temporal gyri (BA 42 and 22), a region
        associated with phonological processing, with no significant between-group
        differences. Interestingly, typically achieving children, but not children
        with reading difficulties, showed activation of left fusiform cortex (BA 37),
        a region implicated in orthographic processing. Furthermore, this activation
        was significantly greater for typically achieving children compared to those
        with reading difficulties. These findings suggest that typical children automatically
        activate orthographic representations during spoken language processing, while
        those with reading difficulties do not. Follow-up analyses revealed that the
        intensity of the activation in the fusiform gyrus was associated with significantly
        stronger behavioral conflict effects in typically achieving children only
        (i.e., longer latencies to rhyming pairs with orthographically dissimilar
        endings than to those with identical orthographic endings; jazz-has vs. cat-hat).
        Finally, for reading disabled children, a positive correlation between left
        fusiform activation and nonword reading was observed, such that greater access
        to orthography was related to decoding ability. Taken together, the results
        suggest that the integration of orthographic and phonological processing is
        directly related to reading ability.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/20691675\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"8CGdXGZVN7JK\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"af34b389-3cf3-4a41-8766-715d423836fa\",\"title\":\"Disruption
        of posterior brain systems for reading in children with developmental dyslexia.\",\"authors\":\"Bennett
        A Shaywitz; Sally E Shaywitz; Kenneth R Pugh; W.Einar Mencl; Robert K Fulbright;
        Pawel Skudlarski; R.Todd Constable; Karen E Marchione; Jack M Fletcher; G.Reid
        Lyon; John C Gore\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"12114001\",\"doi\":\"10.1016/S0006-3223(02)01365-3\",\"articleYear\":\"2002\",\"journal\":\"Biological
        Psychiatry\",\"abstractText\":\"BACKGROUND: Converging evidence indicates
        a functional disruption in the neural systems for reading in adults with dyslexia.
        We examined brain activation patterns in dyslexic and nonimpaired children
        during pseudoword and real-word reading tasks that required phonologic analysis
        (i.e., tapped the problems experienced by dyslexic children in sounding out
        words).\\n\\nMETHODS: We used functional magnetic resonance imaging (fMRI)
        to study 144 right-handed children, 70 dyslexic readers, and 74 nonimpaired
        readers as they read pseudowords and real words.\\n\\nRESULTS: Children with
        dyslexia demonstrated a disruption in neural systems for reading involving
        posterior brain regions, including parietotemporal sites and sites in the
        occipitotemporal area. Reading skill was positively correlated with the magnitude
        of activation in the left occipitotemporal region. Activation in the left
        and right inferior frontal gyri was greater in older compared with younger
        dyslexic children.\\n\\nCONCLUSIONS: These findings provide neurobiological
        evidence of an underlying disruption in the neural systems for reading in
        children with dyslexia and indicate that it is evident at a young age. The
        locus of the disruption places childhood dyslexia within the same neurobiological
        framework as dyslexia, and acquired alexia, occurring in adults.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/12114001\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"pjy2BY6woEcF\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"b9b7d802-c137-448d-8314-c96f67edd3ca\",\"title\":\"Differentiating
        the neural response to intervention in children with developmental dyslexia\",\"authors\":\"Timothy
        N. Odegard; Jeremiah Ring; Stephanie Smith; John Biggan; Jeff Black\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"18483867\",\"doi\":\"10.1007/s11881-008-0014-5\",\"articleYear\":\"2008\",\"journal\":\"Annals
        of Dyslexia\",\"abstractText\":\"Developmental dyslexia is associated with
        functional abnormalities within reading areas of the brain. For some children
        diagnosed with dyslexia, phonologically based remediation programs appear
        to rehabilitate brain function in key reading areas (Shaywitz et al., Biological
        Psychiatry 55: 101-110, 2004; Simos et al., Neuroscience 58: 1203-1213, 2002).
        However, a non-trivial number of children diagnosed with dyslexia fail to
        respond to these interventions (Torgesen, Learning Disabilities Research &
        Practice 15: 55-64, 2000). A cross-sectional fMRI study investigating post-treatment
        effects was conducted in an effort to better understand differences in brain
        function between treatment responders and non-responders. Educational testing
        and brain activation measured after treatment suggested that the reading intervention
        used in the present study rehabilitated several basic level reading processes
        in all participants diagnosed with dyslexia. However, activation in the left
        inferior parietal lobe differentiated treatment responders and non-responders
        in comparison to non-impaired readers. Children with persistent deficits in
        single word decoding (treatment non-responders) demonstrated significantly
        less activation in the left inferior parietal lobe when compared to non-impaired
        readers.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/18483867\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"ZnEm99MsRpSp\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"9446dc2c-2d02-4935-98f9-7e7ed6688b4e\",\"title\":\"A
        procedure for identifying regions preferentially activated by attention to
        semantic and phonological relations using functional magnetic resonance imaging.\",\"authors\":\"Kathleen
        B McDermott; Steven E Petersen; Jason M Watson; Jeffrey G Ojemann\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"12457755\",\"doi\":\"10.1016/s0028-3932(02)00162-8\",\"articleYear\":\"2003\",\"journal\":\"Neuropsychologia\",\"abstractText\":\"A
        procedure is introduced for using functional magnetic resonance imaging (fMRI)
        techniques to identify neural regions associated with attention to semantic
        and phonological aspects of written words within a single group of subjects.
        Short lists (16 words/list), consisting of visually-presented semantically-related
        words (bed, rest) or rhyming words (weep, beep) were presented rapidly to
        subjects, who were asked to attend to the relations among the words. Regions
        preferentially involved in attention to semantic relations appeared within
        left anterior/ventral inferior frontal gyrus (IFG, approximate Brodmann Area,
        BA47), left posterior/dorsal IFG (BA44/45), left superior/middle temporal
        cortex (BA22/21), left fusiform gyrus (BA37), and right cerebellum. Regions
        preferentially involved in attention to phonological relations appeared within
        left inferior frontal cortex (near BA6/44, posterior to the semantic regions
        within IFG described above) and within bilateral inferior parietal cortex
        (BA40) and precuneus (BA7). This method is notable in that a comparison of
        the two tasks within some of the individual subjects revealed activation patterns
        similar to the group average, especially within left inferior frontal and
        left superior/middle parietal cortices. This fact combined with the efficiency
        with which the data can be obtained (here, in about an hour of functional
        scanning) and the adaptability of the task for many different subject populations
        suggests a wide range of possibilities for this technique: it could be used
        to track language development (e.g. in children), compare language organization
        across subject populations (e.g. for dyslexic or blind subjects), and identify
        language regions within individuals (e.g. potentially to aid in surgical planning).\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/12457755\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"5DVn7UroPoBS\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"e63bc900-4548-454e-9d26-6886593fd8fc\",\"title\":\"Brain
        Mechanisms Underlying Visuo-Orthographic Deficits in Children With Developmental
        Dyslexia\",\"authors\":\"Fan Cao; Xin Yan; Gregory J. Spray; Yanni Liu; Yuan
        Deng\",\"keywords\":\"\",\"pmcid\":\"PMC6291466\",\"pmid\":\"30574080\",\"doi\":\"10.3389/fnhum.2018.00490\",\"articleYear\":\"2018\",\"journal\":\"Frontiers
        in Human Neuroscience\",\"abstractText\":\" \\nMultiple hypotheses have been
        proposed to explain the reading difficulty caused by developmental dyslexia
        (DD). The current study examined visuo-orthographic processing in children
        with dyslexia to determine whether orthographic deficits are explainable based
        solely on visual deficits. To identify orthographic-specific, visual perception-specific,
        and overlapping deficits, we included two tasks (lexical and perceptual) in
        three Chinese subject groups: children with DD, age-matched controls (AC),
        and reading matched controls (RC) using functional magnetic resonance imaging
        (fMRI). We found that the left precuneus showed decreased activation across
        both tasks for the DD group compared to the two control groups, thus reflecting
        visual processing deficits in children with DD, which also affects orthographic
        processing. Furthermore, we found that the functional connectivity between
        left middle occipital gyrus (LMOG) and left inferior frontal gyrus (IFG) was
        decreased in the DD group compared to AC and RC for only the lexical task.
        This suggests a weaker association between orthography and phonology for children
        with DD. In addition, the children with DD showed decreased functional connectivity
        between the LMOG and right parahippocampal gyrus for only the visual perceptual
        task, thereby indicating a weaker association between visual regions for DD
        during visual symbol processing. Taken together, our findings suggest that
        the observed orthographic processing deficit in DD might be driven by both
        a basic visual deficit, and a linguistic deficit. \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/30574080\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"WE9q3WnCodKz\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"4ab28d5b-e1ce-429c-a6ac-c044878ade9e\",\"title\":\"Word
        frequency effects in the left IFG in dyslexic and normally reading children
        \ during picture naming and reading.\",\"authors\":\"Marion Grande; Elisabeth
        Meffert; Walter Huber; Katrin Amunts; Stefan Heim\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"21609767\",\"doi\":\"10.1016/j.neuroimage.2011.05.033\",\"articleYear\":\"2011\",\"journal\":\"NeuroImage\",\"abstractText\":\"Word
        frequency effects have been reported in numerous neuroimaging studies with
        typically reading adults, emphasising the role of the left inferior frontal
        gyrus (LIFG). Within LIFG, different cytoarchitectonic modules (areas 44 and
        45) have been related to phonological vs. lexico-semantic processing, respectively.
        This fMRI study investigated the differential impact of word frequency on
        LIFG activation in reading and picture naming in primary school children with
        and without developmental dyslexia. All children showed the typical LIFG frequency
        effect in both tasks. The effect was comparable in a fronto-orbital region
        anterior-inferior adjacent to area 45. During reading but not picture naming,
        a second effect was observed in area 44. Here, the fMRI effect for lexical
        frequency was stronger for the dyslexic than the normal readers. These findings
        demonstrate the neural underpinnings of a selective deficit in dyslexic children
        in the graphemic input lexicon, whereas abstract lexical representations appear
        to be processed equally well in dyslexic and normally reading children. To
        conclude, the present fMRI study demonstrated differential impact of word
        frequency on LIFG activation in primary school children during reading but
        not picture naming. Apart from extending previous knowledge from studies with
        adults to childhood, the study sheds further light on a potential neural mechanism
        for deficient grapheme-to-phoneme conversion in dyslexic children.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/21609767\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"3qen4N9R2vS9\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"464758b2-1da0-46d6-9b42-d78020cd01db\",\"title\":\"Neural
        correlates of cognitive control deficits in children with reading disorder.\",\"authors\":\"Amy
        E. Margolis; David Pagliaccio; Katie S. Davis; Lauren Thomas; Sarah M. Banker;
        Marilyn Cyr; Rachel Marsh\",\"keywords\":\"\",\"pmcid\":\"PMC6765445\",\"pmid\":\"30919230\",\"doi\":\"10.1007/s11682-019-00083-x\",\"articleYear\":\"2020\",\"journal\":\"Brain
        Imaging and Behavior\",\"abstractText\":\"Reading disorder (RD) is characterized
        by deficient phonological processing, but children with RD also have cognitive
        control deficits, the neural correlates of which are not fully understood.
        We used fMRI to assess neural activity during the resolution of cognitive
        conflict on the Simon Spatial Incompatibility task and patterns of resting-state
        functional connectivity (RSFC) from task control (TC) regions in 7-12-year-old
        children with RD compared to their typically developing (TD) peers. Relative
        to TD children (n\u2009=\u200917), those with RD (n\u2009=\u200916) over-engaged
        a right superior/medial frontal cluster during the resolution of conflict
        (p\u2009=\u2009.05). Relative to TD children (n\u2009=\u200918), those with
        RD (n\u2009=\u200917) also showed reduced RSFC (voxel-wise p\u2009<\u2009.001;
        cluster-size p\u2009<\u2009.05, FDR corrected) from cingulo-opercular seeds
        to left hemisphere fronto-parietal and temporo-parietal reading-related regions,
        perhaps reflecting reduced organization of TC circuits and reduced integration
        with reading-related regions. Children with RD additionally showed reduced
        RSFC between fronto-parietal and default mode network regions. Follow-up analyses
        in a subset of children with both useable task and resting state data (RD\u2009=\u200913;
        TD\u2009=\u200917) revealed that greater conflict-related activation of the
        right frontal Simon task ROI associated with better word-reading, perhaps
        suggesting a compensatory role for this over-engagement. Connectivity from
        fronto-parietal seeds significantly associated with Simon task performance
        and word-reading accuracy in RD children. These findings suggest that altered
        functioning and connectivity of control circuits may contribute to cognitive
        control deficits in children with RD. Future studies should assess the utility
        of adding cognitive control training to reading remediation programs.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/30919230\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"QfHNzHTqSNkK\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"2ddf73dc-2eda-412c-aa48-a89272ef0725\",\"title\":\"Neural
        processing of morphology during reading in children.\",\"authors\":\"Bechor
        Barouch; Yael Weiss; Tami Katzir; Tali Bitan\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"35026319\",\"doi\":\"10.1016/j.neuroscience.2021.12.025\",\"articleYear\":\"2022\",\"journal\":\"Neuroscience\",\"abstractText\":\"The
        importance of morphological segmentation for reading has been shown in numerous
        behavioral studies in children and adults. However, little is known about
        developmental changes in the neural basis of morphological processing. In
        addition to effects of age and reading skill, morphological processing during
        reading may be affected by the morphological structure of the language and
        the transparency of its orthography. Hebrew provides a unique opportunity
        to study these factors, with its rich morphological structure, and two versions
        of script that differ in orthographic transparency. Two groups of children
        (2nd-3rd and 5th-6th graders) were scanned using fMRI while reading aloud
        Hebrew nouns. Half of the words were composed of roots and templates (bi-morphemic)
        and half were mono-morphemic. The words were presented at two levels of transparency:
        with or without diacritics. ROI analyses showed greater activation for mono
        over bi-morphemic words across groups in the anterior portions of bilateral
        middle and superior temporal gyri, especially for the transparent script.
        These results diverge from a previous finding in adults, showing left frontal
        activation in the non-transparent script with the same stimuli. These results
        support the early sensitivity of young Hebrew readers to the rich morphological
        structure of their language but suggest a developmental change in the role
        of morphological processes during reading. While in adults morpho-phonological
        segmentation during reading may compensate for orthographic opacity, morphological
        processes in children may rely more on semantic aspects, and are enhanced
        by orthographic transparency.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/35026319\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"AfSSiyn225HW\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"0b9f085c-ae96-4402-ac38-184ebe8b759e\",\"title\":\"How
        reading acquisition changes children\u2019s spoken language network\",\"authors\":\"Karla
        Monzalvo; Ghislaine Dehaene-Lambertz\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"24216407\",\"doi\":\"10.1016/j.bandl.2013.10.009\",\"articleYear\":\"2013\",\"journal\":\"Brain
        and Language\",\"abstractText\":\"To examine the influence of age and reading
        proficiency on the development of the spoken language network, we tested 6-
        and 9-years-old children listening to native and foreign sentences in a slow
        event-related fMRI paradigm. We observed a stable organization of the peri-sylvian
        areas during this time period with a left dominance in the superior temporal
        sulcus and inferior frontal region. A year of reading instruction was nevertheless
        sufficient to increase activation in regions involved in phonological representations
        (posterior superior temporal region) and sentence integration (temporal pole
        and pars orbitalis). A top-down activation of the left inferior temporal cortex
        surrounding the visual word form area, was also observed but only in 9year-olds
        (3years of reading practice) listening to their native language. These results
        emphasize how a successful cultural practice, reading, slots in the biological
        constraints of the innate spoken language network.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/24216407\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"3Yg3WPV3chbn\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"c84a3803-9b7b-400d-ac22-061260ab8860\",\"title\":\"Dissociating
        executive function and ADHD influences on reading ability in children with
        dyslexia.\",\"authors\":\"Noor Z. Al Dahhan; Kelly Halverson; Carrie P. Peek;
        Dayna Wilmot; Anila D'Mello; Rachel R. Romeo; Olivia Meegoda; Andrea Imhof;
        Karolina Wade; Anissa Sridhar; Eric Falke; Tracy M. Centanni; John D.E. Gabrieli;
        Joanna A. Christodoulou\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"35661478\",\"doi\":\"10.1016/j.cortex.2022.03.025\",\"articleYear\":\"2022\",\"journal\":\"Cortex\",\"abstractText\":\"Developmental
        dyslexia (DD) and attention-deficit/hyperactivity disorder (ADHD) are two
        of the most common neurodevelopmental disorders among school-age children.
        These disorders frequently co-occur, with up to 40-50% of children with one
        diagnosis meeting criteria for the other, and similar percentages of children
        with either DD or ADHD exhibiting impaired executive functions (EF). Although
        both ADHD and EF deficits are common in dyslexia, there is little evidence
        about how ADHD and EF deficits specifically influence the brain basis of reading
        difficulty in dyslexia, and whether the influences of ADHD and EF on dyslexia
        can be disentangled. The goal of the current study was to investigate, at
        both behavioral and brain levels, whether reading performance in individuals
        with dyslexia is more strongly associated with EF or with diagnostic status
        of comorbid ADHD. We examined reading abilities and EF in children (8-13 years
        old) with typical reading ability, DD only, or both DD\_+\_ADHD. Across both
        groups with dyslexia, impaired EF was associated with greater impairment on
        measures loading onto a reading fluency, but not a reading accuracy, factor.
        There were no significant differences between the DD and DD\_+\_ADHD groups
        on measures of reading fluency or reading accuracy. During functional magnetic
        resonance imaging (fMRI) while performing a rhyme-matching reading task requiring
        phonological awareness, typically developing readers showed greater left-hemisphere
        reading network activation than children with DD or DD\_+\_ADHD. Children
        with DD and DD\_+\_ADHD did not show differential activation, but DD children
        with unimpaired EF showed greater activation than those with impaired EF in
        reading-related areas. Thus, ADHD status alone had no measurable influence
        on reading performance or brain activation. Impaired EF in dyslexia, independent
        of ADHD status, was associated with greater deficits in reading fluency and
        greater reductions of activation in response to print in the typical left-hemisphere
        reading network.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/35661478\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"yctP4LeHB87Q\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"d884d8af-ebd4-4b61-bd79-b0ebe3901b01\",\"title\":\"The
        BDNF Val66Met Polymorphism Influences Reading Ability and Patterns of Neural
        \ Activation in Children.\",\"authors\":\"Kaja K. Jasi\u0144ska; Peter J.
        Molfese; Sergey A. Kornilov; W. Einar Mencl; Stephen J. Frost; Maria Lee;
        Kenneth R. Pugh; Elena L. Grigorenko; Nicole Landi\",\"keywords\":\"\",\"pmcid\":\"PMC4995017\",\"pmid\":\"27551971\",\"doi\":\"10.1371/journal.pone.0157449\",\"articleYear\":\"2016\",\"journal\":\"PLoS
        ONE\",\"abstractText\":\"Understanding how genes impact the brain's functional
        activation for learning and cognition during development remains limited.
        We asked whether a common genetic variant in the BDNF gene (the Val66Met polymorphism)
        modulates neural activation in the young brain during a critical period for
        the emergence and maturation of the neural circuitry for reading. In animal
        models, the bdnf variation has been shown to be associated with the structure
        and function of the developing brain and in humans it has been associated
        with multiple aspects of cognition, particularly memory, which are relevant
        for the development of skilled reading. Yet, little is known about the impact
        of the Val66Met polymorphism on functional brain activation in development,
        either in animal models or in humans. Here, we examined whether the BDNF Val66Met
        polymorphism (dbSNP rs6265) is associated with children's (age 6-10) neural
        activation patterns during a reading task (n = 81) using functional magnetic
        resonance imaging (fMRI), genotyping, and standardized behavioral assessments
        of cognitive and reading development. Children homozygous for the Val allele
        at the SNP rs6265 of the BDNF gene outperformed Met allele carriers on reading
        comprehension and phonological memory, tasks that have a strong memory component.
        Consistent with these behavioral findings, Met allele carriers showed greater
        activation in reading-related brain regions including the fusiform gyrus,
        the left inferior frontal gyrus and left superior temporal gyrus as well as
        greater activation in the hippocampus during a word and pseudoword reading
        task. Increased engagement of memory and spoken language regions for Met allele
        carriers relative to Val/Val homozygotes during reading suggests that Met
        carriers have to exert greater effort required to retrieve phonological codes.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/27551971\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7eVXwc3RVe4V\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"4403c80a-24aa-49c9-8715-6b1a23173ba7\",\"title\":\"The
        relationship between maternal education and the neural substrates of phoneme
        perception in children: Interactions between socioeconomic status and proficiency
        level\",\"authors\":\"Lisa L. Conant; Einat Liebenthal; Anjali Desai; Jeffrey
        R. Binder\",\"keywords\":\"\",\"pmcid\":\"PMC5602599\",\"pmid\":\"28437659\",\"doi\":\"10.1016/j.bandl.2017.03.010\",\"articleYear\":\"2017\",\"journal\":\"Brain
        and Language\",\"abstractText\":\"Relationships between maternal education
        (ME) and both behavioral performances and brain activation during the discrimination
        of phonemic and nonphonemic sounds were examined using fMRI in children with
        different levels of phoneme categorization proficiency (CP). Significant relationships
        were found between ME and intellectual functioning and vocabulary, with a
        trend for phonological awareness. A significant interaction between CP and
        ME was seen for nonverbal reasoning abilities. In addition, fMRI analyses
        revealed a significant interaction between CP and ME for phonemic discrimination
        in left prefrontal cortex. Thus, ME was associated with differential patterns
        of both neuropsychological performance and brain activation contingent on
        the level of CP. These results highlight the importance of examining SES effects
        at different proficiency levels. The pattern of results may suggest the presence
        of neurobiological differences in the children with low CP that affect the
        nature of relationships with ME.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/28437659\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"4vN4pDW5Vzi2\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"911e3336-eef0-40c6-936f-eefcab7d551b\",\"title\":\"Pre-reading
        language abilities and the brain's functional reading network in young children.\",\"authors\":\"Alina
        Benischek; Xiangyu Long; Christiane S. Rohr; Signe Bray; Deborah Dewey; Catherine
        Lebel\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"32389725\",\"doi\":\"10.1016/j.neuroimage.2020.116903\",\"articleYear\":\"2020\",\"journal\":\"NeuroImage\",\"abstractText\":\"Early
        childhood is an important period for language development that lays the foundation
        for future reading abilities. However, little research has focused on the
        functional brain systems supporting pre-reading language abilities in typically
        developing children. Here, we investigated functional connectivity using passive
        viewing functional magnetic resonance imaging (fMRI) in 50 healthy children
        aged 2.85-5.07 years (3.84\_\u200B\xB1\_\u200B0.60 years, 22 female/28 male).
        Children completed the NEPSY-II Phonological Processing and Speeded Naming
        subtests and underwent fMRI while watching a movie of their choice. Functional
        connectivity was measured between key brain reading areas (bilateral angular
        gyrus, superior temporal gyrus, and inferior frontal gyrus) and the rest of
        the brain. Age-adjusted pre-reading scores positively correlated with functional
        connectivity between (1) the right angular gyrus and superior temporal gyrus,
        (2) the bilateral angular gyri and right pars triangularis and motor areas,
        (3) the left superior temporal gyrus and bilateral medial frontal gyrus and
        right cerebellum, (4) the left pars triangularis and middle occipital gyrus
        and insula, and (5) the right pars triangularis and the bilateral thalamus.
        Higher pre-reading scores were associated with stronger negative functional
        connectivity between (1) the left angular gyrus and auditory cortex, (2) the
        left superior temporal gyrus and occipital vision areas, (3) the right pars
        triangularis and medial frontal region, and (4) the right superior temporal
        gyrus and the posterior cingulate/precuneus. These results suggest better
        integration of the reading network, as well as its connections with other
        brain areas that support language or reading, and more dissociation between
        reading areas and the default mode network, in young children with better
        pre-reading skills. Our findings show that relationships between functional
        connectivity and pre-reading language skills are evident in young children
        even before formal reading instruction.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/32389725\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"3ZDqdmcjqZxj\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"c7710af7-c1f9-422c-8f00-500c513d36b8\",\"title\":\"The
        reading-attention relationship: Variations in working memory network activity
        during single word decoding in children with and without dyslexia.\",\"authors\":\"Niki
        Sinha; C. Nikki Arrington; Jeffrey G. Malins; Kenneth R. Pugh; Jan C. Frijters;
        Robin Morris\",\"keywords\":\"\",\"pmcid\":\"PMC11284775\",\"pmid\":\"38340962\",\"doi\":\"10.1016/j.neuropsychologia.2024.108821\",\"articleYear\":\"2024\",\"journal\":\"Neuropsychologia\",\"abstractText\":\"\\nThis
        study utilized a neuroimaging task to assess working memory (WM) network recruitment
        during single word reading. Associations between WM and reading comprehension
        skills are well documented. Several converging models suggest WM may also
        contribute to foundational reading skills, but few studies have assessed this
        contribution directly. Two groups of children (77 developmental dyslexia (DD),
        22 controls) completed a functional magnetic resonance imaging (fMRI) task
        to identify activation of a priori defined regions of the WM network. fMRI
        trials consisted of familiar word, pseudoword, and false font stimuli within
        a 1-back oddball task to assess how activation in the WM network differs in
        response to stimuli that can respectively be processed using word recognition,
        phonological decoding, or non-word strategies. Results showed children with
        DD recruited WM regions bilaterally in response to all stimulus types, whereas
        control children recruited left-lateralized WM regions during the pseudoword
        condition only. Group-level comparisons revealed activation differences in
        the defined WM network regions for false font and familiar word, but not pseudoword
        conditions. This effect was driven by increased activity in participants with
        DD in right hemisphere frontal, parietal, and motor regions despite poorer
        task performance. Findings suggest the WM network may contribute to inefficient
        decoding and word recognition strategies in children with DD.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/38340962\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"brh2eH3YkfVm\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"0023dacb-7935-4170-bee2-075c89a086db\",\"title\":\"Cognitive
        levels of performance account for hemispheric lateralisation effects in dyslexic
        and normally reading children\",\"authors\":\"Stefan Heim; Marion Grande;
        Elisabeth Meffert; Simon B. Eickhoff; Helen Schreiber; Juraj Kukolja; Nadim
        Jon Shah; Walter Huber; Katrin Amunts\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"20633659\",\"doi\":\"10.1016/j.neuroimage.2010.07.009\",\"articleYear\":\"2010\",\"journal\":\"NeuroImage\",\"abstractText\":\"Recent
        theories of developmental dyslexia explain reading deficits in terms of deficient
        phonological awareness, attention, visual and auditory processing, or automaticity.
        Since dyslexia has a neurobiological basis, the question arises how the reader's
        proficiency in these cognitive variables affects the brain regions involved
        in visual word recognition. This question was addressed in two fMRI experiments
        with 19 normally reading children (Experiment 1) and 19 children with dyslexia
        (Experiment 2). First, reading-specific brain activation was assessed by contrasting
        the BOLD signal for reading aloud words vs. overtly naming pictures of real
        objects. Next, ANCOVAs with brain activation during reading the individuals'
        scores for all five cognitive variables assessed outside the scanner as covariates
        were performed. Whereas the normal readers' brain activation during reading
        showed co-variation effects predominantly in the right hemisphere, the reverse
        pattern was observed for the dyslexics. In particular, middle frontal gyrus,
        inferior parietal cortex, and precuneus showed contralateral effects for controls
        as compared to dyslexics. In line with earlier findings in the literature,
        these data hint at a global change in hemispheric asymmetry during cognitive
        processing in dyslexic readers, which, in turn, might affect reading proficiency.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/20633659\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"53jwvThEr6vt\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"424f2956-e2f4-4f72-80fb-e2e561160d84\",\"title\":\"Neural
        Dynamics of Improved Bimodal Attention and Working Memory in Musically Trained
        Children\",\"authors\":\"Leonie Kausel; Francisco Zamorano; Pablo Billeke;
        Mary E. Sutherland; Josefina Larrain-Valenzuela; Ximena Stecher; Gottfried
        Schlaug; Francisco Aboitiz\",\"keywords\":\"\",\"pmcid\":\"PMC7578432\",\"pmid\":\"33132820\",\"doi\":\"10.3389/fnins.2020.554731\",\"articleYear\":\"2020\",\"journal\":\"Frontiers
        in Neuroscience\",\"abstractText\":\" \\nAttention and working memory (WM)
        are core components of executive functions, and they can be enhanced by training.
        One activity that has shown to improve executive functions is musical training,
        but the brain networks underlying these improvements are not well known. We
        aimed to identify, using functional MRI (fMRI), these networks in children
        who regularly learn and play a musical instrument. Girls and boys aged 10\u201313
        with and without musical training completed an attention and WM task while
        their brain activity was measured with fMRI. Participants were presented with
        a pair of bimodal stimuli (auditory and visual) and were asked to pay attention
        only to the auditory, only to the visual, or to both at the same time. The
        stimuli were afterward tested with a memory task in order to confirm attention
        allocation. Both groups had higher accuracy on items that they were instructed
        to attend, but musicians had an overall better performance on both memory
        tasks across attention conditions. In line with this, musicians showed higher
        activation than controls in cognitive control regions such as the fronto-parietal
        control network during all encoding phases. In addition, facilitated encoding
        of auditory stimuli in musicians was positively correlated with years of training
        and higher activity in the left inferior frontal gyrus and the left supramarginal
        gyrus, structures that support the phonological loop. Taken together, our
        results elucidate the neural dynamics that underlie improved bimodal attention
        and WM of musically trained children and contribute new knowledge to this
        model of brain plasticity. \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/33132820\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"RCMYVKxNEkgk\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"71a1978e-11a3-4729-8812-a0b37b5aa47f\",\"title\":\"Working
        Memory Deficit in Dyslexia: Behavioral and fMRI Evidence\",\"authors\":\"Harald
        Beneventi; Finn Egil T\xF8nnessen; Lars Ersland; Kenneth Hugdahl\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"20128672\",\"doi\":\"10.3109/00207450903275129\",\"articleYear\":\"2010\",\"journal\":\"International
        Journal of Neuroscience\",\"abstractText\":\"Dyslexia is a condition characterized
        by difficulty of reading given adequate intelligence and educational opportunities,
        primarily associated with a phonological processing deficit. In this study
        we show that dyslexic children also show a deficit in working memory compared
        to a control group, measured with fMRI. A working memory n-back task with
        three load levels was used. Behavioral data showed that the dyslexics had
        poorer performance compared to the controls. fMRI data showed that the dyslexics
        had reduced activation in the prefrontal and parietal cortices and the cerebellum
        compared with the controls. These results imply a working memory deficit in
        dyslexia.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/20128672\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7M6DuoH3yvcq\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"2674b73f-5b39-4da0-ac8d-f7edcc19b8cc\",\"title\":\"Higher
        maternal education is related to negative functional connectivity between
        attention system networks and reading-related regions in children with reading
        difficulties compared to typical readers.\",\"authors\":\"Paige Greenwood;
        Jonathan Dudley; John Hutton; Mark DiFrancesco; Rola Farah; Tzipi Horowitz-Kraus\",\"keywords\":\"\",\"pmcid\":\"PMC8214310\",\"pmid\":\"34033755\",\"doi\":\"10.1016/j.brainres.2021.147532\",\"articleYear\":\"2021\",\"journal\":\"Brain
        Research\",\"abstractText\":\"Ten to 15% of school-age children have reading
        difficulties (RD, or dyslexia), defined by deficits in phonological processing,
        fluency, and executive functions (EFs). Although RD is referred to as a genetic
        disorder, reading ability may also be affected by environmental factors such
        as inadequate exposure to literacy and a lack of parental involvement. These
        environmental components are a part of the socioeconomic status (SES) measure,
        which is defined by parental occupation, educational attainment, and household
        income and are positively correlated to reading ability. The goal of the current
        study was to relate maternal education, a construct of SES to executive functions
        (EFs) that relate to reading in children with RD compared to typical readers
        (TRs) using behavioral and neurobiological resting-state fMRI data. The results
        show that higher maternal education is negatively correlated to inhibitory
        control for TRs and not for children with RD. Higher maternal education was
        also associated with negative functional connectivity of the frontal-parietal
        network to the left central opercular cortex and left occipital gyrus for
        children with RD compared to TRs. These results suggest that higher maternal
        education has contrasting roles on the behavioral and neurobiological correlates
        of EFs for children with RD compared to TRs. We conclude that higher education
        levels for mothers may provide their children with a structured environment
        and educational resources that may assist their children with RD and TRs with
        cognitive development based on their reading profile.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/34033755\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"CnAwDXF53kPL\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"1317803e-1830-4b09-968b-277fea47570f\",\"title\":\"Functional
        connectivity is linked to working memory differences in children with reading
        learning disability\",\"authors\":\"Rodrigo Flores-Gallegos; Thal\xEDa Fern\xE1ndez;
        Sarael Alcauter; Erick Pasaye; Lucero Albarr\xE1n-C\xE1rdenas; Bertha Barrera-D\xEDaz;
        Paulina Rodr\xEDguez-Leis\",\"keywords\":\"\",\"pmcid\":\"PMC11077889\",\"pmid\":\"38720281\",\"doi\":\"10.1186/s12887-024-04791-2\",\"articleYear\":\"2024\",\"journal\":\"BMC
        Pediatrics\",\"abstractText\":\" \\nReading learning disability (RLD) is characterized
        by a specific difficulty in learning to read that is not better explained
        by an intellectual disability, lack of instruction, psychosocial adversity,
        or a neurological disorder. According to the domain-general hypothesis, a
        working memory deficit is the primary problem. Working memory in this population
        has recently been linked to altered resting-state functional connectivity
        within the default mode network (DMN), salience network (SN), and frontoparietal
        network (FPN) compared to that in typically developing individuals. The main
        purpose of the present study was to compare the within-network functional
        connectivity of the DMN, SN, FPN, and reading network in two groups of children
        with RLD: a group with lower-than-average working memory (LWM) and a group
        with average working memory (AWM). All subjects underwent resting-state functional
        magnetic resonance imaging (fMRI), and data were analyzed from a network perspective
        using the network brain statistics framework. The results showed that the
        LWM group had significantly weaker connectivity in a network that involved
        brain regions in the DMN, SN, and FPN than the AWM group. Although there was
        no significant difference between groups in reading network in the present
        study, other studies have shown relationship of the connectivity of the angular
        gyrus, supramarginal gyrus, and inferior parietal lobe with the phonological
        process of reading. The results suggest that although there are significant
        differences in functional connectivity in the associated networks between
        children with LWM and AWM, the distinctive cognitive profile has no specific
        effect on the reading network. \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/38720281\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"uVDjqjpkHMcn\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"f3c2e2f9-4ca3-4264-a3ac-388f57933598\",\"title\":\"Sex
        differences in the intrinsic reading neural networks of Chinese children\",\"authors\":\"Xitong
        Liang; Guanqun Li; Yin He; Chaoying Xu; Xiangzhi Meng; Chunming Lu; Li Liu\",\"keywords\":\"\",\"pmcid\":\"PMC8943427\",\"pmid\":\"35325839\",\"doi\":\"10.1016/j.dcn.2022.101098\",\"articleYear\":\"2022\",\"journal\":\"Developmental
        Cognitive Neuroscience\",\"abstractText\":\" \\nSex differences in reading
        performance have been considered a relatively stable phenomenon. However,
        there is no general agreement about their neural basis, which might be due
        to that sex differences are largely influenced by age. This paper focuses
        on the sex differences in the reading-related neural network of Chinese children
        and its interaction with age. We also attempt to predict reading abilities
        based on neural network. Fifty-three boys and 56 girls (8.2\u201314.6 years
        of age) were recruited. We collected their resting-state fMRI and behavioural
        data. Restricted sex differences were found in the resting-state reading neural
        network compared to extensive age by sex interaction effect. Specifically,
        the interactions between sex and age indicated that with increasing age, girls
        showed greater connectivity strength between visual orthographic areas and
        other brain areas within the reading network, while boys showed an opposite
        trend. After controlling age, the prediction models of reading performance
        for the girls mainly included interhemispheric connections, while the intrahemispheric
        connections (particularly the phonological route) mainly contributed to predicting
        the reading ability for boys. Taken together, these findings suggest that
        sex differences in reading neural networks are modulated by age. Partialling
        out age, boys and girls also show the stable sex differences in relationship
        between reading neural circuit and reading behaviour. \\n   Highlights  \\n
        \ \\nSex differences in reading neural networks are modulated by age. \\n
        \ \\nGirls\u2019 RSFCs within reading neural networks increase with age, contrary
        to boys. \\n  \\nIntra- and interhemispheric RSFCs predict the reading ability
        of boys and girls, respectively. \\n  \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/35325839\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"Y9MUDwpJrMpx\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"a42602ce-e704-482f-945a-6ffa8e52d321\",\"title\":\"Neurodevelopmental
        Changes in Verbal Working Memory Load-Dependency: An fMRI Investigation\",\"authors\":\"Elizabeth
        D. O'Hare; Lisa H. Lu; Suzanne M. Houston; Susan Y. Bookheimer; Elizabeth
        R. Sowell\",\"keywords\":\"\",\"pmcid\":\"PMC2570587\",\"pmid\":\"18586110\",\"doi\":\"10.1016/j.neuroimage.2008.05.057\",\"articleYear\":\"2008\",\"journal\":\"NeuroImage\",\"abstractText\":\"Development
        of working memory (WM) aptitude parallels structural changes in the frontal-parietal
        association cortices important for performance within this cognitive domain.
        The cerebellum has been proposed to function in support of the postulated
        phonological loop component of verbal WM, and along with frontal and parietal
        cortices, has been shown to exhibit linear WM load-dependent activation in
        adults. It is not known if these kinds of WM load-dependent relationships
        exist for cerebro-cerebellar networks in developmental populations, and whether
        there are age-related changes in the nature of load-dependency between childhood,
        adolescence, and adulthood. The present study used fMRI and a verbal Sternberg
        WM task with three load levels to investigate developmental changes in WM
        load-dependent cerebro-cerebellar activation in a sample of 30 children, adolescents,
        and young adults between the ages of 7 and 28. The neural substrates of linear
        load-dependency were found to change with age. Among adolescents and adults,
        frontal, parietal and cerebellar regions showed linear load-dependency, or
        increasing activation under conditions of increasing WM load. In contrast,
        children recruited only left ventral prefrontal cortex in response to increasing
        WM load. These results demonstrate that, while children, adolescents, and
        young adults activate similar cerebro-cerebellar verbal working memory networks,
        the extent to which they rely on parietal and cerebellar regions in response
        to increasing task difficulty changes significantly between childhood and
        adolescence.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/18586110\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"5hSa9b8QEmgN\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"dcb65fe7-1a15-442a-8479-e6808d7a129e\",\"title\":\"Brain-behavior
        relationships in reading acquisition are modulated by socioeconomic factors.\",\"authors\":\"Kimberly
        G. Noble; Michael E. Wolmetz; Lisa G. Ochs; Martha J. Farah; Bruce D. McCandliss\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"17059461\",\"doi\":\"10.1111/j.1467-7687.2006.00542.x\",\"articleYear\":\"2006\",\"journal\":\"Developmental
        Science\",\"abstractText\":\"Functional neuroimaging may provide insights
        into the achievement gap in reading skill commonly observed across socioeconomic
        status (SES). Brain activation during reading tasks is known to be associated
        with individual differences in children's phonological language skills. By
        selecting children of equivalent phonological skill, yet diverse socioeconomic
        backgrounds, we use functional magnetic resonance imaging (fMRI) to demonstrate
        that a child's experience, as operationalized by SES, can systematically modulate
        the relationship between phonological language skills and reading-related
        brain activity in left fusiform and perisylvian regions. Specifically, at
        lower socioeconomic levels, individual differences in skill result in large
        differences in brain activation. In contrast, as SES increases, this relationship
        between phonological language skill and activation is attenuated. Socioeconomic
        background factors are thus found to modulate brain-behavior relationships
        in reading, indicating that cognitive, social, and neurobiological influences
        on reading development are fundamentally intertwined.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/17059461\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"oGGp5d8Dx2mB\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"4a580d39-b5d1-48f5-9900-7ac6b2fde49d\",\"title\":\"A
        hierarchical deficit model of reading disability: Evidence from dynamic causal
        modelling analysis.\",\"authors\":\"Xiaohui Yan; Kyle Perkins; Fan Cao\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"33549584\",\"doi\":\"10.1016/j.neuropsychologia.2021.107777\",\"articleYear\":\"2021\",\"journal\":\"Neuropsychologia\",\"abstractText\":\"\\nDeficits
        have been documented in visuo-orthographic processing as well as phonological
        retrieval/manipulation during visual word reading in individuals with reading
        disability (RD); however, the relationship between these deficits remains
        unclear. Previously, we found that during word reading, visuo-orthographic
        deficit appears to be a neural signature of RD, but deficits in phonological
        retrieval/manipulation appears to be a consequence of being RD (Cao et al.,
        2020). Therefore, in the current study, we directly tested the hypothesis
        that during visual word reading, deficit in phonological retrieval/manipulation
        may result from weakened input from visuo-orthographic regions, and that this
        relationship tends to be universal across languages. We conducted a dynamic
        causal modelling analysis of fMRI data from Chinese-English bilingual children
        (9-11 years, N\_=\_78) with or without RD during a visual word rhyming judgment
        task. We found a weaker connection from the left inferior temporal gyrus (ITG)
        to the left dorsal inferior frontal gyrus (dIFG) in children with RD and reading
        controls than the connection found in age controls for both Chinese and English.
        This finding suggests that the phonological deficit at the dIFG may result
        from weak input from the visuo-orthographic region and this connection appears
        to be responsive to reading level rather than RD, because the reading-control
        children were similar to children with RD. We also found that the left ITG
        was selectively connected with language-specific regions (i.e., the left inferior
        parietal lobe (IPL) for Chinese and the left ventral inferior frontal gyrus
        (vIFG) for English) depending on the language being processed; however, this
        language selectivity was reduced in children with RD, suggesting that decreased
        language specialization is associated with RD. Using a double control design,
        our study suggests that during reading, the visuo-orthographic deficit of
        RD constrains the development of the connection from orthography to phonology
        and to other language-specific processing due to distorted quantity and quality
        of reading.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/33549584\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"2B6P2veNiQyA\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"25659225-1960-4333-934e-4ec18531ff8f\",\"title\":\"Age-related
        changes in individuals with and without reading disability: Behavioral and
        fMRI evidence\",\"authors\":\"Xiaohui Yan; Guoyan Feng; Yang Fu; Jia Hua;
        Fan Cao\",\"keywords\":\"\",\"pmcid\":\"PMC12272204\",\"pmid\":\"40800301\",\"doi\":\"10.1162/imag_a_00232\",\"articleYear\":\"2024\",\"journal\":\"Imaging
        Neuroscience\",\"abstractText\":\"Abstract Reading disability (RD) is a developmental
        neurological disorder with high prevalence across languages; however, the
        developmental differences in the behavior and brain of individuals with RD
        remain poorly understood, especially in Chinese RD. In the current study,
        we aimed to differentiate persistent deficits in Chinese children and adults
        with RD, differences that are evident only in children but not adults with
        RD, and differences that are more severe in adults than children with RD.
        In a cross-sectional design, we compared behavioral performances in a battery
        of reading tests and brain activities in three tasks in Chinese children (N
        = 83, mean age = 11) and adults (N = 94, mean age = 20) with and without RD.
        We found that phonological deficits were persistent across children and adults
        with RD, while deficits in word decoding accuracy were only evident in children
        but not adults with RD. Moreover, deficits in sentence reading fluency were
        more severe in adults than children with RD. In the brain, we found persistent
        reduction of brain activation in the left inferior parietal lobule (IPL),
        suggesting neural signature of RD. We found greater reduction of brain activation
        in the left inferior frontal gyrus (IFG) in children with RD than in adults
        with RD, suggesting a developmental delay and/or performance effect. On the
        other hand, a reduction of brain activation in the left inferior temporal
        gyrus (ITG) was more salient in adults with RD than in children with RD, due
        to greater developmental increase in typical readers than in RD readers, ultimately
        indicating accumulative effects of RD. The results were replicated in multiple
        tasks and samples. It contributes to advancing our understanding of the etiology
        and prognosis of RD. The findings also have practical implications in precise
        diagnosis and interventions for RD at different ages.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/40800301\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"ojxuvvKb9bEG\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"9493c23d-978d-4462-b100-0ca9888c2719\",\"title\":\"Functional
        preference of the left inferior parietal lobule to second language reading\",\"authors\":\"Jia
        Zhang; Hehui Li; Manli Zhang; Zhengke Wang; Xiya Ao; Jie Jian; Na Wei; Haiyi
        Liu; Guosheng Ding; Xiangzhi Meng\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"36858331\",\"doi\":\"10.1016/j.neuroimage.2023.119989\",\"articleYear\":\"2023\",\"journal\":\"NeuroImage\",\"abstractText\":\"Additional
        neural substance for reading in a second language has been reported by prior
        studies. However, to date, there has been little investigation into whether
        and how the brain's adaptation to a second language is induced by specific
        linguistic tasks or is a general effect during reading in a new language.
        To address this issue, our study investigated Chinese children learning English
        as a second language by combining cross-sectional and longitudinal Functional
        Magnetic Resonance Imaging (fMRI) studies. We compared brain activation across
        four reading tasks, orthographic tasks and phonological tasks in Chinese (the
        first language, L1) and English (the second language, L2). By comparing the
        activation pattern across languages, we observed greater activation in the
        left inferior parietal lobule (LIPL) in English compared to Chinese, suggesting
        a functional preference of the LIPL to L2. In addition, greater correlation
        between LIPL-related FC and L2 was mainly observed in the phonological task,
        indicating that LIPL could be associated with phonological processing. Moreover,
        a proportion of the children were enrolled in an 8-week phonological-based
        reading-training program. We observed significant functional plasticity of
        the LIPL elicited by this training program only in the English phonological
        task and not in the orthographic task, further substantiating that the additional
        requirements of the LIPL in L2 are mainly associated with phonological processing.
        The findings provide new insights into understanding the functional contribution
        of the LIPL to reading in a second language.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/36858331\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"rhxCEZyTNHaE\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"3c19478e-3b37-4c00-b1ce-7617dee66f99\",\"title\":\"Neural
        Cognitive Correlates of Orthographic Neighborhood Size Effect for Children
        During Chinese Naming\",\"authors\":\"Hong-Yan Bi; Qing-Lin Li\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"\",\"doi\":\"10.5772/30068\",\"articleYear\":\"2012\",\"journal\":\"InTech
        eBooks\",\"abstractText\":\"A lot of researchers are concerned of orthographic
        neighborhood (N) effect (Andrews, 1989, 1992; Carreiras et al., 1997; Laxon
        et al., 1988; Peereman & Content, 1995; Sears et al., 2006), which can reflect
        how the potential word candidates with similar orthography affect the word
        naming task. In alphabetic writing systems, orthographic neighborhood refers
        to a word pool, which is consisted by changing one letter of a given word
        while keeping other letters unchanged (Coltheart et al., 1977). Behavioral
        researches with naming tasks have reported a facilitatory effect of N size
        (Andrews, 1989, 1992; Carreiras et al., 1997; Peereman & Content, 1995; Sears
        et al., 1995), which the presence of many orthographic neighbors facilities
        phonological retrieval of the target word, and such facilitation would be
        more prominent for low-frequency words (Andrews, 1989, 1992; Peereman & Content,
        1995). This large N advantage is also found as orthographic distinctiveness
        effect in memory (Glanc & Greene, 2007; 2009). Modeling researches suggested
        that the facilitation of large N arises from the overlapping phonemes of their
        neighbors (Coltheart et al., 2001) and the feedback activations from orthographic
        units to feature units strengthen the phonological retrieval (Reynolds & Besner,
        2002). Recently, Fiebach et al. (2007) examine the neural mechanisms of N
        size effect using fMRI. Their results demonstrated the interactions of lexicality
        and N size in mid-dorsolateral and medial prefrontal cortex, suggesting domain
        general processes during word recognition.\",\"articleLink\":\"\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"reND4FQCkxQx\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"dcdcf703-2bda-431b-aebb-c0088cf238f6\",\"title\":\"Shared
        temporoparietal dysfunction in dyslexia and typical readers with discrepantly
        high IQ.\",\"authors\":\"Roeland Hancock; John D.E. Gabrieli; Fumiko Hoeft\",\"keywords\":\"\",\"pmcid\":\"PMC5400289\",\"pmid\":\"28439565\",\"doi\":\"10.1016/j.tine.2016.10.001\",\"articleYear\":\"2016\",\"journal\":\"Trends
        in Neuroscience and Education\",\"abstractText\":\"\\nIt is currently believed
        that reading disability (RD) should be defined by reading level without regard
        to broader aptitude (IQ). There is debate, however, about how to classify
        individuals who read in the typical range but less well than would be expected
        by their higher IQ. We used functional magnetic resonance imaging (fMRI) in
        49 children to examine whether those with typical, but discrepantly low reading
        ability relative to IQ, show dyslexia-like activation patterns during reading.
        Children who were typical readers with high-IQ discrepancy showed reduced
        activation in left temporoparietal neocortex relative to two control groups
        of typical readers without IQ discrepancy. This pattern was consistent and
        spatially overlapping with results in children with RD compared to typically
        reading children. The results suggest a shared neurological atypicality in
        regions associated with phonological processing between children with dyslexia
        and children with typical reading ability that is substantially below their
        IQ.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/28439565\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"n5PLfkJf3vwf\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"f905a3f7-5a6d-4a62-966d-fa7069c104a0\",\"title\":\"Neuroimaging
        of decoding and language comprehension in young very low birth weight (VLBW)
        adolescents: Indications for compensatory mechanisms.\",\"authors\":\"Helene
        van Ettinger-Veenstra; Carin Wid\xE9n; Maria Engstr\xF6m; Thomas Karlsson;
        Ingemar Leijon; Nina Nelson\",\"keywords\":\"\",\"pmcid\":\"PMC5624616\",\"pmid\":\"28968426\",\"doi\":\"10.1371/journal.pone.0185571\",\"articleYear\":\"2017\",\"journal\":\"PLoS
        ONE\",\"abstractText\":\"Objective\\r\\nReading problems are more common in
        individuals born preterm with very low birth weight (VLBW \u2264 1500 g) than
        in normal birth weight (NBW) term-born peers. We investigated components of
        reading comprehension in young VLBW adolescents in direct comparison to NBW
        and measured neural activation within brain regions important for language
        with the use of functional magnetic resonance imaging (fMRI). We hypothesized
        that the decoding mechanisms will be affected by VLBW, and expect to see increased
        neural activity for VLBW which may be modulated by performance and cognitive
        ability. \\r\\nMethods\\r\\n13 (11 included in fMRI) young adolescents (ages
        12 to 14 years) born preterm with VLBW and in 13 NBW controls (ages 12 to
        14 years) were investigated for performance on the Block Design and Vocabulary
        subtests of the Wechsler Intelligence Scale for Children; and for semantic,
        orthographic, and phonological processing during an fMRI paradigm.\\r\\nResults\\r\\nThe
        VLBW group showed increased phonological activation in left inferior frontal
        gyrus, decreased orthographic activation in right supramarginal gyrus, and
        decreased semantic activation in left inferior frontal gyrus. Block Design
        was related to altered right-hemispheric activation, and left angular gyrus
        showed activation increase specific for VLBW with high accuracy on the semantic
        test. VLBW also showed lower scores on the WISC Block Design test.\\r\\nConclusions\\r\\nYoung
        VLBW adolescents showed phonological activation increase and semantic activation
        decrease in left inferior frontal gyrus, however not in overlapping cluster.
        The increase of activation for phonological decoding and lower Block Design
        is consistent with our hypothesis for an altered functionality of the phonological
        processing pathway in relation to impaired cognitive functioning. The results
        may reflect compensatory mechanisms by recruiting additional brain regions
        upon altered neural development of phonological decoding for VLBW; also the
        involvement of left angular gyrus was related to more successful semantic
        processing for VLBW.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/28968426\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"3XYniUub6vdz\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"bc47c3c1-1fb6-4a5d-969b-0e5d279789d0\",\"title\":\"Chinese
        dyslexics show neural differences in morphological processing.\",\"authors\":\"Li
        Liu; Ran Tao; Wenjing Wang; Wenping You; Danling Peng; James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC6987802\",\"pmid\":\"23872198\",\"doi\":\"10.1016/j.dcn.2013.06.004\",\"articleYear\":\"2013\",\"journal\":\"Developmental
        Cognitive Neuroscience\",\"abstractText\":\"Previous behavioral studies have
        suggested that morphological awareness is impaired in Chinese children with
        reading disability (RD), but how this is reflected in brain alterations is
        not known. Using functional magnetic resonance imaging (fMRI), the current
        study compared morphological processing in a RD group (11-13 years old) to
        an age-matched typically developing (TD) group. Participants made semantic
        relatedness judgments to incongruent word pairs that were either semantically
        related but did not share a morpheme or semantically unrelated but did share
        a morpheme. This was compared to conditions where semantic relatedness and
        morphemic information was congruent. A smaller incongruency effect was found
        in left dorsal posterior (BA9) and ventral anterior (BA47) inferior frontal
        gyrus (IFG) in the RD compared to the TD, suggesting that the RD is less sensitive
        to morphological information. This was a specific deficit as a phonological
        control task that manipulated congruency between orthography and phonology
        did not show group differences in the IFG. Moreover, brain activation in the
        IFG for the incongruency effect in the semantic task was negatively correlated
        with reading skill for the RD group only, suggesting that higher skill children
        with RD may rely on a compensatory whole-word strategy by ignoring the morphemic
        information.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/23872198\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"4NSmtsrUhrRX\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"8f284b0d-3e2d-43d8-b849-8a0108ee8891\",\"title\":\"Past
        experience shapes ongoing neural patterns for language\",\"authors\":\"Lara
        J. Pierce; Jen-Kai Chen; Audrey Delcenserie; Fred Genesee; Denise Klein\",\"keywords\":\"\",\"pmcid\":\"PMC4686754\",\"pmid\":\"26624517\",\"doi\":\"10.1038/ncomms10073\",\"articleYear\":\"2015\",\"journal\":\"Nature
        Communications\",\"abstractText\":\"Early experiences may establish a foundation
        for later learning, however, influences of early language experience on later
        neural processing are unknown. We investigated whether maintenance of neural
        templates from early language experience influences subsequent language processing.
        Using fMRI, we scanned the following three groups performing a French phonological
        working memory (PWM) task: (1) monolingual French children; (2) children adopted
        from China before age 3 who discontinued Chinese and spoke only French; (3)
        Chinese-speaking children who learned French as a second language but maintained
        Chinese. Although all groups perform this task equally well, brain activation
        differs. French monolinguals activate typical PWM brain regions, while both
        Chinese-exposed groups also activate regions implicated in cognitive control,
        even the adoptees who were monolingual French speakers at testing. Early exposure
        to a language, and/or delayed exposure to a subsequent language, continues
        to influence the neural processing of subsequently learned language sounds
        years later even in highly proficient, early-exposed users.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/26624517\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7EEyXsyEDf2Q\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"b2bb0679-c81c-43f7-b6f4-c0afba1c1f55\",\"title\":\"Dyslexia
        on a continuum: A complex network approach.\",\"authors\":\"Erica S. Edwards;
        Kali Burke; James R. Booth; Chris McNorgan\",\"keywords\":\"\",\"pmcid\":\"PMC6296514\",\"pmid\":\"30557304\",\"doi\":\"10.1371/journal.pone.0208923\",\"articleYear\":\"2018\",\"journal\":\"PLoS
        ONE\",\"abstractText\":\"\\nWe investigated the efficacy of graph-theoretic
        metrics of task-related functional brain connectivity in predicting reading
        difficulty and explored the hypothesis that task conditions emphasizing audiovisual
        integration would be especially diagnostic of reading difficulty. An fMRI
        study was conducted in which 24 children (8 to 14 years old) who were previously
        diagnosed with dyslexia completed a rhyming judgment task under three presentation
        modality conditions. Regression analyses found that characteristic connectivity
        metrics of the reading network showed a presentation modality dependent relationship
        with reading difficulty: Children with more segregated reading networks and
        those that used fewer of the available connections were those with the least
        severe reading difficulty. These results are consistent with the hypothesis
        that a lack of coordinated processing between the neural regions involved
        in phonological and orthographic processing contributes towards reading difficulty.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/30557304\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"JsBcENHkVfXz\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"20d55ec7-dfcb-4c59-8a24-bbc0446b698e\",\"title\":\"Neural
        systems predicting long-term outcome in dyslexia\",\"authors\":\"Fumiko Hoeft;
        Bruce D. McCandliss; Jessica M. Black; Alexander Gantman; Nahal Zakerani;
        Charles Hulme; Heikki Lyytinen; Susan Whitfield-Gabrieli; Gary H. Glover;
        Allan L. Reiss; John D. E. Gabrieli\",\"keywords\":\"\",\"pmcid\":\"PMC3017159\",\"pmid\":\"21173250\",\"doi\":\"10.1073/pnas.1008950108\",\"articleYear\":\"2010\",\"journal\":\"Proceedings
        of the National Academy of Sciences\",\"abstractText\":\"Individuals with
        developmental dyslexia vary in their ability to improve reading skills, but
        the brain basis for improvement remains largely unknown. We performed a prospective,
        longitudinal study over 2.5 y in children with dyslexia (n = 25) or without
        dyslexia (n = 20) to discover whether initial behavioral or brain measures,
        including functional MRI (fMRI) and diffusion tensor imaging (DTI), can predict
        future long-term reading gains in dyslexia. No behavioral measure, including
        widely used and standardized reading and language tests, reliably predicted
        future reading gains in dyslexia. Greater right prefrontal activation during
        a reading task that demanded phonological awareness and right superior longitudinal
        fasciculus (including arcuate fasciculus) white-matter organization significantly
        predicted future reading gains in dyslexia. Multivariate pattern analysis
        (MVPA) of these two brain measures, using linear support vector machine (SVM)
        and cross-validation, predicted significantly above chance (72% accuracy)
        which particular child would or would not improve reading skills (behavioral
        measures were at chance). MVPA of whole-brain activation pattern during phonological
        processing predicted which children with dyslexia would improve reading skills
        2.5 y later with >90% accuracy. These findings identify right prefrontal brain
        mechanisms that may be critical for reading improvement in dyslexia and that
        may differ from typical reading development. Brain measures that predict future
        behavioral outcomes (neuroprognosis) may be more accurate, in some cases,
        than available behavioral measures.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/21173250\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"GaMUqomudmSa\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"381238af-1103-488e-b6e1-c0cd4d3cf42c\",\"title\":\"Reduced
        Dependence on Sensorimotor Processing in the Brain is Associated with Higher
        Math Skills in Adults\",\"authors\":\"Xueying Ren; Marc N Coutanche; Julie
        A Fiez; Melissa E Libertus\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"41955292\",\"doi\":\"10.1101/2025.09.16.676580\",\"articleYear\":\"2025\",\"journal\":\"Cerebral
        Cortex\",\"abstractText\":\"Number processing is crucial for math competence,
        yet the neural underpinnings remain unclear. In this study, we used functional
        magnetic resonance imaging (fMRI) to 1) identify key brain regions involved
        in symbolic and embodied number processing, and 2) examine their relations
        with math abilities in children and adults. We collected fMRI data from 104
        adults (Mage = 23.25 years) and 88 4th graders (Mage = 9.75) as they performed
        number comparison and phonological tasks with numeral (symbolic) and hand
        (embodied) numerical stimuli. Participants\u2019 math abilities were assessed
        using the math subtests of the Woodcock-Johnson Tests of Achievement. Univariate
        analyses revealed number processing regions in occipital, parietal and temporal
        cortices including inferior parietal, sensorimotor, supramarginal and insular
        areas. In adults, less involvement of sensorimotor processing regions during
        number compared to phonological processing is associated with enhanced math
        skills. These findings not only elucidate the neural mechanisms underlying
        number processing and math abilities but also raise questions about the emphasis
        on embodied number presentation in math learning experiences. Significance
        Statement Children and adults show substantial individual differences in math
        competence, and understanding the underlying neural mechanisms is crucial.
        By employing functional magnetic resonance imaging (fMRI), we identified key
        brain regions involved in symbolic and embodied number processing and explored
        their relations with math skills. Our findings reveal that reduced sensorimotor
        involvement during number processing correlates with enhanced math performance
        in adults. This study not only elucidates the neural mechanisms underlying
        number processing, offering critical insights into the cognitive architecture
        that supports math abilities, but also raises questions about the emphasis
        on embodied number representations in math learning experiences.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/41955292\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"w9Q86Lw4w2vG\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"65154dbe-fe85-40cb-bc90-38482b86707b\",\"title\":\"Neuronal
        Activation for Semantically Reversible Sentences\",\"authors\":\"Fiona M.
        Richardson; Michael S. C. Thomas; Cathy J. Price\",\"keywords\":\"\",\"pmcid\":\"PMC2860570\",\"pmid\":\"19445603\",\"doi\":\"10.1162/jocn.2009.21277\",\"articleYear\":\"2010\",\"journal\":\"Journal
        of Cognitive Neuroscience\",\"abstractText\":\"Semantically reversible sentences
        are prone to misinterpretation and take longer for typically developing children
        and adults to comprehend; they are also particularly problematic for those
        with language difficulties such as aphasia or Specific Language Impairment.
        In our study, we used fMRI to compare the processing of semantically reversible
        and nonreversible sentences in 41 healthy participants to identify how semantic
        reversibility influences neuronal activation. By including several linguistic
        and nonlinguistic conditions within our paradigm, we were also able to test
        whether the processing of semantically reversible sentences places additional
        load on sentence-specific processing, such as syntactic processing and syntactic-semantic
        integration, or on phonological working memory. Our results identified increased
        activation for reversible sentences in a region on the left temporal-parietal
        boundary, which was also activated when the same group of participants carried
        out an articulation task which involved saying \\\"one, three\\\" repeatedly.
        We conclude that the processing of semantically reversible sentences places
        additional demands on the subarticulation component of phonological working
        memory.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/19445603\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"6N79zXJwAM2x\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"fbbc4cb8-1831-4f9a-bc2e-cceb4da8e239\",\"title\":\"Comorbidity
        of reading disabilities and ADHD: Structural and functional brain characteristics.\",\"authors\":\"Nicolas
        Langer; Christopher Benjamin; Bryce L. C. Becker; Nadine Gaab\",\"keywords\":\"\",\"pmcid\":\"PMC6508987\",\"pmid\":\"30784139\",\"doi\":\"10.1002/hbm.24552\",\"articleYear\":\"2019\",\"journal\":\"Human
        Brain Mapping\",\"abstractText\":\"Reading disabilities (RD) and attention-deficit/hyperactivity
        disorder (ADHD) are two of the most common developmental disorders. RD and
        ADHD frequently co-occur, which raises questions about how the disorders interact
        and to what extent they can be differentiated. To date, the underlying neural
        mechanisms leading to RD-ADHD comorbidity (COM) are not understood. In this
        study, structural and functional magnetic resonance imaging (fMRI) were combined
        with comprehensive behavioral testing in order to characterize the behavior,
        brain structure, and neural correlates of executive function, phonological
        processing and reading fluency in 60 children with clinical diagnoses of RD,
        ADHD, or COM, and controls. Whole-brain analyses of variance were performed
        on cortical thickness values and on the data of the three fMRI tasks to investigate
        overall group differences. To validate these findings, a region of interest
        analysis was performed in regions that have previously been shown to exhibit
        group differences in children with RD or ADHD using the same paradigms. The
        neuroimaging results demonstrated structural and functional atypicalities
        for COM in regions that are frequently associated with deficits in children
        with isolated ADHD or RD. A combination of shared and distinctive brain alterations
        between the clinical groups was identified, supporting the multiple deficit
        model for ADHD, RD, and its comorbidity.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/30784139\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"2pYN6fiWDQ7U\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"375811f6-ecc0-4504-9302-754936a9ff84\",\"title\":\"Multimodal
        brain features at 3 years of age and their relationship with pre-reading measures
        1 year later\",\"authors\":\"Kathryn Y. Manning; Jess E. Reynolds; Xiangyu
        Long; Alberto Llera; Deborah Dewey; Catherine Lebel\",\"keywords\":\"\",\"pmcid\":\"PMC9441575\",\"pmid\":\"36072890\",\"doi\":\"10.3389/fnhum.2022.965602\",\"articleYear\":\"2022\",\"journal\":\"Frontiers
        in Human Neuroscience\",\"abstractText\":\" \\nPre-reading language skills
        develop rapidly in early childhood and are related to brain structure and
        functional architecture in young children prior to formal education. However,
        the early neurobiological development that supports these skills is not well
        understood. Here we acquired anatomical, diffusion tensor imaging (DTI) and
        resting state functional MRI (rs-fMRI) from 35 children at 3.5 years of age.
        Children were assessed for pre-reading abilities using the NEPSY-II subtests
        1 year later (4.5 years). We applied a data-driven linked independent component
        analysis (ICA) to explore the shared co-variation of gray and white matter
        measures. Two sources of structural variation at 3.5 years of age demonstrated
        relationships with Speeded Naming scores at 4.5 years of age. The first imaging
        component involved volumetric variability in reading-related cortical regions
        alongside microstructural features of the superior longitudinal fasciculus
        (SLF). The second component was dominated by cortical volumetric variations
        within the cerebellum and visual association area. In a subset of children
        with rs-fMRI data, we evaluated the inter-network functional connectivity
        of the left-lateralized fronto-parietal language network (FPL) and its relationship
        with pre-reading measures. Higher functional connectivity between the FPL
        and the default mode and visual networks at 3.5 years significantly predicted
        better Phonological Processing scores at 4.5 years. Together, these results
        suggest that the integration of functional networks, as well as the co-development
        of white and gray matter brain structures in early childhood, support the
        emergence of pre-reading measures in preschool children. \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/36072890\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7BSKGTr5Vu2q\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"7e0b8f1a-4892-492f-8810-a140f139312e\",\"title\":\"The
        Neural Basis of Hyperlexic Reading\",\"authors\":\"Peter E Turkeltaub; D.Lynn
        Flowers; Alyssa Verbalis; Martha Miranda; Lynn Gareau; Guinevere F Eden\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"14715131\",\"doi\":\"10.1016/s0896-6273(03)00803-1\",\"articleYear\":\"2004\",\"journal\":\"Neuron\",\"abstractText\":\"Children
        with autism spectrum disorders in very rare cases display surprisingly advanced
        \\\"hyperlexic\\\" reading skills. Using functional magnetic resonance imaging
        (fMRI), we studied the neural basis of this precocious reading ability in
        a 9-year-old hyperlexic boy who reads 6 years in advance of his age. During
        covert reading, he demonstrated greater activity in the left inferior frontal
        and superior temporal cortices than both chronological age- and reading age-matched
        controls. Activity in the right inferior temporal sulcus was greater when
        compared to reading age-matched controls. These findings suggest that precocious
        reading is brought about by simultaneously drawing on both left hemisphere
        phonological and right hemisphere visual systems, reconciling the two prevailing,
        but seemingly contradictory, single hemisphere theories of hyperlexia. Hyperlexic
        reading is therefore associated with hyperactivation of the left superior
        temporal cortex, much in the same way as developmental dyslexia is associated
        with hypoactivation of this area.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/14715131\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"4HhmM8pF5HFU\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"ee53c2df-90d0-4bab-a931-b4256b469f63\",\"title\":\"Temporo-parietal
        connectivity uniquely predicts reading change from childhood to  adolescence.\",\"authors\":\"Shu-Hui
        Lee; James R. Booth; Tai-Li Chou\",\"keywords\":\"\",\"pmcid\":\"PMC5159335\",\"pmid\":\"27377221\",\"doi\":\"10.1016/j.neuroimage.2016.06.055\",\"articleYear\":\"2016\",\"journal\":\"NeuroImage\",\"abstractText\":\"Previous
        research has shown that left posterior middle temporal gyrus (pMTG) is a core
        node in the semantic network, and cross-sectional studies have shown that
        activation in this region changes developmentally and is related to skill
        measured concurrently. However, it is not known how functional connectivity
        with this region changes developmentally, and whether functional connectivity
        is related to future gains in reading. We conducted a longitudinal functional
        magnetic resonance imaging (fMRI) study in 30 typically developing children
        (aged 8-15) to examine whether initial brain measures, including activation
        and connectivity, can predict future behavioral improvement in a semantic
        judgment task. Participants were scanned on entering the study (time 1, T1)
        and a follow-up period of 2years (time 2, T2). Character pairs were arranged
        in a continuous variable according to association strength (i.e. strong versus
        weak), and participants were asked to determine if these visually presented
        pairs were related in meaning. Our results demonstrated greater developmental
        changes from time 1 to time 2 for weaker association pairs in the left pMTG
        for the children (aged 8-11) as compared to the adolescents (aged 12-15).
        Moreover, the results showed greater developmental changes from time 1 to
        time 2 for weaker association pairs in connectivity between the pMTG and inferior
        parietal lobule (IPL) for the children as compared to the adolescents. Furthermore,
        a hierarchical stepwise regression model revealed that connectivity between
        the pMTG and IPL in weak association pairs was uniquely predictive of behavioral
        improvement from time 1 to time 2 for the children, but not the adolescents.
        Taken together, the activation results suggest relatively rapid development
        before adolescence of semantic representations in the pMTG. Moreover, the
        connectivity results of pMTG with IPL tentatively suggest that early development
        of semantic representations may be facilitated by enhanced engagement of phonological
        short-term memory.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/27377221\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"4AijjNP9J4sD\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"9b816152-d45c-4450-adf3-b89567b87005\",\"title\":\"Functional
        connectivity to a right hemisphere language center in prematurely born adolescents.\",\"authors\":\"Eliza
        H. Myers; Michelle Hampson; Betty Vohr; Cheryl Lacadie; Stephen J. Frost;
        Kenneth R. Pugh; Karol H. Katz; Karen C. Schneider; Robert W. Makuch; R. Todd
        Constable; Laura R. Ment\",\"keywords\":\"\",\"pmcid\":\"PMC2872040\",\"pmid\":\"20347043\",\"doi\":\"10.1016/j.neuroimage.2010.03.049\",\"articleYear\":\"2010\",\"journal\":\"NeuroImage\",\"abstractText\":\"Prematurely
        born children are at increased risk for language deficits at school age and
        beyond, but the neurobiological basis of these findings remains poorly understood.
        Thirty-one PT adolescents (600-1250g birth weight) and 36 T controls were
        evaluated using an fMRI passive language task and neurodevelopmental assessments
        including: the Wechsler Intelligence Scale for Children-III (WISC-III), the
        Peabody Picture Vocabulary Test-Revised (PPVT-R), the Comprehensive Test of
        Phonological Processing (CTOPP) and the Test of Word Reading Efficiency (TOWRE)
        at 16years of age. Neural activity was assessed for language processing and
        the data were evaluated for connectivity and correlations to cognitive outcomes.
        PT subjects scored significantly lower on all components of the WISC-III (p<0.05)
        compared to term subjects, but there was no significant difference in PPVT-R
        scores between the groups. Functional connectivity (fcMRI) between Wernicke's
        area (left BA 22) and the right supramarginal gyrus (BA 40) was increased
        in preterm subjects relative to term controls (p=0.03), and the strength of
        this connection was inversely related to performance on both the PPVT-R (R(2)=0.553,
        p=0.002), and the verbal comprehension index (R(2)=0.439, p=0.019). Preterm
        adolescents engage a dorsal right hemisphere region for language at age 16years.
        Those with the greatest cognitive deficits demonstrate increasing reliance
        on this alternate pathway.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/20347043\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"67RUpXVgirFi\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"ecc53556-2ded-476c-99a9-f376891a9cc6\",\"title\":\"Abnormal
        visual motion processing is not a cause of dyslexia.\",\"authors\":\"Olumide\_A.
        Olulade; Eileen\_M. Napoliello; Guinevere\_F. Eden\",\"keywords\":\"\",\"pmcid\":\"PMC3713164\",\"pmid\":\"23746630\",\"doi\":\"10.1016/j.neuron.2013.05.002\",\"articleYear\":\"2013\",\"journal\":\"Neuron\",\"abstractText\":\"Developmental
        dyslexia is a reading disorder, yet deficits also manifest in the magnocellular-dominated
        dorsal visual system. Uncertainty about whether visual deficits are causal
        or consequential to reading disability encumbers accurate identification and
        appropriate treatment of this common learning disability. Using fMRI, we demonstrate
        in typical readers a relationship between reading ability and activity in
        area V5/MT during visual motion processing and, as expected, also found lower
        V5/MT activity for dyslexic children compared to age-matched controls. However,
        when dyslexics were matched to younger controls on reading ability, no differences
        emerged, suggesting that weakness in V5/MT may not be causal to dyslexia.
        To further test for causality, dyslexics underwent a phonological-based reading
        intervention. Surprisingly, V5/MT activity increased along with intervention-driven
        reading gains, demonstrating that activity here is mobilized through reading.
        Our results provide strong evidence that visual magnocellular dysfunction
        is not causal to dyslexia but may instead be consequential to impoverished
        reading.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/23746630\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"x8mk7EmmSzCL\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"f659686f-2f05-4ee4-917e-a4854ebdfc05\",\"title\":\"The
        neural correlates of non-spatial working memory in velocardiofacial syndrome
        (22q11.2 deletion syndrome)\",\"authors\":\"Wendy R. Kates; Beth R. Krauss;
        Nuria AbdulSabur; Deirdre Colgan; Kevin M. Antshel; Anne Marie Higgins; Robert
        J. Shprintzen\",\"keywords\":\"\",\"pmcid\":\"PMC2034197\",\"pmid\":\"17618656\",\"doi\":\"10.1016/j.neuropsychologia.2007.05.007\",\"articleYear\":\"2007\",\"journal\":\"Neuropsychologia\",\"abstractText\":\"Velocardiofacial
        syndrome (VCFS), also known as 22q11.2 deletion syndrome, is a neurogenetic
        disorder that is associated with both learning disabilities and a consistent
        neuropsychological phenotype, including deficits in executive function, visuospatial
        perception, and working memory. Anatomic imaging studies have identified significant
        volumetric reductions in the parietal lobe of individuals with VCFS, but several
        studies have reported that the frontal lobe is relatively preserved. We used
        functional magnetic resonance imaging to investigate the neural correlates
        of non-spatial working memory in 17 youths with VCFS, 10 of their unaffected
        siblings, and 10 community controls (with the same proportion of learning
        disabilities as the VCFS youths). Task performance of siblings tended to be
        more accurate than children with VCFS, who did not differ from community controls.
        All three-study groups recruited parietal regions that were equivalent in
        location and magnitude. Whereas the sibling group also recruited the dorsolateral
        prefrontal cortex (DLPFC), Broca's area, and anterior cingulate, DLPFC activation
        was absent in the whole brain analyses of children with VCFS and controls.
        Moreover, the magnitude of frontal activation in VCFS participants was restricted
        relative to both siblings and controls. These findings suggest that VCFS participants
        exhibit frontal hypoactivation that is not attributable to performance. In
        addition, VCFS children and controls (many with idiopathic learning disabilities)
        appear to rely on phonological rehearsal to hold information on line instead
        of the DLPFC. Despite previous anatomic MRI reports of preserved frontal lobe
        volumes in VCFS therefore, these fMRI findings suggest that the frontal component
        of the distributed network subserving executive function and working memory
        may be disrupted in youth with this disorder.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/17618656\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"5LaA78WTZ2Wd\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"8c2c29ae-40c8-4327-b775-c9677d92ba8a\",\"title\":\"Development
        of brain networks involved in spoken word processing of Mandarin Chinese.\",\"authors\":\"Fan
        Cao; Kainat Khalid; Rebecca Lee; Christine Brennan; Yanhui Yang; Kuncheng
        Li; Donald J. Bolger; James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC3049201\",\"pmid\":\"20884355\",\"doi\":\"10.1016/j.neuroimage.2010.09.047\",\"articleYear\":\"2011\",\"journal\":\"NeuroImage\",\"abstractText\":\"Developmental
        differences in phonological and orthographic processing of Chinese spoken
        words were examined in 9-year-olds, 11-year-olds and adults using functional
        magnetic resonance imaging (fMRI). Rhyming and spelling judgments were made
        to two-character words presented sequentially in the auditory modality. Developmental
        comparisons between adults and both groups of children combined showed that
        age-related changes in activation in visuo-orthographic regions depended on
        a task. There were developmental increases in the left inferior temporal gyrus
        and the right inferior occipital gyrus in the spelling task, suggesting more
        extensive visuo-orthographic processing in a task that required access to
        these representations. Conversely, there were developmental decreases in activation
        in the left fusiform gyrus and left middle occipital gyrus in the rhyming
        task, suggesting that the development of reading is marked by reduced involvement
        of orthography in a spoken language task that does not require access to these
        orthographic representations. Developmental decreases may arise from the existence
        of extensive homophony (auditory words that have multiple spellings) in Chinese.
        In addition, we found that 11-year-olds and adults showed similar activation
        in the left superior temporal gyrus across tasks, with both groups showing
        greater activation than 9-year-olds. This pattern suggests early development
        of perceptual representations of phonology. In contrast, 11-year-olds and
        9-year-olds showed similar activation in the left inferior frontal gyrus across
        tasks, with both groups showing weaker activation than adults. This pattern
        suggests late development of controlled retrieval and selection of lexical
        representations. Altogether, this study suggests differential effects of character
        acquisition on development of components of the language network in Chinese
        as compared to previous reports on alphabetic languages.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/20884355\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"3PnVgeBPA7Qb\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"c9d440ce-010a-4993-aadd-9e8095a6f7b7\",\"title\":\"Putative
        protective neural mechanisms in prereaders with a family history of dyslexia
        who subsequently develop typical reading skills\",\"authors\":\"Xi Yu; Jennifer
        Zuk; Meaghan V. Perdue; Ola Ozernov\u2010Palchik; Talia Raney; Sara D. Beach;
        Elizabeth S. Norton; Yangming Ou; John D. E. Gabrieli; Nadine Gaab\",\"keywords\":\"\",\"pmcid\":\"PMC7294063\",\"pmid\":\"32166830\",\"doi\":\"10.1002/hbm.24980\",\"articleYear\":\"2019\",\"journal\":\"Human
        Brain Mapping\",\"abstractText\":\"Developmental dyslexia is a learning disability
        characterized by difficulties in word reading. While the prevalence in the
        general public is around 10-12%, an increased prevalence of 40-60% has been
        reported for children with a familial risk. Neural atypicalities in the reading
        network have been observed in children with (FHD+) compared to without (FHD-)
        a family history of dyslexia, even before reading onset. Despite the hereditary
        risk, about half of FHD+ children develop typical reading abilities (FHD+Typical)
        but the underlying neural characteristics and the developmental trajectories
        of these favorable reading outcomes remain unknown. Utilizing a retrospective,
        longitudinal approach, this is the first study to examine whether potential
        protective neural mechanisms are present before reading onset in FHD+Typical.
        Functional and structural brain characteristics were examined in 69 pre-readers
        who subsequently developed typical reading abilities (35 FHD+Typical/34 FHD-Typical)
        using MRI/fMRI. Searchlight-based multivariate pattern analyses identified
        distinct activation patterns during phonological processing between FHD+Typical
        and FHD-Typical in right inferior frontal (RIFG) and left temporo-parietal
        (LTPC) regions. Hypoactivation in LTPC was further demonstrated in FHD+Typical
        compared to FHD-Typical, suggesting that this previously reported neural characteristic
        of dyslexia is primarily associated with familial risk. Importantly, FHD+Typical
        pre-readers exhibited higher activation in RIFG than FHD-Typical, which was
        associated with increased interhemispheric functional and structural connectivity.
        These results suggest that putative protective neural mechanisms are already
        established in FHD+Typical pre-readers and may therefore support their successful
        reading development. Further studies are needed to investigate the functional
        significance and developmental trajectories of these neural mechanisms as
        well as their enabling factors, which has the potential to inform the design
        of early preventative/remediation strategies.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/32166830\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"cLPHJT4xkVjX\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"88f75742-3777-4851-afe5-710b0a025d6a\",\"title\":\"The
        brain adapts to orthography with experience: Evidence from English and Chinese\",\"authors\":\"Fan
        Cao; Christine Brennan; James R. Booth\",\"keywords\":\"\",\"pmcid\":\"PMC4934123\",\"pmid\":\"25444089\",\"doi\":\"10.1111/desc.12245\",\"articleYear\":\"2014\",\"journal\":\"Developmental
        Science\",\"abstractText\":\"Using functional magnetic resonance imaging (fMRI),
        we examined the process of language specialization in the brain by comparing
        developmental changes in two contrastive orthographies: Chinese and English.
        In a visual word rhyming judgment task, we found a significant interaction
        between age and language in left inferior parietal lobule and left superior
        temporal gyrus, which was due to greater developmental increases in English
        than in Chinese. Moreover, we found that higher skill only in English children
        was correlated with greater activation in left inferior parietal lobule. These
        findings suggest that the regions associated with phonological processing
        are essential in English reading development. We also found greater developmental
        increases in English than in Chinese in left inferior temporal gyrus, suggesting
        refinement of this region for fine-grained word form recognition. In contrast,
        greater developmental increases in Chinese than in English were found in right
        middle occipital gyrus, suggesting the importance of holistic visual-orthographic
        analysis in Chinese reading acquisition. Our results suggest that the brain
        adapts to the special features of the orthography by engaging relevant brain
        regions to a greater degree over development.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/25444089\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"cRTcG3jd4dss\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"05b63267-d1ff-44ee-8fcc-22bbd76b40a9\",\"title\":\"Right-hemisphere
        reading in a case of developmental deep dyslexia\",\"authors\":\"Nicola J.
        Pitchford; Elaine Funnell; Bianca De Haan; Paul S. Morgan\",\"keywords\":\"\",\"pmcid\":\"\",\"pmid\":\"17676552\",\"doi\":\"10.1080/17470210701425845\",\"articleYear\":\"2007\",\"journal\":\"Quarterly
        Journal of Experimental Psychology\",\"abstractText\":\"The right-hemisphere
        hypothesis of deep dyslexia has received support from functional imaging studies
        of acquired deep dyslexia following damage to the left cerebral hemisphere,
        but no imaging studies of cases of developmental deep dyslexia, in which brain
        damage is not suspected, have been reported. In this paper, we report the
        first evidence of right hyperactivation in an adult case of developmental
        deep dyslexia. Hyperactivation was observed in the right inferior frontal
        cortex during functional magnetic resonance imaging (fMRI) of the oral reading
        of imageable content words and nonwords to which imageable lexical responses
        were frequently made. No evidence of right hyperactivation was observed in
        the oral reading of function words, nor during the naming of imageable words
        in response to pictured objects. The results reveal strategic and selective
        use of right-hemisphere functions for particular types of written stimuli.
        We propose that children with developmental deep dyslexia compensate for their
        lack of phonological skills by accessing right-hemisphere imageable associations
        that provide a mnemonic for linking written forms to spoken names.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/17676552\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"igVWo6wSc8Yh\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"4d643008-fd25-4dbe-9111-1b79d971948d\",\"title\":\"Early
        differences in neural adaptation to written words before reading instruction
        in dyslexia\",\"authors\":\"Anna Banaszkiewicz; Katarzyna Chyl-Tana\u015B;
        Hanna G\xF3recka; Karolina Zieli\u0144ska; Anna Rede\u0142; Anna Szuka\u0142o;
        Agnieszka D\u0119bska; Katarzyna Jednor\xF3g\",\"keywords\":\"\",\"pmcid\":\"PMC13594855\",\"pmid\":\"42743683\",\"doi\":\"10.1016/j.dcn.2026.101815\",\"articleYear\":\"2026\",\"journal\":\"Developmental
        Cognitive Neuroscience\",\"abstractText\":\"Reduced neural adaptation has
        been proposed as a neurophysiological characteristic of dyslexia, but it remains
        unclear whether such differences precede reading acquisition or emerge as
        a consequence of limited reading experience. Prior studies have focused on
        literate individuals, limiting developmental inferences. In this preregistered
        longitudinal fMRI study, children oversampled for dyslexia risk were scanned
        in kindergarten (prior to formal reading instruction) and again in third grade.
        Using the rapid adaptation paradigm, we examined neural adaptation to written
        words, false fonts, faces, houses and objects. Analyses focused on whole-brain
        effects and predefined regions of interest (ROI), including ventral occipito-temporal
        cortex (vOT). Dyslexic and control groups were case-control matched on age
        and reading skill at kindergarten. In ROI analyses, children who later developed
        dyslexia compared to controls showed reduced neural adaptation to written
        words in the left vOT already in kindergarten, despite matched pre-reading
        skills. This result was confirmed in individually-defined ROI analyses and
        was restricted to the anterior part of the vOT. The group difference remained
        stable across development. Across the full kindergarten sample (N\u202F=\u202F59),
        adaptation to words in left vOT was modestly associated with prereading skills,
        including phonological awareness. No robust group differences were observed
        at the whole-brain level or for non-linguistic visual categories. These findings
        indicate small, region-specific differences in neural adaptation to print
        that are detectable prior to formal reading instruction. The absence of whole-brain
        effects and for non-linguistic visual categories suggests that neural adaptation
        differences in dyslexia are localized and domain-specific.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/42743683\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"LTMKomB6Vkvg\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"767c0c64-fe04-4d2e-a041-0a9a3c90d79f\",\"title\":\"Social
        Interaction Affects Neural Outcomes of Sign Language Learning As a Foreign
        Language in Adults\",\"authors\":\"Noriaki Yusa; Jungho Kim; Masatoshi Koizumi;
        Motoaki Sugiura; Ryuta Kawashima\",\"keywords\":\"\",\"pmcid\":\"PMC5374197\",\"pmid\":\"28408872\",\"doi\":\"10.3389/fnhum.2017.00115\",\"articleYear\":\"2017\",\"journal\":\"Frontiers
        in Human Neuroscience\",\"abstractText\":\"Children naturally acquire a language
        in social contexts where they interact with their caregivers. Indeed, research
        shows that social interaction facilitates lexical and phonological development
        at the early stages of child language acquisition. It is not clear, however,
        whether the relationship between social interaction and learning applies to
        adult second language acquisition of syntactic rules. Does learning second
        language syntactic rules through social interactions with a native speaker
        or without such interactions impact behavior and the brain? The current study
        aims to answer this question. Adult Japanese participants learned a new foreign
        language, Japanese sign language (JSL), either through a native deaf signer
        or via DVDs. Neural correlates of acquiring new linguistic knowledge were
        investigated using functional magnetic resonance imaging (fMRI). The participants
        in each group were indistinguishable in terms of their behavioral data after
        the instruction. The fMRI data, however, revealed significant differences
        in the neural activities between two groups. Significant activations in the
        left inferior frontal gyrus (IFG) were found for the participants who learned
        JSL through interactions with the native signer. In contrast, no cortical
        activation change in the left IFG was found for the group who experienced
        the same visual input for the same duration via the DVD presentation. Given
        that the left IFG is involved in the syntactic processing of language, spoken
        or signed, learning through social interactions resulted in an fMRI signature
        typical of native speakers: activation of the left IFG. Thus, broadly speaking,
        availability of communicative interaction is necessary for second language
        acquisition and this results in observed changes in the brain.\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/28408872\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"5G3QQU47cf9a\",\"importId\":\"12f52935-e583-4c02-b1e0-700d56c1c119\"},{\"id\":\"ae7f950c-e923-4525-b45f-e5a62b6bfe2b\",\"title\":\"Age-dependent
        mesial temporal lobe lateralization in language fMRI.\",\"authors\":\"Leigh
        N Sepeta, Madison M Berl, Marko Wilke, Xiaozhen You, Meera Mehta, Benjamin
        Xu, Sara Inati, Irene Dustin, Omar Khan, Alison Austermuehle, William H Theodore,
        William D Gaillard\",\"keywords\":\"\",\"pmcid\":\"PMC4749038\",\"pmid\":\"26696589\",\"doi\":\"10.1111/epi.13258\",\"articleYear\":\"2016\",\"journal\":\"Epilepsia\",\"abstractText\":\"OBJECTIVE\\nFunctional
        magnetic resonance imaging (fMRI) activation of the mesial temporal lobe (MTL)
        may be important for epilepsy surgical planning. We examined MTL activation
        and lateralization during language fMRI in children and adults with focal
        epilepsy.\\nMETHODS\\nOne hundred forty-two controls and patients with left
        hemisphere focal epilepsy (pediatric: epilepsy, n = 17, mean age = 9.9 \xB1
        2.0; controls, n = 48; mean age = 9.1 \xB1 2.6; adult: epilepsy, n = 20, mean
        age = 26.7 \xB1 5.8; controls, n = 57, mean age = 26.2 \xB1 7.5) underwent
        3T fMRI using a language task (auditory description decision task). Image
        processing and analyses were conducted using Statistical Parametric Mapping
        (SPM8); regions of interest (ROIs) included MTL, Broca's area, and Wernicke's
        area. We assessed group and individual MTL activation, and examined degree
        of lateralization.\\nRESULTS\\nPatients and controls (pediatric and adult)
        demonstrated group and individual MTL activation during language fMRI. MTL
        activation was left lateralized for adults, but less so in children (p's <
        0.005). Patients did not differ from controls in either age group. Stronger
        left-lateralized MTL activation was related to older age (p = 0.02). Language
        lateralization (Broca's and Wernicke's) predicted 19% of the variance in MTL
        lateralization for adults (p = 0.001), but for not children.\\nSIGNIFICANCE\\nLanguage
        fMRI may be used to elicit group and individual MTL activation. The developmental
        difference in MTL lateralization and its association with language lateralization
        suggests a developmental shift in lateralization of MTL function, with increased
        left lateralization across the age span. This shift may help explain why children
        have better memory outcomes following resection compared to adults.\\n\",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/26696589\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"6YXqLZSWMY7h\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"},{\"id\":\"575b60aa-73d7-40ea-a729-d1482e2c302f\",\"title\":\"Neuroimaging
        of valence decisions in children and adults\",\"authors\":\"Teresa Sylvester;
        Johanna Liebig; Arthur M. Jacobs\",\"keywords\":\"\",\"pmcid\":\"PMC7848765\",\"pmid\":\"33517110\",\"doi\":\"10.1016/j.dcn.2021.100925\",\"articleYear\":\"2021\",\"journal\":\"Developmental
        Cognitive Neuroscience\",\"abstractText\":\"  Highlights  \\n  \\nAffective
        word processing is integrated in semantic networks. \\n  \\nAdults show cortical
        semantic network activation during valence decision task. \\n  \\nChildren
        additionally recruit subcortical regions for affect processing. \\n  \\n  \\nTo
        date, the neural underpinnings of affective components in language processing
        in children remain largely unknown. To fill this gap, the present study examined
        behavioural and neural correlates of children and adults performing the same
        auditory valence decision task with an event-related fMRI paradigm. Based
        on previous findings in adults, activations in anterior and posterior cingulate
        cortex, orbitofrontal cortex and left inferior frontal gyrus were expected
        for both positive and negative valence categories. Recent behavioural findings
        on valence decisions showed similar ratings and reaction time patterns in
        children and adults. This finding was successfully replicated in the present
        study. On a neural level, our analysis of affective language processing showed
        activations in regions associated with both semantic (superior and middle
        temporal and frontal) and affective (anterior and posterior cingulate, orbitofrontal
        and inferior frontal, insula and amygdala) processing. Neural activations
        in children and adults were systematically different in explicit affective
        word processing. In particular, adults showed a more distributed semantic
        network activation while children recruited additional subcortical structures.
        \\n \",\"articleLink\":\"https://pubmed.ncbi.nlm.nih.gov/33517110\",\"exclusionTag\":null,\"identificationSource\":{\"id\":\"neurosynth_neurostore_id_source\",\"label\":\"Neurostore\"},\"tags\":[],\"neurostoreId\":\"7n32yinF6EMi\",\"importId\":\"1003ab0a-e738-4a29-b289-120965c44d29\"}]}],\"prismaConfig\":{\"isPrisma\":true,\"identification\":{\"exclusionTags\":[{\"id\":\"neurosynth_duplicate_exclusion\",\"label\":\"Duplicate\",\"isExclusionTag\":true,\"isAssignable\":true}]},\"screening\":{\"exclusionTags\":[{\"id\":\"neurosynth_irrelevant_exclusion\",\"label\":\"Irrelevant\",\"isExclusionTag\":true,\"isAssignable\":true},{\"id\":\"e3add4e2-e8ac-458e-9345-64a6322e461b\",\"label\":\"adults\",\"isExclusionTag\":true,\"isAssignable\":true}]},\"eligibility\":{\"exclusionTags\":[{\"id\":\"neurosynth_reports_not_retrieved_exclusion\",\"label\":\"Reports
        not retrieved\",\"isExclusionTag\":true,\"isAssignable\":true},{\"id\":\"neurosynth_insufficient_detail_exclusion\",\"label\":\"Insufficient
