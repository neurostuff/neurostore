        Imaging Behav\"},\"Abstract\":{\"AbstractText\":\"The human working memory
        system provides an experimentally useful model for examination of neural overload
        effects on subsequent functioning of the overloaded system. This study employed
        functional magnetic resonance imaging in conjunction with a parametric working
        memory task to characterize the behavioral and neural effects of cognitive
        overload on subsequent cognitive performance, with particular attention to
        cognitive-limbic interactions. Overloading the working memory system was associated
        with varying degrees of subsequent decline in performance accuracy and reduced
        activation of brain regions central to both task performance and suppression
        of negative affect. The degree of performance decline was independently predicted
        by three separate factors operating during the overload condition: the degree
        of task failure, the degree of amygdala activation, and the degree of inverse
        coupling between the amygdala and dorsolateral prefrontal cortex. These findings
        suggest that vulnerability to overload effects in cognitive functioning may
        be mediated by reduced amygdala suppression and subsequent amygdala-prefrontal
        interaction.\"},\"Language\":\"eng\",\"@PubModel\":\"Print\",\"GrantList\":{\"Grant\":[{\"Agency\":\"NIMH
